# The Core Acceptance Suite, on a POSIX runner.
#
# This repository has no toolchain of its own and deliberately had no CI: everything is run
# on demand (CLAUDE.md). One gate cannot be: `WGF_GOLDEN=1 bin/wgf test-core --strict` runs
# the two golden runs, and those shell out to `pnpm` through `wgflib.procs`, which spawns
# without a shell. On Windows pnpm exists only as a `.cmd` shim, so both goldens die in
# setUpClass with `FileNotFoundError: [WinError 2]` before a single test runs — on any branch,
# including main. The release gate was therefore unrunnable on the host the recent work was
# developed on. This workflow exists to give that gate a Linux runner, and for nothing else.
#
# Rules it keeps:
#   - it runs the repository's own commands, exactly as CLAUDE.md documents them;
#   - it adds no mock, shim or replacement for pnpm, and does not patch the golden harness;
#   - it changes no test expectation;
#   - it caches nothing: the goldens warm a pnpm store themselves and then run offline behind
#     a refusing proxy, and a cache restored from another run would make that unreproducible.

name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      golden_loop:
        description: "Also run the GOLDEN LOOP category (job golden-loop: two more 2D golden runs)"
        type: boolean
        default: false

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: integrity, schemas, adapters, unit, test-core with the goldens
    runs-on: ubuntu-24.04
    # The two golden runs each create a game repository from the pinned template, install it,
    # build it and drive Chromium through Playwright. Since workflow 5 each golden builds and
    # plays the game several times (greybox, production, the production-quality and visual-qa
    # gates): the unit suite alone took 24 min and the run was cancelled at 90 (PR #18).
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: check-integrity compares core/reference/lessons.yaml with the
          # knowledge at the base commit (a pull request's merge base, a push's previous
          # tip), which a depth-1 checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # The pinned template requires node >= 20 (its package.json `engines`).
          node-version: '22'

      - name: pnpm, at the version the template pins
        # Corepack ships with node; `pnpm` must be a real executable on PATH because
        # wgflib.procs spawns it directly. The version is the template's `packageManager`.
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Record the toolchain
        run: |
          python3 --version
          node --version
          pnpm --version
          git --version

      - name: Referential integrity
        # The knowledge base: a pull request's base branch (its merge base with the head), a
        # push's previous tip; a manual run compares with HEAD's parent. Strict: a base that
        # cannot be found fails integrity here, where locally it is only a note.
        env:
          WGF_KNOWLEDGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD^' }}
          WGF_KNOWLEDGE_STRICT: '1'
        run: python3 scripts/check-integrity.py

      - name: Content hashes and pins
        run: python3 scripts/wgf-hash.py --check workspace/

      - name: Every artifact schema compiles
        run: |
          for f in core/artifacts/*.schema.json; do
            npx --yes -p ajv-cli@5 -p ajv-formats@2 ajv compile \
              -s "$f" -r "core/artifacts/shared/*.schema.json" \
              -c ajv-formats --spec=draft2020 --strict=false
          done

      - name: The worked example validates
        run: |
          npx --yes -p ajv-cli@5 -p ajv-formats@2 ajv validate \
            -s core/artifacts/game-design.schema.json \
            -r "core/artifacts/shared/*.schema.json" \
            -c ajv-formats --spec=draft2020 --strict=false \
            -d workspace/titles/neon-drift/game-design.json

      - name: Adapters regenerate identically
        # An adapter file is generated; a hand edit is a bug (CLAUDE.md). Regenerating must
        # leave the tree unchanged.
        run: |
          bash scripts/gen-adapters.sh
          git diff --exit-code

      - name: Unit suite
        run: python3 -m unittest discover scripts/tests

      - name: The pinned template, and a browser that matches its Playwright
        # The goldens run offline behind a refusing proxy, so the template's dependencies and
        # the browser must already be on disk. The browser is installed by the template's own
        # Playwright, so its build is the one that template expects.
        run: |
          template=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from wgflib import template
          directory = template.checkout()
          template.ensure_dependencies(directory)
          print(directory)
          ")
          echo "pinned template: $template"
          cd "$template" && pnpm exec playwright install --with-deps chromium

      - name: An MP4 encoder for the store-listing trailer
        # Yandex requires the horizontal video as MP4 (platforms/yandex.yaml 1.3.0); Playwright's
        # bundled ffmpeg writes VP8/WebM only, so capture.mjs converts with an ffmpeg that lists
        # libx264 (WGF_FFMPEG, else PATH). Without one a Yandex listing correctly stops for a person.
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && ffmpeg -hide_banner -encoders | grep -w libx264

      - name: Core Acceptance Suite, with both golden runs
        # WGF_GOLDEN_KEEP keeps each run's working directory, which is where the develop
        # checks, the review verdict and the browser evidence are written. Without it a
        # failing gate reports only a count ("conformance: 2 violation(s)") and the evidence
        # is deleted at teardown, which is a bad trade on a runner that is thrown away anyway.
        run: WGF_GOLDEN=1 WGF_GOLDEN_KEEP=1 bin/wgf test-core --strict

      - name: Golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evidence
          path: /tmp/wgf-golden-*/evidence
          if-no-files-found: warn
          retention-days: 7

  # The GOLDEN LOOP category (docs/golden-runs.md "The golden loop"): the 2D golden with a
  # planted defect must fail a real check, be routed back to greybox and pass the same check
  # on a newer commit; its negative control must not pass. Two more golden runs, so it is kept
  # out of the job above (its 180 minutes are nearly spent) and runs only when asked: a manual
  # run with `golden_loop` ticked, or a pull request carrying the label `golden-loop` (adding
  # the label does not start a run by itself - the next push or a re-run does, so a label
  # event never cancels the acceptance job above through the shared concurrency group).
  golden-loop:
    name: GOLDEN LOOP (2D, planted defect, negative control)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.golden_loop) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'golden-loop'))
    runs-on: ubuntu-24.04
    # One full 2D golden with one extra greybox build-and-play, and a negative control that
    # builds and plays the greybox three times and stops: about one and a half goldens.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm, at the version the template pins
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Record the toolchain
        run: |
          python3 --version
          node --version
          pnpm --version
          git --version

      - name: The pinned template, and a browser that matches its Playwright
        run: |
          template=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from wgflib import template
          directory = template.checkout()
          template.ensure_dependencies(directory)
          print(directory)
          ")
          echo "pinned template: $template"
          cd "$template" && pnpm exec playwright install --with-deps chromium

      - name: An MP4 encoder for the store-listing trailer
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && ffmpeg -hide_banner -encoders | grep -w libx264

      - name: The golden loop and its negative control
        run: WGF_GOLDEN_LOOP=1 WGF_GOLDEN_KEEP=1 bin/wgf test-core --only "GOLDEN LOOP" --strict

      - name: Golden loop evidence
        # golden-loop-2d.json (the before/after record) and golden-loop/ (the failing and the
        # passing frames) beside each run's summary and playability reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-loop-evidence
          path: /tmp/wgf-golden-*/evidence
          if-no-files-found: warn
          retention-days: 14
