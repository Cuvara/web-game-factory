# The Core Acceptance Suite, on a POSIX runner.
#
# This repository has no toolchain of its own and deliberately had no CI: everything is run
# on demand (CLAUDE.md). One gate cannot be: `WGF_GOLDEN=1 bin/wgf test-core --strict` runs
# the two golden runs, and those shell out to `pnpm` through `wgflib.procs`, which spawns
# without a shell. On Windows pnpm exists only as a `.cmd` shim, so both goldens die in
# setUpClass with `FileNotFoundError: [WinError 2]` before a single test runs — on any branch,
# including main. The release gate was therefore unrunnable on the host the recent work was
# developed on. This workflow exists to give that gate a Linux runner, and for nothing else.
#
# Rules it keeps:
#   - it runs the repository's own commands, exactly as CLAUDE.md documents them;
#   - it adds no mock, shim or replacement for pnpm, and does not patch the golden harness;
#   - it changes no test expectation;
#   - it caches nothing: the goldens warm a pnpm store themselves and then run offline behind
#     a refusing proxy, and a cache restored from another run would make that unreproducible.
#
# Since 2.8.1 the suite runs as parallel jobs instead of one job of about three hours
# (scripts/ci-partition.py splits it, and `check` proves the split leaves nothing out): the
# repository checks, four unit shards (the modules no suite category names), the non-golden
# categories through `bin/wgf test-core --strict`, and each golden category in its own job,
# also through `test-core --strict`. Every module runs in exactly one place; before the split
# the categories' modules ran twice, once in the unit suite and once in test-core.
# `acceptance` passes only when every job passed: the gate is the same, its wall clock is the
# longest job (the 2D golden) instead of the sum.

name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      golden_loop:
        description: "Also run the GOLDEN LOOP category (job golden-loop: four more 2D golden runs)"
        type: boolean
        default: false

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: integrity, hashes, schemas, adapters, and the suite's split
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: check-integrity compares core/reference/lessons.yaml with the
          # knowledge at the base commit (a pull request's merge base, a push's previous
          # tip), which a depth-1 checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Referential integrity
        # The knowledge base: a pull request's base branch (its merge base with the head), a
        # push's previous tip; a manual run compares with HEAD's parent. Strict: a base that
        # cannot be found fails integrity here, where locally it is only a note.
        env:
          WGF_KNOWLEDGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD^' }}
          WGF_KNOWLEDGE_STRICT: '1'
        run: python3 scripts/check-integrity.py

      - name: Content hashes and pins
        run: python3 scripts/wgf-hash.py --check workspace/

      - name: Every artifact schema compiles
        run: |
          for f in core/artifacts/*.schema.json; do
            npx --yes -p ajv-cli@5 -p ajv-formats@2 ajv compile \
              -s "$f" -r "core/artifacts/shared/*.schema.json" \
              -c ajv-formats --spec=draft2020 --strict=false
          done

      - name: The worked example validates
        run: |
          npx --yes -p ajv-cli@5 -p ajv-formats@2 ajv validate \
            -s core/artifacts/game-design.schema.json \
            -r "core/artifacts/shared/*.schema.json" \
            -c ajv-formats --spec=draft2020 --strict=false \
            -d workspace/titles/neon-drift/game-design.json

      - name: Adapters regenerate identically
        # An adapter file is generated; a hand edit is a bug (CLAUDE.md). Regenerating must
        # leave the tree unchanged.
        run: |
          bash scripts/gen-adapters.sh
          git diff --exit-code

      - name: The split covers every test module exactly once
        run: python3 scripts/ci-partition.py check 4

  units:
    name: unit shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm, at the version the template pins
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Unit modules of this shard
        # From the repository root, as `unittest discover scripts/tests` ran them (some tests
        # read repository files by relative path); the test directory is on the path.
        run: |
          modules=$(python3 scripts/ci-partition.py units ${{ matrix.shard }} 4)
          echo "$modules" | tr ' ' '\n'
          PYTHONPATH=scripts/tests python3 -m unittest $modules

  core:
    name: test-core, every category but the goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # The pinned template requires node >= 20 (its package.json `engines`).
          node-version: '22'

      - name: pnpm, at the version the template pins
        # Corepack ships with node; `pnpm` must be a real executable on PATH because
        # wgflib.procs spawns it directly. The version is the template's `packageManager`.
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Record the toolchain
        run: |
          python3 --version
          node --version
          pnpm --version
          git --version

      - name: The pinned template, and a browser that matches its Playwright
        run: |
          template=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from wgflib import template
          directory = template.checkout()
          template.ensure_dependencies(directory)
          print(directory)
          ")
          echo "pinned template: $template"
          cd "$template" && pnpm exec playwright install --with-deps chromium

      - name: An MP4 encoder for the store-listing trailer
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && ffmpeg -hide_banner -encoders | grep -w libx264

      - name: Core Acceptance Suite, every category but the goldens
        run: |
          args=()
          while IFS= read -r category; do args+=(--only "$category"); done < <(python3 scripts/ci-partition.py core)
          bin/wgf test-core --strict "${args[@]}"

  golden:
    name: ${{ matrix.category }}
    runs-on: ubuntu-24.04
    # Each golden run creates a game repository from the pinned template, installs it, builds
    # it and drives Chromium through Playwright, several times. Alone on a runner the 2D golden
    # took 58-69 min and the 3D 39-50 (PR #63, #66 runs); 150 leaves room for a slow runner
    # without hiding a hang for long.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        category: ['2D GOLDEN', '3D GOLDEN']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm, at the version the template pins
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Record the toolchain
        run: |
          python3 --version
          node --version
          pnpm --version
          git --version

      - name: The pinned template, and a browser that matches its Playwright
        # The goldens run offline behind a refusing proxy, so the template's dependencies and
        # the browser must already be on disk. The browser is installed by the template's own
        # Playwright, so its build is the one that template expects.
        run: |
          template=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from wgflib import template
          directory = template.checkout()
          template.ensure_dependencies(directory)
          print(directory)
          ")
          echo "pinned template: $template"
          cd "$template" && pnpm exec playwright install --with-deps chromium

      - name: An MP4 encoder for the store-listing trailer
        # Yandex requires the horizontal video as MP4 (platforms/yandex.yaml 1.3.0); Playwright's
        # bundled ffmpeg writes VP8/WebM only, so capture.mjs converts with an ffmpeg that lists
        # libx264 (WGF_FFMPEG, else PATH). Without one a Yandex listing correctly stops for a person.
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && ffmpeg -hide_banner -encoders | grep -w libx264

      - name: This golden category
        # WGF_GOLDEN_KEEP keeps each run's working directory, which is where the develop
        # checks, the review verdict and the browser evidence are written.
        run: WGF_GOLDEN=1 WGF_GOLDEN_KEEP=1 bin/wgf test-core --strict --only "${{ matrix.category }}"

      - name: Golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evidence-${{ matrix.category == '2D GOLDEN' && '2d' || '3d' }}
          path: /tmp/wgf-golden-*/evidence
          if-no-files-found: warn
          retention-days: 7

  acceptance:
    # The gate: one result for the whole suite. It passes only when every job above passed -
    # a failed, cancelled or skipped job fails it - and when the golden matrix is still every
    # golden category of the suite.
    name: acceptance (every job passed)
    if: always()
    needs: [checks, units, core, golden]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The golden matrix is every golden category
        run: |
          expected=$(python3 scripts/ci-partition.py golden | sort | tr '\n' '|')
          listed=$(printf '%s\n' '2D GOLDEN' '3D GOLDEN' | sort | tr '\n' '|')
          [ "$expected" = "$listed" ] || { echo "golden matrix '$listed' != suite '$expected'"; exit 1; }

      - name: Every job passed
        run: |
          echo "checks=${{ needs.checks.result }} units=${{ needs.units.result }} core=${{ needs.core.result }} golden=${{ needs.golden.result }}"
          for r in "${{ needs.checks.result }}" "${{ needs.units.result }}" "${{ needs.core.result }}" "${{ needs.golden.result }}"; do
            [ "$r" = success ] || exit 1
          done

  # The GOLDEN LOOP category (docs/golden-runs.md "The golden loop"): the 2D golden with a
  # planted defect must fail a real check, be routed back to greybox and pass the same check
  # on a newer commit; its negative control must not pass. The develop-stage variant plants it
  # in production, where the failure goes through triage to a specialist and the run's finding
  # ledger must verify the repair; its negative control blocks at triage's budget. Four more
  # golden runs, so it is kept out of the jobs above and runs only when asked: a manual
  # run with `golden_loop` ticked, or a pull request carrying the label `golden-loop` (adding
  # the label does not start a run by itself - the next push or a re-run does, so a label
  # event never cancels the acceptance job above through the shared concurrency group).
  golden-loop:
    name: GOLDEN LOOP ${{ matrix.stage }} (2D, planted defect, negative control)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.golden_loop) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'golden-loop'))
    runs-on: ubuntu-24.04
    # One job per stage, on its own runner (each golden holds port 4173): the greybox stage is
    # one full 2D golden with one extra greybox build-and-play and a negative control that
    # builds and plays the greybox three times and stops; the develop stage is one full golden
    # with one extra production build-and-play and a negative control that plays the
    # production build three times and stops. About two goldens each.
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: greybox
            classes: test_golden_loop.GoldenLoop2D test_golden_loop.GoldenLoopNoRepair2D
          - stage: develop
            classes: test_golden_loop.GoldenLoopDevelop2D test_golden_loop.GoldenLoopDevelopNoRepair2D
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm, at the version the template pins
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Record the toolchain
        run: |
          python3 --version
          node --version
          pnpm --version
          git --version

      - name: The pinned template, and a browser that matches its Playwright
        run: |
          template=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from wgflib import template
          directory = template.checkout()
          template.ensure_dependencies(directory)
          print(directory)
          ")
          echo "pinned template: $template"
          cd "$template" && pnpm exec playwright install --with-deps chromium

      - name: An MP4 encoder for the store-listing trailer
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && ffmpeg -hide_banner -encoders | grep -w libx264

      - name: The golden loop and its negative control (this stage)
        # The category's classes for this stage; a skip is a failure here (WGF_GOLDEN_LOOP=1
        # runs them all), as --strict makes it for the whole category.
        working-directory: scripts/tests
        run: |
          WGF_GOLDEN_LOOP=1 WGF_GOLDEN_KEEP=1 python3 -m unittest -v ${{ matrix.classes }} 2>&1 | tee golden-loop.log
          status=${PIPESTATUS[0]}
          if grep -E "... skipped|skipped=" golden-loop.log; then echo "a golden-loop test was skipped"; exit 4; fi
          exit $status

      - name: Golden loop evidence
        # golden-loop-2d.json / golden-loop-2d-develop.json (the before/after record, the
        # develop stage's with its ledger records) and golden-loop/ (the failing and the
        # passing frames) beside each run's summary and playability reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-loop-evidence-${{ matrix.stage }}
          path: /tmp/wgf-golden-*/evidence
          if-no-files-found: warn
          retention-days: 14
