    reads:
      - core/lifecycle/stages/qa.md
      - core/artifacts/verification-report.schema.json
      - core/artifacts/qa-report.schema.json
      - core/craft/playtesting.md
      - core/craft/3d-diagnostics.md
  - id: release
    supports: [release]
    covers: >
      Manifests, checksums, store metadata and presentation, platform assertions, and
      submission.
    reads:
      - core/lifecycle/stages/release-candidate.md
      - core/lifecycle/stages/publish.md
      - core/lifecycle/stages/store-listing.md
      - core/artifacts/release-manifest.schema.json
      - core/craft/onboarding-and-portal-ux.md
      - core/craft/store-listing.md
      - core/reference/publication/
      - core/artifacts/portal-registry.schema.json
      - docs/publish-module.md
  - id: store-listing
    supports: [release]
    covers: >
      The store listing: the canonical package captured from the verified build (branding
      from the game's own assets, screenshots and a gameplay recording of real play, copy
      grounded in the design), one rendition per platform under its profile's
      store_listing block, and the validation that reports unknown requirements as unknown.
    reads:
      - core/lifecycle/stages/store-listing.md
      - core/artifacts/store-listing.schema.json
      - core/artifacts/listing-validation-report.schema.json
      - core/reference/store-listing.yaml
      - core/artifacts/shared/platform-profile.schema.json
      - core/reference/platforms/
      - core/craft/store-listing.md
  - id: production-art-2d
    supports: [asset, gameplay, game-designer]
    covers: >
      2D production art that reads as a product: silhouette-first sprites with a distinct
      shape per level and variant, palette roles, the layered-SVG style kit (outlines,
      misregistration, halftone), backgrounds, VFX sprites, sizes and anchors, and authoring
      through the assets step or a library.
    reads:
      - core/craft/production-art-2d.md
      - core/reference/art-style-families.yaml
      - core/craft/production-art-and-ui.md
      - core/craft/2d-assets.md
      - core/reference/asset-policy.yaml
  - id: production-art-3d
    supports: [asset, gameplay, game-designer]
    covers: >
      3D production art from model specs: part decomposition of recognisable low-poly
      objects, bevel, taper and mirror, attachment, intersections, camera clearance and
      scale against the player, materials, emissive and the lighting rig per style family,
      fog and sky, chase camera and portrait framing, and building and inspecting models.
    reads:
      - core/craft/production-art-3d.md
      - core/reference/art-style-families.yaml
      - core/craft/production-art-and-ui.md
      - core/craft/3d-assets-and-animation.md
      - core/craft/3d-scene-and-physics.md
      - core/artifacts/shared/model-spec.schema.json
  - id: game-ui-kit
    supports: [ui, asset, game-designer]
    covers: >
      The game's own interface kit: fonts as licensed assets with locale glyph coverage,
      HUD layout without overlap, contrast and touch-target minimums, drawn buttons, title,
      pause, result and retry screens, and the mobile portrait layout.
    reads:
      - core/craft/game-ui-kit.md
      - core/craft/production-art-and-ui.md
      - core/craft/ui-hud-mobile.md
      - core/craft/accessibility.md
  - id: juice
    supports: [gameplay, ui]
    covers: >
      Game feel with numbers: drop bounce, merge pop and burst, combo text, shake,
      near-miss and crash feedback, opening grace, acknowledgement within 100 ms, and the
      interaction effects the design declares (build_spec.vfx) and the gates measure.
    reads:
      - core/craft/juice.md
      - core/reference/vfx.yaml
      - core/craft/game-feel.md
  - id: production-wiring
    supports: [gameplay, ui, asset]
    covers: >
      Wiring production art into a build: loading the runtime asset manifest (variants,
      roles, fonts), the play probe's asset, render and assets_loaded, the regression guard
      end-to-end test, and self-checking against the production gate and visual QA before
      reporting.
    reads:
      - core/craft/production-wiring.md
      - core/craft/2d-assets.md
      - core/artifacts/shared/play-probe.schema.json
      - core/reference/visual-quality.yaml
      - core/reference/experience-rules.yaml
# ---------------------------------------------------------------------------
# What an adapter must NOT do.
# ---------------------------------------------------------------------------
prohibitions:
  - Do not copy schema field lists into adapter files. Reference the schema path.
  - Do not restate stage procedures. Reference the procedure path.
  - Do not define a per-provider `workflows/` tree. It duplicates core/lifecycle/stages/.
  - Do not advance a lifecycle state from inside an agent surface. Emit artifacts and stop;
    transitions are commands and gates are human.
  - Do not auto-approve G4, G6 or G7 under any configuration.
