# Check tiers: what each check the Factory declares does to a build, in one vocabulary.
#
# Every validator states its own severities - the quality floor `blocker | warning` per tier,
# content-sufficiency `blocker | major`, the design rules `blocking | warning`, the visual
# judge's blockers and pass bars, the review's gate-gaming flags. Read one at a time, nothing
# said which of them a build must pass, which hold it to a calibrated bar and which only
# inform. This file classifies every one of them into three tiers, stated at the tier a build
# ships at (`applies_at`; a tier-mvp run is a development build, core/reference/
# quality-policy.yaml, and is never released):
#
#   hard      Hard Gate. A pass/fail condition: any failure holds the build. No score, average
#             or other dimension lifts it, and it is never recalibrated to let a build pass.
#   quality   Quality Gate. A measured score or count held to a calibrated bar - a dimension's
#             `min_score`, a benchmark bar, a rubric pass bar. Below the bar it holds the
#             build like a hard gate; the bar moves only by a new version of the file that
#             states it (docs/factory-quality-benchmark.md), never for one build.
#   advisory  Advisory. Reported, and at most routed as a finding (a warning counts toward its
#             dimension's score, which that dimension's quality gate holds); never holds a
#             build on its own.
#
# A check's id here is `<source>:<id>` (`quality-floor:floor.core_loop`,
# `playability:depth.ramp`): the source names the file or producer that defines it. Sources
# are enumerated two ways:
#
#   derived   the source file is read (`file`, `enumerate`) and each entry's tier follows from
#             a field it already carries (`tier.by` through `tier.map`), or is one constant
#             (`tier.all`), or follows the named `tier.rule`. Nothing is restated: a new entry
#             in the file is classified by the same rule, and an entry whose field the map
#             does not cover fails check-integrity.
#             `prefix` is prepended to every id the file declares, when the producer reports
#             them under it (browser-qa.yaml `loads` is reported as `browser.loads`).
#             `findings_via` names the report triage reads the producer's failures through
#             (a verify check reaches triage as a qa-report blocking defect), so a finding
#             there carries the lessons of its check (`guarded_by`).
#   explicit  `checks` lists each id and its tier. Used for a producer whose checks are
#             defined in code (`defined_in`: each id must appear there as a string literal)
#             and for a file whose own fields do not say which tier a check is. An entry the
#             source file has and this table does not - or the reverse - fails integrity.
#
# Integrity (scripts/check-integrity.py, scripts/wgf_quality/registry.py) also holds that
# every check a quality-floor criterion reads from a producer is listed under that producer,
# and that a producer check a release-tier blocker reads is `hard` or `quality`, never
# advisory. core/reference/lessons.yaml names checks by these ids.
#
# `status_at` (1.1.0) says where a check's result is read in its producer's report, so a
# rule of core/reference/lessons.yaml can be shown to have run and passed on a build
# (docs/knowledge-enforcement.md). A source without one reads the top-level `status_at`. A
# locator:
#
#   list        dotted path to the entries in the report; `name[]` flattens a list on the way
#               (`items[].quality.checks`: every item's quality checks)
#   keys        instead of `list`: a mapping of check id -> measured value (a score). Its
#               result is MEASURED with the value; the bar is the source file's
#   id          the entry field holding the check id (default `id`)
#   id_pattern  a regular expression with a group `id` that extracts the check id from it
#               (a review blocker `gate-gaming-<pattern>-<n>`)
#   id_split    a separator: the check id is what precedes it (`browser.<id>:<viewport>`)
#   where       {field: value}: only entries carrying these values are read
#   status      the entry field holding its status (default `status`)
#   map         raw status -> PASS | FAIL | WARNING | BLOCKED | SKIPPED | UNMEASURED |
#               DEFERRED; an unmapped raw status is upper-cased
#   presence    instead of `status`: an entry present means this status (a blocker is FAIL)
#   attribute   false: the entries carry no check id the source declares (a judge's
#               free-form ids); any selected entry is every check of the source at the
#               `presence` status
#   absent      {field, map}: a check with no entry reads the report's `field` through `map`
#               (a review that approved has no gate-gaming blocker: PASS); otherwise, and
#               when a report has no entry for a check, it is UNMEASURED - never a pass.
#   not_reported  (1.2.0) [group]: a producer that reports a check only for a build it
#               concerns. A report with no entry for a check a group lists (`checks`, or
#               "*" for every check of the source) reads NOT_APPLICABLE only when every
#               condition of the group holds - otherwise UNMEASURED, and no report at all is
#               always UNMEASURED:
#                 verdict   the report's verdict is one of these (the producer finished: a
#                           BLOCKED report proves nothing)
#                 ran       an entry whose id starts so exists (the check's family ran)
#                 render    the run's render facet is one of these
#                 none_of   {report, path, values}: none of `values` is at `path` in another
#                           report of the run (the design declares no moving body)
#                 missing   {report, path}: nothing is at `path` in another report (no
#                           adopted content floor)
#                 other     {report, list, id, status}: another report carries that check
#                           at one of those statuses (the content data file was read)
#                 why       why the producer does not report it (required)
#               A group needs `verdict` or `ran`: an absent entry is never NOT_APPLICABLE on
#               nothing but its absence.
#   not_applicable  {field, values} (1.2.0): an entry whose `field` (dotted, in the entry)
#               holds one of `values` is the producer saying the check does not concern this
#               build (a clear rate with no accepted build to fall from): NOT_APPLICABLE
#   covered     {field, values} (1.2.0): a WARNING entry whose `field` (a mapping or list)
#               holds only `values` is a proxy its producer made advisory because another
#               check measured what it stands for - read on its own; it reads PASS
#               (`covered`), never hiding the other check
#
# check-integrity holds that every locator's path exists in the producer's schema
# (core/artifacts/<producer>.schema.json).
#
# Read by: scripts/check-integrity.py, scripts/wgf_quality/registry.py (the lessons registry
# and triage's `guarded_by`), scripts/wgf_knowledge/ (levels, the applicability resolver).
# Add a check to a source file and it is classified here, or the integrity check fails.

version: 1.2.0

applies_at: release

# Where a source's results are read when it states no `status_at` of its own.
status_at: {list: checks, id: id, status: status}

tiers:
  hard:
    label: Hard Gate
    blocks: true
    meaning: A pass/fail condition. Any failure holds the build; nothing averages past it.
  quality:
    label: Quality Gate
    blocks: true
    meaning: A measured score or count held to a calibrated bar; below the bar it holds the build, and the bar moves only by a new version.
  advisory:
    label: Advisory
    blocks: false
    meaning: Reported and routed as a finding at most; never holds a build on its own.

sources:
  # ---------------------------------------------------------------- derived from data
  quality-floor:
    file: core/reference/quality-floor.yaml
    producer: quality-report
    enumerate: floor-criteria        # universal + genres.*.criteria + dimensions_contracts.*.criteria
    # The report scores the criteria of the build's own contract (its genre family, its render,
    # an `applies` the build meets): a criterion it does not carry does not concern this build.
    status_at:
      list: criteria
      id: id
      status: status
      not_reported:
        - checks: "*"
          ran: floor.
          why: the report scores the criteria of the build's own contract (its genre family, its render, an `applies` the build meets)
    # A release blocker is hard when it is pass/fail (a check share, a verdict, a count of
    # zero) and quality when it reads a calibrated bar (a `quality-benchmark:` or
    # `visual-qa-rubric:` reference, or a rubric score); a release warning is advisory; a
    # criterion with no release severity does not apply at the release tier: advisory.
    tier: {rule: floor-criterion}
  quality-dimension:
    file: core/reference/quality-floor.yaml
    producer: quality-report
    enumerate: {keys: dimensions}
    tier: {all: quality}
    status_at: {list: dimensions, id: id, status: status, map: {BELOW_FLOOR: FAIL}}
  visual-qa-blocker:
    file: core/reference/visual-qa-rubric.yaml
    producer: visual-qa-report
    enumerate: {list: blockers}
    tier: {all: hard}
    # The judge names its findings freely (wgf_visualqa/rubric.py: "short-kebab-id"; the
    # baseline judge writes baseline-regression-<frame>): a blocker finding cannot be told
    # to be one rubric blocker rather than another, so any blocker finding leaves every
    # rubric blocker UNMEASURED, and a judged report with none passed them all.
    status_at: {list: findings, where: {severity: blocker}, attribute: false, presence: UNMEASURED, absent: {field: verdict, map: {PASS: PASS, FAIL: PASS}}}
  visual-qa-score:
    file: core/reference/visual-qa-rubric.yaml
    producer: visual-qa-report
    enumerate: {keys: dimensions}
    tier: {all: quality}
    status_at: {keys: scores}
  gate-gaming:
    file: core/reference/gate-gaming.yaml
    producer: review-report
    enumerate: {keys: patterns}
    # A flag is a review blocker routed back to the visit's owner (docs/review-module.md).
    tier: {all: hard}
    status_at: {list: blockers, id_pattern: "^gate-gaming-(?P<id>.+)-[0-9]+$", presence: FAIL, absent: {field: verdict, map: {approve: PASS}}}
  design-consistency:
    file: core/reference/design-consistency-rules.yaml
    producer: game-design
    enumerate: {list: rules}
    tier: {by: severity, map: {blocking: hard, warning: advisory}}
    status_at: {list: consistency.rule_results, id: criterion_id, status: breached, map: {"true": FAIL, "false": PASS}}
  browser-qa:
    file: core/reference/browser-qa.yaml
    producer: verification-report
    findings_via: [qa-report]
    enumerate: {list: checks}
    prefix: browser.
    # Each check states its own tier in the file; per viewport it is reported as
    # `browser.<id>:<viewport>`, and a finding's `:<viewport>` is not part of the check.
    tier: {by: tier, map: {hard: hard, quality: quality, advisory: advisory}}
    status_at: {list: checks, id: id, id_split: ":", status: status}

  # ---------------------------------------------------------------- explicit tables
  content-sufficiency:
    file: core/reference/content-sufficiency.yaml
    producer: content-sufficiency-report
    enumerate: {keys: checks}
    # content.regression is reported only for a run that adopted a game (a floor to keep).
    status_at:
      list: checks
      id: id
      status: status
      not_reported:
        - checks: [content.regression]
          verdict: [PASS, FAIL]
          ran: content.
          missing: {report: game-design, path: existing_content}
          why: reported only for a run that adopted a game, whose design carries the floor
    # Required at the release tier, every one fails the step's verdict. Pass/fail ones are
    # hard; one that counts the build against a tier's bar (the benchmark) is quality.
    checks:
      content.contract: hard
      content.data_present: hard
      content.units_shipped: quality
      content.units_reachable: hard
      content.entity_kinds: quality
      content.elements: quality
      content.combinations: quality
      content.structure: quality
      content.groups: quality
      content.difficulty: quality
      content.objectives: quality
      content.climax: quality
      content.progression: hard
      content.playtime: quality
      content.drift: hard
      content.regression: hard
  playability:
    producer: playability-report
    defined_in: scripts/wgf_playability
    # depth.stall is reported only where the ramp was sampled in timed, endless play.
    status_at:
      list: checks
      id: id
      status: status
      not_reported:
        - checks: [depth.stall]
          verdict: [PASS, FAIL]
          ran: depth.ramp
          why: reported only where the ramp was sampled in timed, endless play
    checks:
      probe.present: hard
      start.playable: hard
      start.objective: hard
      win.reachable: hard
      lose.reachable: hard
      restart.works: hard
      act.acknowledged: hard
      idle.grace: hard
      page.errors: hard
      progression.persists: hard
      content.variety: quality
      content.win_lose_per_unit: hard
      content.units_reachable: hard
      difficulty.axes_progress: quality
      frames.readable: quality
      entities.projectile: quality
      depth.ramp: quality
      depth.session_length: quality
      depth.stall: hard
  production-quality:
    producer: production-quality-report
    defined_in: scripts/wgf_production
    checks:
      assets.present: hard
      assets.runtime: hard
      assets.loaded: hard
      assets.used: hard
      scene.no_primitives: hard
      scene.contrast: quality
      audio.plays: hard
      ui.text: quality
      ui.targets: quality
      ui.overlap: hard
      ui.styled: hard
      ui.states: hard
  play-realism:
    producer: playability-report
    defined_in: scripts/wgf_playability
    # Reported only where a check concerns the build (play-realism.yaml): physics on a 2D
    # board with a moving body, drift and alignment on a 3D path, level.geometry and
    # unit_length on path layouts, level.clearance on grid layouts. Each absence is
    # NOT_APPLICABLE only with the evidence its group names - the report finished, realism
    # ran on a viewport (its runtime checks are reported for every viewport the bot
    # recorded), the content data file was read - else UNMEASURED. naive.clear_rate with no
    # accepted build (`measured.unmeasured: no-accepted-build`) is, in the producer's words,
    # never held: a game with no accepted build has no clear rate to fall from. A
    # level.clearance the producer made advisory because each failing unit's clear rate was
    # measured (`measured.gate` advisory or clear-rate-failed, realism.gate_clearance) is
    # covered by naive.clear_rate, which is read on its own.
    status_at:
      list: checks
      id: id
      status: status
      not_applicable: {field: measured.unmeasured, values: [no-accepted-build]}
      covered: {field: measured.gate, values: [advisory, clear-rate-failed]}
      not_reported:
        - checks: [physics.undrawn_collision, physics.collider_size]
          verdict: [PASS, FAIL]
          ran: runtime.
          render: [3d]
          why: judged on a 2D board only - a 3D build's screen positions are a moving camera's
        - checks: [physics.undrawn_collision, physics.collider_size]
          verdict: [PASS, FAIL]
          ran: runtime.
          render: [2d]
          none_of: {report: game-design, path: "build_spec.assets[].role", values: [projectile]}
          why: judged on the bodies the simulation moves (play-realism.yaml physics.roles), and the design declares none
        - checks: [naive.drift, naive.alignment]
          verdict: [PASS, FAIL]
          ran: naive.
          render: [2d]
          why: judged on a 3D path only (play-realism.yaml drift and alignment dimensions)
        - checks: [level.geometry, level.unit_length, level.clearance]
          verdict: [PASS, FAIL]
          other: {report: content-sufficiency-report, list: checks, id: content.data_present, status: [PASS]}
          why: judged on the layouts the content data file declares - paths, grids - and it declares none of that kind
    # core/reference/play-realism.yaml: a measured FAIL holds the build at the tiers
    # `enforce.fail_required_at` names (release, premium); an unmeasured one follows
    # quality-policy.yaml skipped_checks. Pass/fail ones are hard; one held to a
    # calibrated bar (a ratio, a share of par, a per-tier duration, a clear rate) quality.
    # level.clearance is a proxy: realism.gate_clearance makes it advisory unit by unit
    # where the unit's clear rate was measured and passed.
    checks:
      physics.undrawn_collision: hard
      physics.collider_size: quality
      naive.setbacks: quality
      naive.drift: quality
      naive.alignment: quality
      naive.pace: quality
      naive.unit_duration: quality
      naive.clear_rate: quality
      level.geometry: quality
      level.unit_length: quality
      level.clearance: quality
      runtime.console_errors: quality
      runtime.webgl_context: hard
  browser-qa-run:
    producer: verification-report
    findings_via: [qa-report]
    defined_in: scripts/wgf_verification
    # Whether the browser-QA spec ran at all: BLOCKED at release when it did not.
    status_at: {list: checks, id: id, id_split: ":", status: status}
    checks:
      browser.run: hard
  model-review:
    producer: asset-manifest
    defined_in: scripts/wgf_assets
    # The deterministic model checks (core/reference/asset-quality.yaml `models`): a spec
    # that fails one is not shipped as the model.
    status_at: {list: "items[].quality.checks", id: id, status: status, map: {pass: PASS, fail: FAIL, skipped: SKIPPED}}
    checks:
      model.valid: hard
      model.parts: hard
      model.primitive: hard
      model.bounds: hard
      model.normals: hard
      model.triangles: quality
      model.palette: quality
      model.contrast: quality
      model.silhouette: quality

# `<source>:<id>: <tier>` - a classification the source's rule gets wrong, stated with why.
# Empty as shipped.
overrides: {}
