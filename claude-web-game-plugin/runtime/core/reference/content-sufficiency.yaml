# Content sufficiency: how the content-sufficiency step measures the content of the BUILT game.
#
# The design step holds a design to its quality tier on what it declares (content.tier_*,
# scripts/wgf_design/content.py). Nothing held the build to it: a twelve-level build with one
# element passed every gate (docs/quality-gap-audit-2026-10.md, finding 2). The
# content-sufficiency step (scripts/wgf_sufficiency, docs/content-sufficiency-module.md)
# measures the build itself - the content data file it ships (public/content/units.json) and
# what its play probe reports while the playability bot plays and surveys every unit - and
# holds that to the bars of core/reference/quality-benchmark.yaml at the design's quality
# tier (`content`, `progression`), the genre family's (core/reference/genre-models.yaml
# `units`, `budget`, `variety`) and the design's own commitments.
#
# This file holds no bar. It holds how a quantity is measured (what is a unit's layout, how
# alike two units must be to be the same unit), how long the bot may spend surveying, and for
# each check the discipline that owns a failure, its severity and where it routes. No consumer
# branches on a family id or a game: everything a family changes is in genre-models.yaml.
#
# Read by:
#   scripts/wgf_sufficiency/audit.py     every block
#   scripts/wgf_playability/step.py      `survey` (the bot's survey test, bot.spec.ts)

version: 1.5.0  # 1.1.0: content.regression against an adopted repository's existing-content floor; 1.2.0: the probe floor, and an unmeasured floor SKIPPED (never a pass); 1.3.0: layouts compared on geometry only (leaves inside a list), `layout.source`, a unit without geometry undetermined and repetition it leaves open UNMEASURED; 1.4.0: geometry only from a declared place (a unit's `layout` entry, `layout.unit_key`, and the layout source), compared as sequences by value with container names dropped, one layout wholly inside another the same layout; 1.5.0: content.introductions_one_at_a_time

survey:
  # The playability step's `survey` test (step `with: {survey: true}`): every unit the design
  # lists (except `optional` ones) is entered directly through the probe's unit link
  # (`?wgf-probe=1&wgf-unit=<unit id>`, core/artifacts/shared/play-probe.schema.json) and
  # played by the oracle for at most `unit_s`, so units past the first few the traverse
  # reaches are measured too: the unit the probe reports, the entity kinds and assets drawn,
  # the difficulty in force, and how long the oracle took to complete it. Content is the same
  # on every viewport, so only `projects` are surveyed. `total_s` caps the whole test; a unit
  # it cannot reach in time is recorded as not entered, with the reason.
  projects: [desktop]
  unit_s: 12
  total_s: 480

layout:
  # Units are compared on their GEOMETRY, and geometry comes only from a declared place:
  # in the build, each unit's own `unit_key` entry in units.json (its course, board, grid,
  # wave list as data) and its entry in the layout source (`source` below); in the design,
  # each unit's `parameters` (game-design `units[].parameters`). No other key of a unit
  # counts - a `tags` list or a `parameters` block beside the layout is not geometry.
  # Inside a declared layout the geometry is its sequences: every outermost list (a track's
  # segments, a grid's rows, a wave list, a board's cells), compared item by item by value,
  # whatever its container is called (`segments` renamed `pieces` is the same course). A
  # scalar outside every list - a width, a par time, a flag - is tuning, the same layout at
  # another difficulty. A unit whose declared layout holds no list is UNDETERMINED, never
  # repeated (scripts/wgf_design/layouts.py). The descriptive keys below remain what a unit's
  # data says ABOUT it (audit.layout_of); they are never geometry.
  descriptive_keys:
    - id
    - index
    - tier
    - purpose
    - objective
    - objective_kind
    - group
    - structure
    - elements
    - mechanics
    - introduces
    - difficulty
    - expected_duration_s
    - success
    - failure
    - acceptance
    - art
    - variation_from_previous
    - start_state
    - end_state
    - name
    - title
    - notes
    - unlock
  # Two units are the same unit with other numbers - repeated - when they share their
  # structure kind, their combination of elements and their objective kind, and their
  # layouts are at least this alike: how much of the smaller layout the larger holds, in
  # order (each sequence's items matched to one sequence of the other, over the smaller
  # layout's item count), so a copy padded with an unrelated list is still a copy. One layout
  # wholly inside another (similarity 1.0: identical, renamed, padded) is always repeated.
  # A design unit is also repeated when another has its structure, its elements and the same
  # parameter values, whatever its geometry - the design check is never looser than that.
  near_identical_similarity: 0.85
  # The key of a unit's entry in units.json that holds its layout.
  unit_key: layout
  # Where a game keeps its geometry apart from units.json: a JSON file under public/content
  # holding {unit id: layout} under `key` (or at its root when it has no such key). A unit's
  # entry there is part of its geometry. The content data file may name another file the
  # same way (units.json `layout_source`: {path, key} or a path; only under public/content).
  # The playability step keeps the file beside units.json for the commit it played.
  source: {path: public/content/layouts.json, key: layouts}
  # Repetition is held to content.structure.max_repeated_layout_ratio on the units with
  # geometry; while undetermined units could carry the share past that bar (each repeating a
  # unit not yet repeated), it is unmeasured: content.structure is SKIPPED as UNMEASURED,
  # never a pass (the quality gate holds a skipped check at the release tier,
  # quality-floor.yaml floor.sufficiency_measured).

probe:
  # Entities of these roles carry `kind` (play-probe entities[].kind) in a game with
  # authored content: a kind is how the build shows which element is on screen, so without
  # it element variety on the build cannot be counted.
  kind_roles: [threat, goal, target, projectile, collectible, hazard]
  # Roles that are the player or the interface: their kinds are not content elements.
  not_content_roles: [player, ui]

# Every check: the quality dimension it scores, the discipline that owns a failure, its
# severity, and its route. `route: develop` - the build is short of what was designed;
# `route: by-design` - the same quantity is measured on the design's own declaration first:
# when the design is short of the bar, the failure routes `design-gap` (the design must
# grow), else `develop` (the build must catch up). `design_field` is where a design gap
# points.
checks:
  content.contract: {dimension: content, owner: game-design, severity: blocker, route: design-gap, design_field: "build_spec.content"}
  content.data_present: {dimension: content, owner: level-design, severity: blocker, route: develop}
  content.units_shipped: {dimension: content, owner: level-design, severity: blocker, route: by-design, design_field: "build_spec.content.units"}
  content.units_reachable: {dimension: progression, owner: gameplay, severity: blocker, route: develop}
  content.entity_kinds: {dimension: content, owner: gameplay, severity: major, route: develop}
  content.elements: {dimension: content, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.elements"}
  content.combinations: {dimension: level-design, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.units[].elements"}
  content.structure: {dimension: level-design, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.units[].structure"}
  content.groups: {dimension: content, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.groups"}
  content.difficulty: {dimension: difficulty, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.units[].difficulty"}
  content.objectives: {dimension: level-design, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.units[].objective_kind"}
  content.climax: {dimension: content, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.units[].art"}
  content.progression: {dimension: progression, owner: game-design, severity: major, route: by-design, design_field: "build_spec.progression.steps"}
  content.playtime: {dimension: content, owner: level-design, severity: major, route: by-design, design_field: "build_spec.content.units[].expected_duration_s"}
  content.drift: {dimension: content, owner: level-design, severity: blocker, route: develop}
  # Only when the design records an existing-content floor (game-design existing_content,
  # an adopted repository): the build ships no fewer units, groups, climax units or elements
  # than that repository already shipped. `by-design` like the rest: a design that itself
  # plans below the floor routes design-gap. A repository that shipped no content data file
  # is floored on its shipped build through the play probe (the first greybox-playability
  # visit; the playability-report carries it): a build with a content data file is counted
  # on it, one without through the probe. Until that floor is measured the check is SKIPPED
  # as unmeasured - never a pass - and the quality gate holds it as a blocker
  # (quality-floor.yaml floor.existing_content).
  content.regression: {dimension: content, owner: level-design, severity: blocker, route: by-design, design_field: "build_spec.content.units"}
  # 1.5.0. The design rule content.introductions_one_at_a_time (design-consistency-rules.yaml)
  # counted on the BUILT content data file: after the opening unit, no shipped unit (index
  # order) debuts more than one element - `elements`, `mechanics` and `introduces` it names
  # that no earlier shipped unit named. A design that paces its introductions but a build
  # whose units.json does not FAILs (claimed vs actual); `by-design`: a design that itself
  # debuts two at once routes design-gap. A content data file that names no unit's elements
  # or mechanics cannot be counted: SKIPPED as unmeasured, never a pass.
  content.introductions_one_at_a_time: {dimension: level-design, owner: level-design, severity: blocker, route: by-design, design_field: "build_spec.content.units[].introduces"}
