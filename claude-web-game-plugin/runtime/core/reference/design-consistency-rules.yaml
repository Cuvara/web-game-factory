# Web Game Factory — Design consistency rules
#
# Evaluated as the exit guard on title:design. The result is written into
# game_design.consistency so that "the design is coherent" is a recorded outcome with
# named rule results, not an assertion by whoever wrote it.
#
# This is what makes "scope, session, retention and monetization were co-designed"
# checkable. Without it, folding those four into one stage just means one document with
# four sections that still contradict each other.
#
# Rules use the criteria-expression vocabulary. Paths are dotted against the game-design
# artifact plus the resolved platform profiles. Keep them few and obvious — a rule nobody
# understands gets waived, and a waived rule is worse than no rule.

version: 2.2.0  # 1.2.1: match never the bare verb; 1.3.0: scope_fits_session_count applies only without a genre family; 1.4.0: detail_terms; 2.0.0: mechanics, not words (below); 2.1.0: brief commitments and the existing-content floor (below); 2.1.1: brief-commitments 1.1.0 (the probe floor); 2.2.0: content.introductions_one_at_a_time and knowledge.trace_matches_design (below)

# 2.0.0. The concept rules compared words: "tap hops" in a design read as a foreign `jump`
# for a brief that asked for hops, a goal gate read as a checkpoint `gate`, and an author
# repairing a breach renamed its words until the check stopped seeing the mechanic it had
# added. They now compare mechanic ids. The brief and the strategy are normalized to ids
# through the mechanic lexicon (synonyms and verbs are data there); the design is its
# build_spec mechanics, the content units that use them and the controls that drive them,
# each read as the id it is. A paraphrase is the same id; a renamed mechanic is still its id,
# or is unrecognised when the lexicon does not know it and the brief never says it.
# `concept_terms` and `detail_terms` moved into the lexicon (`kind: defining | detail`), and
# pillar_realized_by_mechanic is new. Changing the lexicon's words changes what these rules
# decide, so the ruleset pins its version and refuses another.
lexicon: { id: mechanic-lexicon, version: 1.0.0 }

# 2.1.0. The lexicon carries mechanics and pillars, not counts: a brief that asked for "4 themed
# worlds of hand-designed levels ... boss levels, and an endless mode" was designed as 3 groups
# of 12 units with the endless mode cut, and passed every rule; the repository it adopted
# already shipped 32 units in 4 worlds with 4 bosses. `commitments.*` is the brief's and the
# strategy's stated counts, structure and modes against what the design plans
# (core/reference/brief-commitments.yaml, wgf_design/commitments.py); `adopted.*` is what
# the adopted repository ships against the same counts of the design (wgf_design/existing.py,
# recorded in game-design.existing_content with the commit it was counted at). The ruleset
# pins the vocabulary like the lexicon: its words decide what a brief committed to.
commitments: { id: brief-commitments, version: 1.1.0 }

rules:
  - id: rewarded_ads_need_reward_moments
    label: Rewarded ads require natural reward moments
    severity: blocking
    when:
      all_of:
        - { left: monetization.placements, op: in, right: [rewarded] }
        - { left: session.reward_moments_per_session, op: lt, right: 1 }
    rationale: >
      Rewarded video only works where the player already wants something. Without a
      designed reward moment the placement becomes an interruption and the eCPM assumption
      behind the whole monetization plan is wrong.

  - id: short_session_no_daily_quest
    label: Short sessions cannot carry a daily-quest retention loop
    severity: blocking
    when:
      all_of:
        - { left: session.target_seconds, op: lte, right: 120 }
        - { left: retention.hooks, op: in, right: [daily_quest] }
    rationale: >
      A two-minute session has no room to present, explain and complete a daily quest. The
      retention mechanism has to fit inside the session it is meant to extend.

  - id: interstitial_interval_fits_session
    label: Session must be longer than the platform's interstitial interval
    severity: blocking
    when: { left: session.target_seconds, op: lt, right_path: platform.ads.interstitial_min_interval_s }
    rationale: >
      If the session is shorter than the minimum gap the portal enforces between
      interstitials, at most one can ever show and the revenue model does not hold.

  - id: scope_fits_session_count
    label: Content volume must match session length and expected retention
    severity: blocking
    # A design that names its genre family (game-design 1.9.0 `genre`) is bounded by the
    # family's content model instead: core/reference/genre-models.yaml and the design step's
    # content check (`content.units_fit_session`) size its units to the session, and a
    # level puzzle legitimately carries 20 levels for a five-minute session.
    when:
      all_of:
        - { left: session.target_seconds, op: lte, right: 300 }
        - { left: scope.content_units, op: gt, right: 12 }
        - { left: genre.family, op: absent }
    rationale: >
      More content than the retention curve will ever surface is cost with no return. Cut
      content or design a reason to come back; do not build for a player who leaves.

  - id: required_locales_addressed
    label: Every required locale is in scope
    severity: blocking
    when: { left: scope.locales, op: not_in, right_path: platform.requirements.locales_required }
    rationale: >
      Yandex requires ru, GameVui requires vi. Discovering this at platform validation is
      post-build; addressing it here costs a line in the scope.

  - id: monetization_supported_by_platform
    label: Monetization must be supported by every required platform
    severity: blocking
    # The platform's list is on the LEFT on purpose. With an array on the left, `in` asks
    # whether every element of the right is present in it (shared/criteria-expression) - so
    # this reads "not every designed placement is offered". Written the other way round, as
    # it was in 1.0.0, it fired whenever a portal offered a placement the design did not use.
    # `ads` here includes `iap` when the profile's capabilities.iap is true.
    when: { left: platform.capabilities.ads, op: not_in, right_path: monetization.placements }
    rationale: >
      Designing around a placement a required portal does not offer forces either a
      redesign or dropping the platform, both late and both expensive.

  - id: concept_mechanics_carried
    label: The design's core mechanic is the one the strategy approved
    severity: blocking
    # `concept.*` is a projection (wgf_design consistency.concept_view) in mechanic ids of
    # core/reference/mechanic-lexicon.yaml: the defining and detail ids the strategy's concept
    # (one-liner, core mechanic, core loop) names, against the ids of the design's MVP
    # mechanics and MVP controls. A design whose mechanics are a swap is a swap game, whatever
    # its prose repeats from the strategy.
    when: { left: concept.uncarried, op: neq, right: [] }
    rationale: >
      The design is what the developer builds and what the reviewer judges against. A design
      that drops a mechanic the strategy approved describes a different game from the one
      G2 approved, and the build is then either unfaithful to the design or to the strategy.

  - id: design_adds_no_foreign_mechanic
    label: The design introduces no core mechanic the brief and strategy do not imply
    severity: blocking
    # A core mechanic is an MVP mechanic a content unit uses, a control drives or the design
    # calls `core` (every MVP mechanic when the design lists no content), and every MVP
    # control. Foreign: a defining id among them that the brief and the strategy nowhere
    # imply, or a driven mechanic the lexicon does not know whose words they never use.
    when: { left: concept.foreign, op: neq, right: [] }
    rationale: >
      A swap-to-match design for a drop-and-merge strategy, or a checkpoint clock for a
      dodge-the-walls strategy, keeps every word of the concept and still changes the game.
      A mechanic the brief and strategy do not imply is a strategy change and goes back to
      G2. A paraphrase of the brief ("tap hops" for a jump) is not one.

  - id: pillar_realized_by_mechanic
    label: Every pillar the brief or design asks for is realized by a mechanic in play
    severity: blocking
    # `concept.pillars_unrealized`: the lexicon pillars the brief, the strategy or the
    # design's pillars name (risk/reward, time pressure) for which no MVP mechanic a content
    # unit uses is one of the pillar's `realized_by` ids.
    when: { left: concept.pillars_unrealized, op: neq, right: [] }
    rationale: >
      "Risk/reward decisions" is a promise about play. The words appearing in the design
      keep none of it; a mechanic the units use - an optional pickup off the safe line, a
      multiplier, a shortcut - does.

  - id: brief_commitments_met
    label: The design plans at least the counts, structure and modes the brief states
    severity: blocking
    # `commitments.unmet`: every count the brief or the strategy's own statements state -
    # groups ("4 themed worlds"), units ("32 levels", "worlds of 8"), climax units ("boss
    # levels", "a boss per world") - that the design's units not tiered optional fall short
    # of, and every mode of the feature catalogue the brief names that the design does not
    # include. Each names the brief's words and what the design plans.
    when: { left: commitments.unmet, op: neq, right: [] }
    rationale: >
      "Four worlds" is a promise the person who wrote the brief can count. A design with three
      passes every quality bar and still delivers less than was asked; the shortfall is found
      by a player, not a gate. Plan at least what the brief states, or change the brief - a
      person's decision, never the design's.

  - id: existing_content_floor_kept
    label: The design plans no less than the adopted repository already ships
    severity: blocking
    # `adopted.short`: every quantity of game-design.existing_content (units, groups, climax
    # units, elements, counted on the adopted checkout's content data at its HEAD commit)
    # that the design plans fewer of. Absent when the run adopts nothing.
    when: { left: adopted.short, op: neq, right: [] }
    rationale: >
      A run that adopts a game is improving it. A design below what the repository already
      ships plans a regression, and every later gate would measure the build against the
      smaller design and pass it.

  # 2.2.0. A unit that debuts two never-seen elements at once teaches neither: the player
  # meets both in the same breath and cannot tell which one beat them. The same count holds
  # the BUILT content data file (content-sufficiency.yaml content.introductions_one_at_a_time),
  # so a design that paces its introductions and a build that does not is caught too.
  - id: content.introductions_one_at_a_time
    label: After the opening unit, a unit debuts at most one element the player has not met
    severity: blocking
    # `introductions.over_one`: every content unit (not tiered optional, in index order)
    # after the first that debuts more than one element - what it states it `introduces`, or,
    # for a unit stating none, every element and mechanic no earlier unit named
    # (wgf_design/content.py unit_debuts, introductions_view). The opening unit is exempt: it
    # is where play begins. A design with no units holds the rule and says so.
    when: { left: introductions.over_one, op: neq, right: [] }
    rationale: >
      Every new element is first met on its own and practised before it is combined with
      another new one. Two debuts in one unit is the classic way a level becomes a wall: the
      player fails, cannot tell which new thing beat them, and quits.

  - id: first_reward_within_first_session
    label: First reward must land inside the first session
    severity: warning
    when: { left: session.time_to_first_reward_s, op: gt, right_path: session.first_session_seconds }
    rationale: >
      A player who never reaches a reward has no reason to return. Web game traffic is
      unforgiving about this in a way app traffic is not — there is no install cost to
      anchor them.

  - id: iap_matches_audience
    label: IAP on a casual mobile audience needs justification
    severity: warning
    when:
      all_of:
        - { left: monetization.placements, op: in, right: [iap] }
        - { left: audience.type, op: eq, right: casual }
        - { left: audience.device, op: eq, right: mobile }
    rationale: >
      Casual web-portal traffic converts poorly to IAP. Not forbidden, but the design
      should say why this case is different rather than assume it.

  - id: asset_cost_within_scope
    label: Asset cost must fit the production model
    severity: blocking
    when: { left: asset_manifest.total_est_cost, op: gt, right_path: scope.asset_budget }
    rationale: Scope is the variable that moves. Cut content, not the budget.

  - id: progression_has_an_end_or_a_loop
    label: Progression must terminate or loop deliberately
    severity: warning
    when: { left: scope.progression_terminal, op: absent }
    rationale: >
      An open-ended progression with no designed end state produces an endless content
      obligation, which is exactly what a 7-14 day production model cannot service.

  # 2.2.0. The design's decision trace (game-design 1.16.0 `knowledge_applied`): what the
  # author says it did with each Factory rule it was given. A claim the design contradicts is
  # a breach. Listed LAST: it reads the result of every rule above it.
  - id: knowledge.trace_matches_design
    label: The design's knowledge trace says what the design does
    severity: blocking
    # `knowledge.problems` (wgf_design/knowledge.py trace_view): an entry naming a rule the
    # design was not given (not applicable to the game), a revision it was not given, units
    # the design does not have, checks that are not the rule's - or `applied: true` while one
    # of the rule's own design-side checks (design-consistency) is breached on this design.
    # An absent trace is not a breach; a trace with no knowledge to check it against is.
    when: { left: knowledge.problems, op: neq, right: [] }
    rationale: >
      A trace is a claim, and a claim nobody checks is decoration. It never makes a rule
      satisfied - only the rule's checks do, on the build - but a design that says it applied
      a rule it breaks is wrong about itself, and every reader downstream would believe it.

evaluation:
  pass_condition: No rule with severity=blocking is breached.
  record_into: game_design.consistency
  note: >
    Warnings do not block the transition but are carried to G3 and must be acknowledged
    there. A warning that is never read is just a comment.
