# Feature catalogue: the candidate features a web game design evaluates, never adds blindly.
#
# A brief asks for "an endless mode for replay"; a genre's players expect a time trial. Neither
# is a mechanic the consistency rules see, and both used to drop out of a design without a
# word. This file names the features a design is expected to have an opinion about, and the
# design records that opinion per feature in `game-design.features[]` (1.10.0):
#
#   source       where the feature came from: brief | strategy | design | catalogue
#   catalogue    this file's feature id the entry evaluates
#   evaluation   {player_value, cost_h, platform_support, monetization_impact, qa_cost,
#                 decision: include | later | cut, reason}
#
# Read by:
#   scripts/wgf_design/features.py   the design step's feature check (criterion ids features.*)
#                                    and the built-in author's evaluations
#   scripts/wgf_design/agent.py      the agent author's request (`feature_candidates`)
#
# What the check requires (docs/quality-gap-audit-2026-10.md WS-5):
#
#   - a catalogue feature the brief names (one of its `terms`) is a feature with
#     `catalogue: <id>`, `source: brief` and an evaluation - included, deferred or cut, each
#     with a reason;
#   - the same for one the title strategy names (its one-liner, concept, MVP, what the
#     prototype must prove, or its out_of_scope list), with `source: strategy` or `brief`;
#   - every feature this file marks `expected` for the design's genre family
#     (core/reference/genre-models.yaml) is evaluated the same way - not added: `later` and
#     `cut` are honest answers when the reason is stated;
#   - an `include` is tiered mvp or post-mvp, a `later` or `cut` is tiered optional, and a
#     cut feature is listed in scope.tiers.out_of_scope with its reason (so G4 shows it);
#   - an included feature that needs a platform capability (`platform.capability`) that a
#     required platform lacks, with no local fallback, is refused: cut it or defer it.
#
# Fields per feature:
#   terms         how a brief or strategy names it: whole words or phrases, lower case,
#                 matched on word boundaries with hyphens read as spaces. Only phrases that
#                 name THIS feature - a bare "best" or "mode" names nothing.
#   families      per genre family: expected (its players look for it; must be evaluated),
#                 fits (a reasonable candidate) or poor (rarely worth its cost there). Every
#                 family of genre-models.yaml is listed; no consumer branches on a family id.
#   platform      the capability of a platform profile (`capabilities.<name>`) the feature
#                 rests on, and `fallback`: local (it still works on-device without it) or
#                 none (without it there is no feature). Absent: any platform.
#   player_value, monetization_impact, qa_cost
#                 the starting estimate an evaluation may revise with a reason: low |
#                 medium | high (monetization_impact also none).
#   cost_h        the starting estimate of build hours at web-portal scale.
#
# Change an estimate only with a reason a person could defend from a build or a playtest; add
# a feature when a brief named one this file could not recognise. Never edit a term to make a
# brief stop naming something.

version: 1.0.0

# The values an evaluation's platform_support takes, computed from the required platforms:
#   all    every required platform supports it (or it needs no capability)
#   some   some required platforms do; the others need its fallback or go without
#   local  no required platform does, and it works on-device (fallback: local)
#   none   no required platform does, and there is no fallback
platform_support: [all, some, local, none]

features:
  - id: progression
    name: Level progression
    kind: meta
    description: A level map or select screen the player advances through, one unit after another.
    terms: [progression, level select, level map, world map, campaign]
    families: {puzzle: expected, platformer: expected, arcade: fits, shooter: fits, racing: fits, strategy: expected, survival: poor, simulation: fits}
    player_value: high
    cost_h: 6
    monetization_impact: low
    qa_cost: medium

  - id: unlocks
    name: Unlocks
    kind: meta
    description: Content, modes or cosmetics that open on a stated condition, so a goal is always visible.
    terms: [unlock, unlocks, unlockable, unlockables, unlocked]
    families: {puzzle: fits, platformer: fits, arcade: fits, shooter: fits, racing: expected, strategy: fits, survival: fits, simulation: fits}
    player_value: medium
    cost_h: 4
    monetization_impact: low
    qa_cost: medium

  - id: worlds
    name: Themed worlds
    kind: content
    description: The units grouped into themed worlds, each with its own look and the elements it introduces.
    terms: [themed worlds, worlds of, world themes, themed zones, chapters]
    families: {puzzle: fits, platformer: expected, arcade: fits, shooter: fits, racing: fits, strategy: fits, survival: poor, simulation: poor}
    player_value: high
    cost_h: 16
    monetization_impact: low
    qa_cost: high

