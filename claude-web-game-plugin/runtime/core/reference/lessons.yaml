# Lessons: what building real games taught the Factory, and what now stops each from recurring.
#
# This file is the Factory's knowledge model (docs/knowledge-enforcement.md). A lesson is a
# defect a person or a gate found in a game the Factory built, stated so it is true of any
# game: the root cause in the Factory, not the game's symptom. Each names the check that now
# prevents it from recurring (a check id of core/reference/check-tiers.yaml) and the tests that
# prove the check catches it - or says plainly that nothing does yet. Before this file the
# lessons lived in a ledger outside the Factory; a lesson learned in one run had to be
# re-learned by the next person who hit it.
#
# Never a game, a title, a theme or a portal account here: core/ names no specific game.
# Which game showed each lesson, the run, the fix and the evidence are instance data kept in
# workspace/lessons/evidence.yaml, keyed by these ids.
#
# Fields of a lesson:
#   id           stable, never reused, never deleted (deprecate it instead)
#   title        one line
#   category     the quality-floor scorecard line it belongs to (core/reference/
#                quality-floor.yaml `scorecard`), or `process`: compliance is counted per
#                scorecard line, so there is no second taxonomy
#   problem      the generic symptom a player or a person saw
#   root_cause   why the Factory let it through: which gate, brief or step did not hold it
#   lesson       the generalized lesson
#   scope        where it applies: `global`, or a mapping whose keys are AND-ed and whose
#                values are OR-ed - families (core/reference/genre-models.yaml families),
#                render (2d, 3d), platforms (core/reference/platforms/<id>.yaml), tiers
#                (core/reference/quality-benchmark.yaml tiers). `profiles` and `archetypes` are
#                reserved for the complexity profile and archetype registry and refused until
#                it exists. A run whose facet is undetermined is never excluded by it.
#   status       coverage - how much of it a check holds (below); orthogonal to lifecycle
#   lifecycle    candidate | active | validated | deprecated (below)
#   introduced   {version, date}: the Factory release and date it entered this file;
#                `validated` the same, once validated
#   checks       the check ids that hold it
#   tests        {catches, passes, generalizes}: tests that show the check fails the defect,
#                that it passes the fixed or accepted build, and that it catches the defect in
#                a game other than the one it was learned from (scripts/tests/<file>.py::<name>)
#   gap          what is not held yet (partial and gap lessons)
#   held_by      where a process lesson is written down
#   level        OPTIONAL, and only to declare a level STRONGER than the derived one; a level
#                is derived from the tiers of its checks and is never restated (below)
#   superseded_by / reason   a deprecated lesson's successor, or why it was withdrawn
#
# Since 2.1.0 (docs/knowledge-enforcement.md "K5"), every lesson also carries:
#   domain         what part of a game it is about - one of `domains` below; orthogonal to
#                  `category` (the scorecard line its compliance is counted on)
#   principle      the reusable why, true of any game: "X, because Y"
#   anti_pattern   what violating it looks like, true of any game
#   classification how strongly the evidence lets it speak - one of `classifications` below,
#                  held consistent with the DERIVED level (never stronger): BLOCKING exactly
#                  when the level is blocking, REQUIRED exactly when required,
#                  RECOMMENDATION a recommended rule, VALIDATED_PRINCIPLE a validated lesson
#                  that is not blocking or required, OBSERVATION or HEURISTIC an experimental
#                  rule (candidate or gap) or a process lesson
#   revision       an integer from 1, raised whenever the entry changes; a rule version is
#                  `<id>@r<revision>` (L29@r4). A run's knowledge-contract records each
#                  rule's revision and the digest of its entry, and check-integrity fails an
#                  entry that changed against the base commit without its revision rising
#                  (scripts/wgf_knowledge/model.py lesson_digest).
#
# status:
#   enforced  a check of check-tiers.yaml holds it at the release tier, and a test replays
#             the failure (on real evidence where the lesson came with some) and shows it caught
#   partial   a check covers part of it; `gap` says what still is not held
#   gap       nothing holds it yet; `gap` says what would hold it
#   process   a lesson about how people and agents work, not about a build: no check can hold
#             it; `held_by` says where it is written down. Never in a run's contract.
#
# Enforcement level, DERIVED from the tiers of the lesson's checks (check-tiers.yaml):
#   blocking      enforced or partial, every check `hard`
#   required      enforced or partial, every check hard or quality, at least one `quality`
#   recommended   any of its checks `advisory`
#   experimental  status gap, or lifecycle candidate: guidance, never blocks
# A blocking or required rule that applies to a run must be satisfied by the build's current
# evidence, or excepted by a person (`exceptions` below). A lesson may declare a stronger
# `level` than the derived one, never a weaker one: to weaken a rule, the check's tier moves
# by a new version of its source file, or a new lesson supersedes this one.
#
# lifecycle:
#   candidate    proposed; level experimental; nothing enforces it yet
#   active       enforced or partial with `tests.catches` (a process lesson is active when
#                written down)
#   validated    enforced, with catches, passes and generalizes tests, and the instance
#                evidence's `verified` leg: the check passed on the game that raised it after
#                the fix
#   deprecated   kept, never deleted; names `superseded_by` (a successor at least as strong,
#                holding every check, covering the scope) or a `reason` - then it stays in
#                every run it applied to as recommended: reported, never blocking
#
# Versioning: adding a lesson, a stricter scope or a stricter level is a minor version. A
# weaker rule - a lower level, a check removed or demoted, a narrower scope, a looser
# exception policy - is never an edit in place: a new lesson supersedes it. check-integrity
# compares with the knowledge at the base commit, each side by its own check tiers.
#
# A quality finding a gate raises on a check named here carries the lesson as `guarded_by`
# (core/artifacts/shared/quality-finding.schema.json). A specialist visit that finds a systemic
# issue names a lesson candidate in its report; a person promotes one to this file - with its
# check and its tests - or rejects it. A candidate never edits this file by itself.
#
# check-integrity holds (scripts/wgf_quality/registry.py, scripts/wgf_knowledge/model.py):
# every id unique; every lesson has a category, a scope in its vocabularies, a problem and a
# root cause, and a derivable level; an enforced or partial lesson names checks that
# check-tiers.yaml classifies and tests that exist; a declared level is stronger than the
# derived one; the lifecycle's requirements hold; no lesson names a game the instance
# evidence lists.

# 2.0.1: L23, L25 and L26 name generalizes tests (tests only; no rule changed).
# 2.1.0: domain, principle, anti_pattern, classification and revision on every lesson
#        (backfilled on L1-L28, no rule changed); L29.
version: 2.1.0

statuses: [enforced, partial, gap, process]

lifecycles: [candidate, active, validated, deprecated]

levels: [blocking, required, recommended, experimental]

domains:
  - game-design
  - level-design
  - difficulty
  - pacing
  - progression
  - player-feedback
  - game-feel
  - ux
  - ui
  - content
  - replayability
  - art-direction
  - audio
  - vfx
  - performance
  - accessibility
  - technical
  - process

classifications:
  - OBSERVATION
  - HEURISTIC
  - RECOMMENDATION
  - VALIDATED_PRINCIPLE
  - REQUIRED
  - BLOCKING

# Exceptions: a person may accept, for one run, that an applicable rule is not satisfied
# (core/artifacts/shared/knowledge-exception.schema.json): {rule_id, reason, scope,
# approved_by, created_at, expires_at}. Only the levels listed may be excepted (recommended and
# experimental rules never block, so there is nothing to except). `approvers` says which
# `approved_by.mode` each level accepts: `human` is a person; `automation` is a decision made
# inside a Factory step's process tree. A blocking exception is a person's, always -
# check-integrity refuses `automation` there. A run's exception is never granted by
# configuration, says why in at least 20 characters (the schema's) and 4 distinct words, and
# expires: at most `max_days` (never over 90) after it was created. The record alone is
# never trusted about its approver: the operator act that grants one stamps the mode.
exceptions:
  levels: [blocking, required]
  approvers:
    blocking: [human]
    required: [human]
  max_days: 30

lessons:
  - id: L1
    title: Layered result screens passed a UI overlap check
    category: ui_ux
    domain: ui
    classification: REQUIRED
    revision: 1
    principle: >-
      Text is judged by what a player sees behind it, and exactly one screen is active at a
      time, because element boxes that do not overlap say nothing about the pixels under a
      label.
    anti_pattern: >-
      Inactive screens left drawn beneath the active one, so text sits over other layers
      while every box-overlap check passes.
    problem: >-
      Text on a result screen was unreadable over other screens drawn beneath it, and every
      layout check passed.
    root_cause: >-
      The overlap check compared element boxes, not the pixels behind the text, and nothing
      required exactly one screen to be active.
    lesson: >-
      Inactive screens left drawn under the active one (pause, win and loss cards stacked)
      passed a layout overlap check that compares element boxes, while a frame judge saw the
      text unreadable over the layers.
    scope: global
    status: partial
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [production-quality:ui.text, production-quality:ui.overlap]
    tests:
      catches:
        - scripts/tests/test_production_quality.py::test_the_same_text_over_multi_coloured_art_fails
        - scripts/tests/test_production_quality.py::test_a_label_partly_over_a_bright_shape_fails_on_that_part
      passes: []
      generalizes: []
    gap: text over a busy backdrop fails now; there is no play-probe contract that exactly one screen is active at a time.

  - id: L2
    title: A difficulty-ramp check decided noise at small margins
    category: gameplay
    domain: difficulty
    classification: REQUIRED
    revision: 1
    principle: >-
      A verdict at the edge of its bar is measured again or reported unmeasured, because a
      few short samples near a threshold decide noise, not the game.
    anti_pattern: >-
      A ramp or pacing verdict that flips between builds whose gameplay did not change.
    problem: >-
      A difficulty-ramp verdict flipped between builds whose gameplay had not changed.
    root_cause: >-
      The ramp was decided from a few short samples at the edge of its bar, so measurement
      noise was reported as a verdict.
    lesson: >-
      A ramp judged from a few short samples flipped between pass and fail on builds whose
      gameplay had not changed: a measurement at the edge of its bar is noise, not a verdict.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [playability:depth.ramp, playability:depth.stall]
    tests:
      catches:
        - scripts/tests/test_playability.py::test_endless_samples_whose_pooled_input_rate_falls_fail
        - scripts/tests/test_playability.py::test_a_noisy_borderline_is_extended_then_unmeasured_never_decided
        - scripts/tests/test_playability.py::test_a_stall_is_its_own_finding_not_a_ramp_failure
      passes: []
      generalizes: []

  - id: L3
    title: An asset chain check reported only its first broken link
    category: technical
    domain: technical
    classification: BLOCKING
    revision: 1
    principle: >-
      A chain of conditions is measured link by link to its end, because a check that stops
      at the first broken link surfaces the rest one expensive loop at a time.
    anti_pattern: >-
      A check that reports only the first failing link of a chain, so each later failure
      costs another full develop-and-measure cycle.
    problem: >-
      Broken links of a runtime asset chain surfaced one per loop, each loop a full develop
      and measure cycle.
    root_cause: >-
      The chain check stopped at its first failing link instead of measuring every link of the
      chain.
    lesson: >-
      A runtime asset chain (exists, referenced, loaded, rendered, visible) that stops at the
      first failing link surfaces later failures one loop at a time, each loop a full develop
      and measure cycle.
    scope: global
    status: partial
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [production-quality:assets.runtime]
    tests:
      catches:
        - scripts/tests/test_production_quality.py::test_the_chain_stops_at_the_first_broken_link
      passes: []
      generalizes: []
    gap: every link is measured, but the finding and its route still name the first failing link only; the visibility bar of a small fast entity is a viewport share, not a share of the play area.

  - id: L4
    title: A design-gap repair was measured only at the end of production
    category: level_design
    domain: level-design
    classification: REQUIRED
    revision: 1
    principle: >-
      A design change is measured on the design itself as early as the measurement allows,
      because a defect found only after production costs the whole loop.
    anti_pattern: >-
      A redesign whose content structure is first measured after every expensive step has
      already run on it.
    problem: >-
      A redesign that answered a content structure failure could fail the same check after the
      whole production loop had run on it.
    root_cause: >-
      Content structure was measured only at content-sufficiency, after production, never on
      the design's own layouts.
    lesson: >-
      A content structure failure answered by a redesign was not measured again until the
      content-sufficiency step, after the whole production loop: the redesign could fail the
      same check after every expensive step had run on it.
    scope: global
    status: partial
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [content-sufficiency:content.structure]
    tests:
      catches:
        - scripts/tests/test_content_sufficiency.py::test_geometry_is_the_declared_layouts_lists_by_value
      passes: []
      generalizes: []
    gap: the judge is right now, but its ordering is unchanged - neither design nor greybox measures structure on the design's own layouts.

  - id: L5
    title: A reachability check timed the bot, not the game
    category: level_design
    domain: technical
    classification: BLOCKING
    revision: 1
    principle: >-
      A timing measurement excludes the measurer's own latency, because a window that
      includes the bot's reaction judges the bot and the host, not the game.
    anti_pattern: >-
      Identical gameplay that passes on an idle host and fails on a loaded one.
    problem: >-
      Identical gameplay failed unit-to-unit reachability on a loaded host.
    root_cause: >-
      The transition window included the bot's own reaction latency, so the verdict measured
      the measurer.
    lesson: >-
      A unit-to-unit transition window that included the bot's own reaction latency failed
      identical gameplay on a loaded host: the verdict measured the measurer.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [playability:content.units_reachable]
    tests:
      catches:
        - scripts/tests/test_playability.py::test_the_val_3d_transitions_replay_to_one_verdict
      passes:
        - scripts/tests/test_playability.py::test_a_transition_late_only_by_the_bot_passes
      generalizes: []

  - id: L6
    title: Delegated agents ran with no record the coordinator could audit
    category: process
    domain: process
    classification: HEURISTIC
    revision: 1
    principle: >-
      Every delegated piece of work is started through the path that records it, because
      work no record names cannot be audited or told apart from an orphan.
    anti_pattern: >-
      Agents started outside the coordinator's delegation path, which an audit then reports
      as orphaned.
    problem: >-
      An audit reported live delegated work as orphaned.
    root_cause: >-
      Work started outside the coordinator's delegation path, or whose start check failed,
      left no record the coordinator could audit.
    lesson: >-
      Work started outside the coordinator's own delegation path, or whose start check failed,
      left real agents with no record; an audit then reported live work as orphaned.
    scope: global
    status: process
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    held_by: the coordinator's delegation procedure (outside the Factory runtime); the mechanism it was found in is retired.

  - id: L7
    title: A stalled host was judged as a failing game
    category: gameplay
    domain: technical
    classification: REQUIRED
    revision: 1
    principle: >-
      A recording taken on a degraded host is made again or reported unmeasured, because
      measurement artifacts judged as game behaviour fail good games and pass bad ones.
    anti_pattern: >-
      A stalled host's recording or a sample cut short deciding start time, reachability or
      variety.
    problem: >-
      Start time, win reachability and variety failed on recordings taken while the host
      stalled.
    root_cause: >-
      A degraded recording or a sample cut short was judged as the game's behaviour instead of
      being measured again or reported unmeasured.
    lesson: >-
      A recording taken while the host stalled, or a sample cut short, decided start time, win
      reachability and variety: measurement artifacts were judged as game defects.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [playability:start.playable, playability:win.reachable, playability:content.variety]
    tests:
      catches:
        - scripts/tests/test_playability.py::test_every_attempt_degraded_is_unmeasured_never_passed
        - scripts/tests/test_playability.py::test_a_stall_on_a_host_degraded_on_every_attempt_is_blocked_never_a_finding
      passes:
        - scripts/tests/test_playability.py::test_a_degraded_attempt_made_again_is_judged_on_the_healthy_one
      generalizes: []

  - id: L8
    title: Nothing compared a candidate with the last accepted build
    category: gameplay
    domain: game-design
    classification: OBSERVATION
    revision: 1
    principle: >-
      A candidate build is compared with the build a person accepted, because absolute
      floors let a build pass every check and still be worse than what was accepted.
    anti_pattern: >-
      A build that passes every check the accepted build passed while being smaller, flatter
      or harder to read.
    problem: >-
      A build passed every check that passed on the accepted build and was still worse than
      it.
    root_cause: >-
      Every gate is an absolute floor; nothing compares a candidate with the build a person
      accepted.
    lesson: >-
      Every gate is an absolute floor, so a build can pass every check that passed on the
      build a person accepted and still be worse than it - smaller, flatter, harder to read.
    scope: global
    status: gap
    lifecycle: candidate
    introduced: {version: 2.8.0, date: 2026-10-07}
    gap: an accepted-baseline regression gate - paired frame judgement, playability metric deltas, content and feature parity against the build a person accepted.

  - id: L9
    title: The accepted build is the floor, not the target
    category: level_design
    domain: game-design
    classification: OBSERVATION
    revision: 1
    principle: >-
      Bars state what a good game of its kind is, calibrated beyond the Factory's own
      output, because a floor calibrated on its own games is a floor, not a target.
    anti_pattern: >-
      A build that clears every bar and still has lacklustre design and below-standard art.
    problem: >-
      A build that cleared every bar still had lacklustre game and level design and
      below-standard models.
    root_cause: >-
      The bars state what a finished game has, calibrated on the Factory's own games, not what
      a good one is.
    lesson: >-
      A build that clears every bar can still have lacklustre game and level design and
      below-standard models: the bars said what a finished game has, not what a good one is.
    scope: {tiers: [release, premium]}
    status: gap
    lifecycle: candidate
    introduced: {version: 2.8.0, date: 2026-10-07}
    gap: design, level and model-craft judges, and benchmark bars calibrated on the market rather than on the Factory's own games.

  - id: L10
    title: Specialists passed a gate by changing what it measures
    category: technical
    domain: technical
    classification: BLOCKING
    revision: 1
    principle: >-
      A fix changes what the player experiences, never what the gate measures, because a
      gate met by moving its measured quantity reports a pass while nothing improved.
    anti_pattern: >-
      A reachability or visibility finding met by shrinking the play area or drawing sprites
      larger than their colliders.
    problem: >-
      Specialists met reachability and visibility findings by changing what the gate measures;
      the player felt nothing better.
    root_cause: >-
      Nothing read a specialist's change for edits to the measured quantity itself (play area,
      sprite against collider, a content field no code reads).
    lesson: >-
      A reachability finding was met by shrinking the play area with undrawn bounds, and a
      visibility finding by drawing sprites larger than their colliders: the gate passed, the
      player felt nothing better.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [gate-gaming:play-area-change, gate-gaming:sprite-size-without-collider, gate-gaming:unread-content-field]
    tests:
      catches:
        - scripts/tests/test_review_gaming.py::test_a_lowered_ceiling_in_a_reachability_visit_is_flagged
        - scripts/tests/test_review_gaming.py::test_a_sprite_drawn_larger_with_its_collider_unchanged_is_flagged
      passes: []
      generalizes: []

  - id: L11
    title: Physics collided where nothing was drawn
    category: gameplay
    domain: game-feel
    classification: REQUIRED
    revision: 1
    principle: >-
      What the simulation collides with is what the screen draws, because a body turning at
      nothing reads to a player as an invisible wall.
    anti_pattern: >-
      Bounds and colliders the simulation has and the screen never shows.
    problem: >-
      The moving body turned at bounds and colliders the screen never showed: invisible walls.
    root_cause: >-
      The play probe reported drawn shapes only, never colliders, so no gate could compare
      collision with what is drawn.
    lesson: >-
      Bounds and colliders the simulation has but the screen does not show read to a player as
      invisible walls; the play probe reported drawn shapes only, never colliders.
    scope: global
    status: partial
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [play-realism:physics.undrawn_collision, play-realism:physics.collider_size, gate-gaming:play-area-change, gate-gaming:sprite-size-without-collider]
    tests:
      catches:
        - scripts/tests/test_play_realism.py::test_L11_the_regressed_2d_head_turns_at_an_undrawn_ceiling
        - scripts/tests/test_play_realism.py::test_a_sprite_enlarged_with_the_collider_unchanged_still_fails
        - scripts/tests/test_play_realism.py::test_a_collider_is_never_passed_without_a_drawn_body
        - scripts/tests/test_review_gaming.py::test_a_play_area_value_in_a_layout_is_flagged_whatever_its_name
      passes:
        - scripts/tests/test_play_realism.py::test_L11_the_accepted_2d_build_never_turns_at_nothing
      generalizes: []
    gap: a 2D build's turns are judged at runtime against what is drawn, and a reported collider against its drawn body; a 3D build's screen-space turns are not judged (a camera moves), so there only the code-diff heuristic holds it.

  - id: L12
    title: A run adopting an accepted game rewrote it
    category: level_design
    domain: content
    classification: BLOCKING
    revision: 1
    principle: >-
      Adopting an accepted game extends what it ships, and replacing accepted work is a
      person's decision, because a rewrite throws away what was already judged good.
    anti_pattern: >-
      A run that adopts an accepted game and replaces its units and strips its world.
    problem: >-
      A run adopting a person-accepted game replaced every unit and stripped the world.
    root_cause: >-
      Nothing held a run to the content a person accepted, and replacing accepted work was not
      a person's decision.
    lesson: >-
      A run that adopted a person-accepted repository wrote a new design and rebuilt the game
      wholesale - every unit replaced, the world stripped - and nothing made replacing
      accepted work a person's decision.
    scope: global
    status: partial
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [content-sufficiency:content.regression, quality-floor:floor.existing_content]
    tests:
      catches:
        - scripts/tests/test_brief_commitments.py::test_a_build_that_deletes_shipped_units_is_a_regression
        - scripts/tests/test_existing_floor_probe.py::test_no_content_data_is_an_unmeasured_floor_never_no_floor
      passes: []
      generalizes: []
    gap: the floor holds counts, not ids - a run can keep the count and replace every unit; replacement is not yet a person's decision.

  - id: L13
    title: The playability bot only ever played perfectly
    category: gameplay
    domain: difficulty
    classification: REQUIRED
    revision: 1
    principle: >-
      A game is played the way a first-time player plays it, imperfectly, because a perfect
      oracle never falls, drifts or misreads the camera.
    anti_pattern: >-
      Difficulty, falls and pace judged only by a bot that plays perfectly.
    problem: >-
      Falls, drift, input alignment and pace under ordinary input were never measured; a
      perfect bot cleared everything.
    root_cause: >-
      The playability bot played with an oracle, so ordinary, imperfect play was never
      simulated.
    lesson: >-
      A bot with an oracle never falls, drifts or misreads the camera, so falls per minute,
      lateral drift, input alignment and time against par under ordinary input were never
      measured.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [play-realism:naive.setbacks, play-realism:naive.drift, play-realism:naive.alignment, play-realism:naive.pace, play-realism:naive.unit_duration]
    tests:
      catches:
        - scripts/tests/test_play_realism.py::test_L13_the_regressed_3d_head_is_cleared_by_holding_forward
        - scripts/tests/test_play_realism.py::test_L13_this_bot_fails_the_regressed_3d_head_and_passes_r1_forward
        - scripts/tests/test_play_realism.py::test_falling_every_few_seconds_in_the_opening_fails
        - scripts/tests/test_play_realism.py::test_an_off_axis_camera_fails_alignment
      passes:
        - scripts/tests/test_play_realism.py::test_L13_the_accepted_builds_pass_naive_play
      generalizes: []

  - id: L14
    title: Level geometry was never checked
    category: level_design
    domain: level-design
    classification: REQUIRED
    revision: 1
    principle: >-
      Level geometry is held to minimums of shape and length per tier, because tight
      unrailed turns and units cleared in a fraction of their par are invisible to every
      other gate.
    anti_pattern: >-
      Tight turns without rails, and units cleared in a fraction of their par time.
    problem: >-
      Tight turns without rails, and units cleared in a fraction of their par, shipped
      unnoticed.
    root_cause: >-
      There was no geometry lint and no minimum unit length or duration per tier.
    lesson: >-
      Tight turns without rails and units cleared in a fraction of their par went unnoticed:
      there was no geometry lint and no minimum unit length or duration per tier.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [play-realism:level.geometry, play-realism:level.unit_length, play-realism:naive.unit_duration]
    tests:
      catches:
        - scripts/tests/test_play_realism.py::test_L14_the_regressed_3d_courses_are_too_tight_and_too_short
        - scripts/tests/test_play_realism.py::test_a_tight_bend_needs_a_railed_inner_edge
        - scripts/tests/test_play_realism.py::test_a_unit_cleared_in_a_few_seconds_is_too_short_at_the_tier
      passes:
        - scripts/tests/test_play_realism.py::test_L14_the_3d_r1_forward_courses_pass
      generalizes: []

  - id: L15
    title: 3D models were graded by their own author
    category: art_3d
    domain: art-direction
    classification: BLOCKING
    revision: 1
    principle: >-
      A model is judged by someone other than its author, and a spec its author calls bad
      does not ship, because self-grading passes detail nobody can see.
    anti_pattern: >-
      Models with detail sunk inside a shell, flat stacked parts and floating pieces,
      shipped on their author's own grade.
    problem: >-
      Models shipped with detail sunk inside a shell, flat stacked parts, floating pieces and
      kit nodes never authored.
    root_cause: >-
      The model author judged its own specs, and the loop shipped the last check-passing spec
      even when its author called it bad.
    lesson: >-
      Model specs the author judged itself shipped below standard: detail sunk inside a shell,
      flat stacked parts, floating pieces, kit nodes never authored; the loop shipped the last
      check-passing spec even when its author called it bad.
    scope: {render: [3d]}
    status: partial
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [model-review:model.primitive, model-review:model.parts]
    tests:
      catches:
        - scripts/tests/test_model_review.py::test_bands_sunk_inside_the_shell_compose_nothing
        - scripts/tests/test_model_review.py::test_a_lone_sphere_is_still_a_placeholder
      passes: []
      generalizes: []
    gap: no independent model-craft judge, contrast measured against the sky rather than the play surface, no game-to-asset node contract.

  - id: L16
    title: Interactions had no required visual feedback
    category: feel
    domain: player-feedback
    classification: OBSERVATION
    revision: 1
    principle: >-
      Every interaction the player causes has a designed, proportionate visual response,
      because a pickup or outcome with no feedback reads as nothing having happened.
    anti_pattern: >-
      Pickups, checkpoints and outcomes with no effect, or a flat screen-filling one.
    problem: >-
      Pickups, checkpoints and outcomes had flat, screen-filling or no visual feedback.
    root_cause: >-
      The build spec has no effect contract per interaction, and no gate looks for one.
    lesson: >-
      Pickups, checkpoints and outcomes had flat or screen-filling effects, or none: the build
      spec has no effect contract per interaction, and no gate looks for one.
    scope: global
    status: gap
    lifecycle: candidate
    introduced: {version: 2.8.0, date: 2026-10-07}
    gap: a per-interaction effect contract in the design, checked by production-quality and the visual judge's states.

  - id: L17
    title: Game and level design were technically complete and dull
    category: gameplay
    domain: level-design
    classification: OBSERVATION
    revision: 1
    principle: >-
      What each unit asks of the player is designed, not only the order of its beats,
      because a technically complete sequence can still be dull.
    anti_pattern: >-
      Units whose beats are in order and that ask nothing new, with no climax, while every
      bar passes.
    problem: >-
      Units introduced many mechanics at once, bosses asked nothing new and nothing climaxed,
      while every bar passed.
    root_cause: >-
      Only the order of a unit's declared beats was checked, never what the beats ask of the
      player.
    lesson: >-
      Units declared their beats but only their order was checked: an opening unit introduced
      many mechanics at once, bosses absorbed damage without asking anything new, nothing
      climaxed - and every bar passed.
    scope: global
    status: gap
    lifecycle: candidate
    introduced: {version: 2.8.0, date: 2026-10-07}
    gap: a design contract (one new idea per unit, set pieces, climax, route choice) judged against teardowns of comparable games.

  - id: L18
    title: No one judged the levels, and risk never paid
    category: level_design
    domain: level-design
    classification: OBSERVATION
    revision: 1
    principle: >-
      A level uses its space, routes and reveals with intent, and optional risk pays over
      the safe line, because a level nobody judged is just geometry.
    anti_pattern: >-
      Levels with no identity or route choice, where taking a risk never pays.
    problem: >-
      No level used its space, routes or reveals with intent, and optional risk never paid.
    root_cause: >-
      Nothing judged level design, and no measurement compared a risky line with the safe one.
    lesson: >-
      Nothing judged how a level uses its space, its identity, routes or reveals, and no
      measurement showed that an optional risk pays off over the safe line.
    scope: global
    status: gap
    lifecycle: candidate
    introduced: {version: 2.8.0, date: 2026-10-07}
    gap: a level-design rubric and judge, and safe and greedy bot policies whose outcomes are compared.

  - id: L19
    title: An agent's cleanup deleted other agents' work
    category: process
    domain: process
    classification: HEURISTIC
    revision: 1
    principle: >-
      An agent deletes only what it created, in a path of its own, because shared scratch
      space and shared worktrees hold other agents' live work.
    anti_pattern: >-
      A cleanup that removes a shared scratch directory or prunes shared worktrees.
    problem: >-
      Live work of other agents was deleted.
    root_cause: >-
      A cleanup removed a shared scratch directory and pruned shared worktrees.
    lesson: >-
      A cleanup that removed a shared scratch directory and pruned worktrees deleted live work
      of other agents.
    scope: global
    status: process
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    held_by: every delegation prompt - a unique path per agent, delete only what you created, never prune shared worktrees.

  - id: L20
    title: A structure judge read geometry from the wrong place
    category: level_design
    domain: level-design
    classification: REQUIRED
    revision: 1
    principle: >-
      A judge reads its input only from the declared place, because a judge that guesses
      where data lives sees identical units as different once the data moves.
    anti_pattern: >-
      A structure judge that reads geometry from one fixed file and counts any list as
      geometry.
    problem: >-
      Identical units looked different to the structure judge once a game moved its geometry.
    root_cause: >-
      The judge read layouts from one fixed file and counted any list as geometry instead of
      reading the declared place.
    lesson: >-
      A content-structure judge read layouts from one file and counted any list as geometry;
      when a game moved per-unit geometry elsewhere, identical units looked different.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [content-sufficiency:content.structure]
    tests:
      catches:
        - scripts/tests/test_content_sufficiency.py::test_only_a_declared_place_carries_geometry
        - scripts/tests/test_content_sufficiency.py::test_a_list_outside_the_declared_layout_does_not_escape_unmeasured
      passes: []
      generalizes: []

  - id: L21
    title: A deferred platform became the default build
    category: platform_compliance
    domain: technical
    classification: OBSERVATION
    revision: 1
    principle: >-
      Each platform's package carries only that platform's integration, because a deferred
      portal's SDK in the default build ships into every other portal's package.
    anti_pattern: >-
      One portal's third-party ad SDK shipped in every other portal's package.
    problem: >-
      One portal's third-party ad SDK shipped in every other portal's package, and a smoke
      test loaded the real SDK.
    root_cause: >-
      Strategy could rank a platform the installation does not publish to as required, and
      nothing scanned each platform's bundle for another portal's SDK.
    lesson: >-
      Strategy ranked a platform the installation does not publish to as required, so the
      default build carried that portal's third-party ad SDK into every other portal's
      package, and a smoke test loaded the real SDK.
    scope: global
    status: gap
    lifecycle: candidate
    introduced: {version: 2.8.0, date: 2026-10-07}
    gap: an SDK leakage scan of each platform's bundle, a deferred-platform guard in strategy, and smoke tests that stub every portal SDK.

  - id: L22
    title: A design re-entry reused a stale floor
    category: level_design
    domain: content
    classification: BLOCKING
    revision: 1
    principle: >-
      A floor is measured on the content a person accepted, never on an intermediate state,
      because a stale floor makes the pipeline conform the game to the wrong design.
    anti_pattern: >-
      A design re-entry that reuses a floor measured on an intermediate commit.
    problem: >-
      Greybox began conforming a restored game to an old design after a design re-entry.
    root_cause: >-
      Design re-entry reused an existing-content floor measured on an intermediate commit
      instead of the accepted one.
    lesson: >-
      Resuming design after a person restored the accepted content reused an existing-content
      floor measured on an intermediate commit, and greybox began conforming the restored game
      to the old design.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-07}
    checks: [design-consistency:existing_content_floor_kept, content-sufficiency:content.regression]
    tests:
      catches:
        - scripts/tests/test_design_readopt.py::test_the_floor_is_the_accepted_courses_and_supersedes_v4s
        - scripts/tests/test_design_readopt.py::test_v4s_units_breach_the_floor_the_checkout_ships
        - scripts/tests/test_design_readopt.py::test_greybox_refuses_v4_before_any_developer
        - scripts/tests/test_design_readopt.py::test_develop_refuses_v1
      passes: []
      generalizes: []

  - id: L23
    title: A larger collider closed the gaps a level is threaded through
    category: level_design
    domain: level-design
    classification: REQUIRED
    revision: 1
    principle: >-
      A change to a moving body is measured against the gaps the level threads it through,
      because a larger collider can close passages while everything drawn looks the same.
    anti_pattern: >-
      A larger collider that leaves the passages of a level too tight to thread, while every
      gate passes.
    problem: >-
      Levels a player could thread before became near-impassable, while every gate passed.
    root_cause: >-
      Gates judged what was drawn and were played by a perfect oracle; nothing measured
      clearance against the moving body or clear rate against the accepted build.
    lesson: >-
      Growing a moving body's collider left the narrow passages of a level's unbreakable rows
      too tight to thread. Every check still passed - they judged what was drawn, played by a
      perfect oracle - while the levels were cleared far less often than on the accepted
      build.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-08}
    checks: [play-realism:level.clearance, play-realism:naive.clear_rate]
    tests:
      catches:
        - scripts/tests/test_play_realism.py::test_M1_the_r20_collider_cannot_thread_the_steel_gaps
        - scripts/tests/test_play_realism.py::test_M1_the_steel_levels_clear_less_often_than_on_the_accepted_build
        - scripts/tests/test_play_realism.py::test_M1_894b4b8_is_blocked_by_its_clear_rate
      passes:
        - scripts/tests/test_play_realism.py::test_M1_the_steel_gaps_fix_is_advisory_on_clearance_at_r1_clear_rate
      generalizes:
        - scripts/tests/test_knowledge_generalization.py::test_L23_clearance_catches_a_synthetic_platformer

  - id: L24
    title: Console errors and lost WebGL contexts were seen by no gate
    category: technical
    domain: technical
    classification: REQUIRED
    revision: 1
    principle: >-
      Gates read the console and the rendering context, not only uncaught exceptions,
      because a game can log errors or lose its context and keep running.
    anti_pattern: >-
      Console errors and a WebGL context lost mid-play that no gate sees.
    problem: >-
      Console errors and a WebGL context lost mid-play passed every check.
    root_cause: >-
      Gates read uncaught exceptions only, never the console or the rendering context.
    lesson: >-
      Gates read uncaught exceptions only: errors the game logged to the console, and a WebGL
      context the browser took away mid-play, passed every check.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-08}
    checks: [play-realism:runtime.console_errors, play-realism:runtime.webgl_context, browser-qa:browser.console-errors, browser-qa:browser.webgl-context]
    tests:
      catches:
        - scripts/tests/test_play_realism.py::test_an_error_from_the_games_origin_fails_and_network_refusals_are_not_counted
        - scripts/tests/test_play_realism.py::test_a_lost_webgl_context_fails
        - scripts/tests/test_browser_qa.py::test_console_errors_of_the_game_not_of_the_environment
        - scripts/tests/test_browser_qa.py::test_webgl_context_loss
      passes: []
      generalizes: []

  - id: L25
    title: The browser's context menu opened over the game
    category: browser
    domain: ux
    classification: REQUIRED
    revision: 1
    principle: >-
      A gate tries the inputs a player brings, including a right click and a long press,
      because an untried input can open browser UI over play.
    anti_pattern: >-
      The browser's context menu opening over play on a right click or long press.
    problem: >-
      The browser's context menu opened over play on a right click or a long press.
    root_cause: >-
      No gate ever tried a right click or a long press.
    lesson: >-
      A right click, or a long press on a touch device, opened the browser's context menu over
      play at every viewport; no gate ever tried either.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-08}
    checks: [browser-qa:browser.context-menu]
    tests:
      catches:
        - scripts/tests/test_browser_qa.py::test_context_menu_left_open_fails_at_release
        - scripts/tests/test_browser_qa.py::test_both_games_open_the_context_menu_at_every_viewport
      passes: []
      generalizes:
        - scripts/tests/test_knowledge_generalization.py::test_L25_learned_on_A_catches_synthetic_B

  - id: L26
    title: Layout was judged at two viewports, never against what is played
    category: ui_ux
    domain: ui
    classification: REQUIRED
    revision: 1
    principle: >-
      UI is judged at the viewports players bring and against what is played, because two
      viewports and control-to-control overlap miss a HUD that covers the game.
    anti_pattern: >-
      A HUD card covering the moving body on some layouts, and pages that scroll or clip at
      common sizes.
    problem: >-
      A HUD card covered the moving body on tablet and touch layouts, and pages scrolled or
      clipped at common sizes.
    root_cause: >-
      Layout was checked at two viewports for overlap between controls only, never against
      what is played.
    lesson: >-
      UI was checked on one desktop and one phone viewport for overlap between controls only:
      a HUD card covering the moving body on tablet and touch layouts, and pages that scroll
      or clip at the sizes players bring, passed.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-08}
    checks: [browser-qa:browser.ui-covers-play, browser-qa:browser.overflow, browser-qa:browser.clipping, browser-qa:browser.ui-overlap]
    tests:
      catches:
        - scripts/tests/test_browser_qa.py::test_ui_over_a_critical_entity
        - scripts/tests/test_browser_qa.py::test_the_2d_objective_card_covers_the_ball_on_touch_layouts
        - scripts/tests/test_browser_qa.py::test_overflow_clipping_overlap
        - scripts/tests/test_play_realism.py::test_the_viewports_are_data
      passes: []
      generalizes:
        - scripts/tests/test_knowledge_generalization.py::test_L26_ui_covers_play_on_a_synthetic_3d_hud

  - id: L27
    title: Sound was checked to play, not to play when it should
    category: audio
    domain: audio
    classification: REQUIRED
    revision: 1
    principle: >-
      Each sound event is checked to play when it should and stop when it should, because a
      check that something played passes silence where it matters.
    anti_pattern: >-
      A loss with no sound, a one-shot that loops, a mute that does not silence, sound with
      the page hidden.
    problem: >-
      A loss played no sound, a one-shot looped, mute did not silence, and sound went on with
      the page hidden.
    root_cause: >-
      The audio check asked only whether something played, not whether each event played when
      it should.
    lesson: >-
      An audio check that something played passed a loss with no sound, a one-shot started
      looping, a mute control that did not silence and sound that went on with the page
      hidden.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-08}
    checks: [browser-qa:browser.audio-events, browser-qa:browser.audio-loops, browser-qa:browser.audio-mute, browser-qa:browser.audio-hidden, browser-qa:browser.audio-clips]
    tests:
      catches:
        - scripts/tests/test_browser_qa.py::test_an_end_state_without_a_sound
        - scripts/tests/test_browser_qa.py::test_the_3d_time_out_is_silent
        - scripts/tests/test_browser_qa.py::test_a_one_shot_started_looping
        - scripts/tests/test_browser_qa.py::test_mute_that_does_not_silence
        - scripts/tests/test_browser_qa.py::test_sound_while_hidden_is_a_hard_gate
      passes: []
      generalizes: []

  - id: L28
    title: Performance was never measured while played, and a loaded host was judged as the game
    category: performance
    domain: performance
    classification: REQUIRED
    revision: 1
    principle: >-
      Performance is measured in a real browser over a session, and host degradation is told
      apart from the game, because a load time on a stalled host is not the game's.
    anti_pattern: >-
      Frame stability and memory growth never measured in play, and a stalled host's timing
      judged as the game's.
    problem: >-
      Frame stability and memory growth were never measured in play, and a stalled host's load
      time could be judged as the game's.
    root_cause: >-
      Performance was not measured in a real browser over a session, and host degradation was
      not told apart from the game.
    lesson: >-
      Frame stability and memory growth over a session were not measured in a real browser,
      and a load time read on a stalled host or a software rasterizer would have been judged
      as the game's own.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-08}
    checks: [browser-qa:browser.frame-stability, browser-qa:browser.memory-growth, browser-qa:browser.load-time, browser-qa:browser.first-interaction]
    tests:
      catches:
        - scripts/tests/test_browser_qa.py::test_frames_and_memory_over_the_bars
        - scripts/tests/test_browser_qa.py::test_a_degraded_host_never_passes_or_fails_a_timing_check
        - scripts/tests/test_browser_qa.py::test_the_zz_perf_load_artefact_is_blocked_never_failed
        - scripts/tests/test_browser_qa.py::test_a_software_rasterizer_blocks_a_failure_and_keeps_a_pass
      passes: []
      generalizes: []

  - id: L29
    title: "Units debuted several new elements at once, and no check held it"
    category: level_design
    domain: level-design
    classification: BLOCKING
    revision: 4
    principle: >-
      After the opening unit, a unit introduces at most one element the player has not met,
      so every new element is first met on its own and practised before it is combined with
      another new one.
    anti_pattern: >-
      A unit that debuts two or more never-seen elements at once.
    problem: >-
      A unit that debuted two never-seen elements at once was cleared far less often than
      the units around it, while every gate passed its design.
    root_cause: >-
      The design was checked only for teaching a mechanic before relying on it, never for how
      many new elements one unit debuts, and nothing counted it on the built content.
    lesson: >-
      A unit that debuts two never-seen elements at once teaches neither: the player meets
      both in the same breath, cannot tell which one beat them, and fails the unit far more
      often than the units around it. Nothing counted how many new elements one unit
      debuts, on the design or on the built content.
    scope: global
    status: enforced
    lifecycle: active
    introduced: {version: 2.8.0, date: 2026-10-09}
    checks: [design-consistency:content.introductions_one_at_a_time, content-sufficiency:content.introductions_one_at_a_time]
    tests:
      catches:
        - scripts/tests/test_lesson_l29.py::test_L29_the_check_fails_the_defect
        - scripts/tests/test_lesson_l29.py::test_L29_a_compliant_design_and_a_violating_build_fail_the_build
        - scripts/tests/test_lesson_l29.py::test_L29_an_empty_introduces_is_counted_by_what_the_unit_shows
        - scripts/tests/test_lesson_l29.py::test_L29_a_build_is_held_to_its_design_whatever_introduces_it_copied
        - scripts/tests/test_lesson_l29.py::test_L29_a_listed_introduction_is_trusted_on_the_design_known_limitation
        - scripts/tests/test_knowledge_transfer.py::test_a_violating_designer_breaches_and_is_repaired
        - scripts/tests/test_knowledge_transfer.py::test_a_violating_build_fails_content_sufficiency_and_is_repaired
      passes:
        - scripts/tests/test_lesson_l29.py::test_L29_the_check_passes_the_fixed_build
        - scripts/tests/test_lesson_l29.py::test_L29_the_accepted_2d_validation_game_passes
        - scripts/tests/test_lesson_l29.py::test_L29_the_accepted_3d_validation_game_passes
        - scripts/tests/test_lesson_l29.py::test_L29_the_2d_validation_design_passes_as_written
        - scripts/tests/test_lesson_l29.py::test_L29_the_2d_and_3d_content_data_pass_as_written
        - scripts/tests/test_lesson_l29.py::test_L29_an_element_and_its_mechanic_are_one_debut
      generalizes:
        - scripts/tests/test_lesson_l29.py::test_L29_generalizes_to_a_synthetic_3d_racer
        - scripts/tests/test_knowledge_transfer.py::test_session_b_a_fresh_session_applies_the_principle
