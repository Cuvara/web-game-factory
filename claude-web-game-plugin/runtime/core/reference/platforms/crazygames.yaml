# Platform profile — CrazyGames
#
# See yandex.yaml for how profiles are consumed. Figures are starting values to be
# corrected from portal documentation and from compliance findings.

id: crazygames
name: CrazyGames
version: 1.1.0  # 1.1.0: the store_listing block (listing requirements, null = unknown)
status: unverified
docs: https://docs.crazygames.com/

audience:
  primary_regions: [us, br, de, fr, gb]
  device_mix: { mobile: 0.5, desktop: 0.5 }

capabilities:
  ads: [interstitial, rewarded, banner]
  iap: false
  cloud_saves: true
  leaderboards: false
  achievements: false
  auth: optional
  analytics: platform-provided

requirements:
  locales_required: [en]
  locales_recommended: [pt, de, fr, es]
  max_bundle_mb: 250
  orientation: [landscape, portrait]
  loading_api: required
  offline_start: false
  https_only: true
  quality_guidelines: enforced

ads:
  interstitial_min_interval_s: 180
  rewarded_available: true
  banner_available: true
  notes: >
    Ad placement rules are enforced editorially, not only technically. A game that
    technically respects the interval can still be rejected for interrupting badly.

metadata_requirements:
  descriptions_locales: [en]
  screenshots_min: 4
  icon_required: true
  age_rating_required: false

review:
  process: manual
  typical_days: [3, 10]
  common_rejections:
    - Quality below the portal's bar — placeholder art, unfinished UI.
    - Ads interrupting gameplay rather than sitting at natural breaks.
    - No mobile support on a title the portal considers mobile-suitable.
    - Loading screen without progress feedback.

# What the portal's listing takes. The cover aspect ratios are the ones the portal's
# developer documentation describes; their exact pixel sizes, the text limits and the video
# bounds are null - UNKNOWN to validation, never passed - until read from the portal and
# recorded with their source.
store_listing:
  status: unverified
  source: null
  notes: >
    The portal asks for covers in three aspect ratios. Read the exact sizes, accepted formats
    and the description limits from docs.crazygames.com, then set status: verified.
  title: {required: true, max_chars: null}
  short_description: {required: true, max_chars: null}
  long_description: {required: true, max_chars: null}
  tags: {required: true, min: null, max: null, allowed: null}
  categories: {required: true, min: 1, max: null, allowed: null}
  locales: null
  icon: {id: icon, required: true, sizes: null, aspect: "1:1", formats: null, max_kb: null, source: icon}
  covers:
    - {id: cover-16x9, label: Cover 16:9, required: true, sizes: null, aspect: "16:9", formats: null, max_kb: null, source: thumbnail}
    - {id: cover-4x3, label: Cover 4:3, required: true, sizes: null, aspect: "4:3", formats: null, max_kb: null, source: thumbnail}
    - {id: cover-1x1, label: Cover 1:1, required: true, sizes: null, aspect: "1:1", formats: null, max_kb: null, source: thumbnail}
  screenshots: {required: true, min: 4, max: null, sizes: null, aspect: null, formats: null, max_kb: null}
  video: {required: false, formats: null, min_seconds: null, max_seconds: null, max_mb: null}

assertions:
  - id: crazygames_bundle_size
    check: { left: package.size_mb, op: lte, right: 250 }
    severity: blocking
  - id: crazygames_sdk_present
    check: { left: package.platform_sdk, op: eq, right: crazygames }
    severity: blocking
  - id: crazygames_en_locale_present
    check: { left: package.locales, op: in, right: [en] }
    severity: blocking
  - id: crazygames_mobile_supported
    check: { left: package.mobile_supported, op: eq, right: true }
    severity: warning
  - id: crazygames_screenshots
    check: { left: metadata.screenshots, op: gte, right: 4 }
    severity: warning

scoring_hints:
  platform_fit_favours:
    - Polished, immediately readable action and puzzle titles.
    - Desktop-and-mobile playability from one build.
  platform_fit_penalizes:
    - IAP-dependent economies — there is no IAP here.
    - Slow-starting games; the portal's traffic bounces fast.
