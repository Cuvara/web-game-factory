# Platform profile — CrazyGames
#
# See yandex.yaml for how profiles are consumed. Figures are starting values to be
# corrected from portal documentation and from compliance findings.

id: crazygames
name: CrazyGames
version: 1.3.0  # 1.3.0: re-read 2026-10-07 - IAP exists invite-only (iap stays false, commented),
                #        account-linked progress for Full Launch, settings.muteAudio, banner and
                #        rewarded-button rules,
                #        technical rules without a field (notes), the 15-20 s video reading
                # 1.2.0: loading API optional, no screenshots (covers + preview video instead),
                #        the cover sizes and video bounds read 2026-10-04, PEGI 12, file limits
                # 1.1.0: the store_listing block (listing requirements, null = unknown)
status: unverified
docs: https://docs.crazygames.com/

audience:
  primary_regions: [us, br, de, fr, gb]
  device_mix: { mobile: 0.5, desktop: 0.5 }

capabilities:
  ads: [interstitial, rewarded, banner]
  # In-game purchases exist: invite-only, through CrazyGames' Xsolla account, for signed-in
  # users only; Automatic Progress Save is then not allowed
  # (https://docs.crazygames.com/sdk/in-game-purchases/, read 2026-10-07). The template
  # exposes no purchases for CrazyGames, and an invitation is not something a design can
  # assume: false is a Factory choice (like yandex's ru), not a statement that none exist.
  iap: false
  # Full Launch REQUIRES progress tied to the account unless progress does not apply: the
  # Data module (preferred; guest data migrates on login), one's own backend through the
  # User module, or Automatic Progress Save (backs up localStorage, no code; not with IAP)
  # (https://docs.crazygames.com/requirements/account-integration/, /other/aps/, read
  # 2026-10-07). The template's adapter uses the Data module.
  cloud_saves: true
  leaderboards: false
  achievements: false
  auth: optional
  analytics: platform-provided

requirements:
  locales_required: [en]
  locales_recommended: [pt, de, fr, es]
  # https://docs.crazygames.com/requirements/technical/ : 250 MB total, at most 1500 files,
  # an initial download (load start to the first gameplayStart) of at most 50 MB (20 MB to be
  # eligible for the mobile homepage), relative paths only. Only the total has a field here.
  max_bundle_mb: 250
  orientation: [landscape, portrait]
  # loadingStart/loadingStop "has to be called" (https://docs.crazygames.com/sdk/game/), but no
  # launch requirement lists it; gameplayStart is the Full Launch requirement.
  loading_api: optional
  offline_start: false
  https_only: true
  quality_guidelines: enforced
  # External links are restricted: privacy/terms allowed, community links only in menus, app
  # store links never (https://docs.crazygames.com/requirements/gameplay/).
  #
  # Read 2026-10-07, no field in this schema (docs/platform-targets-2026-10.md, Part 1c):
  # /requirements/technical/ - external files must let the game reach play within 20 s;
  # it must run smoothly on a 4 GB RAM Chromebook; Chrome and Edge required, Safari judged
  # per game; on mobile `user-select: none` and safe-area padding for the CrazyGames App;
  # a privacy policy and terms only when the game collects personal data beyond SDK events.
  # /sdk/intro/ - sitelock: the SDK limits the game to CrazyGames domains plus a whitelist.
  # /requirements/gameplay/ - text and images legible at DPR 1 from 800x450 to 1920x1080;
  # physics consistent at 144 and 165 Hz; new users land in gameplay immediately or within
  # one click; no custom fullscreen button; no cross-promotion.
  # /sdk/game/ - settings.muteAudio is required for HTML5: game audio off while it is true.

ads:
  interstitial_min_interval_s: 180
  rewarded_available: true
  banner_available: true
  notes: >
    Ad placement rules are enforced editorially, not only technically. A game that
    technically respects the interval can still be rejected for interrupting badly. The SDK
    enforces "max 1 every 3 minutes" itself (adCooldown) and counts rewarded and preroll ads
    toward it. Mute and pause on adStarted, resume on adFinished or adError; reward only on
    adFinished. During Basic Launch every ad fails with adsDisabledBasicLaunch - expected, and
    the game must run normally without them; the same for an ad blocker
    (https://docs.crazygames.com/requirements/ads/, /sdk/video-ads/). Re-read 2026-10-07:
    the portal's settings.muteAudio is required for HTML5 and switches game audio off while
    true (/sdk/game/). Rewarded buttons make clear an ad will be watched (e.g. a video icon), skip and close buttons are styled
    like the continue button, a non-ad alternative exists, and rewards are never offered on
    every death. Banners only on useful screens open at least 5 s on average, at most 2 per
    screen, never during gameplay, never covering UI (/requirements/ads/).

metadata_requirements:
  descriptions_locales: [en]
  # The portal asks for three covers and two preview videos, no screenshots
  # (https://docs.crazygames.com/requirements/game-covers/).
  screenshots_min: 0
  icon_required: false
  # Content must comply with PEGI 12 (https://docs.crazygames.com/requirements/gameplay/);
  # there is no rating to state.
  age_rating_required: false

review:
  process: manual
  typical_days: [3, 10]
  common_rejections:
    - Quality below the portal's bar — placeholder art, unfinished UI.
    - Ads interrupting gameplay rather than sitting at natural breaks.
    - No mobile support on a title the portal considers mobile-suitable.
    - Loading screen without progress feedback.
    - A custom in-game fullscreen button (the portal provides fullscreen).
    - Chained ads, or rewarded buttons left clickable while ads are unavailable (Basic
      Launch, ad blocker).
    - Missing English localization, or content beyond PEGI 12.
    - Absolute paths in the bundle, or an initial download over 50 MB.
    - Game audio playing while the portal's settings.muteAudio is true (/sdk/game/).
    - Banners during gameplay, on short-lived screens, more than 2 per screen, or covering
      UI; rewarded buttons that do not make clear an ad will be watched (/requirements/ads/).
    - Full Launch without account-linked progress where progress applies
      (/requirements/account-integration/).
    - Unoriginal content or inappropriate themes (/requirements/intro/).

# What the portal's listing takes, read from https://docs.crazygames.com/requirements/game-covers/
# on 2026-10-04: three covers - landscape 16:9 1920x1080, portrait 2:3 800x1200, square 1:1
# 800x800 - with the title as the only text, and preview videos of at most 20 s and 50 MB,
# 1080p, landscape 16:9 and portrait 2:3, without sound. The text limits, image formats and
# the video container are not documented (the submission form needs a login): null, UNKNOWN.
store_listing:
  status: unverified
  source: https://docs.crazygames.com/requirements/game-covers/ (read 2026-10-04)
  notes: >
    Covers carry the title only - no borders, icons or store logos. The preview video opens
    on the static cover, has no black bars, cursor, "Play Now" text or sound, and is cut at
    20 s. The portal asks for a landscape AND a portrait video; this block can state one, so
    it states the landscape one and the portrait one (1080p, 2:3) is a manual item. Both
    without audio. "15-20 seconds maximum" (re-read 2026-10-07) reads as 15 s recommended;
    ambiguous, so min_seconds stays null. Submission also asks for a description and
    instructions (https://docs.crazygames.com/faq/).
  title: {required: true, max_chars: null}
  short_description: {required: true, max_chars: null}
  long_description: {required: true, max_chars: null}
  tags: {required: true, min: null, max: null, allowed: null}
  categories: {required: true, min: 1, max: null, allowed: null}
  locales: [en]
  covers:
    - {id: cover-16x9, label: Landscape cover, required: true, sizes: [{width: 1920, height: 1080}], aspect: "16:9", formats: null, max_kb: null, source: promo}
    - {id: cover-2x3, label: Portrait cover, required: true, sizes: [{width: 800, height: 1200}], aspect: "2:3", formats: null, max_kb: null, source: thumbnail}
    - {id: cover-1x1, label: Square cover, required: true, sizes: [{width: 800, height: 800}], aspect: "1:1", formats: null, max_kb: null, source: thumbnail}
  screenshots: {required: false, min: 0, max: null, sizes: null, aspect: null, formats: null, max_kb: null}
  video: {required: true, formats: null, min_seconds: null, max_seconds: 20, max_mb: 50, min_height: 1080, aspect: "16:9"}

assertions:
  - id: crazygames_bundle_size
    check: { left: package.size_mb, op: lte, right: 250 }
    severity: blocking
  - id: crazygames_sdk_present
    check: { left: package.platform_sdk, op: eq, right: crazygames }
    severity: blocking
  - id: crazygames_en_locale_present
    check: { left: package.locales, op: in, right: [en] }
    severity: blocking
  - id: crazygames_mobile_supported
    check: { left: package.mobile_supported, op: eq, right: true }
    severity: warning

scoring_hints:
  platform_fit_favours:
    - Polished, immediately readable action and puzzle titles.
    - Desktop-and-mobile playability from one build.
  platform_fit_penalizes:
    - IAP-dependent economies - purchases are invite-only (Xsolla, signed-in users).
    - Slow-starting games; the portal's traffic bounces fast.
