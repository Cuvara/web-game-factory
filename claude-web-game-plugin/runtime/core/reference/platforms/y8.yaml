# Platform profile — Y8
#
# See yandex.yaml for how profiles are consumed. Upstreamed from web-game-template v1.1.0
# (config/platforms/y8.yaml, "proposed"), whose docs/platforms/y8.md holds the audit.
#
# Every figure comes from https://docs.y8.com/ as read on 2026-09-24. Where the docs say
# nothing — audience, bundle size, review time, metadata — the field is left out or null
# rather than guessed. The App ID and Game ID are supplied at build time
# (WGF_Y8_APP_ID / WGF_Y8_GAME_ID), never through game.config.yaml.

id: y8
name: Y8
version: 1.4.0  # 1.4.0: ads.required_by_portal (2026-10-21: Y8 returned a game the Factory built
                #        with "the game is missing ads"), the ad placement guidelines, and the
                #        media rules (store_listing: no title, menu or loading screen as a
                #        screenshot; no logo alone on a plain background as a promo)
                # 1.3.0: re-read 2026-10-07 - banners exist on Y8's approval (still off here),
                #        auto-save throttling, the per-game SDK checklist (UNKNOWN), the
                #        published rejection grounds
                # 1.2.0: no external links or foreign ads (developer.y8.com, read 2026-10-04),
                #        the published review rules as common rejections
                # 1.1.0: the store_listing block (listing requirements, null = unknown)
status: unverified
docs: https://docs.y8.com/

capabilities:
  # https://docs.y8.com/sdk/advertising/ — interstitials and rewarded ads. Banners (728x90,
  # 300x250 and others) exist but need Y8's per-game approval (re-read 2026-10-07); they stay
  # out of this list until a person records that approval - the template makes no banner call.
  ads: [interstitial, rewarded]
  iap: false
  # https://docs.y8.com/sdk/cloud-storage/ — signed-in players only; at most 30 KB a value,
  # one write per key every 5 s. https://docs.y8.com/best-practices/ (re-read 2026-10-07):
  # send data on player actions, throttle auto-saves to at most once a minute, show save
  # failures and retry quietly.
  cloud_saves: true
  # The platform offers both; the template's Platform contract does not expose them yet.
  leaderboards: true
  achievements: true
  # https://docs.y8.com/best-practices/ — "Let guests play".
  auth: optional
  # https://docs.y8.com/sdk/analytics/ — plays counted on init.
  analytics: platform-provided

requirements:
  # The docs require no locale. getPlatformLocale() reports the site's language.
  locales_required: []
  max_bundle_mb: null
  # No loading or game-ready API exists in the SDK.
  loading_api: none
  # https://developer.y8.com/games?new=1 — "external links" and "unauthorized ads, ad scripts,
  # pop-ups, redirects" are not allowed; "You cannot use your own ads or ads from another
  # company inside your game" (https://developer.y8.com/).
  no_external_links: true
  # https://developer.y8.com/ (re-read 2026-10-07): "complete the SDK requirements shown for
  # your game in the Developer Portal" for ads, cloud saves, leaderboards and achievements.
  # That per-game checklist is shown only behind a login: UNKNOWN, a person reads it. Every
  # game must be connected to a Studio (https://docs.y8.com/studio/create-game/).

ads:
  # "By default Y8 allows one roughly every 180 seconds, configurable per game." The SDK
  # enforces it and reports frequencyCapped; the adapter does not count locally.
  interstitial_min_interval_s: 180
  rewarded_available: true
  # Banners exist with Y8's per-game approval (https://docs.y8.com/sdk/advertising/, read
  # 2026-10-07); false until a person records the approval.
  banner_available: false
  # Y8 reviews a game for ads and returns one that shows none (2026-10-21: "Dear Dev, the game
  # is missing ads. Please fix it and re-upload with correct promo images"). A build for Y8
  # must therefore reach every ad kind the title commits to with a placement: verify's
  # platform.ads-integrated:y8 is a Hard Gate, platform-validate's ads_integrated guard is RED
  # without it (docs/verification-module.md).
  required_by_portal: true
  required_by_portal_source:
    urls:
      - https://docs.y8.com/sdk/advertising/
      - https://docs.y8.com/sdk/ad-placement-guidelines/
    read: "2026-10-21"
    evidence: >-
      Y8's review returned a game with no ad calls ("the game is missing ads"); the advertising
      page and the ad placement guidelines describe the placements a game is expected to make.
  notes: >
    Interstitials (showAd type "next") only right after a player's click on Play, Next,
    Retry or Continue - never during play. Rewarded (type "reward") is optional; grant the
    reward only in adViewed. Pause and mute inside beforeAd, resume inside afterAd — a skipped
    or capped break fires neither. Rewarded ads are never capped but restart the interstitial
    interval. Never request the preroll placement (the platform runs it itself) and never call
    adBreak; banners only with Y8's approval
    (https://docs.y8.com/sdk/ad-placement-guidelines/, read 2026-10-21).

review:
  # "While your game is in review, the platform serves Google's test creatives" — review
  # exists; its length is not documented.
  process: manual
  # https://developer.y8.com/ : "Y8 reviews every game before publishing it"; resubmission
  # cooldowns grow from 6 h to 5 days.
  common_rejections:
    - External links, redirects or pop-ups (https://developer.y8.com/games?new=1).
    - Ads other than Y8's own, or rewarded or encouraged ad clicks.
    - Broken gameplay on the devices chosen at submission.
    - Guests unable to play (https://docs.y8.com/best-practices/).
    - Technical problems, low quality, broken gameplay, missing instructions, a broken SDK
      integration, harmful, copyrighted or stolen content, malware, fake traffic or
      unauthorised ads (https://developer.y8.com/, read 2026-10-07).
    - Copied, low-quality, repeatedly reskinned or mass-generated games
      (https://developer.y8.com/).

# What the portal's listing takes. docs.y8.com documents no listing requirement (as read on
# 2026-09-24, and again on 2026-10-07: /studio/overview/ calls the game's tabs
# "self-explanatory" and lists no field), so everything here is null - UNKNOWN to
# validation, never passed - until read from the portal's submission flow.
store_listing:
  status: unverified
  source: null
  # 1.4.0: the media rules of https://docs.y8.com/studio/media/ (read 2026-10-21) - stated as
  # rules, not figures: sizes and counts stay null (UNKNOWN) until read from the portal.
  notes: >-
    Sizes and counts are not documented at docs.y8.com; read the submission flow itself.
    Media (https://docs.y8.com/studio/media/, read 2026-10-21): screenshots show gameplay -
    never a title, menu or loading screen; a promo image is never a logo alone on a plain
    background (it shows the game). The promo rule is a person's check before upload: no
    validator reads what an image shows.
  title: {required: true, max_chars: null}
  short_description: {required: true, max_chars: null}
  long_description: {required: false, max_chars: null}
  locales: null
  icon: {id: icon, required: null, sizes: null, aspect: null, formats: null, max_kb: null, source: icon}
  covers: []
  # Gameplay only: a screenshot captured on the title, loading, pause or catch-all state is
  # left out of the Y8 rendition, and listing validation warns if one remains.
  screenshots: {required: null, min: null, max: null, sizes: null, aspect: null, formats: null, max_kb: null, excluded_states: [loading, title, paused, other]}
  video: {required: false, formats: null, min_seconds: null, max_seconds: null, max_mb: null}

assertions:
  - id: y8_sdk_present
    check: { left: package.platform_sdk, op: eq, right: y8 }
    severity: blocking
    rationale: >
      The Y8 SDK is loaded from https://cdn.y8.com/minimal-sdk/2-0/y8.min.js at runtime;
      a build for Y8 without it earns nothing and counts no plays.
  - id: y8_no_external_links
    check: { left: package.external_links, op: eq, right: 0 }
    severity: blocking
