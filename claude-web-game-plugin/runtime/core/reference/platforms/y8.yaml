# Platform profile — Y8
#
# See yandex.yaml for how profiles are consumed. Upstreamed from web-game-template v1.1.0
# (config/platforms/y8.yaml, "proposed"), whose docs/platforms/y8.md holds the audit.
#
# Every figure comes from https://docs.y8.com/ as read on 2026-09-24. Where the docs say
# nothing — audience, bundle size, review time, metadata — the field is left out or null
# rather than guessed. The App ID and Game ID are supplied at build time
# (WGF_Y8_APP_ID / WGF_Y8_GAME_ID), never through game.config.yaml.

id: y8
name: Y8
version: 1.2.0  # 1.2.0: no external links or foreign ads (developer.y8.com, read 2026-10-04),
                #        the published review rules as common rejections
                # 1.1.0: the store_listing block (listing requirements, null = unknown)
status: unverified
docs: https://docs.y8.com/

capabilities:
  # https://docs.y8.com/sdk/advertising/ — interstitials and rewarded ads. No banner is documented.
  ads: [interstitial, rewarded]
  iap: false
  # https://docs.y8.com/sdk/cloud-storage/ — signed-in players only; at most 30 KB a value,
  # one write per key every 5 s.
  cloud_saves: true
  # The platform offers both; the template's Platform contract does not expose them yet.
  leaderboards: true
  achievements: true
  # https://docs.y8.com/best-practices/ — "Let guests play".
  auth: optional
  # https://docs.y8.com/sdk/analytics/ — plays counted on init.
  analytics: platform-provided

requirements:
  # The docs require no locale. getPlatformLocale() reports the site's language.
  locales_required: []
  max_bundle_mb: null
  # No loading or game-ready API exists in the SDK.
  loading_api: none
  # https://developer.y8.com/games?new=1 — "external links" and "unauthorized ads, ad scripts,
  # pop-ups, redirects" are not allowed; "You cannot use your own ads or ads from another
  # company inside your game" (https://developer.y8.com/).
  no_external_links: true

ads:
  # "By default Y8 allows one roughly every 180 seconds, configurable per game." The SDK
  # enforces it and reports frequencyCapped; the adapter does not count locally.
  interstitial_min_interval_s: 180
  rewarded_available: true
  banner_available: false
  notes: >
    Pause and mute inside beforeAd, resume inside afterAd — a skipped or capped break fires
    neither. Rewarded ads are never capped but restart the interstitial interval. Never
    request the preroll placement; the platform runs it itself.

review:
  # "While your game is in review, the platform serves Google's test creatives" — review
  # exists; its length is not documented.
  process: manual
  # https://developer.y8.com/ : "Y8 reviews every game before publishing it"; resubmission
  # cooldowns grow from 6 h to 5 days.
  common_rejections:
    - External links, redirects or pop-ups (https://developer.y8.com/games?new=1).
    - Ads other than Y8's own, or rewarded or encouraged ad clicks.
    - Broken gameplay on the devices chosen at submission.
    - Guests unable to play (https://docs.y8.com/best-practices/).

# What the portal's listing takes. docs.y8.com documents no listing requirement (as read on
# 2026-09-24), so everything here is null - UNKNOWN to validation, never passed - until read
# from the portal's submission flow.
store_listing:
  status: unverified
  source: null
  notes: Not documented at docs.y8.com; read the submission flow itself.
  title: {required: true, max_chars: null}
  short_description: {required: true, max_chars: null}
  long_description: {required: false, max_chars: null}
  locales: null
  icon: {id: icon, required: null, sizes: null, aspect: null, formats: null, max_kb: null, source: icon}
  covers: []
  screenshots: {required: null, min: null, max: null, sizes: null, aspect: null, formats: null, max_kb: null}
  video: {required: false, formats: null, min_seconds: null, max_seconds: null, max_mb: null}

assertions:
  - id: y8_sdk_present
    check: { left: package.platform_sdk, op: eq, right: y8 }
    severity: blocking
    rationale: >
      The Y8 SDK is loaded from https://cdn.y8.com/minimal-sdk/2-0/y8.min.js at runtime;
      a build for Y8 without it earns nothing and counts no plays.
  - id: y8_no_external_links
    check: { left: package.external_links, op: eq, right: 0 }
    severity: blocking
