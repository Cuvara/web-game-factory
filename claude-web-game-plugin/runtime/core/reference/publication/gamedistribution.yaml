# Publication profile - GameDistribution (docs/publish-module.md)
#
# The developer panel issues the Game ID and requires the pre-roll to be viewed in full once
# from the panel before the SDK integration is approved (core/reference/platforms/
# gamedistribution.yaml). No upload API is documented. No console flow has been exercised and
# none is written: every phase is a person's, so the publish step stops HUMAN_REQUIRED.
#
# 2.0.0 (core/artifacts/shared/publication-profile.schema.json): migrated without new facts.
# The panel was not read for this file; what a person must log in to learn is under
# `unknowns`.

id: gamedistribution
version: 2.1.0
status: unverified
docs: https://gamedistribution.com/

unknowns:
  - The developer panel's game creation and build upload flow, and every label.
  - The upload size limit.
  - The listing fields the panel asks for, and their limits.
  - The status labels the panel shows (the 1.0.0 words Draft, Pending, Live, Rejected are unsourced).
  - The developer terms, and whether they permit automated use of the panel.
  - Any policy on generated text or assets.
  - Whether a CAPTCHA, a second factor or an anti-bot check protects the panel.

submission:
  method: console
  automation_terms: unverified
  content_policy:
    ai_generated_text: unknown
    ai_generated_assets: unknown
  console:
    url: https://developer.gamedistribution.com/
    allowed_origins: [https://developer.gamedistribution.com]
    upload_timeout_s: 900
  credential:
    # A person logs in, live, in the browser window the publish step opens, and
    # handles any CAPTCHA or second factor there. Nothing of the session is kept.
    kind: human-login
  human_required: [login, two-factor, terms, review, console-switch]
  adaptive: forbidden
  flow:
    - id: declare.preroll
      phase: human_fields
      class: human
      note: View the pre-roll in full once from the panel, so the SDK integration is approved.
  status:
    states: [Draft, Pending, Live, Rejected]
    submitted_states: [Pending]
    live_states: [Live]
    rejected_states: [Rejected]
    pending_states: [Pending]
  constraints:
    upload_max_mb: null
