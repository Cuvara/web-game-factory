# Publication profile - Y8 (docs/publish-module.md)
#
# 2.0.0 (core/artifacts/shared/publication-profile.schema.json): the console flow as intents.
# Written from public pages only (docs/portal-publishing-architecture.md, Part 3, read
# 2026-10-04): nobody has logged in for this file. Y8 publishes no upload or submission API;
# games are created and submitted in the Studio's web UI. Automated use of the console is not
# addressed by a public document found (the developer agreement is a checkbox in the portal):
# unverified, so the publish step stops HUMAN_REQUIRED and hands the packaged release to a
# person.
#
# Order matters: the Game ID and App ID exist only after the game is created, and the build
# must carry them (WGF_Y8_APP_ID, WGF_Y8_GAME_ID). A first release is two passes - create the
# game, record the ids, rebuild and re-package, then upload. An SDK-less build is never
# uploaded.

id: y8
version: 2.3.0  # 2.3.0: re-read 2026-10-07 - the Builds tab (documented), the App ID's delay, the
                #        update rule, the bank-transfer payout threshold
                # 2.2.0: the Y8 adapter's flow - the Studio check, create confirm, Feedback tab,
                #        upload, Basic Info tab, save - the undocumented parts as hypotheses
status: unverified
docs: https://docs.y8.com/

sources:
  - {url: "https://developer.y8.com/", read: "2026-10-04"}
  - {url: "https://docs.y8.com/studio/studio/", read: "2026-10-04"}
  - {url: "https://docs.y8.com/studio/create-game/", read: "2026-10-04"}
  - {url: "https://docs.y8.com/studio/overview/", read: "2026-10-04"}
  - {url: "https://developer.y8.com/", read: "2026-10-07"}
  - {url: "https://docs.y8.com/studio/create-game/", read: "2026-10-07"}
  - {url: "https://docs.y8.com/studio/overview/", read: "2026-10-07"}

unknowns:
  - Every Basic Info field (description, instructions, categories, tags) and its limits.
  - Thumbnail and screenshot sizes.
  - The build upload widget (zip or files) and its size limit.
  - The status labels the console shows (the 1.0.0 words Pending, Approved, Rejected are unsourced).
  - The developer agreement's text (a checkbox in the portal; not public).
  - Whether a CAPTCHA, a second factor or an anti-bot check protects the console.
  - The session markers (logged in, login form, challenges) on the console page.
  - Where the console shows the Game ID and the App ID, and how My Games is laid out.
  - Whether "Submit for Reviews" is the button's exact label (it is the public flow summary).
  - How the console shows that the account has a Studio (studio.check reads a "My Games" link - a hypothesis).
  - The create form's confirm button (create.confirm "Create" is a hypothesis).
  - The game's tabs - "Basic Info" and "Feedback" are named by public pages; their roles and the Feedback panel's layout are hypotheses.
  - Whether a new game shows a status word before it is submitted ("Draft" is a hypothesis).
  - The markers by which the Studio and the payout choice show as done.

submission:
  method: console
  automation_terms: unverified
  content_policy:
    ai_generated_text: unknown
    ai_generated_assets: unknown
    source: https://developer.y8.com/
    note: >
      AI tools are allowed with the rights and quality; "copied, misleading, low-quality,
      repeatedly reskinned, or mass-generated games" may be rejected; no disclosure required.
      Unknown here until a person records the policy for listing copy.
  console:
    url: https://account.y8.com/
    allowed_origins: [https://account.y8.com, https://www.y8.com]
    upload_timeout_s: 900
  credential:
    # A person logs in, live, in the browser window the publish step opens, and
    # handles any CAPTCHA or second factor there. Nothing of the session is kept.
    kind: human-login
  human_required: [login, two-factor, terms, payout-setup, review, console-switch]

  adaptive: allowed
  adaptive_bounds: {max_per_intent: 3, max_per_visit: 10}
  dismissable: [Close, Got it, Skip, Not now]

  identity:
    portal_id_from: [registry, config:game_id, config:app_id, title]
    # The Game ID and App ID exist only once the game is created, and the build must carry
    # them: the first visit stops IDS_ISSUED after create_game, before any upload. Where the
    # console shows them is a hypothesis (unknowns).
    issued_on_create:
      - {key: external_game_id, read: [{label: "Game ID"}]}
      - key: app_id
        read: [{label: "App ID"}]
        note: >
          The Game ID is issued when the record is created (the name is the only field); the
          App ID is issued when the game's page is first opened and may read "Not yet
          available" until the page is refreshed (https://docs.y8.com/studio/create-game/,
          read 2026-10-07). That text is not an id: refresh, never record it.
    # Where each issued id reaches the build: the sdk step writes the registry's ids into
    # this platform's entry in game.config.yaml, and the build is made again.
    build_config: {external_game_id: "platforms[].game_id", app_id: "platforms[].app_id"}
    title_match: exact-casefold
    basis: hypothesis

  flow:
    - id: studio.check
      phase: find_game
      class: reversible
      action: read
      target: [{role: link, name: "My Games"}]
      basis: hypothesis
      note: >
        The Studio comes first. Read before anything is created: a console without the
        Studio's mark stops for a person to create it (the adapter: HUMAN_REQUIRED, legal).
    - id: declare.studio
      phase: human_fields
      class: human
      note: >
        The Studio comes first: logo, name (4-32 chars, unique, permanent once published),
        About, links and the terms checkbox. A person creates it; the name is permanent.
      source: https://docs.y8.com/studio/studio/
    - id: create.open
      phase: create_game
      class: reversible
      action: click
      target: [{role: link, name: "Create Your Game"}, {text: "Create Your Game"}]
      names: [Create Your Game, Create game]
      basis: documented
      source: https://developer.y8.com/
    - id: create.name
      phase: create_game
      class: reversible
      action: fill
      value: identity.title
      target: [{label: "Game Name"}, {placeholder: "Game Name"}]
      names: [Game Name]
      expect: {value_equals: identity.title}
      basis: documented
      source: https://docs.y8.com/studio/create-game/
      note: Creating a game asks only for its name and issues the Game ID.
    - id: create.confirm
      phase: create_game
      class: reversible
      action: click
      target: [{role: button, name: "Create"}]
      names: [Create]
      basis: hypothesis
    - id: feedback.open
      phase: read_status
      class: reversible
      action: click
      optional: true
      target: [{role: tab, name: "Feedback"}]
      basis: hypothesis
      note: The game's Feedback tab, where Y8's review feedback appears (developer.y8.com).
    - id: feedback.read
      phase: read_status
      class: reversible
      action: read
      optional: true
      target: [{role: region, name: "Feedback"}]
      basis: hypothesis
      note: Read as status evidence; quoted with a rejection.
    - id: tab.builds
      phase: upload_build
      class: reversible
      action: click
      optional: true
      target: [{role: tab, name: "Builds"}, {text: "Builds"}]
      names: [Builds]
      basis: documented
      source: https://docs.y8.com/studio/overview/
      note: >
        Builds are uploaded on the game's Builds tab under My Games (read 2026-10-07).
        Optional: a console that shows the upload field without the tab runs on.
    - id: upload.build
      phase: upload_build
      class: reversible
      action: upload
      value: package.file
      target: [{label: "Game file"}]
      basis: hypothesis
      note: >
        The build, on the Builds tab (documented); the field's label and whether it takes
        a zip or files are unknown (unknowns).
    - id: tab.basic_info
      phase: fill_metadata
      class: reversible
      action: click
      target: [{role: tab, name: "Basic Info"}]
      basis: hypothesis
    - id: field.description
      phase: fill_metadata
      class: reversible
      action: fill
      value: listing.text.en.description
      target: [{label: "Description"}]
      names: [Description]
      expect: {value_equals: listing.text.en.description}
      basis: hypothesis
    - id: field.instructions
      phase: fill_metadata
      class: reversible
      action: fill
      value: listing.text.en.how_to_play
      target: [{label: "Instructions"}]
      names: [Instructions, How to play]
      expect: {value_equals: listing.text.en.how_to_play}
      basis: hypothesis
    - id: media.thumbnail
      phase: upload_media
      class: reversible
      action: upload
      value: listing.media.cover
      target: [{label: "Thumbnail"}]
      names: [Thumbnail]
      basis: hypothesis
    - id: draft.save
      phase: save_draft
      class: reversible
      action: click
      target: [{role: button, name: "Save"}]
      names: [Save]
      basis: hypothesis
    - id: declare.payout
      phase: human_fields
      class: human
      note: >
        YMP (50% of eligible ad revenue; payout from USD 100 by PayPal or from USD 500 by
        bank transfer, within 10 business days of invoice acceptance) or AFP via Google - a
        commercial choice (https://developer.y8.com/, read 2026-10-07).
    - id: review.request
      phase: request_review
      class: irreversible
      action: click
      target: [{role: button, name: "Submit for Reviews"}, {text: "Submit for Reviews"}]
      expect: {status_in: submitted_states}
      basis: documented
      source: https://developer.y8.com/
      note: The label is the public page's flow summary, not read on the console.

  status:
    states: [Draft, Pending, Approved, Rejected]
    submitted_states: [Pending]
    live_states: [Approved]
    rejected_states: [Rejected]
    pending_states: [Pending]

  constraints:
    upload_max_mb: null
    resubmission_cooldown: "0, 6 h, 12 h, 24 h, 2 days, then 5 days (exempt above 10 M plays)"

  fields:
    name: {required: true, min: 4, max: 32, locales: shared, listing: listing.title, basis: documented, note: Permanent once published.}
    description: {required: null, max: null, locales: null, basis: hypothesis}
    instructions: {required: null, max: null, locales: null, basis: hypothesis}
    thumbnail: {required: null, formats: null, size: null, basis: hypothesis}

  restrictions:
    - rule: Copied, misleading, low-quality, repeatedly reskinned or mass-generated games may be rejected.
      source: https://developer.y8.com/
    - rule: Review feedback appears in the game's Feedback tab; resubmission cooldowns grow with each rejection.
      source: https://developer.y8.com/
    - rule: An update is a new build uploaded through the portal; it is reviewed before it replaces the live version (read 2026-10-07).
      source: https://developer.y8.com/
    - rule: Every game must be connected to a Studio; Studios must not be created to dodge restrictions (read 2026-10-07).
      source: https://docs.y8.com/studio/create-game/
    - rule: The SDK requirements the Developer Portal shows for the game (ads, cloud saves, leaderboards, achievements) are completed - a per-game checklist behind the login, UNKNOWN to the Factory (read 2026-10-07).
      source: https://developer.y8.com/
