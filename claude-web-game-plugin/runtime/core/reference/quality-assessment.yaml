# Quality assessment: what the evidence a build already has can - and cannot - say about it.
#
# The quality gate (scripts/wgf_quality, docs/quality-gate-module.md) holds a build to the
# floor on every dimension and decides the release. This file decides nothing. It reads the
# SAME check results - through the one reader (core/reference/check-tiers.yaml `status_at`,
# wgf_quality.registry.check_status, as knowledge compliance reads them) - and states three
# separate questions about the build, each with the checks it rests on and how each was
# measured:
#
#   design_validity      Is the design coherent, and does the built content carry what the
#                        design and its tier ask for?
#   runtime_correctness  Does the build load, run, take input and reach its states without
#                        errors, on the reports of the build it is?
#   player_facing        Is it fun, does it feel right, is it fair, well paced and clear to a
#                        player? Automation measures proxies of this; it never measures it.
#
# Each dimension is PASS | FAIL | INCONCLUSIVE | NOT_SUPPORTED (scripts/wgf_quality/
# assessment.py):
#
#   FAIL           a check of the dimension FAILED whose tier (check-tiers.yaml) holds a build
#                  - hard or quality - or a person's G4 decision on this build sent it back
#   INCONCLUSIVE   no failure, but a check it rests on is UNMEASURED, SKIPPED, BLOCKED,
#                  stale, a WARNING (not held at this tier) or DEFERRED - never a pass; or, for
#                  a dimension that `requires: human`, no person has judged this build
#   NOT_SUPPORTED  no check that holds a build applies to this game (only advisory ones, or
#                  none at all): nothing here can say
#   PASS           every check that holds a build and applies to it passed - and, for a
#                  dimension that `requires: human`, a person's G4 decision passed this build
#
# An advisory check is `supporting`: listed with its status, never deciding. Every automated
# check of a `requires: human` dimension is `supporting` too (a proxy): a proxy that holds a
# build and FAILED still fails the dimension - automation can show a defect a player meets -
# but no number of passing proxies makes it PASS.
#
# `classes` is how a check was measured. A check's class is its family's. `families` group the
# declared checks (`<check-tiers source>:<id>`, `<source>:*` for every check of the source no
# other family names) by dimension and class, and say what the checks measure, how, their
# limits, and what they cannot justify - docs/quality-assessment.md is the same table for a
# person. `when: reported`: a family whose producer reports a check only for a build it
# concerns (the floor's `applies: reported`; a model the pipeline built; a design rule the
# design step evaluated); a check of it the report has no entry for is listed `not_reported`
# and counts for nothing.
#
# An `ai-judged` family names its `judge` - the report that records it, and where the report
# says what kind of judge it was and how many times it ran - so a dimension resting on one
# judgment says so. `unresolved` names the findings a family's report raised at the listed
# severities: they are listed on the dimension whatever the report's verdict, and decide
# nothing. A dimension's `basis` says how much of a PASS rests on the game's own report or on
# a single AI judgment (`weak` when all of it does, `qualified` when some does) - the
# Factory has no repeated or independent judging, so every AI judgment is a single one.
#
# Coverage (scripts/check-integrity.py, wgf_quality.assessment.problems): every check a
# family names is a declared check of check-tiers.yaml; every check of a source a family
# names is in exactly one family; every source of check-tiers.yaml is named by a family or
# `excluded` with why; a quality-floor criterion no family names is an aggregate - its
# `evaluate.kind` is one of `aggregates.kinds` over a report whose own checks a family maps,
# or it is listed in `aggregates.criteria` or `excluded_checks` with why.
#
# Read by: scripts/wgf_quality/assessment.py (the quality-report's `assessment` section,
# 1.5.0), scripts/check-integrity.py. Read live: a view, not a bar - the run's pinned
# check-tiers still decide which checks exist and where they are read.

version: 1.0.0

statuses: [PASS, FAIL, INCONCLUSIVE, NOT_SUPPORTED]

classes:
  deterministic:
    label: Deterministic
    meaning: Measured by the Factory from outside the game - bytes, pixels, the DOM, the browser's own errors and timings, the design and data files - the same build measured twice gives the same result (timings within the host's noise).
  heuristic:
    label: Heuristic
    meaning: A measured quantity held to a bar that stands for a quality it does not define - a contrast ratio for readability, a bot's clear rate for fairness. Can be wrong both ways on a game the bar was not calibrated on.
  self-reported:
    label: Self-reported (game probe)
    meaning: The game's own play probe (window.__wgf__) says what state it is in - playing, won, lost, which unit, what entity kinds. The bot's inputs are real, but whether the state is true is the game's word.
  ai-judged:
    label: AI-judged
    meaning: An agent read frames or code and gave a score, a verdict or a flag. Useful and fallible; never a measurement.
  human:
    label: Human
    meaning: A person's recorded decision on this build (a G4 decision-record decided by a person). The only class that can pass a player-facing dimension.

dimensions:
  design_validity:
    label: Design validity
    question: Is the design coherent, and does the built content carry what the design and its tier ask for?
    requires: automation
  runtime_correctness:
    label: Runtime correctness
    question: Does the build load, run, take input and reach its states without errors?
    requires: automation
  player_facing:
    label: Player-facing quality
    question: Is it fun, does it feel right, is it fair, well paced and clear to a player?
    requires: human
    # A person's decision on this build: a G4 decision-record decided by a person that pins
    # at least one of this build's current reports by content hash. A decision on an earlier
    # build is listed and decides nothing. MV-4 records are taken outside a run and are not
    # an input of the gate: a person brings them to G4.
    human_evidence:
      artifact: decision-record
      gate: G4
      mode: human
      pass: [pass]
      fail: [iterate, abandon]
    cannot_justify: Nothing the Factory runs measures fun, feel, fairness or pacing. Its proxies show defects a player would meet; a person playing the build is the only evidence that it is good.

families:
  # ------------------------------------------------------------------ design validity
  - id: design-rules
    label: Design consistency rules
    dimension: design_validity
    class: deterministic
    when: reported
    checks: ["design-consistency:*"]
    measures: The design's own rules - monetization against the platforms, session and scope, locales, the concept's mechanics carried and no foreign one added, the brief's commitments, one new element per unit, the knowledge trace.
    method: Evaluated by the design step over the game-design's fields (consistency.rule_results).
    limits: Judges the document, not the build. A rule the design step did not evaluate for this design is not reported.
    cannot_justify: That the design is fun, or that the build implements it.
  - id: content-contract
    label: Built content against the design and the tier
    dimension: design_validity
    class: deterministic
    checks:
      - content-sufficiency:content.contract
      - content-sufficiency:content.data_present
      - content-sufficiency:content.units_shipped
      - content-sufficiency:content.elements
      - content-sufficiency:content.combinations
      - content-sufficiency:content.structure
      - content-sufficiency:content.groups
      - content-sufficiency:content.difficulty
      - content-sufficiency:content.objectives
      - content-sufficiency:content.climax
      - content-sufficiency:content.progression
      - content-sufficiency:content.playtime
      - content-sufficiency:content.drift
      - content-sufficiency:content.regression
      - content-sufficiency:content.introductions_one_at_a_time
    measures: The content data the build ships (public/content/units.json at the played commit) counted against the units, elements and structure the design owes and the benchmark's bars at its tier; drift between the two.
    method: Counted from the data file and the design by the content-sufficiency step.
    limits: Counts what the data declares. Difficulty and playtime are the design's own declared values, not measured play. Generated (non-authored) content is skipped, so it is unmeasured here.
    cannot_justify: That the content is varied to a player, that any level is good, or that the declared playtime is how long anyone plays.
  - id: content-on-screen
    label: Content kinds reported on screen
    dimension: design_validity
    class: self-reported
    checks: [content-sufficiency:content.entity_kinds]
    measures: Every on-screen entity of a content role carries its kind, so elements can be counted on the build.
    method: Read from the probe's entities while the bot played.
    limits: The kind is the game's own label for an entity.
    cannot_justify: That the entity looks like, or behaves as, the element it names.
  - id: level-layout
    label: Level layout geometry
    dimension: design_validity
    class: heuristic
    when: reported
    checks: [play-realism:level.geometry, play-realism:level.unit_length, play-realism:level.clearance]
    measures: The path and grid layouts the content data file declares - geometry, unit length, clearance - against play-realism.yaml's bars.
    method: Computed from the declared layouts by the playability step's realism pass.
    limits: Bars calibrated on the reference games; a layout of a kind the data file does not declare is not judged.
    cannot_justify: That a level is well designed or interesting to play.
  - id: independent-review
    label: Independent review of the build
    dimension: design_validity
    class: ai-judged
    checks: [quality-floor:floor.review_blockers, quality-floor:floor.review_approved]
    judge: {report: review-report, kind: reviewer.kind}
    measures: An independent reviewer's verdict and blockers on the shipped commit - fidelity to the design, invented content, code that games a gate.
    method: A read-only reviewer agent reads the diff and the design (docs/review-module.md).
    limits: An agent's reading; it can miss a defect and flag a sound change.
    cannot_justify: That the build is correct at runtime, or good to play.
  - id: design-assets
    label: Audio the design owes, delivered
    dimension: design_validity
    class: self-reported
    checks: [quality-floor:floor.music, quality-floor:floor.sfx]
    measures: The asset manifest lists the music and sound effects delivered or integrated.
    method: Counted from the asset-manifest the assets step wrote.
    limits: A manifest status is the assets step's record, not a sound heard.
    cannot_justify: That the audio plays (runtime) or suits the game (player-facing).

  # ------------------------------------------------------------------ runtime correctness
  - id: probe-and-errors
    label: The play probe answers, and the page raises no error
    dimension: runtime_correctness
    class: deterministic
    checks: [playability:probe.present, playability:page.errors]
    measures: window.__wgf__.play.snapshot() answers while the game starts; no uncaught page error while the bot plays.
    method: The playability bot in Playwright Chromium on the development commit's build, desktop and mobile viewports.
    limits: One browser engine; errors the bot's path never triggers are not seen.
    cannot_justify: That the game works on other browsers or real devices.
  - id: oracle-states
    label: States the game reports reaching
    dimension: runtime_correctness
    class: self-reported
    checks:
      - playability:start.playable
      - playability:win.reachable
      - playability:lose.reachable
      - playability:restart.works
      - playability:progression.persists
      - playability:content.win_lose_per_unit
      - playability:content.units_reachable
      - content-sufficiency:content.units_reachable
    measures: Play begins within the budget; good play reaches won, bad play reaches lost, retry returns to play with the goal reset; progress survives a reload; every unit can be entered and won or lost.
    method: Real page inputs at the coordinates the probe lists; the states are read from the probe.
    limits: win.reachable rests on the game's own won state, and the bot presses what the game's oracle says to press. A probe that reports won without a win passes it (gate-gaming review is what looks for that).
    cannot_justify: That a player can win or lose by playing, or that winning feels earned.
  - id: input-response
    label: Every action changes the frame
    dimension: runtime_correctness
    class: deterministic
    checks: [playability:act.acknowledged]
    measures: Each action the probe offers, pressed for real, changes at least a share of the frame's pixels.
    method: Before/after frames compared pixel by pixel (acknowledgement bars in the play rules).
    limits: Any visible change counts - a flicker passes, a meaningful but tiny response may fail.
    cannot_justify: That the response is the right one or feels responsive.
  - id: runtime-errors
    label: Console errors and WebGL context
    dimension: runtime_correctness
    class: deterministic
    when: reported
    checks: [play-realism:runtime.console_errors, play-realism:runtime.webgl_context]
    measures: Console errors from the game's origin and lost WebGL contexts during the bot's play, per viewport.
    method: Recorded by the browser while the bot plays.
    limits: Only the paths the bot played.
    cannot_justify: Stability over long sessions or on other GPUs.
  - id: production-runtime
    label: Assets loaded and used, UI layout and states
    dimension: runtime_correctness
    class: deterministic
    checks:
      - production-quality:assets.present
      - production-quality:assets.runtime
      - production-quality:assets.loaded
      - production-quality:assets.used
      - production-quality:audio.plays
      - production-quality:ui.overlap
      - production-quality:ui.states
    measures: Every required asset is in the build, fetched and used at runtime; audio plays; no UI control overlaps another; every screen state can be reached.
    method: The production-quality step's network, DOM and frame records of the build.
    limits: Measured on the viewports the step renders.
    cannot_justify: That the assets look right or the UI is pleasant.
  - id: production-completeness
    label: No placeholder geometry or browser-default UI
    dimension: runtime_correctness
    class: heuristic
    checks: [production-quality:scene.no_primitives, production-quality:ui.styled]
    measures: The scene draws no primitive placeholders and the UI is not unstyled browser controls.
    method: Frame and DOM analysis against production-quality's detectors.
    limits: A detector - a deliberately geometric art style can trip it, an unusual placeholder can pass it.
    cannot_justify: That the art is finished or good.
  - id: browser-run
    label: Browser QA - measured by the browser
    dimension: runtime_correctness
    class: deterministic
    when: reported
    checks:
      - browser-qa-run:browser.run
      - browser-qa:browser.loads
      - browser-qa:browser.canvas
      - browser-qa:browser.page-errors
      - browser-qa:browser.console-errors
      - browser-qa:browser.webgl-context
      - browser-qa:browser.context-menu
      - browser-qa:browser.overflow
      - browser-qa:browser.clipping
      - browser-qa:browser.ui-overlap
      - browser-qa:browser.ui-covers-play
      - browser-qa:browser.safe-margins
      - browser-qa:browser.button-states
      - browser-qa:browser.audio-clips
      - browser-qa:browser.audio-loops
      - browser-qa:browser.audio-hidden
      - browser-qa:browser.audio-mute
      - browser-qa:browser.oversized-textures
      - browser-qa:browser.asset-weight
    measures: The shipped build loads, draws, raises no error, keeps its UI inside the viewport and off the play, and handles audio (decodes, no stray loops, silent when hidden, mutes).
    method: verify's browser-QA spec on the verified commit (core/reference/browser-qa.yaml), per viewport.
    limits: Chromium under Playwright on the build host.
    cannot_justify: Behaviour on Safari, Firefox or a real handset.
  - id: browser-oracle
    label: Browser QA - states the game reports
    dimension: runtime_correctness
    class: self-reported
    when: reported
    checks:
      - browser-qa:browser.ready
      - browser-qa:browser.menus
      - browser-qa:browser.win
      - browser-qa:browser.lose
      - browser-qa:browser.restart
      - browser-qa:browser.pause-resume
      - browser-qa:browser.hidden-pause
      - browser-qa:browser.audio-events
    measures: Loading completes, the title screen leads to play, win, loss, retry, pause and hidden-page pause work, and actions start their sounds - on the shipped build.
    method: verify's browser-QA spec, reading the probe's state.
    limits: The states are the game's own word, as in oracle-states.
    cannot_justify: That a player reaches them by playing.
  - id: browser-timing
    label: Browser QA - timings
    dimension: runtime_correctness
    class: deterministic
    when: reported
    checks: [browser-qa:browser.load-time, browser-qa:browser.first-interaction, browser-qa:browser.frame-stability, browser-qa:browser.memory-growth]
    measures: Load time, time to first input, frame-time percentiles and heap growth.
    method: Measured in the browser on the build host; a degraded host blocks the timing instead of passing it.
    limits: Desktop host timings - never a mobile device's (MV-4 measurement classes).
    cannot_justify: Performance on a player's phone.
  - id: model-validity
    label: 3D model validity
    dimension: runtime_correctness
    class: deterministic
    when: reported
    checks: [model-review:model.valid, model-review:model.parts, model-review:model.primitive, model-review:model.bounds, model-review:model.normals, model-review:model.triangles]
    measures: Each GLB the pipeline built is valid, has its parts, bounds, normals and triangle budget, and is not a bare primitive.
    method: Read from the GLB by the model checks (core/reference/asset-quality.yaml models).
    limits: Only models built from a spec by the pipeline report these.
    cannot_justify: That a model looks good.
  - id: gate-gaming
    label: Changes that game a gate
    dimension: runtime_correctness
    class: ai-judged
    checks: ["gate-gaming:*"]
    judge: {report: review-report, kind: reviewer.kind}
    measures: The reviewer's flags for a change that makes a check pass without the behaviour - an unread content field, a moved play area, a changed probe path, a sprite resized without its collider.
    method: The review step's reviewer, against core/reference/gate-gaming.yaml.
    limits: An agent's reading of a diff; no flag is not proof of none.
    cannot_justify: That the self-reported states are true.
  - id: qa-and-verify
    label: Verification, QA, performance budget and platform readiness
    dimension: runtime_correctness
    class: deterministic
    checks:
      - quality-floor:floor.no_blocking_defects
      - quality-floor:floor.qa_pass
      - quality-floor:floor.valid_package
      - quality-floor:floor.platform_ready
      - quality-floor:floor.performance
      - quality-floor:floor.platform_sdk
    measures: The verified bundle builds and packages, QA records no blocking defect, the frame budget holds, every required platform is ready and its SDK integration is complete.
    method: The verify, QA and sdk steps' reports on the shipped commit, read by the quality floor.
    limits: The performance budget is measured on the build host; the SDK status is a static inspection of the integration against the platform profile, never the live portal SDK.
    cannot_justify: That the portal accepts the build, or that it runs well on a player's device.

  # ------------------------------------------------------------------ player-facing proxies
  - id: clarity-proxies
    label: Clarity proxies
    dimension: player_facing
    class: heuristic
    checks:
      - playability:start.objective
      - playability:frames.readable
      - production-quality:scene.contrast
      - production-quality:ui.text
      - production-quality:ui.targets
    measures: The objective's words on screen in the first seconds; frame and scene contrast; text size and touch-target size against their bars.
    method: Text found on screen, pixel statistics and DOM measurements.
    limits: Words on screen are not words read; contrast is not legibility; a target's size is not its findability.
    cannot_justify: That a player understands the goal or can read the screen.
  - id: pacing-proxies
    label: Variety and difficulty as the game reports them
    dimension: player_facing
    class: self-reported
    checks:
      - playability:content.variety
      - playability:difficulty.axes_progress
      - playability:entities.projectile
      - playability:idle.grace
    measures: New content kinds appear in time, the design's difficulty axes rise across units, projectiles are reported as entities, and play is not lost without input before the grace.
    method: The probe's entity kinds, difficulty values and lost state while the bot plays.
    limits: Every value is the game's own report.
    cannot_justify: That the variety is felt, that the difficulty curve is fair, or that the opening is welcoming.
  - id: depth-proxies
    label: Depth and session-length proxies
    dimension: player_facing
    class: heuristic
    checks: [playability:depth.ramp, playability:depth.session_length, playability:depth.stall]
    measures: Challenge rises over timed play, a session lasts the designed length, and the ramp does not stall.
    method: Samples of the game's reported metrics over a bot session, against the design's depth bars.
    limits: A bot's session, not a player's; the bars are the design's.
    cannot_justify: That a player wants to keep playing.
  - id: naive-player
    label: A naive bot's experience
    dimension: player_facing
    class: heuristic
    when: reported
    checks: [play-realism:naive.setbacks, play-realism:naive.drift, play-realism:naive.alignment, play-realism:naive.pace, play-realism:naive.unit_duration, play-realism:naive.clear_rate]
    measures: How a bot that does not follow the oracle fares - setbacks, drift and alignment on a 3D path, pace, unit duration, clear rate.
    method: The realism pass of the playability step (core/reference/play-realism.yaml), calibrated on the reference games.
    limits: A naive bot is not a first-time player; its clear rate stands for fairness only as far as the calibration holds.
    cannot_justify: That the game is fair or well paced for a person.
  - id: physics-fairness
    label: Collisions match what is drawn
    dimension: player_facing
    class: heuristic
    when: reported
    checks: [play-realism:physics.undrawn_collision, play-realism:physics.collider_size]
    measures: No collision with something not drawn, and colliders the size of their sprites, on a 2D board with moving bodies.
    method: The probe's bodies against the drawn frame.
    limits: Only bodies the probe reports; a 3D camera's screen positions are not judged.
    cannot_justify: That a hit or a miss feels fair.
  - id: visual-judge
    label: Visual judge
    dimension: player_facing
    class: ai-judged
    # Read through the floor's visual criteria, which hold the judge's scores and findings to
    # the rubric's bars at the run's tier (the judge's own entries are excluded below).
    checks:
      - quality-floor:floor.visual_verdict
      - quality-floor:floor.no_critical_visual_findings
      - quality-floor:floor.visual_major_findings
      - quality-floor:floor.visual_minor_findings
      - quality-floor:floor.visual_min_dimension
      - quality-floor:floor.visual_mean
      - quality-floor:floor.ui_scores
      - quality-floor:floor.no_debug
      - quality-floor:floor.consistency_score
      - quality-floor:genre.course_readable
      - quality-floor:render.spatial_readability
      - quality-floor:render.environment
    judge: {report: visual-qa-report, kind: judge.kind, runs: judge_runs, repairs: judge_repairs}
    # Every blocker or major finding the judge raised is listed unresolved - on a report that
    # passed too, where nothing else carries it on (the retro of the 2026-10 runs: two MAJOR
    # findings of a PASS report were dropped).
    unresolved: {report: visual-qa-report, list: findings, severities: [blocker, major]}
    measures: A vision judge's verdict, its 0-5 scores per rubric dimension and its findings on the runtime frames, held to the rubric's and the benchmark's bars.
    method: The visual-qa step's judge (core/reference/visual-qa-rubric.yaml) - an agent reading frames; the baseline judge of a golden run compares frames with a stored baseline. Read through the quality floor's visual criteria.
    limits: An AI judge reading still frames - it can be fooled, is not stable between runs, and is blind to motion and timing.
    cannot_justify: That the game looks good to a person, or feels good in motion.
  - id: model-look
    label: 3D model look proxies
    dimension: player_facing
    class: heuristic
    when: reported
    checks: [model-review:model.palette, model-review:model.contrast, model-review:model.silhouette]
    measures: A model's palette, contrast and silhouette against the asset-quality bars.
    method: Rendered and measured by the model checks.
    limits: Bars, not taste.
    cannot_justify: That the model reads well in play.
  - id: audio-balance
    label: Audio balance
    dimension: player_facing
    class: heuristic
    when: reported
    checks: [browser-qa:browser.audio-loudness]
    measures: Shipped clips' loudness spread and music under effects.
    method: Loudness computed from the shipped clips.
    limits: A level window, not a mix a person judged.
    cannot_justify: That the audio is pleasant or fits the game.

# Floor criteria no family names: each aggregates checks a family already maps (or, for the
# `kinds` listed, reads a report whose own checks a family maps), so counting it again would
# count a result twice.
aggregates:
  source: quality-floor
  kinds: [checks, scores]
  criteria:
    floor.ui_verdict: production-quality's verdict over its checks (production-runtime, production-completeness, clarity-proxies)
    floor.content_sufficient: content-sufficiency's verdict over its checks (content-contract, content-on-screen, oracle-states)
    floor.content_checks_measured: playability's skipped checks, each UNMEASURED in its own family
    floor.sufficiency_measured: content-sufficiency's skipped checks, each UNMEASURED in its own family

excluded:
  quality-dimension: A floor dimension is the mean of its criteria held to a bar - an aggregate of the checks the families map, with no measurement of its own.
  visual-qa-blocker: The judge names its findings freely, so a blocker finding cannot be told to be one rubric blocker rather than another (it reads every rubric blocker UNMEASURED, never FAIL); the visual-judge family reads the judge through the floor's visual criteria instead, which count the findings.
  visual-qa-score: A score is a value, not a verdict; the floor's visual criteria (visual-judge) hold the same scores to the rubric's and the benchmark's bars at the run's tier.

excluded_checks:
  quality-floor:floor.store_listing: The store listing is publishing readiness - measured after G4 by listing-validation, which release requires on its own - and none of the three questions.
