# Visual QA rubric: what a finished game's frames are held to by a vision judge.
#
# The visual-qa step (title:prototype, production phase) hands a judge - an agent able to read
# images - every frame the playability step captured of the production build: each state
# (boot, idle, playing, before and after each action, won, lost), on a desktop and a mobile
# viewport. The judge scores each dimension below 0-5 and lists findings; the step, not the
# judge, decides the verdict from these rules. It is an agent's reading of frames
# (measurement_class: automation-agent), never a first-time player's.
#
# The judge is an installation's choice, configured outside core: an agent command that can
# read images, run read-only with nothing but the brief and copies of the frames, which
# returns its scores and findings in the shape the brief gives. No judge configured blocks
# the step; visual QA is never a silent pass.
#
# The anchors describe 0, 3 and 5; 1, 2 and 4 lie between them. The build fails on any of: a
# dimension scored below `pass_bar`, a finding of severity `blocker`, a per-state answer equal
# to its question's `fail_when` (state_questions below), a mean score below `mean_pass_bar`,
# or the look judged anything but `finished-game`. Each names where its failure goes back to: `assets` when an asset
# itself must change, `develop` when the game's use of it must (the step's route is `assets`
# when anything failing routes there, else `develop`).
#
# What an `assets` failure makes again: on re-entry the assets step remakes the design's asset
# requirements (game-design build_spec.assets) a failure concerns, and hands their authors the
# judge's reasons and the frames that show them (docs/assets-module.md, "Re-entry"). A failure
# concerns the requirements whose id it names, those of a role whose word it names
# (`rebuild.role_words`), those whose runtime asset the play probe reported drawing an entity
# of that role, and those of its own `rebuild_roles` - a dimension's, a blocker's, a state
# question's or the look's. Roles are the design's asset roles; a name in `rebuild.groups`
# stands for its roles. An `assets` failure that names nothing remakes `rebuild.fallback`: a
# run sent back to make its art again never reuses every file.
#
# Calibrated once against real frames (docs/visual-qa-module.md, "Calibration"): a game whose
# characters were untextured cubes on a near-black pitch, and the template's two golden
# ports. Recalibrate as verdicts accumulate - never to make one build pass.

version: 1.2.0

pass_bar: 3
# The mean of every dimension's score must reach this too. Per-dimension scores from one
# judge vary by a point between runs on the same frames, so no single dimension can carry a
# bar of 4; the mean does. Calibration 2026-10-02 (three runs per reference, one on a
# greybox): two finished reference games scored means of 3.63-4.13, a styled greybox 3.13.
# A dimension below 4 then contributes its route.
mean_pass_bar: 3.5

dimensions:
  art_completeness:
    route: assets
    rebuild_roles: [art]
    question: Is every thing on screen finished art, in the style the design specifies?
    anchors:
      "0": Placeholder art everywhere - untextured primitives, flat boxes, missing-texture colours, stand-in rectangles.
      "3": Most entities and the scene are finished art; one or two minor elements are still plain or stand-ins.
      "5": Every entity, surface and UI element is finished art consistent with the art direction.
  character_readability:
    route: assets
    rebuild_roles: [entities]
    question: Can a first-time player tell at a glance what each readable entity (player, threat, goal, target, projectile) is, at its size on both viewports?
    anchors:
      "0": Entities are anonymous shapes; the player cannot tell themself from a threat or a goal.
      "3": Each entity's role can be told apart, but it takes a second look or it is small on mobile.
      "5": Each entity reads instantly by silhouette and colour, on desktop and mobile alike.
  environment:
    route: assets
    rebuild_roles: [scene]
    question: Does the scene (background, ground, arena, lighting) give a sense of place and frame the play?
    anchors:
      "0": An empty, black or flat-colour void; or so dark nothing reads.
      "3": A plain but coherent setting that frames the play; lighting adequate.
      "5": A setting with depth and character that supports the play and the identity.
  ui_polish:
    route: develop
    question: Are buttons, panels and HUD styled to the design's UI rules, sized for touch on mobile?
    anchors:
      "0": Browser-default controls, unstyled HTML, overlapping or clipped UI.
      "3": Styled consistently but plain; usable on mobile.
      "5": Distinctive UI matching the visual identity, clear hierarchy, comfortable touch targets.
  typography:
    route: develop
    question: Is the text set in the design's faces, legible at its size, with a clear hierarchy?
    anchors:
      "0": Default serif or system font, illegible sizes, text over busy art without contrast.
      "3": Legible and consistent, little character.
      "5": The design's faces, legible on both viewports, clear hierarchy of score, labels and calls to action.
  composition:
    route: develop
    question: Is the frame laid out so the play is central, nothing important is cut off, and the mobile layout is designed rather than squeezed?
    anchors:
      "0": Play area cropped, entities off-screen or overlapping the HUD; mobile a shrunken desktop.
      "3": Play area clear and uncropped on both viewports; some wasted or crowded space.
      "5": Deliberate composition on both viewports; the eye goes to the play first.
  consistency:
    route: assets
    rebuild_roles: [art]
    question: Do all the visuals belong to one game - one palette, one shape language, one rendering style?
    anchors:
      "0": Mixed styles - flat clip-art beside photo textures, palettes that clash, assets from different games.
      "3": Mostly coherent, with an odd one out.
      "5": One unmistakable style throughout, matching the design's palette and shape language.
  no_debug:
    route: develop
    question: Is the build free of development output?
    anchors:
      "0": Debug text, FPS or stats panels, axes or grid helpers, wireframes or bounding boxes visible.
      "3": One small leftover developer element (an unlabeled counter, a stray outline).
      "5": Nothing a developer left on screen.

# Findings the judge must raise as `severity: blocker` whatever the scores. Each names the
# category and the route the step expects; a blocker fails the build on its own.
blockers:
  - id: primitive-entity
    category: assets
    route: assets
    rebuild_roles: [entities]
    rule: A readable entity (player, threat, goal, target, projectile) drawn as a plain cube, sphere, capsule, cylinder or rectangle, when the design's visual identity has no primitive_style.
  - id: missing-asset
    category: assets
    route: assets
    rule: An asset the design lists is visibly absent - a missing-texture colour, an empty sprite box, a black or magenta square, a model that did not load.
  - id: browser-default-ui
    category: ui
    route: develop
    rule: Browser-default buttons, inputs or text (grey bevelled buttons, Times New Roman, blue underlined links) in the game's UI.
  - id: debug-output
    category: debug
    route: develop
    rule: Visible debug output - text overlays, FPS or stats panels, axes or grid helpers, wireframes, collider outlines.
  - id: unreadable-frame
    category: readability
    route: develop
    rule: A playing frame in which the player cannot find the readable entities - too dark, too small, or lost in the background. Route develop when lighting, camera or scale is the cause; assets when the entity's art itself cannot be read.
  - id: cropped-play
    category: composition
    route: develop
    rule: The play area, a readable entity or a required control is cut off on either viewport.

# The states the frames are grouped into, in the order the brief and the report list them.
# The judge answers every question below for every (state, viewport) that has frames. A state
# with no frame (the playability bot captures no frame after a retry today) is reported as
# not captured - never answered from imagination.
states:
  - id: initial
    shows: the first screen after load, and the game waiting for input after the grace
  - id: gameplay
    shows: play under way
  - id: interaction
    shows: just before and just after a player action
  - id: win
    shows: the win screen
  - id: loss
    shows: the loss screen
  - id: retry
    shows: the screen after the player chose to retry

# Asked of every (state, viewport). An answer equal to `fail_when` fails the build, routed to
# `route`. null means the frames of that state show nothing the question is about (no text,
# no button, a 2D game's lighting); it never means "not sure". `unless: primitive_style` -
# the answer does not fail a game whose visual identity states primitive_style.
state_questions:
  - id: entities_recognisable
    ask: Are the entities on screen recognisable production assets - a player can tell what each one is?
    fail_when: false
    route: assets
    rebuild_roles: [entities]
  - id: primitives_or_placeholders
    ask: Is any entity or element drawn as a plain primitive (cube, sphere, capsule, rectangle) or a placeholder?
    fail_when: true
    route: assets
    rebuild_roles: [entities, scene]
    unless: primitive_style
  - id: lighting_materials_coherent
    ask: In a 3D scene, are lighting and materials coherent - lit, shaded, one material language? (null for 2D)
    fail_when: false
    route: develop
  - id: typography_readable
    ask: Is the text readable at its size and set in a chosen face - not a fallback system or browser-default font?
    fail_when: false
    route: develop
  - id: buttons_polished
    ask: Are the buttons and controls styled for this game - not browser defaults?
    fail_when: false
    route: develop
  - id: objective_obvious
    ask: Is what the player must do obvious from the screen?
    fail_when: false
    route: develop
    states: [initial, gameplay, interaction]
  - id: outcome_understandable
    ask: Is it clear the player won or lost, and what to do next?
    fail_when: false
    route: develop
    states: [win, loss, retry]

# Asked once, of the whole set of frames. `developer-prototype` fails the build.
look:
  ask: >-
    Does this look like a finished game a portal would feature (finished-game), a competent
    but plain game nobody would remember - generic shapes, default-looking UI, an empty or
    flat scene, no visual identity of its own (unremarkable) - or a developer prototype?
    Compare with the quality bar frames in the brief.
  values: [finished-game, unremarkable, developer-prototype]
  # Both fail: the bar is a game a portal would feature, not one that merely works.
  fail_on: [unremarkable, developer-prototype]
  route: assets
  rebuild_roles: [art]

# Roles and words for the assets step's re-entry (see the header). A word matches a whole word
# of a finding's id or summary, singular or plural.
rebuild:
  groups:
    entities: [player, threat, goal, target, projectile, collectible, hazard]
    scene: [environment, background, prop]
    art: [entities, scene, vfx]
  fallback: [entities, scene]
  role_words:
    player: [player, hero, avatar, character, protagonist]
    threat: [threat, enemy, obstacle, wall, monster]
    hazard: [hazard, spike, trap]
    goal: [goal, finish, exit]
    target: [target]
    projectile: [projectile, bullet, missile, shot]
    collectible: [collectible, pickup, coin, gem, powerup]
    environment: [environment, arena, ground, floor, terrain, track, scenery]
    background: [background, backdrop, sky, horizon]
    prop: [prop, decoration]
    vfx: [vfx, effect, particle, explosion, debris, burst, trail, spark]
    ui: [ui, button, panel, hud, menu]
    icon: [icon, glyph]
    font: [font, typeface]
