# Discovery module - candidate archetype catalog.
#
# The shapes of web game the market scan considers. The scan's job is to find out which of
# these the evidence favours on the target portals, not to invent a game from nothing - and
# a catalog makes "what else did you consider?" answerable at G1.
#
# EVERY NUMBER HERE IS AN ESTIMATE, not a measurement. The research step turns each
# archetype's figures into one `hypothesis` claim (capped at 0.6 confidence), and every
# dimension resting on them is screened at the hypothesis weight. Correct them from shipped
# titles' prototype and performance reports; that is how they stop being guesses.
#
# Fields:
#   market_tags         genre slugs matched against category / reference-title facts
#   session_seconds     a typical session, not a best case
#   replayability       low | medium | high
#   technical_complexity, asset_complexity    xs | s | m | l | xl
#   dev_speed_days      to a verifiable prototype, in the factory's 7-14 day model
#   asset_cost_usd      library and generated sources, not commissioned art
#   bundle_mb           expected initial download
#   priors              0..1 guesses for dimensions no public source measures
#
# No revenue figure appears here, deliberately: revenue_potential needs at least a derived
# claim (core/reference/dimensions.yaml), and a catalog guess would anchor everyone.

version: 1.0.0

archetypes:
  - id: block-puzzle
    title: Block Grid Puzzle
    genre: puzzle
    subgenre: block-puzzle
    market_tags: [puzzle, block-puzzle, casual]
    core_mechanic: drag given block shapes onto a grid; full rows and columns clear
    fantasy: turning a cluttered board into a clean one, one satisfying clear at a time
    core_loop: receive three pieces, place them, clear lines for combo points, run ends when nothing fits, retry for a high score
    session_seconds: 240
    replayability: high
    retention_design: score chase plus daily challenge board
    technical_complexity: xs
    asset_complexity: xs
    dev_speed_days: 7
    asset_cost_usd: 150
    bundle_mb: 8
    rendering: 2d
    text_heavy: false
    multiplayer: false
    needs_cloud_save: false
    mobile_ready: true
    monetization:
      primary: rewarded
      secondary: [interstitial]
      rationale: A full board is a natural rewarded moment (clear space to continue); interstitials fit between runs.
    priors: {monetization_fit: 0.7, retention_potential: 0.6, session_quality: 0.7, technical_risk: 0.1, performance_risk: 0.1, iterability: 0.8}
    risks:
      - {description: A well-served genre; differentiation rests on feel and polish rather than novelty., severity: medium}

