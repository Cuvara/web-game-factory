# Discovery module - the build-capability catalog.
#
# What the Factory can build, and what it cannot yet. Research V2 discovers opportunities from
# a game corpus (wgf_discovery/corpus.py, opportunities.py) - this catalog no longer bounds
# what research may propose. It answers, for any opportunity: is there a shape the Factory
# can build for it (an entry covering its genre node, with a `design_archetype`), what does
# that need (`requires`), and when it cannot be built, why not (`unavailable`). An opportunity
# with no buildable entry is kept as a capability gap, never discarded.
#
# Each entry is also still screened as a candidate in its own right (the `capability-screen`
# generator): its platform fit and catalog estimates against the scoped portals - so "what
# else did you consider?" stays answerable at G1.
#
# EVERY NUMBER HERE IS AN ESTIMATE, not a measurement. The research step turns each
# archetype's figures into one `hypothesis` claim (capped at 0.6 confidence), and every
# dimension resting on them is screened at the hypothesis weight. Correct them from shipped
# titles' prototype and performance reports; that is how they stop being guesses.
#
# Fields:
#   market_tags         genre slugs matched against category / reference-title facts
#   session_seconds     a typical session, not a best case
#   replayability       low | medium | high
#   technical_complexity, asset_complexity    xs | s | m | l | xl
#   dev_speed_days      to a verifiable prototype, in the factory's 7-14 day model
#   asset_cost_usd      library and generated sources, not commissioned art
#   bundle_mb           expected initial download
#   priors              0..1 guesses for dimensions no public source measures
#   genre_node          the research-vocabulary genre node the entry builds; it covers that
#                       node's subtree (core/reference/research-vocabulary.yaml)
#   mechanics           the vocabulary mechanics the entry's design implements
#   requires            the technical and asset capabilities the shape needs
#   unavailable         why the Factory cannot build it yet (entries with design_archetype null)
#   design_archetype    the design module's archetype (scripts/wgf_design/archetypes.py) that
#                       designs this concept so it passes design consistency, or null. Tied to
#                       the design module by scripts/tests/test_research_to_design.py.
#   genre_model         the core/reference/genre-models.yaml family whose model the concept is
#                       designed from (optional). A genre-model entry is designed by the
#                       built-in genre seed author or the agent author from the family's model
#                       - its unit kinds, progression and difficulty models, axes and unit
#                       counts - never from a hand-coded design archetype.
#                       ONE ENTRY PER FAMILY. A family carries one `seed` block, and that seed
#                       is one game: the design it produces must be the game this entry's
#                       concept describes, which the design consistency rules enforce
#                       (concept_mechanics_carried, design_adds_no_foreign_mechanic). Pointing
#                       a second concept at the same family makes a design of the first
#                       concept's game and fails at G2's exit guard - so a second shape in a
#                       family is a new seed in genre-models.yaml, never a second entry here.
#                       scripts/tests/test_research_to_design.py measures this per entry.
#
# AN ENTRY IS BUILDABLE WHEN `design_archetype` IS SET OR `genre_model` IS SET. An entry with
# neither is what the Factory cannot design yet: research never selects it, keeps it in the
# report as excluded ("not buildable"), and an opportunity that needs it is kept as a
# capability gap with `unavailable` as the reason. A new design archetype or a new genre family
# is how a null becomes buildable, never a relaxed rule.
#
# No revenue figure appears here, deliberately: revenue_potential needs at least a derived
# claim (core/reference/dimensions.yaml), and a catalog guess would anchor everyone.

version: 1.3.0  # 1.1.0: design_archetype; 1.2.0: capability fields
