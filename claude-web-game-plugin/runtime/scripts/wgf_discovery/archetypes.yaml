archetypes:
  - id: block-puzzle
    title: Block Grid Puzzle
    genre: puzzle
    subgenre: block-puzzle
    design_archetype: null
    genre_node: block-puzzle
    mechanics: [drag-place, line-clear]
    requires: [2d grid board, drag input, line-clear rules]
    unavailable: >-
      the puzzle genre model's seed is a slide-and-clear colour grid, not a board the player
      drops given shapes onto; a block-placing seed (its fit test, its piece bag and its
      game-over rule) does not exist yet
    market_tags: [puzzle, block-puzzle, casual]
    core_mechanic: drag given block shapes onto a grid; full rows and columns clear
    fantasy: turning a cluttered board into a clean one, one satisfying clear at a time
    core_loop: receive three pieces, place them, clear lines for combo points, run ends when nothing fits, retry for a high score
    session_seconds: 240
    replayability: high
    retention_design: score chase plus daily challenge board
    technical_complexity: xs
    asset_complexity: xs
    dev_speed_days: 7
    asset_cost_usd: 150
    bundle_mb: 8
    rendering: 2d
    text_heavy: false
    multiplayer: false
    needs_cloud_save: false
    mobile_ready: true
    monetization:
      primary: rewarded
      secondary: [interstitial]
      rationale: A full board is a natural rewarded moment (clear space to continue); interstitials fit between runs.
    priors: {monetization_fit: 0.7, retention_potential: 0.6, session_quality: 0.7, technical_risk: 0.1, performance_risk: 0.1, iterability: 0.8}
    risks:
      - {description: A well-served genre; differentiation rests on feel and polish rather than novelty., severity: medium}

