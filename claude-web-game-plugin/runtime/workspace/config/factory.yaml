# Local factory configuration, read by the `wgf` CLI (scripts/wgf.py).
#
# Core ships the workflow definitions (core/workflows/); this file is where one installation
# decides how they execute. Every key is optional and falls back to the defaults in
# scripts/wgflib/workflow/config.py.

factory:
  workflow:
    default: new-game

  # Retry and loop policy for every step that does not set its own in the workflow file.
  execution:
    max_attempts: 3
    backoff: exponential        # none | fixed | exponential
    delay_seconds: 2            # before the first retry; doubles each time when exponential
    max_delay_seconds: 60
    max_visits: 5               # how often a loop may re-enter one step before the run blocks
    # Liveness (docs/agent-lifecycle.md). `wgf status` calls a RUNNING step hung when its
    # driver has recorded nothing, not even a heartbeat, for hung_after_seconds; or when the
    # driver's heartbeats arrive but the child it waits on has written nothing for
    # hung_output_seconds. Status only reports; on_hung decides whether the driving engine
    # acts: `none`, or `cancel` - terminate the silent child's tree and end the step, not
    # retryably (a STEP_LOG warning says why). A run keeps the on_hung policy it started
    # with. Keep hung_output_seconds above every module idle_timeout_seconds below, or the
    # watchdog pre-empts the module's own ending.
    # hung_after_seconds: 300
    # hung_output_seconds: 900
    # on_hung: none             # none | cancel

  # Which runtime executes a step. Only `local` exists; an agent-host runtime registers
  # itself from a step module and is selected here by name.
  agents:
    default: local
    # Agent processes (the develop step's developer command, the review step's reviewer)
    # start with an allowlisted environment, never the Factory's: PATH, HOME, USER, LANG,
    # LC_*, TERM, TMPDIR, SHELL, CI, the proxy variables, XDG_*, NODE_*, PNPM_*,
    # npm_config_*, PLAYWRIGHT_*, COREPACK_* (minus anything named like a secret), plus the
    # WGF_PROC_* tags. Name here what else an agent needs -
    # an exact name, or a prefix ending in *. See scripts/wgflib/agentenv.py.
    env_passthrough: []
    # Claude Code logged in with `claude login` reads its credentials under HOME and needs
    # nothing here. Authenticated by key or token instead, it needs that one variable:
    # env_passthrough: [ANTHROPIC_API_KEY]      # or CLAUDE_CODE_OAUTH_TOKEN
    # Game code - what the Factory runs inside a game repository: the develop checks
    # (pnpm install, typecheck, lint, test, build, smoke), verify, the sdk conformance suite
    # and release packaging - was written by the developer agent and gets the same allowlist,
    # plus only what is named here. Deliberately separate from env_passthrough, so the agent
    # host's credential never reaches game code. A registry credential normally lives in
    # ~/.npmrc under HOME, which is passed; name one here only if the install step reads it
    # from the environment:
    game_env_passthrough: []
    # game_env_passthrough: [NPM_REGISTRY_TOKEN]

  # Where game repositories are checked out: <checkouts>/<repository name>, relative to
  # this repository's root (never the working directory). ONE directory for every step -
  # init clones there; assets, develop, review, sdk, verify and release work there. Each
  # step finds a title's checkout by one precedence (scripts/wgflib/checkout.py,
  # docs/checkouts.md): the step's `with: repo_dir` (alias `game_repo`), else
  # WGF_GAME_REPO, else the scaffold-record's repository.local_path (where init put it),
  # else this directory + the repository name. The per-module keys this replaces
  # (develop.checkouts, init.projects_dir, review.checkouts, sdk.games_dir,
  # verification.checkouts, release.checkouts) still work, as deprecated aliases read in
  # that order when this key is unset; any that disagree are warned about and ignored.
  # While a step works in a checkout it holds an advisory lock on it (in
  # <storage>/checkouts/): a second run reaching the same checkout is BLOCKED, naming the
  # first.
  checkouts: ..

  # Relative to the repository root, wherever `wgf` is run from. Run state is instance data,
  # never committed.
  storage:
    directory: .factory
    fsync: true                 # flush state.json to disk before the atomic rename

  # Python modules that register real step implementations: each exposes register(registry).
  # `--mock` replaces every implementation with its placeholder for that run.
  #   wgf_strategy   the `strategy` step (scripts/wgf_strategy/)
  #   wgf_release    the `release` step (scripts/wgf_release/, docs/release-module.md)
  #   wgf_visualqa   the `visual-qa` step (scripts/wgf_visualqa/, docs/visual-qa-module.md)
  #   wgf_sufficiency the `content-sufficiency` step (scripts/wgf_sufficiency/,
  #                  docs/content-sufficiency-module.md)
  #   wgf_quality    the `quality-gate` step (scripts/wgf_quality/,
  #                  docs/quality-gate-module.md)
  #   wgf_listing    the `store-listing` and `listing-validation` steps (scripts/wgf_listing/,
  #                  docs/store-listing-module.md)
  #   wgf_publish    the `platform-validate` and `publish` steps (scripts/wgf_publish/,
  #                  docs/publish-module.md)
  #   wgf_triage     the `triage` step: failures as quality findings, routed to the
  #                  specialist that owns them (scripts/wgf_triage/, docs/specialist-routing.md)
  steps:
    modules: [wgf_discovery, wgf_strategy, wgf_init, wgf_assets, wgf_develop, wgf_review, wgf_verification, wgf_design, wgf_sdk, wgf_techplan, wgf_release, wgf_playability, wgf_production, wgf_visualqa, wgf_sufficiency, wgf_quality, wgf_listing, wgf_publish, wgf_triage]

  # The strategy module (scripts/wgf_strategy): by default it ranks the opportunity's
  # candidate platforms by audience fit and makes the best one required. A project that has
  # decided its portals names them here (or a step's `with: {platforms: [...]}`), the first
  # required: the strategy targets exactly those that can carry the monetization, and G2
  # still approves it. Changing it on a title is a new strategy - wgf resume <run> --from
  # strategy - never an edit downstream (docs/platform-targets-2026-10.md).
  # `quality_tier` is what the strategy budgets content for: `release` (the default) commits
  # the units, groups and elements a published title carries - the larger of the genre
  # model's and core/reference/quality-benchmark.yaml's bars - and `mvp` only the
  # prototype's units, for a run meant to stop at G4 (docs/factory-lifecycle.md).
  # Every other key is strategy policy (wgf_strategy/planner.py Policy), e.g. max_platforms
  # (default 3) for a fourth target.
  # strategy:
  #   platforms: [yandex, crazygames, y8]
  #   quality_tier: release

  # The tech-plan module (scripts/wgf_techplan, docs/techplan-module.md): engine from the
  # design, pinned platforms from the strategy, a heuristic dev plan. Every key is optional.
  techplan:
    # template_ref: Cuvara/web-game-template@main   # default: factory.init.template @ main
    # overrun_tolerance: 1.5                        # default: portfolio.yaml
    # This installation's calibration (docs/handoff/2026-09-27-production-validation.md,
    # "Calibration"). The defaults (wgf_techplan/devplan.py) are an uncalibrated heuristic:
    # they put the Tower Merge Rush MVP at 87.5 h, where the live build new-game-20260927-
    # 044345-3c20a0 took 2.12 agent-hours (develop + review, from its events.jsonl). Rule,
    # fixed before the result: f = 4 x measured / heuristic (x4 for gate time, playtests and
    # rework the agent clock does not see) = 0.097, rounded to 0.1 and applied to every
    # hour constant; hours_per_day unchanged. One concept, one run: recalibrate as runs
    # accumulate, never to make a plan fit.
    estimates:
      hours_per_day: 6
      core_hours: 0.3
      feature_base_hours: 0.2
      per_criterion_hours: 0.15
      feature_max_hours: 1.2
      platform_base_hours: 0.3
      per_assertion_hours: 0.05
      qa_hours: 0.4
    # device_classes: [{id: mobile-mid, target_fps: 60}, {id: desktop, target_fps: 60}]
    # build: {command: pnpm build, output: dist}

  # The init module (scripts/wgf_init, docs/init-module.md): creates each game's repository
  # from the template with `gh`, clones it, and checks the template's infrastructure arrived.
  # With a tech-plan in the run it writes game.config.yaml (engine, platforms, ad kinds) and
  # commits it locally; it never pushes.
  init:
    # github: `gh repo create --template` (outward-facing). local: an independent project
    # made from a local template checkout with `git archive`, no remote and no network -
    # what offline and golden-regression runs use.
    source: github
    # template_path: ../web-game-template   # source local only: a git checkout of the template
    # template_ref: HEAD                    # source local only: the commit or ref to pin
    # commit_author: {name: wgf-init, email: wgf-init@users.noreply.invalid}
    owner: Cuvara                       # who owns game repositories
    template: Cuvara/web-game-template  # never a blank repository
    visibility: private                 # private | internal | public
    # The local clone goes to <factory.checkouts>/<title-id> (or the step's with: repo_dir,
    # or WGF_GAME_REPO), and its path is recorded in the scaffold-record for later steps.
    # Take over a repository or directory init did not create in this run. Leave false:
    # set it only to adopt a specific existing project, then set it back.
    adopt_existing: false
    populate_timeout_seconds: 60        # GitHub generates from a template asynchronously

  # The verification module (scripts/wgf_verification, docs/verification-module.md). It
  # verifies a local checkout (found as every step finds it: factory.checkouts above) and
  # never clones.
  # verification: {}

  # The release module (scripts/wgf_release, docs/release-module.md): drafts a release from a
  # verified commit with the game repository's own release:package / release:manifest, and
  # never pushes, tags or publishes. The checkout is found as every step finds it
  # (factory.checkouts above).
  # A step's `with:` overrides any key: release_id (default: the next r<n>, or the one this
  # commit already has), version (default: game.version), kind, timeouts. Two keys are read
  # from one place only: `required_gates` from the workflow's `with:` (default [G4]), and
  # `allow_unreviewed` from here.
  release:
    # Release refuses (`unreviewed`) unless the newest review-report approved exactly the
    # commit it ships - the sdk commit, which the workflow's sdk-review reads. With the
    # shipped `review.reviewer.kind: none` below, EVERY RELEASE IS REFUSED until a reviewer
    # is configured: that is the intended fail-closed default. `true` is an explicit,
    # recorded exception: a skipped or absent review is drafted anyway, and the manifest's
    # evidence.review says UNREVIEWED. It never waives a request for changes, an approval
    # of another commit, or G4.
    allow_unreviewed: false

  # The publish module (scripts/wgf_publish, docs/publish-module.md): the `publish` group
  # of the workflow - release:validating (platform-validate), G5, G6, release:submitting
  # (publish) - run in the drafting run by `wgf publish --run <run-id>`. Every key is
  # optional; a step's `with:` overrides any of them.
  publish:
    # dry-run (default): a person logs in, the game is looked up and its status read, and
    # the visit stops before its first change on the portal, saying what it would do; the
    # record says outcome DRY_RUN. live: the build is uploaded to the draft and saved -
    # only when the Factory's environment also has WGF_PUBLISH_LIVE=1, so production is
    # opted into twice - and the visit stops UPLOAD_COMPLETE; the review request runs only
    # in a later visit after a person's `wgf decide <run> submit`.
    mode: dry-run
    # A console is reached through a PERSON's live login: the submit step opens a headed
    # browser and waits (WAITING_FOR_HUMAN_LOGIN) until the person has logged in there, up
    # to this many seconds; then AUTH_REQUIRED, waiting, never a failure. No session is
    # captured, loaded or saved (publication profile 2.1.0, credential human-login).
    login_timeout_s: 900
    # A tool's token credential (submission.credential.kind token) the publish step may read
    # - a third allowlist beside factory.agents.env_passthrough and game_env_passthrough. No
    # shipped adapter uses one; a console never does.
    env_passthrough: []
    # Per platform. terms_confirmed: a person established, from the portal's own terms, that
    # automated use of its developer console is permitted (the publication profile says
    # `automation_terms: unverified` for every console portal shipped: until this is set,
    # the step stops HUMAN_REQUIRED before contacting it). adapter: another adapter for the
    # platform (tests point one at the fixture portal). console_url: override the profile's.
    platforms: {}
    # platforms:
    #   crazygames: {terms_confirmed: true}
    # More publication profiles (directories, relative to the project): a test's fixture.
    # profiles_extra: []
    # The console executor's timeouts, ms: action 5000, navigation 60000, upload from the
    # profile (upload_timeout_s) else 900000.
    # timeouts: {}
    # The bounded adaptive mode (docs/publish-module.md): when a REVERSIBLE intent of a
    # console flow drifts on a portal whose profile says `adaptive: allowed`, the resolver
    # below may propose one locator for the same intent, one overlay to dismiss or one path
    # on the console; the executor checks every proposal before it acts and writes what
    # worked to drift.json as a proposed profile change. Never an irreversible action, a
    # value, a declaration, or anything past a login. Off unless true here AND a resolver
    # is configured.
    adaptive: false
    # Lower the budget (never above 3 per intent, 10 per visit):
    # adaptive_bounds: {max_per_intent: 3, max_per_visit: 10}
    # The release role through the agent runner: kind none (default) or command. argv
    # placeholders {request} (the redacted drift request), {answer} (answer_from: file),
    # {schema} (the answer's JSON schema), {prompt}; answer_from: stdout (the last JSON
    # object it prints) or file. Its environment is the agents' allowlist plus
    # factory.agents.env_passthrough, never a WGF_PUBLISH_* or publish env_passthrough
    # variable. Give it no tools, no browser and no MCP server: it reads one file.
    resolver:
      kind: none
    # resolver:
    #   kind: command
    #   answer_from: stdout
    #   timeout_seconds: 180
    #   argv: [claude, -p, "{prompt}", --model, sonnet, --safe-mode, --strict-mcp-config,
    #          --tools, "Read", --allowedTools, "Read({request})"]

  # The assets step (scripts/wgf_assets). Every key is optional; a step's `with:` block
  # overrides any of them. See docs/assets-module.md.
  assets:
    # The game repository checkout assets are written into, under public/assets/.
    # Default: the run's checkout (factory.checkouts above, via the scaffold-record), so
    # the files land where develop builds and commits them, and the develop brief lists
    # each file's path. Without a scaffold-record, or before the checkout exists:
    # .factory/assets/<title-id> under this repository's root - git-ignored scratch.
    # root: ../my-game
    # Where a requirement's file comes from, in order (docs/assets-module.md): a library,
    # the author, the 3D model author (wgf_assets.model_author, when installed), a
    # placeholder. Every delivered file is judged against core/reference/asset-quality.yaml.
    #
    # Directories (relative to the project) holding an index.json of reusable, licensed
    # assets and/or a library.json mapping requirement ids and roles to licensed files -
    # how golden fixtures and purchased packs supply real art.
    libraries: []
    # Producers of final assets from the design itself, tried after libraries and authors
    # and before placeholders: `fonts` (the typography's faces from the Factory font library,
    # workspace/library/fonts - OFL, pre-built WOFF2) and `audio` (music composed from the
    # design's audio direction, encoded Ogg Vorbis; sound effects as WAV - ~1-2 min per
    # design). Off by default; the autonomous profile turns both on.
    producers: []
    # Who draws a 2D requirement as SVG: kind none (default: what no library supplies is a
    # placeholder) or command - an agent host run through wgflib.procs with the agent
    # environment. mode asset (default): once per drawing; argv placeholders {request} (the
    # request JSON: the requirement, palette, visual identity, art direction, quality bars,
    # repair problems, re-entry findings), {output} (where to write the SVG), {prompt};
    # svg_from: file (it writes {output}) or stdout (it prints the SVG last; the Factory
    # writes {output}). mode set: ONE session draws every 2D requirement of the design as one
    # set (wgf_assets/set_author.py); argv placeholders {request} (the set brief), {out} (the
    # only directory it writes), {preview} (the only command it runs: the Factory's judge and
    # contact-sheet render, wgf_assets/preview.py), {sheet}, {prompt}. A rejected file (asset)
    # or set (set) is shown its problems and asked again, repair_rounds times; then the
    # requirement is a placeholder.
    author:
      kind: none
    # The 2D set author on Claude Code's headless mode (mode: set). Checked against CLI
    # 2.1.280 - the permission rules by a real call: an Edit rule scopes every file-writing
    # tool (Write included) to {out} ({out_rule}: `//` and the POSIX form, so it is absolute
    # on Windows too), and the Bash rule allows
    # exactly the preview command and nothing else - and run on a live design's 2D
    # requirements (docs/assets-module.md, "The set author").
    #   --safe-mode                 no hooks, plugins, MCP servers or CLAUDE.md
    #   --tools                     Read (the brief, the craft, the contact sheet), Write and
    #                               Edit (only under {out}), Bash (only {preview})
    #   --permission-mode dontAsk   nothing is ever prompted; what no rule allows is refused
    #   --output-format text        prints only at exit, so no idle timeout
    #   --max-budget-usd            the host's own bound on ONE session (the whole set);
    #                               repair_rounds adds at most one more session each
    # author:
    #   kind: command
    #   mode: set
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --safe-mode
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read,Write,Edit,Bash"
    #     - --allowedTools
    #     - "Read"
    #     - "Edit({out_rule}/**)"
    #     - "Bash({preview})"
    #     - --disallowedTools
    #     - "NotebookEdit,WebFetch,WebSearch"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - text
    #     - --max-turns
    #     - "150"
    #     - --max-budget-usd
    #     - "6"
    #   timeout_seconds: 2700
    #   idle_timeout_seconds: null
    #   repair_rounds: 1
    # The per-asset author (mode: asset) the set mode replaced in the autonomous profile:
    # read-only, it prints one SVG per drawing (svg_from: stdout). 95-125 s a drawing on a
    # real design, each accepted on its first round (docs/claude-capabilities.md, "The asset
    # authors"); it never sees the other drawings or a render of its own.
    # author:   (mode: asset)
    #   kind: command
    #   svg_from: stdout
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --safe-mode
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read"
    #     - --allowedTools
    #     - "Read"
    #     - --disallowedTools
    #     - "Edit,Write,NotebookEdit,Bash,WebFetch,WebSearch"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - text
    #     - --max-turns
    #     - "15"
    #     - --max-budget-usd
    #     - "1"
    #   timeout_seconds: 600
    #   idle_timeout_seconds: null
    #   repair_rounds: 2
    # The 3D model author (scripts/wgf_assets/model_author.py, docs/blender-pipeline.md):
    # kind none, or command - an agent host that writes MODEL SPECS, built by the pinned
    # Blender, judged (parts, normals, palette, primitive_only, silhouette) and RENDERED
    # (contact sheets from the design's camera and at gameplay size): repair rounds show the
    # problems and the renders, review_rounds ask it to open the renders and revise what does
    # not read. mode: each (a session per requirement) or set (one session for every 3D
    # requirement: one palette, material language and detail level, plus a set render).
    # Only a configured author is asked; without one, a design's own model spec is built by
    # Blender, else the requirement is a placeholder. argv placeholders: {request}, {spec}
    # (each mode: where to write the spec), {dir} (the session's directory; set mode writes
    # {dir}/specs/<id>.model.json), {prompt}; spec_from: file (it writes the specs; on a
    # repair or review they hold the previous ones, edited in place) or stdout (each: the
    # spec JSON last; set: {"models": {...}} last). Blender 4.5 LTS must be on PATH or in
    # WGF_BLENDER, or the author is refused.
    model_author:
      kind: none
    # The set author on Claude Code's headless mode: it reads the request, the schema, the
    # craft playbooks and the renders, and writes spec files under its session directory
    # only - an Edit rule on {dir_rule} ({dir} as `//` and the POSIX form, absolute on every
    # host OS) governs every file-editing tool
    # (verified with a real claude -p call: a write inside was allowed, one outside refused;
    # a Write(...) rule is ignored by the host). Run on the space-dodge design with the
    # pinned Blender (docs/blender-pipeline.md, "Set mode"). Each repair or review round is
    # one more call. A read-only per-model author is the same argv with mode: each,
    # spec_from: stdout and --tools/--allowedTools "Read".
    # model_author:
    #   kind: command
    #   mode: set
    #   spec_from: file
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --safe-mode
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read,Write,Edit"
    #     - --allowedTools
    #     - "Read,Edit({dir_rule}/**)"
    #     - --disallowedTools
    #     - "NotebookEdit,Bash,WebFetch,WebSearch"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - text
    #     - --max-turns
    #     - "80"
    #     - --max-budget-usd
    #     - "3"
    #   timeout_seconds: 1800
    #   idle_timeout_seconds: null
    #   max_repair_rounds: 2
    #   review_rounds: 1
    placeholders:
      enabled: true
      # Tried in order; the procedural backend is always last and always works. An
      # unconfigured or unreachable 2d-assets-mcp is recorded on the manifest and skipped.
      backends: [2d-assets-mcp, procedural]
      # 2d-assets-mcp:
      #   command: [npx, -y, 2d-assets-mcp]
      #   tool: generate_sprite
      #   license: CC0-1.0        # only if the server's terms grant it; else unknown
      # Blender builds 3D requirements that carry a `model` spec (docs/blender-pipeline.md).
      # It joins the order by itself when a design has one; this block only tunes it.
      # blender:
      #   executable: blender     # else $WGF_BLENDER, else `blender` on PATH; 4.5 LTS pinned
      #   timeout_seconds: 300
      #   allow_unpinned: false   # true: build with another series, recorded pinned: false
      #   required: false         # true: a spec Blender could not build is an error
    optimize: true              # lossless, and only on files the step writes
    fail_on: []                 # issue codes that fail the step, e.g. [license-restricted]

  # The development module (scripts/wgf_develop, docs/development-module.md). Who writes
  # the game in the checkout (factory.checkouts above), and what must pass before a visit is
  # committed. The module never clones, pushes or creates a repository.
  develop:
    developer:
      kind: handoff             # handoff: brief, wait for --decision done | command: run argv unattended
      argv: []                  # command only: {brief} {repo} {key} {prompt} are substituted
      timeout_seconds: 5400
    # Unattended developer on Claude Code's headless mode. Checked against CLI 2.1.281 and
    # run live through the real develop step (docs/claude-capabilities.md). The Factory
    # enforces the timeouts, the process tree and the keyed commit; everything in argv is
    # the agent host's own restriction, not the Factory's.
    #   --setting-sources project   ignore the operator's personal settings, whose allow
    #                               rules would widen what is below
    #   --tools                     the only tools that exist in the session
    #   --allowedTools              what runs without a prompt: Edit/Write only inside the
    #                               checkout (the cwd), Bash only for pnpm, node, read-only git
    #                               and the read-only ls/head/tail/grep/wc a session pipes
    #                               output through (docs/claude-capabilities.md: each is
    #                               justified there; nothing commits, pushes or resets)
    #   --disallowedTools          git that moves history, refs or config, and the network
    #                               tools; deny wins over allow. The Factory commits, not the agent
    #   --permission-mode dontAsk   anything not pre-approved is refused, never prompted
    #   stream-json --verbose       output while it works, so idle_timeout_seconds catches a
    #                               hung agent, not a quiet one (text mode prints only at exit)
    #   --max-turns/--max-budget-usd  the host's own bound, under the Factory's timeouts. Sized
    #                               so they do not cut a build short of timeout_seconds: on the
    #                               v1 acceptance run a from-scratch build took 200 turns in
    #                               26-44 min for US$10-15, and 200 ended two attempts half-way
    # `pnpm *` also admits `pnpm exec` and `pnpm dlx`: arbitrary code in the checkout. The
    # Factory's own side of that boundary (docs/development-module.md): the developer gets
    # the allowlisted environment above (factory.agents.env_passthrough); the Factory's
    # guarded paths (factory.review.guarded_paths) are fingerprinted around it and its
    # checks, and a change is undone and fails the step; the Factory's git names the git
    # directory it resolved before the developer ran and runs no hook, fsmonitor, signer or
    # filter the checkout's config names; and only writable_paths are committed. Anything
    # else outside the checkout - $HOME, the network - is not watched: wrap the argv in an
    # OS sandbox if the developer must not reach them.
    # developer:
    #   kind: command
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --setting-sources
    #     - project
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read,Edit,Write,Glob,Grep,Bash"
    #     - --allowedTools
    #     - "Read,Glob,Grep,Edit(./**),Write(./**),Bash(pnpm *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(ls *),Bash(head *),Bash(tail *),Bash(grep *),Bash(wc *),Bash(node *),Bash(git clean -f -- src/*),Bash(git clean -f -- tests/*),Bash(git clean -f -- public/*)"
    #     - --disallowedTools
    #     - "WebFetch,WebSearch,Bash(git commit *),Bash(git push *),Bash(git reset *),Bash(git checkout *),Bash(git switch *),Bash(git rebase *),Bash(git stash *),Bash(git tag *),Bash(git branch *),Bash(git config *),Bash(git remote *),Bash(git * --output*)"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - stream-json
    #     - --verbose
    #     - --max-turns
    #     - "400"
    #     - --max-budget-usd
    #     - "40"
    #   timeout_seconds: 5400
    #   idle_timeout_seconds: 900
    #
    # --- opt-in: self-playtest ---------------------------------------------------------------
    # The same developer, able to play its own build: a Playwright MCP browser limited to the
    # local preview (workspace/config/mcp-playwright-localhost.json: localhost origins only,
    # headless, isolated profile, pinned version), and this Factory's plugin for the craft
    # skills (game-feel, core-loop, web-performance, ...). self_playtest adds a "Playtest your
    # build" section to the brief. {factory} is the Factory root: the developer's cwd is the
    # checkout, and these files live in the guarded Factory tree, outside anything it may edit.
    #   --strict-mcp-config         still set: only the one listed MCP config loads
    #   Skill, mcp__playwright      the only additions to what runs without a prompt
    # The browser is origin-limited; the developer process itself is not network-guarded
    # (pnpm needs the registry). Flags checked against CLI 2.1.282 and @playwright/mcp 0.0.82;
    # not yet run live (docs/claude-capabilities.md). The developer's environment is
    # allowlisted (factory.agents.env_passthrough): the host's credential must be named
    # there, or the session cannot authenticate. The MCP config writes the browser's
    # snapshots under /tmp (--output-dir), never into the checkout, whose hidden paths the
    # development commit refuses.
    # self_playtest: true
    # developer:
    #   kind: command
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --setting-sources
    #     - project
    #     - --strict-mcp-config
    #     - --mcp-config
    #     - "{factory}/workspace/config/mcp-playwright-localhost.json"
    #     - --plugin-dir
    #     - "{factory}/claude-web-game-plugin"
    #     - --tools
    #     - "Read,Edit,Write,Glob,Grep,Bash,Skill"
    #     - --allowedTools
    #     - "Read,Glob,Grep,Edit(./**),Write(./**),Bash(pnpm *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(ls *),Bash(head *),Bash(tail *),Bash(grep *),Bash(wc *),Bash(node *),Skill,mcp__playwright"
    #     - --disallowedTools
    #     - "WebFetch,WebSearch,Bash(git commit *),Bash(git push *),Bash(git reset *),Bash(git checkout *),Bash(git switch *),Bash(git rebase *),Bash(git stash *),Bash(git tag *),Bash(git branch *),Bash(git config *),Bash(git remote *),Bash(git * --output*)"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - stream-json
    #     - --verbose
    #     - --max-turns
    #     - "400"
    #     - --max-budget-usd
    #     - "40"
    #   timeout_seconds: 5400
    #   idle_timeout_seconds: 900
    checks: [install, conformance, typecheck, lint, unit, build, smoke]
    check_timeout_seconds: 900
    commit: true                # one local commit per visit, keyed by the idempotency key
    build_url: null             # e.g. "https://{branch}.{name}.pages.dev"; default links the commit
    # Host skills the brief recommends, merged over the module's defaults
    # (scripts/wgf_develop/brief.py DEFAULT_SKILLS): this Factory's plugin skills -
    # web-game-factory:game-feel, core-loop, web-performance, audio, onboarding-ux, and the
    # engine's pixijs/threejs - plus generic ones. Add an area, or set one to [] to drop it.
    # skills:
    #   craft: [web-game-factory:game-feel, web-game-factory:core-loop]
    # What the development commit may contain (scripts/wgf_develop/scope.py). A directory
    # ends in /. Any other change left in the tree fails the step, not retryably; a hidden
    # path (.claude/, .github/, .husky/, .env) or an agent instruction file (CLAUDE.md,
    # AGENTS.md) is refused whatever this says. docs/GDD.md is the one Factory-rendered
    # exception: the step writes it from the game-design artifact after the developer.
    # writable_paths: [src/, tests/, public/, docs/development/, index.html]
    # package.json and pnpm-lock.yaml are template-owned except for these dependency
    # changes (add | change | remove), each a registry version range; the lockfile may
    # change only together with one. Every other field - scripts above all - must stay.
    # allowed_package_changes: {dependencies: [add], devDependencies: [add]}
    # git:
    #   allow_filters: false    # true only for a repository that commits through its own
    #                           # filters (git-lfs); a filter changed after the Factory
    #                           # pinned the repository is then refused, never run
    # The run's budget for command-developer sessions (docs/development-module.md#budget).
    # Loop limits (the workflow's max_visits_by_route) are refilled by a person resuming the
    # loop they stopped; this is not.
    # It is a CAP: the tech plan derives what the run needs from the tasks its quality tier
    # builds before G4 (tech-plan dev_plan.develop_budget, core/reference/
    # quality-benchmark.yaml `develop`) and the lower of the two is in force. A cap below the
    # plan's need is recorded in the tech plan as a planned shortfall, which G3 reads.
    # Counted from the run's event log; develop BLOCKS - nothing spawned - once the
    # sessions recorded reach max_sessions, or their recorded cost reaches max_cost.
    # Snapshotted when a run starts; raised only by a person: wgf resume <run>
    # --budget-sessions N | --budget-cost X. Absent: no budget, and a command developer is
    # never started (BLOCKED); a run started without one adopts the one set here at its
    # next resume by a person (BUDGET_ADOPTED). A handoff developer is a person and is
    # never counted. A session whose cost cannot be read is counted as a
    # session and reported as unknown: the host's own per-session flag (--max-budget-usd
    # above) stays the bound on any one session.
    # budget:
    #   max_sessions: 12
    #   max_cost: 60              # in the unit the host reports: US$ for the example above
    #   cost_from:
    #     jsonl_key: total_cost_usd   # stream-json's closing `result` line carries it; a
    #                                 # session ended by a timeout writes none (unknown)

  # The review module (scripts/wgf_review, docs/review-module.md): an independent reviewer
  # reads each development commit - and, as sdk-review, the sdk integration commit on top,
  # which is what ships - and approves it or requests changes, which the workflow routes
  # back to develop. The reviewer is read-only - the checkout is fingerprinted before and
  # after, and any change fails the review and is undone. `none` records a skipped review,
  # never an approval, and release then refuses the build (`unreviewed`) unless
  # release.allow_unreviewed is true: configure a reviewer before expecting a release.
  review:
    reviewer:
      kind: none                # none | command: run argv unattended, read-only
      argv: []                  # command only: {repo} {verdict} {brief} {commit} {prompt}
      timeout_seconds: 1800
      idle_timeout_seconds: 600 # no output for this long ends the reviewer's process tree
      verdict_from: file        # file: it writes {verdict} | stdout: it prints the JSON last
      repair_rounds: 2          # malformed verdict -> judge repairs it (0-10, 0 = none)
    # Read-only reviewer on Claude Code's headless mode. Checked against CLI 2.1.281 and run
    # live through the real review step (docs/claude-capabilities.md). Two independent
    # layers: the host refuses writes (below), and the Factory fingerprints the checkout and
    # guarded_paths before and after, failing and undoing any review that changed anything.
    #   --safe-mode                 no hooks, plugins, MCP servers or CLAUDE.md: nothing the
    #                               developer committed (a .claude/settings.json hook, a
    #                               CLAUDE.md) runs in or instructs the reviewer
    #   --tools Read,Glob,Grep,Bash Edit, Write and NotebookEdit do not exist in the session
    #   --allowedTools              reads, and git diff/log/show only
    #   --disallowedTools           `git ... --output=<file>` is the one read-only git write
    #   --permission-mode dontAsk   every other command (echo >, sed -i, touch, git commit) is
    #                               refused without a prompt
    #   --output-format text        verdict_from: stdout takes the last JSON object printed;
    #                               json/stream-json would wrap it and fail as malformed.
    #                               Text prints only at exit, so no idle timeout: rely on
    #                               timeout_seconds
    # reviewer:
    #   kind: command
    #   verdict_from: stdout
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --safe-mode
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read,Glob,Grep,Bash"
    #     - --allowedTools
    #     - "Read,Glob,Grep,Bash(git diff *),Bash(git log *),Bash(git show *)"
    #     - --disallowedTools
    #     - "Edit,Write,NotebookEdit,WebFetch,WebSearch,Bash(git * --output*),Bash(git *--output=*)"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - text
    #     - --max-turns
    #     - "60"
    #     - --max-budget-usd
    #     - "5"
    #   timeout_seconds: 1800
    #   idle_timeout_seconds: null
    # The Factory's own code, gates, contracts and this config: what decides what a review,
    # and every later check, is worth. Fingerprinted around the reviewer AND around the
    # develop step's developer and checks (scripts/wgflib/isolation.py). Keep at least the
    # default (wgflib.isolation.DEFAULT_GUARDED_PATHS); a narrower list lets an agent rewrite
    # its judge. claude-web-game-plugin is here because the opt-in self-playtest developer
    # loads its skills (--plugin-dir): instructions an agent must not be able to rewrite.
    guarded_paths: [core, scripts, bin, workspace/config, claude-web-game-plugin]

  # The store listing module (scripts/wgf_listing, docs/store-listing-module.md): after G4
  # passes, the verified build is served locally and played through its play probe in the
  # game's own Playwright Chromium; screenshots, a gameplay recording (trimmed with the
  # browser's bundled ffmpeg when it is there), branding composed from the game's own assets
  # and identity, store copy grounded in the design, and one rendition per targeted platform
  # under its profile's `store_listing` block (core/reference/store-listing.yaml). Every key
  # is optional; a step's `with:` block overrides any of them.
  listing:
    # reference: core/reference/store-listing.yaml   # the canonical package and its bars
    # platforms: null            # default: the scaffold-record's game.config platforms
    # locales: null              # default: en plus every targeted platform's required locales
    # copy_dir: workspace/titles/{title_id}/listing-copy
    #                            # a person's own copy, <locale>.json each: used instead of the
    #                            # writer for that locale, and grounded like any other text
    capture:
      kind: browser              # browser | none. `none` BLOCKS the step: a listing without
                                 # screenshots of the running build is never a silent pass
      node: node                 # the Node executable the capture script runs on
      timeout_seconds: 900       # one capture attempt, wall clock
      trailer: true              # record the gameplay trailer
      # viewports: [{id: landscape, width: 1920, height: 1080}, {id: portrait, width: 1080, height: 1920, mobile: true}]
    # Who writes the store copy. auto (default): the run tier's writer
    # (core/reference/store-listing.yaml `writer`) - the copywriter agent (command) at the
    # release tier, the template for development runs. template: the Factory's own
    # deterministic writer, from the design's facts and the game's own strings - English,
    # plus any locale whose strings the bundle ships; it never translates. command: an agent
    # host run read-only once per locale with {brief} {output} {prompt} placeholders,
    # briefed as the copywriter with the build's measured counts, every input it accepts and,
    # re-entered through triage, the store-copy findings; its texts go through the same
    # grounding check (refused and asked again once, then the template writer's text stands
    # in and the listing says so). At the release tier with no argv here the template writes
    # and listing-validation blocks for a person (metadata.writer): configure the agent below
    # (the autonomous profile does) or supply the copy (copy_dir).
    writer:
      kind: auto                 # auto | template | command
      argv: []
      timeout_seconds: 600
      idle_timeout_seconds: null
      text_from: file            # file: the writer writes {output} | stdout: prints the JSON last
    # Read-only writer on Claude Code's headless mode, the same flags as the visual-QA judge
    # (docs/claude-capabilities.md). Not yet run live.
    # writer:
    #   kind: command
    #   text_from: stdout
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --safe-mode
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read"
    #     - --allowedTools
    #     - "Read"
    #     - --disallowedTools
    #     - "Edit,Write,NotebookEdit,Bash,WebFetch,WebSearch"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - text
    #     - --max-turns
    #     - "10"
    #     - --max-budget-usd
    #     - "1"
    #   timeout_seconds: 600
    # An age rating a platform requires (yandex: `age_rating.required`): nothing in the run
    # states one, so the installation does, per platform id or `default`. Without it the
    # platform's rendition fails validation, which blocks for a person.
    # age_rating: {default: "12+"}

  # The visual QA module (scripts/wgf_visualqa, docs/visual-qa-module.md): a vision judge
  # reads every frame playability captured of the production build - each state, desktop
  # and mobile - against core/reference/visual-qa-rubric.yaml, the design's visual identity
  # and the asset roles, and returns scores and findings; the step decides PASS or FAIL
  # (any blocker, or a dimension below the rubric's pass bar) and routes a failure to
  # `assets` or `develop`. `none` BLOCKS the step: visual QA needs a judge, and is never a
  # silent pass. The judge gets copies of the frames in a directory under the run, the
  # allowlisted environment (factory.agents.env_passthrough), and the Factory's guarded paths
  # are fingerprinted around it. A malformed verdict goes back to the judge with its own
  # reply and every error (repair_rounds), then once more from scratch, then fails.
  visualqa:
    judge:
      kind: none                # none | command: run argv unattended, read-only
      argv: []                  # command only: {frames_dir} {brief} {verdict} {prompt}
      timeout_seconds: 900
      idle_timeout_seconds: null
      verdict_from: file        # file: it writes {verdict} | stdout: it prints the JSON last
    # rubric: core/reference/visual-qa-rubric.yaml   # the default
    # Read-only judge on Claude Code's headless mode, able to read images and nothing else.
    # Checked against CLI 2.1.280 and run on real frames (docs/visual-qa-module.md,
    # "Calibration"). Its working directory is the step's scratch directory holding only the
    # brief and the frames.
    #   --safe-mode                 no hooks, plugins, MCP servers or CLAUDE.md
    #   --tools Read                the one tool that exists in the session: it reads the
    #                               brief and the PNG frames (images are read as images)
    #   --allowedTools Read         reads run without a prompt; everything else is refused
    #   --permission-mode dontAsk   nothing is ever prompted
    #   --output-format text        verdict_from: stdout takes the last JSON object printed
    #   --max-budget-usd            the host's own bound on one judgement. The calibration
    #                               runs read 14-16 frames in one session in 80-215 s each
    #                               (text output reports no cost; the cap was never reached)
    # judge:
    #   kind: command
    #   verdict_from: stdout
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --safe-mode
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read"
    #     - --allowedTools
    #     - "Read"
    #     - --disallowedTools
    #     - "Edit,Write,NotebookEdit,Bash,WebFetch,WebSearch"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - text
    #     - --max-turns
    #     - "40"
    #     - --max-budget-usd
    #     - "2"
    #   timeout_seconds: 900
    #   idle_timeout_seconds: null

  # The discovery module (scripts/wgf_discovery) implements `research`. Every key is
  # optional; see scripts/wgf_discovery/step.py. Evidence snapshots live in
  # workspace/research/snapshots/; live probes are off unless `live: true`.
  # discovery:
  #   platforms: [crazygames, gamevui, poki, yandex]
  #   live: false
  # The platform integration module (scripts/wgf_sdk, the `sdk` step). Every key is optional
  # and may be overridden per workflow step under `with:`.
  # The design module's author: who writes the creative draft before the module checks it.
  # `archetype` is built in (offline, deterministic): a hand-coded archetype when the catalog
  # names one, else the genre seed (`genre-seed`, scripts/wgf_design/seed.py) synthesized from
  # the family's `seed` in core/reference/genre-models.yaml. `agent` (scripts/wgf_design/
  # agent.py) runs an agent host that designs the game - its content units, difficulty on the
  # family's axes, win and loss, mastery - from that draft; the module then applies exactly
  # the same buildability, consistency and content checks to it. A design returned through
  # `design-gap` is repaired only by the `agent` author. {request} {draft} {prompt} are
  # substituted. Opt-in; uncomment and set `author: agent` to use it.
  # At `strategy.quality_tier: release` (the default) the design is held to the quality
  # benchmark's content bars (content.tier_*, docs/factory-lifecycle.md). The built-in
  # `archetype` author writes MVP-sized content and fails there, naming what is short: a
  # release-tier run needs `author: agent`, and a run with the built-in author sets
  # `strategy.quality_tier: mvp`.
  design:
    author: archetype
    # agent:
    #   draft_from: file           # edits {draft} in place; stdout overflows a host's reply
    #   argv:
    #     - claude
    #     - -p
    #     - "{prompt}"
    #     - --model
    #     - sonnet
    #     - --safe-mode
    #     - --strict-mcp-config
    #     - --tools
    #     - "Read,Glob,Grep,Edit"
    #     - --allowedTools
    #     - "Read,Glob,Grep,Edit({draft_rule})"
    #     - --disallowedTools
    #     - "Write,NotebookEdit,Bash,WebFetch,WebSearch"
    #     - --permission-mode
    #     - dontAsk
    #     - --no-session-persistence
    #     - --output-format
    #     - text
    #     - --max-turns
    #     - "80"
    #     - --max-budget-usd
    #     - "8"
    #   timeout_seconds: 1800
    #   idle_timeout_seconds: null

  # The SDK module (scripts/wgf_sdk, the `sdk` step): integrates the template's platform SDK
  # into the game, then verifies it with the game repository's conformance suite. It runs
  # tests against mocked portal SDKs; it never publishes. See docs/platform-architecture.md
  # and docs/platform-sdk-verification.md.
  sdk:
    # The game repository is found as every step finds it (factory.checkouts above); with
    # none there the step blocks ("platform not configured").
    browser: false              # also run the PixiJS/Three.js browser smoke
    # A portal that publishes no SDK runs on another adapter - explicitly, so a missing
    # adapter anywhere else still fails at boot. GameVui has no SDK, JavaScript API or
    # publishing API (web-game-template docs/platforms/gamevui/platform-contract.md).
    adapter_substitutes: {gamevui: generic-web}
    # Portals that want an ad opportunity each time the player heads back into gameplay -
    # restart, continue, leaving the pause menu - not only where the design placed one.
    # Poki: "Not every call triggers an ad ... signal as many opportunities as possible";
    # commercialBreak "only when exiting a pause and heading back into gameplay"
    # (developers.poki.com/guide/sdk-overview, /guide/requirements-quality).
    break_on_continue: [poki]
    # Moments at which a portal forbids an interstitial. CrazyGames: "Do not show a midgame
    # ad on a navigational button (e.g. ... opening the settings)"
    # (docs.crazygames.com/requirements/ads).
    interstitial_forbidden_moments: {crazygames: [pause-menu]}

  # Checkpoint gates this installation lets a run approve without a person. Only reversible
  # gates are honoured; G4, G6 and G7 are refused whatever is listed here. `--mock` runs
  # approve every reversible gate unless --hold-gates is given.
  # The lifecycle bridge (docs/factory-lifecycle.md): with sync on, each gate decision a run
  # makes is appended to workspace/titles/<id>/decisions/ and moves the title's cursor through
  # wgf-state.py's guards and gate rules (a refused move is a warning, never the run's
  # outcome). Only for a run whose --project title already has a state.json; never a --mock
  # run. A run keeps the setting it started with.
  lifecycle:
    sync: false
    # titles_directory: workspace/titles

  checkpoints:
    auto_approve: []
    # Reversible gates that approve themselves once they have waited this long (<n>s|m|h|d
    # or seconds). Applied only by `wgf resume` (run it on a schedule for unattended
    # approval); `wgf status` / `wgf runs --waiting` only report eligibility. Listing G4,
    # G6, G7 or a gate gates.yaml does not define refuses every run. Snapshotted per run.
    # timeout_auto_approve: {G2: 48h, G3: 48h}
    timeout_auto_approve: {}
