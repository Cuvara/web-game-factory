# Web Game Factory — Adapter binding manifest
#
# The provider-independent statement of WHAT an AI adapter must cover. Never HOW to phrase
# it — nothing here names a specific AI system or runtime concept.
#
# Why this file exists: adapter files are hand-written markdown pointing into core. That is
# the right shape (a generator would produce committed files that get hand-edited under
# pressure and silently diverge from their source), but textual references alone cannot
# tell you that an adapter never covered `title:architecture`. This manifest supplies
# exactly that missing bit, in one file.
#
# The contract for adapter authors:
#
#   An adapter file's body is "read these core paths, then follow them."
#   An adapter file that restates a schema, a procedure, or a contract is a BUG.
#   Core is authoritative; on conflict, report it rather than resolving it.
#
# Each adapter carries a CONFORMANCE.md mapping every surface id below to its file, so
# reviewing adapter completeness is a two-file diff rather than a directory crawl.

version: 1.2.0

surface_kinds:
  agent: A persistent role the runtime can delegate to.
  command: A user-initiated action, typically a lifecycle transition or a gate.
  skill: Reference capability loaded on demand, not a role and not an action.

# ---------------------------------------------------------------------------
# Roles → agent surfaces. One per non-human role in core/roles/roles.yaml.
# ---------------------------------------------------------------------------
agents:
  - id: research
    role: research
    owns: [portfolio:market-scan, portfolio:discovered]
    must_read:
      - core/roles/research.md
      - core/lifecycle/stages/market-scan.md
      - core/artifacts/shared/claim.schema.json
      - core/artifacts/opportunity.schema.json
      - core/artifacts/research-report.schema.json
      - core/reference/dimensions.yaml
      - core/craft/competitive-teardown.md
    produces: [claim, opportunity, research-report]
    consumes: []

  - id: analysis
    role: analysis
    owns: [portfolio:scored, portfolio:shortlisted, portfolio:approved, title:concept]
    must_read:
      - core/roles/analysis.md
      - core/lifecycle/stages/score-opportunity.md
      - core/lifecycle/stages/opportunity-selection.md
      - core/artifacts/evaluation.schema.json
      - core/artifacts/shared/scoring-model.schema.json
      - core/reference/scoring/portfolio-default.v1.yaml
    produces: [evaluation]
    consumes: [claim, opportunity]

  - id: game-designer
    role: game-designer
    owns: [title:strategy, title:design]
    must_read:
      - core/roles/game-designer.md
      - core/lifecycle/stages/strategy.md
      - core/lifecycle/stages/design.md
      - core/artifacts/title-strategy.schema.json
      - core/artifacts/game-design.schema.json
      - core/reference/design-consistency-rules.yaml
      - core/templates/gdd.md
      - core/craft/core-loop-and-difficulty.md
      - core/craft/onboarding-and-portal-ux.md
      - core/craft/art-direction.md
    produces: [title-strategy, game-design]
    consumes: [opportunity, evaluation, claim]

  - id: architect
    role: architect
    owns: [title:tech-plan]
    # A contributor to title:prototype (title.machine.yaml): the independent, read-only
    # review of each development commit. Never the implementer that wrote the commit.
    works_in: [title:prototype]
    must_read:
      - core/roles/architect.md
      - core/lifecycle/stages/tech-plan.md
      - core/artifacts/tech-plan.schema.json
      - core/templates/tech-plan.md
      - core/lifecycle/stages/prototype.md
      - core/artifacts/review-report.schema.json
      - core/craft/web-performance.md
      - core/craft/gameplay-review.md
    produces: [tech-plan, review-report]
    consumes: [game-design, title-strategy, asset-manifest, prototype-report]

  - id: qa
    role: qa
    owns: [release:qa]
    must_read:
      - core/roles/qa.md
      - core/lifecycle/stages/qa.md
      - core/artifacts/qa-report.schema.json
      - core/artifacts/verification-report.schema.json
      - core/artifacts/shared/gameplay-session.schema.json
      - core/templates/qa-report.md
      - core/craft/playtesting.md
      - core/craft/web-performance.md
      - core/craft/accessibility.md
    produces: [verification-report, qa-report]
    consumes: [release-manifest, game-design, tech-plan, scaffold-record, asset-manifest, sdk-report]

  - id: release
    role: release
    owns:
      - title:scaffolding
      - release:draft
      - release:rc
      - release:validating
      - release:submitting
    must_read:
      - core/roles/release.md
      - core/lifecycle/stages/scaffolding.md
      - core/lifecycle/stages/release-draft.md
      - core/lifecycle/stages/release-candidate.md
      - core/lifecycle/stages/platform-validation.md
      - core/lifecycle/stages/publish.md
      - core/artifacts/release-manifest.schema.json
      - core/artifacts/platform-publication.schema.json
      - core/artifacts/review-report.schema.json
      - core/reference/platforms/
      - core/templates/release-report.md
      - core/craft/onboarding-and-portal-ux.md
    produces: [scaffold-record, release-manifest, platform-publication]
    consumes: [tech-plan, qa-report, verification-report, sdk-report, prototype-report, review-report, scaffold-record]

  - id: liveops
    role: liveops
    owns: [title:live]
    must_read:
      - core/roles/liveops.md
      - core/lifecycle/stages/live.md
      - core/lifecycle/stages/performance-review.md
      - core/lifecycle/stages/campaign.md
      - core/artifacts/performance-review.schema.json
    produces: [performance-review, claim]
    consumes: [release-manifest, platform-publication]

  - id: gameplay
    role: gameplay
    works_in: [title:prototype, title:production]
    must_read:
      - core/roles/implementers.md
      - core/lifecycle/stages/prototype.md
      - core/lifecycle/stages/production.md
      - core/artifacts/prototype-report.schema.json
      - core/artifacts/review-report.schema.json
      - core/artifacts/game-design.schema.json
      - core/craft/game-feel.md
      - core/craft/core-loop-and-difficulty.md
    produces: [prototype-report]
    consumes: [tech-plan, game-design, review-report, qa-report]

  - id: ui
    role: ui
    works_in: [title:prototype, title:production]
    must_read:
      - core/roles/implementers.md
      - core/lifecycle/stages/production.md
      - core/lifecycle/stages/prototype.md
      - core/artifacts/game-design.schema.json
      - core/craft/onboarding-and-portal-ux.md
      - core/craft/ui-hud-mobile.md
      - core/craft/accessibility.md
      - core/craft/game-feel.md
    produces: []
    consumes: [game-design, tech-plan]

  - id: asset
    role: asset
    works_in: [title:design, title:tech-plan, title:prototype, title:production]
    must_read:
      - core/roles/implementers.md
      - core/artifacts/asset-manifest.schema.json
      - core/reference/asset-policy.yaml
      - core/craft/art-direction.md
      - core/craft/audio.md
    produces: [asset-manifest]
    consumes: [game-design]

  - id: sdk
    role: sdk
    works_in: [title:prototype, title:production, release:validating]
    must_read:
      - core/roles/implementers.md
      - core/reference/platforms/
      - core/artifacts/shared/platform-profile.schema.json
      - core/craft/onboarding-and-portal-ux.md
    produces: [sdk-report]
    consumes: [tech-plan, game-design]

# ---------------------------------------------------------------------------
# Transitions → command surfaces.
#
# Commands map to TRANSITIONS, not to stages. Stage-named commands drift from the machine
# within a month, because the machine's edges are what a user actually wants to trigger.
# ---------------------------------------------------------------------------
commands:
  - id: scan
    triggers: portfolio:market-scan
    role: research
    gate: null
  - id: score
    triggers: "portfolio: discovered -> scored -> shortlisted"
    role: analysis
    gate: null
  - id: select
    triggers: "portfolio: shortlisted -> approved -> promoted"
    role: analysis
    gate: G1
  - id: strategy
    triggers: "title: concept -> strategy -> design"
    role: game-designer
    gate: G2
  - id: design
    triggers: "title: design -> tech-plan"
    role: game-designer
    gate: null
  - id: plan
    triggers: "title: tech-plan -> scaffolding"
    role: architect
    gate: G3
  - id: scaffold
    triggers: "title: scaffolding -> prototype"
    role: release
    gate: null
  - id: prototype
    triggers: "title: prototype -> prototype-review"
    role: gameplay
    gate: null
    note: >
      Includes the develop/review loop. The code review of each development commit
      (review-report) happens inside this transition; it is not the G4 `review` command.
  - id: review
    triggers: "title: prototype-review -> {production | prototype | abandoned}"
    role: portfolio-owner
    gate: G4
  - id: release
    triggers: "title: production -> releasing; release: draft -> qa -> rc -> approved"
    role: release
    gate: G5
  - id: publish
    triggers: "release: approved -> validating -> submitting -> live"
    role: release
    gate: G6
  - id: live
    triggers: "title: live (scheduled performance review)"
    role: liveops
    gate: G7
  - id: status
    triggers: null
    role: null
    gate: null
    note: Read-only. Reports portfolio and title state from workspace/.

# ---------------------------------------------------------------------------
# Skills — reference capability, loaded on demand.
# ---------------------------------------------------------------------------
skills:
  - id: market-intelligence
    supports: [research]
    covers: >
      Normalizing platform signal into tiered claims and keeping evidence honest,
      including competitive teardowns of how leading portal games actually play.
    reads:
      - core/lifecycle/stages/market-scan.md
      - core/artifacts/shared/claim.schema.json
      - core/craft/competitive-teardown.md
  - id: opportunity-scoring
    supports: [analysis]
    covers: >
      Scoring models, normalizers, vetoes, and evidence coverage.
    reads:
      - core/lifecycle/stages/score-opportunity.md
      - core/artifacts/shared/scoring-model.schema.json
      - core/reference/scoring/portfolio-default.v1.yaml
  - id: game-design
    supports: [game-designer]
    covers: >
      Core loop, session structure, retention hooks, scope tiers, the build spec, and the
      design consistency rules.
    reads:
      - core/lifecycle/stages/design.md
      - core/artifacts/game-design.schema.json
      - core/reference/design-consistency-rules.yaml
      - core/craft/core-loop-and-difficulty.md
      - core/craft/onboarding-and-portal-ux.md
      - core/templates/gdd.md
  - id: core-loop
    supports: [game-designer, gameplay]
    covers: >
      Making the core loop worth repeating: decisions, risk and reward, mastery signals,
      data-driven difficulty ramps, fast retry and session beats.
    reads:
      - core/craft/core-loop-and-difficulty.md
      - core/artifacts/game-design.schema.json
      - core/lifecycle/stages/strategy.md
  - id: game-feel
    supports: [gameplay, ui]
    covers: >
      Game feel and juice: the minimum feedback bar (input acknowledged, reward noticed,
      failure understood), easing, hit-stop, shake and particle budgets, frame-rate
      independence.
    reads:
      - core/craft/game-feel.md
      - core/artifacts/game-design.schema.json
  - id: onboarding-ux
    supports: [ui, game-designer]
    covers: >
      The first 30 seconds on a web portal, tutorial approach, HUD and mobile touch
      layout, accessibility baseline, and store presentation.
    reads:
      - core/craft/onboarding-and-portal-ux.md
      - core/craft/ui-hud-mobile.md
      - core/craft/accessibility.md
  - id: monetization
    supports: [game-designer, sdk]
    covers: >
      Placement design against platform ad capabilities and cadence limits, placed on beat
      boundaries with stated player value.
    reads:
      - core/artifacts/game-design.schema.json
      - core/reference/platforms/
      - core/craft/onboarding-and-portal-ux.md
  - id: architecture
    supports: [architect]
    covers: >
      Engine selection, performance budgets, and the generic/game/platform ownership
      split.
    reads:
      - core/lifecycle/stages/tech-plan.md
      - core/artifacts/tech-plan.schema.json
      - core/craft/web-performance.md
  - id: development-planning
    supports: [architect]
    covers: >
      Milestones, tasks, dependencies, acceptance criteria and test planning.
    reads:
      - core/artifacts/tech-plan.schema.json
      - core/templates/tech-plan.md
  - id: web-performance
    supports: [architect, gameplay, qa]
    covers: >
      Web game performance: load and first-frame budgets, bundle splitting, atlases and
      GPU-compressed assets, draw calls, memory, leaks on restart, low-end measurement.
    reads:
      - core/craft/web-performance.md
      - core/artifacts/tech-plan.schema.json
  - id: pixijs
    supports: [gameplay, ui]
    covers: >
      2D rendering with PixiJS: sprites, spritesheets, animation, particles, pooling and
      batching.
    reads:
      - core/artifacts/tech-plan.schema.json
      - core/craft/web-performance.md
      - core/craft/game-feel.md
  - id: threejs
    supports: [gameplay]
    covers: >
      3D with Three.js: scene management, GLB/GLTF, Draco/Meshopt, KTX2 textures,
      disposal.
    reads:
      - core/artifacts/tech-plan.schema.json
      - core/craft/web-performance.md
      - core/craft/game-feel.md
  - id: assets
    supports: [asset]
    covers: >
      Asset manifests, sourcing, licensing, provenance of generated assets, and
      compression pipelines.
    reads:
      - core/artifacts/asset-manifest.schema.json
      - core/reference/asset-policy.yaml
      - core/craft/art-direction.md
      - core/craft/audio.md
  - id: art-direction
    supports: [game-designer, asset]
    covers: >
      Turning the visual identity into a style sheet and keeping library, procedural and
      generated assets coherent and readable.
    reads:
      - core/craft/art-direction.md
      - core/lifecycle/stages/design.md
      - core/reference/asset-policy.yaml
  - id: audio
    supports: [asset, gameplay]
    covers: >
      Game audio for the browser: unlock on first gesture, mute, cue lists per event, mix
      and variation, size budgets.
    reads:
      - core/craft/audio.md
      - core/reference/asset-policy.yaml
  - id: platform-sdk
    supports: [sdk]
    covers: >
      The platform abstraction: ads, cloud save, leaderboards, analytics wiring.
    reads:
      - core/reference/platforms/
      - core/artifacts/shared/platform-profile.schema.json
  - id: localization
    supports: [release, ui]
    covers: >
      Required locales per platform, translation quality, string extraction.
      Exists because compliance and localization were previously assigned to nobody and
      were discovered at submission time.
    reads:
      - core/reference/platforms/
      - core/artifacts/release-manifest.schema.json
  - id: gameplay-review
    supports: [architect]
    covers: >
      Reviewing a development commit read-only for the defects players feel: restart
      state, frame-rate dependence, pause leakage, input handling, tuning as data, missing
      feedback hooks.
    reads:
      - core/craft/gameplay-review.md
      - core/lifecycle/stages/prototype.md
      - core/artifacts/review-report.schema.json
  - id: playtesting
    supports: [qa, game-designer]
    covers: >
      Agent browser playthroughs that record a gameplay session, stranger playtest
      protocol, and the performance pass that feed the prototype report and QA.
    reads:
      - core/craft/playtesting.md
      - core/artifacts/shared/gameplay-session.schema.json
      - core/artifacts/prototype-report.schema.json
      - core/lifecycle/stages/prototype-review.md
  - id: qa
    supports: [qa]
    covers: >
      Test suites, device matrices, defect triage, and performance measurement.
    reads:
      - core/lifecycle/stages/qa.md
      - core/artifacts/verification-report.schema.json
      - core/artifacts/qa-report.schema.json
      - core/craft/playtesting.md
  - id: release
    supports: [release]
    covers: >
      Manifests, checksums, store metadata and presentation, platform assertions, and
      submission.
    reads:
      - core/lifecycle/stages/release-candidate.md
      - core/lifecycle/stages/publish.md
      - core/artifacts/release-manifest.schema.json
      - core/craft/onboarding-and-portal-ux.md

# ---------------------------------------------------------------------------
# What an adapter must NOT do.
# ---------------------------------------------------------------------------
prohibitions:
  - Do not copy schema field lists into adapter files. Reference the schema path.
  - Do not restate stage procedures. Reference the procedure path.
  - Do not define a per-provider `workflows/` tree. It duplicates core/lifecycle/stages/.
  - Do not advance a lifecycle state from inside an agent surface. Emit artifacts and stop;
    transitions are commands and gates are human.
  - Do not auto-approve G4, G6 or G7 under any configuration.
