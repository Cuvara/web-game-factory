# Asset quality bars: what makes a delivered asset production art and not a stand-in.
#
# The assets step (and `scripts/wgf-model.py inspect` for a person) reads the files it
# delivers - imported from a library, written by an author, built by the pinned Blender, or
# found in the repository - and records the result on the asset-manifest item as `quality`
# (verdict, checks, primitive_only, parts, triangles, colors). A placeholder is never judged:
# its verdict is `skipped`. A failed check makes the verdict `fail`, and a placeholder or an
# mvp item whose quality is not `pass` never reaches a release. The design supplies the
# per-game inputs: each requirement's role and spec, and the visual_identity palette and
# primitive_style (core/artifacts/game-design.schema.json).
#
# These bars are a floor against stand-ins - one rectangle, a cube for a character, a colour
# nobody chose, a file that fetches something at load time - not a judgement of whether the
# art is good: that is visual QA, reading the running game against its rubric.
#
# Sections are per medium and keep disjoint keys: `svg` and `raster` (2D), `models` (3D, GLB),
# `audio` (sfx and music: WAV decoded, Ogg and MP3 read by their headers).

version: 1.1.0

svg:
  # Larger files are refused before parsing; an SVG sprite that big is a traced raster.
  max_bytes: 262144
  # The longest edge (width/height, else viewBox) a file may declare, in px.
  max_edge: 4096
  # Drawing elements outside <defs>, <clipPath>, <mask>, <pattern>, <symbol>: rect, circle,
  # ellipse, line, polyline, polygon, path, text, use. Below the bar for the role, the file
  # is a stand-in. One rect, circle or ellipse alone is `primitive_only` whatever the bar.
  min_shapes:
    default: 3
    background: 4
    environment: 4
    ui: 2
    icon: 2
    vfx: 2
    font: 0
  # Colours (fill, stroke, stop-color, flood-color, color; attributes and inline style)
  # are compared with the design's palette by RGB distance. Within `tolerance` of a palette
  # colour is on-palette. Pure greys from black to white count as on-palette when
  # `neutrals` is true: outlines and shading. More than `max_off_palette_share` of the
  # distinct colours off-palette fails, unless the file states why on its root element:
  # data-wgf-off-palette="<reason, at least 12 characters>".
  palette:
    tolerance: 60
    neutrals: true
    max_off_palette_share: 0.34
    min_reason_length: 12
  # The declared aspect ratio may differ from the spec's (requirement width/height) by at
  # most this share.
  aspect_tolerance: 0.1

raster:
  # A PNG with fewer distinct opaque colours than this is one flat colour: a stand-in.
  min_distinct_colors: 2
  # Kinds the asset policy marks `transparency: required` must carry an alpha channel; and,
  # when this is above 0, at least this share of their pixels must be transparent (a
  # cut-out, not a filled rectangle). 0: the channel is enough.
  min_transparent_share: 0
  # Decoding bound: larger images are judged by their header only.
  max_pixels: 4194304

models:
  # Roles a first-time player must recognise (game-design build_spec.assets[].role). A model
  # of one of these roles that is `primitive_only` fails, unless the visual identity states
  # `primitive_style` - an art direction that is itself geometric.
  readable_roles: [player, threat, goal, target, projectile, collectible, hazard]

  # Shape detection, on each connected piece of the visual model (LOD0, collision proxies
  # excluded), in the mesh's own axes, normalised to its bounding box. A piece is an
  # unmodified primitive when every vertex sits on the primitive's surface within this
  # fraction of the piece's size: a box is 8 distinct corners of its bounding box; a sphere
  # (UV or ico) has every vertex equidistant from its centre; a cylinder or cone has two
  # rings (or a ring and an apex) at the ends of one axis; a capsule is a cylinder wall
  # between two hemispheres; a plane is 4 corners in one plane. Bevelled, tapered or
  # modelled pieces match none of them.
  shape_tolerance: 0.02

  # Composition: unmodified primitives arranged into something - a keeper of a torso, head,
  # arms, gloves and legs; a car of a body, a cabin and wheels - is a model. At least this
  # many pieces, of at least `min_distinct_pieces` different shapes or proportions. Fewer,
  # or copies of one piece, is still `primitive_only`.
  min_composed_parts: 3
  min_distinct_pieces: 2

  # Every visual primitive carries vertex normals: without them three.js shades a model
  # flat-black or faceted by guesswork.
  require_normals: true

  # At least one material's base colour within this distance of a palette colour of the
  # visual identity (Euclidean, sRGB 0-255 per channel), so a model belongs to the game's
  # look. Skipped when the design has no palette; textured materials are not decoded.
  palette_distance: 48

audio:
  # A WAV is decoded with the standard library (`wave`); Ogg (Vorbis, Opus) and MP3 are read
  # by their headers only - page CRCs, the codec header, the duration - because the standard
  # library has no codec. What a header cannot say (silence, the loop seam of a compressed
  # file) is measured in the running game by the production check audio.plays
  # (core/reference/production-quality.yaml `audio`).

  # The loudest window of this many seconds - about one bar - must reach this RMS. Below it
  # the file is silence or a stand-in nobody can hear over the music.
  window_s: 2.0
  min_rms_dbfs: -45

  # Music is a loop a session hears many times: shorter than this and it repeats audibly
  # within the first minute. A requirement whose description states a length ("a 60 s
  # loop") raises it. Any other looping asset (an engine hum) needs at least loop.min.
  music:
    min_duration_s: 30
  loop:
    min_duration_s: 1
  # A one-shot longer than this is a wrongly chosen file (music in an sfx slot), not a cue.
  sfx:
    max_duration_s: 6

  # A loop (build_spec.audio[].loop) must meet itself: the step from its last frame to its
  # first at most this many times the file's typical sample-to-sample step, and the RMS of
  # the first and last `edge_ms` within `max_edge_db` of each other. A click or a gap at the
  # seam fails both.
  loop_seam:
    max_step_ratio: 8
    max_edge_db: 6
    edge_ms: 50
