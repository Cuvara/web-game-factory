# Asset quality bars: what makes a delivered asset production art and not a stand-in.
#
# The assets step (and `scripts/wgf-model.py inspect` for a person) reads the files it
# delivers - imported from a library, written by an author, built by the pinned Blender, or
# found in the repository - and records the result on the asset-manifest item as `quality`
# (verdict, checks, primitive_only, parts, triangles, colors). A placeholder is never judged:
# its verdict is `skipped`. A failed check makes the verdict `fail`, and a placeholder or an
# mvp item whose quality is not `pass` never reaches a release. The design supplies the
# per-game inputs: each requirement's role and spec, and the visual_identity palette and
# primitive_style (core/artifacts/game-design.schema.json).
#
# These bars are a floor against stand-ins - one rectangle, a cube for a character, a colour
# nobody chose, a file that fetches something at load time - not a judgement of whether the
# art is good: that is visual QA, reading the running game against its rubric.
#
# Sections are per medium and keep disjoint keys: `svg` and `raster` (2D), `models` (3D, GLB),
# `audio` (sfx and music: WAV decoded, Ogg and MP3 read by their headers).

version: 1.3.0

svg:
  # Larger files are refused before parsing; an SVG sprite that big is a traced raster.
  max_bytes: 262144
  # The longest edge (width/height, else viewBox) a file may declare, in px.
  max_edge: 4096
  # Drawing elements outside <defs>, <clipPath>, <mask>, <pattern>, <symbol>: rect, circle,
  # ellipse, line, polyline, polygon, path, text, use. Below the bar for the role, the file
  # is a stand-in. One rect, circle or ellipse alone is `primitive_only` whatever the bar.
  min_shapes:
    default: 3
    background: 4
    environment: 4
    ui: 2
    icon: 2
    vfx: 2
    font: 0
  # Colours (fill, stroke, stop-color, flood-color, color; attributes and inline style)
  # are compared with the design's palette by RGB distance. Within `tolerance` of a palette
  # colour is on-palette. Pure greys from black to white count as on-palette when
  # `neutrals` is true: outlines and shading. More than `max_off_palette_share` of the
  # distinct colours off-palette fails, unless the file states why on its root element:
  # data-wgf-off-palette="<reason, at least 12 characters>".
  palette:
    tolerance: 60
    neutrals: true
    max_off_palette_share: 0.34
    min_reason_length: 12
  # The declared aspect ratio may differ from the spec's (requirement width/height) by at
  # most this share.
  aspect_tolerance: 0.1

raster:
  # A PNG with fewer distinct opaque colours than this is one flat colour: a stand-in.
  min_distinct_colors: 2
  # Kinds the asset policy marks `transparency: required` must carry an alpha channel; and,
  # when this is above 0, at least this share of their pixels must be transparent (a
  # cut-out, not a filled rectangle). 0: the channel is enough.
  min_transparent_share: 0
  # Decoding bound: larger images are judged by their header only.
  max_pixels: 4194304

models:
  # Roles a first-time player must recognise (game-design build_spec.assets[].role). A model
  # of one of these roles that is `primitive_only` fails, unless the visual identity states
  # `primitive_style` - an art direction that is itself geometric.
  readable_roles: [player, threat, goal, target, projectile, collectible, hazard]

  # Shape detection, on each connected piece of the visual model (LOD0, collision proxies
  # excluded), in the mesh's own axes, normalised to its bounding box. A piece is an
  # unmodified primitive when every vertex sits on the primitive's surface within this
  # fraction of the piece's size: a box is 8 distinct corners of its bounding box; a sphere
  # (UV or ico) has every vertex equidistant from its centre; a cylinder or cone has two
  # rings (or a ring and an apex) at the ends of one axis; a capsule is a cylinder wall
  # between two hemispheres; a plane is 4 corners in one plane. Bevelled, tapered or
  # modelled pieces match none of them.
  shape_tolerance: 0.02

  # Composition: unmodified primitives arranged into something - a keeper of a torso, head,
  # arms, gloves and legs; a car of a body, a cabin and wheels - is a model. At least this
  # many pieces, of at least `min_distinct_pieces` different shapes or proportions. Fewer,
  # or copies of one piece, is still `primitive_only`.
  min_composed_parts: 3
  min_distinct_pieces: 2

  # Every visual primitive carries vertex normals: without them three.js shades a model
  # flat-black or faceted by guesswork.
  require_normals: true

  # At least one material's base colour within this distance of a palette colour of the
  # visual identity (Euclidean, sRGB 0-255 per channel), so a model belongs to the game's
  # look. Skipped when the design has no palette; textured materials are not decoded.
  palette_distance: 48

  # Silhouette: a model of one of these roles is not a box with bumps. The visual model is
  # projected orthographically from the front, the side and the top (a 64-cell grid on the
  # longer side, every triangle covering each cell it touches), and in each view the share of
  # the outline covered by its single largest component is measured - a part (a mesh node),
  # or for a model that is one mesh, the largest rectangle inside the outline. The model
  # fails when even its most distinctive view (the smallest share) is over `max_dominance`:
  # its wings, limbs, fins, engines or gaps stay inside the main body's outline, and at
  # gameplay distance it reads as a brick. Skipped under `primitive_style`, and for views in
  # which the model is flat (an edge, not an outline).
  # Calibrated on the 3D reference game's library (Blender builds of hand-iterated specs):
  # craft 0.29, wall 0.53, skyline 0.27, track 0.39, a 13-part goalkeeper 0.38 and a
  # body-cabin-wheels car 0.53 pass; an autonomous craft that read as "an orange brick with
  # no wings" 0.66, a box hull with a sphere canopy and a fan 0.63, and one box 1.0 fail.
  silhouette_roles: [player, threat]
  max_dominance: 0.6

fonts:
  # Glyph coverage. A font that cannot set a locale in the design's scope.locales is a design
  # error, not a runtime fallback: the browser would draw those strings in a system face the
  # design never chose. Two readers use this table:
  #
  #   * the design module (scripts/wgf_design/presentation.py): every family the typography
  #     names must cover each locale's `subsets` (any one of them). A family listed under
  #     `families` is judged by that list; any other family's font asset must state, in its
  #     spec or description, the subsets its files cover.
  #   * the asset quality check `font.coverage` (scripts/wgf_assets/quality.py): the delivered
  #     file's cmap must map every character of each locale's `chars` to a glyph. TTF, OTF
  #     and WOFF are read with the standard library; WOFF2 tables are Brotli-compressed and
  #     are read only when the system Brotli decoder (libbrotlidec) can be loaded through
  #     ctypes; otherwise the check is `skipped` with "coverage unchecked", never passed.
  #
  # `chars` items: "X..Y" is the inclusive range X to Y; any other string is its characters.
  # A locale is matched by its language subtag (pt-BR -> pt). A locale not listed here is
  # reported, not judged.
  locales:
    en: {subsets: [latin], chars: ["A..Z", "a..z"]}
    id: {subsets: [latin], chars: ["A..Z", "a..z"]}
    nl: {subsets: [latin], chars: ["A..Z", "a..z", "ëïÉé"]}
    de: {subsets: [latin], chars: ["A..Z", "a..z", "ÄÖÜäöüß"]}
    fr: {subsets: [latin], chars: ["A..Z", "a..z", "ÀÂÆÇÉÈÊËÎÏÔŒÙÛÜàâæçéèêëîïôœùûüÿ"]}
    es: {subsets: [latin], chars: ["A..Z", "a..z", "ÁÉÍÓÚÑÜáéíóúñü¿¡"]}
    pt: {subsets: [latin], chars: ["A..Z", "a..z", "ÀÁÂÃÇÉÊÍÓÔÕÚàáâãçéêíóôõú"]}
    it: {subsets: [latin], chars: ["A..Z", "a..z", "ÀÈÉÌÒÙàèéìòù"]}
    tr: {subsets: [latin-ext], chars: ["A..Z", "a..z", "ÇĞİÖŞÜçğıöşü"]}
    pl: {subsets: [latin-ext], chars: ["A..Z", "a..z", "ĄĆĘŁŃÓŚŹŻąćęłńóśźż"]}
    vi: {subsets: [vietnamese], chars: ["A..Z", "a..z", "ĂăÂâĐđÊêÔôƠơƯưẠạẢảẤấẦầẾếỀềỐốỒồỚớỜờỨứỪừ"]}
    ru: {subsets: [cyrillic], chars: ["А..Я", "а..я", "Ёё"]}
    uk: {subsets: [cyrillic], chars: ["АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ", "абвгґдеєжзиіїйклмнопрстуфхцчшщьюя"]}
    be: {subsets: [cyrillic], chars: ["АБВГДЕЁЖЗІЙКЛМНОПРСТУЎФХЦЧШЫЬЭЮЯ", "абвгдеёжзійклмнопрстуўфхцчшыьэюя"]}
    kk: {subsets: [cyrillic-ext], chars: ["А..Я", "а..я", "ӘәҒғҚқҢңӨөҰұҮүҺһІі"]}
    el: {subsets: [greek], chars: ["ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ", "αβγδεζηθικλμνξοπρστυφχψω"]}
    ar: {subsets: [arabic], chars: ["ابتثجحخدذرزسشصضطظعغفقكلمنهوي"]}
    hi: {subsets: [devanagari], chars: ["अआइईउऊएऐओऔकखगघचछजझटठडढणतथदधनपफबभमयरलवशषसह"]}
    th: {subsets: [thai], chars: ["กขคงจฉชซญดตถทธนบปผพฟภมยรลวศษสหอฮ"]}
    ja: {subsets: [japanese], chars: ["あいうえおかきくけこさしすせそアイウエオカキクケコ日本語"]}
    ko: {subsets: [korean], chars: ["가나다라마바사아자차카타파하한국어"]}
    zh: {subsets: [chinese-simplified, chinese-traditional], chars: ["的一是不了人我在有他这中大来上国个到说们"]}
  # The subsets each family's files are published with: the Google Fonts catalogue,
  # ofl/<family>/METADATA.pb `subsets` (github.com/google/fonts, read 2026-10-01). These
  # are the families the design module's identity kits name, and the faces it substitutes
  # when a kit's face cannot set a locale in scope. What a delivered file covers is the
  # asset check's to read: a subset build can cover less than its family.
  families:
    Unbounded: [cyrillic, cyrillic-ext, latin, latin-ext, vietnamese]
    Instrument Sans: [latin, latin-ext]
    JetBrains Mono: [cyrillic, cyrillic-ext, greek, latin, latin-ext, vietnamese]
    Bungee: [latin, latin-ext, vietnamese]
    Figtree: [latin, latin-ext]
    Archivo Black: [latin, latin-ext]
    Archivo: [latin, latin-ext, vietnamese]
    Fraunces: [latin, latin-ext, vietnamese]
    Commissioner: [cyrillic, cyrillic-ext, greek, latin, latin-ext, vietnamese]
    Cinzel Decorative: [latin]
    Alegreya Sans: [cyrillic, cyrillic-ext, greek, greek-ext, latin, latin-ext, vietnamese]
    Alegreya Sans SC: [cyrillic, cyrillic-ext, greek, greek-ext, latin, latin-ext, vietnamese]
    Syne: [greek, latin, latin-ext]
    Manrope: [cyrillic, cyrillic-ext, greek, latin, latin-ext, vietnamese]
    Syne Mono: [latin, latin-ext]
    Rubik Mono One: [cyrillic, cyrillic-ext, hebrew, latin, latin-ext]
    Rubik: [arabic, cyrillic, cyrillic-ext, hebrew, latin, latin-ext]
    Russo One: [cyrillic, latin, latin-ext]
    Playfair Display: [cyrillic, latin, latin-ext, vietnamese]
    Cormorant SC: [cyrillic, cyrillic-ext, latin, latin-ext, vietnamese]

variants:
  # A counted requirement (a count above 1: tower levels, enemy kinds) is drawn once per
  # variant, and the player must tell the variants apart by shape, not by colour alone. Each
  # drawing is reduced to a silhouette on a `grid` x `grid` mask over its own canvas (an SVG's
  # viewBox, a PNG's pixels): SVG shapes are filled as polygons (curves through their control
  # points, transforms applied), a PNG's opaque pixels (alpha >= 16, or differing from its
  # corner colour by `png_background_delta` when it has no transparency). Two drawings differ
  # by 1 - IoU of their masks. Every pair must differ by at least `min_silhouette_distance`:
  # a recoloured copy, or one with only its numeral changed, is 0.
  grid: 32
  min_silhouette_distance: 0.08
  png_background_delta: 24

text:
  # svg.text-font: a <text> (or <tspan>) is set in a face the design's typography names
  # (visual_identity.typography display/body/numeric, the family before any "(weight)"),
  # first in its font-family list; generic families may follow it as a fallback. A <text>
  # with no font-family, or one led by another family, is set in a system font - the generic
  # UI the identity kits exist to prevent. An SVG drawn as an image cannot load the game's
  # web fonts at all, so lettering that must look right is drawn as outlines (paths).
  generic_families: [serif, sans-serif, monospace, cursive, fantasy, system-ui, ui-serif, ui-sans-serif, ui-monospace, ui-rounded, emoji, math, fangsong]

avoid:
  # svg.avoid: the visual identity's `avoid` list, where a line can be measured on the file.
  # A rule applies when an avoid line contains one of its phrases (case-insensitive); the
  # other lines are for the author and visual QA to read, never failed here.
  #   blur                  a Gaussian blur, a drop-shadow filter, or a CSS blur(): glow and
  #                         soft shadows
  #   emoji                 an emoji character in a <text>
  #   purple-blue-gradient  a gradient whose stops run from purple to blue
  #   text-gradient         a <text> filled or stroked with a gradient
  #   rounded-corners       a <rect> with rx or ry above 0
  rules:
    blur: [neon glow, glow effects, soft blurred, blurred, blur]
    emoji: [emoji]
    purple-blue-gradient: [purple-to-blue, purple to blue]
    text-gradient: [gradients inside text, gradient text]
    rounded-corners: [rounded corners]

set:
  # set.consistent: drawings authored as one set (the 2D author's `set` mode, or any item
  # judged with others) share one treatment, measured on simple proxies per group of roles.
  # A group with fewer than `min_group` drawings is not compared.
  #   outlined   a drawing is outlined when at least `outlined_share` of its shapes carry a
  #              stroke; within a group, outlined and unoutlined drawings do not mix (the
  #              minority fails)
  #   width      an outlined drawing's outline - its widest stroke, in displayed px
  #              (stroke-width x displayed size / viewBox width) - within
  #              `max_outline_ratio` of the group's median
  #   colour     its outline colour within `outline_colour_tolerance` (RGB distance) of the
  #              group's most common outline colour
  #   effects    blur filters (soft shadows, glow) used by all of a group or by none
  groups:
    entities: [player, threat, goal, target, projectile, collectible, hazard, prop]
    icons: [icon]
  min_group: 2
  outlined_share: 0.3
  max_outline_ratio: 1.6
  outline_colour_tolerance: 60

audio:
  # A WAV is decoded with the standard library (`wave`); Ogg (Vorbis, Opus) and MP3 are read
  # by their headers only - page CRCs, the codec header, the duration - because the standard
  # library has no codec. What a header cannot say (silence, the loop seam of a compressed
  # file) is measured in the running game by the production check audio.plays
  # (core/reference/production-quality.yaml `audio`).

  # The loudest window of this many seconds - about one bar - must reach this RMS. Below it
  # the file is silence or a stand-in nobody can hear over the music.
  window_s: 2.0
  min_rms_dbfs: -45

  # Music is a loop a session hears many times: shorter than this and it repeats audibly
  # within the first minute. A requirement whose description states a length ("a 60 s
  # loop") raises it. Any other looping asset (an engine hum) needs at least loop.min.
  music:
    min_duration_s: 30
  loop:
    min_duration_s: 1
  # A one-shot longer than this is a wrongly chosen file (music in an sfx slot), not a cue.
  sfx:
    max_duration_s: 6

  # A loop (build_spec.audio[].loop) must meet itself: the step from its last frame to its
  # first at most this many times the file's typical sample-to-sample step, and the RMS of
  # the first and last `edge_ms` within `max_edge_db` of each other. A click or a gap at the
  # seam fails both.
  loop_seam:
    max_step_ratio: 8
    max_edge_db: 6
    edge_ms: 50
