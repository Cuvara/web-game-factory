# The baseline comparison: a candidate build held to the build a person accepted.
#
# Read by scripts/wgf_playability/baseline.py through the playability step. When a run adopts
# an existing game (factory.init.adopt_existing), the design records the commit its content
# floor was counted at (`existing_content.source.commit`: the adopted checkout's shipped commit,
# or the one a person names in factory.init.accepted_baseline). The playability step plays that
# accepted commit with the same bot and the same settings as the candidate, and reports, per
# accepted unit and per measured quantity, what got worse beyond the tolerances below
# (docs/baseline-comparison.md). A change to accepted content is a failure unless a person
# recorded why (factory.init.accepted_changes); it is then listed, never hidden.
#
# Why it exists (K6 retro, 2026-10-09): both 2026-10-05 loops made their gates pass while making
# the person-accepted games worse - the 3D courses cut from 234-440 m to 38-124 m corridors and
# the first course cleared by holding forward in 5.8 s against a 24 s par (H6, H7); the 2D
# paddle, capsules, opener and speed curve changed (H4). No gate compared with the accepted
# build (H1).
#
# Calibration (docs/baseline-comparison.md, "Calibration"): every tolerance is held by
# scripts/tests/test_baseline_compare.py over real measurements of the accepted builds (2D
# 96f5cea, 3D 64ff4c6), the regressed loop heads (2D 68a12b7, 3D 1c6b099) and the current
# candidates (2D 0db72b6, 3D 43c08e2), and each accepted build measured twice: the accepted
# build passes against its own second measurement, the regressed heads fail.
#
# 1.1.0: two ADVISORY measurements (check-tiers.yaml 1.6.0 `advisory`: reported, never
#        required, never routed, not read by floor.accepted_baseline): `source_rewrite` - the
#        share of accepted units replaced, files rewritten and lines deleted between the
#        accepted and the candidate commit, from git - and `frame_metrics` - each compared
#        frame's mean luminance and contrast against the accepted build's. Ported from the
#        unmerged accepted-baseline work (issue #75); its bars are uncalibrated here.
version: 1.1.0

# A measured regression holds the build at every tier: an accepted game made worse is never a
# development detail. An unmeasured comparison follows quality-policy.yaml skipped_checks (not
# passed at the release tier), except where the accepted build carries none of a quantity
# (`accepted-declares-none`: nothing accepted to keep - reported, never held).
enforce:
  fail_required_at: all

# The viewports the comparison reads (both builds are played on them; the accepted build only
# on them). Content, naive play and the survey run on desktop (play-realism.yaml naive.projects,
# content-sufficiency.yaml survey.projects).
play:
  projects: [desktop]

# A unit's extent: a PATH layout's centre-line length (realism.layout_length, the layout's own
# units), else the solid cells of a GRID layout - every character of a list of strings that is
# not one of `grid_empty`. Compared only when both builds declare the same kind.
extent:
  grid_empty: [".", " ", "0", "-", "_"]

# Where a unit's par is read, first found: its layout, the unit, its parameters.
par_keys: [par_s, par_time_s, time_target]

# Each accepted unit's declared layout and declared elements. 1.0: identical - the same
# sequences by value (wgf_design.layouts: container names dropped, 30.0 is 30). Accepted
# content is changed only with a person's recorded reason, so no change is tolerated; a scalar
# outside every list (tuning) is the `tuning` comparison's.
unit_content:
  min_similarity: 1.0

# Each accepted unit's extent and par, candidate over accepted. 0.9: a unit may lose a tenth of
# its length or cells (one brick of 16 is 0.94) before it is reported as cut - the layout
# change itself is unit_content's. The real cuts are 0.09-0.29 (3D courses, 1c6b099 against the
# accepted courses) and 0.625 (2D w1-l1, 68a12b7: 10 bricks for 16).
unit_extent:
  min_ratio: 0.9
  min_par_ratio: 0.9

# Every accepted tuning value (the content data file's `tuning` block, flattened to dotted
# keys): kept, or the change recorded by a person. 0.0: data is exact - a ball speed, a paddle
# width or a speed curve is the feel a person accepted.
tuning:
  max_relative_change: 0.0

# Each accepted unit's difficulty value per axis (the content data's `difficulty`, else the
# probe's metrics.difficulty in the survey) and the order of every pair of accepted units on
# each axis. The tolerance is genre-models.yaml implementation.difficulty_tolerance (the one a
# build is held to its design's values by), read there - not restated here.
difficulty_order:
  tolerance_from: core/reference/genre-models.yaml implementation.difficulty_tolerance

# The fastest clear of each compared unit, per naive policy (play-realism.yaml naive), and the
# oracle's clear in the survey, candidate over accepted. A run that did not clear its unit is a
# lower bound (its clear is later still): a regression is reported only when the candidate's
# clear is shorter than the bar whatever the unknown part of the bound is. 0.6: the accepted
# 3D build against its own repeat clears the opening course held forward in 22.86 s and
# 20.65 s (0.90 / 1.11 x); the regressed 3D head in 6.18 s (0.27 x; jittered, at most 0.31 x);
# the current 3D candidate in 19.0 s (0.83 x). Naive play clears no 2D level in its run on
# any build measured, so this bar decides nothing there (reported `undetermined`).
clear_time:
  min_ratio: 0.6

# A clear rate above the accepted band (a unit got easier beyond chance) is reported here; a
# drop below it is play-realism's naive.clear_rate, measured against the same accepted play.
# Both use play-realism.yaml clear_rate's bars (runs, min_runs, min_drop, min_z): one band.
clear_rate:
  bars_from: core/reference/play-realism.yaml clear_rate

# The median drawn size of each role while the oracle plays (the win test's per-frame
# entities), on each axis. 0.25: a quarter larger or smaller is a different paddle or ball to a
# player. The accepted builds against their repeats move at most 1.6 % (3D) and 0 (2D); the
# regressed 2D head draws the paddle 0.71 x as wide and 1.23 x as tall.
entity_size:
  roles: [player, projectile, goal, target, threat]
  max_change: 0.25

# The build's response, from what the bot already records: play begins (first session,
# navigation to play less the bot's own measuring), every action the accepted build visibly
# acknowledged within the acknowledgement window still changes min_ack_fraction of the frame
# (visual-quality.yaml acknowledgement.min_changed_fraction), and frames per second while the
# oracle plays (requestAnimationFrame callbacks over the page's lifetime in the win test).
# Software rendering on the build host: a ratio between two builds on one host, never a
# player's device. The start is timed from the page's first byte (the wait for it is the
# local server's: 2301 ms of one candidate's 2801). The bars allow what the accepted builds'
# own repeats measured on this shared host: starts of 510 / 820 ms (2D) and 708 / 317 ms
# (3D) - inside max(1.5 x, + 1000 ms) either way - and frame rates of 10.6 / 10.0 (2D) and
# 8.5 / 11.0 (3D): the 3D build against itself reads 0.77 x, so 0.6. No build measured ran
# slower than its accepted build beyond that spread: the frame-rate and start bars are
# calibrated on noise only, and have not been shown to catch a real regression.
responsiveness:
  max_start_ratio: 1.5
  start_slack_ms: 1000
  min_ack_fraction: 0.002
  min_fps_ratio: 0.6

# -- advisory (1.1.0) ---------------------------------------------------------------------------
# Neither section below holds a build at any tier: their checks are always `required: false`
# (a change beyond a bar is a WARNING whose summary starts "ADVISORY, not held"), and
# check-tiers.yaml lists them `advisory`. What would make one blocking: its bars measured
# with this step on builds a person judged - accepted builds against their own repeats (noise)
# and builds a person judged worse (the regression) - and a new version here stating them,
# with the check moved to `quality` in check-tiers and named in floor.accepted_baseline.

# How much of the accepted commit the candidate commit replaced, read from git objects of the
# step's own clone (baseline.source_rewrite): the accepted content data file's units removed or
# altered (a key the accepted unit had gone or changed; a key added is an extension), the
# accepted text files under `roots` deleted or rewritten (deleted lines >= file_rewritten_share
# of the file's accepted lines), and the accepted lines under `roots` deleted. Shares are of what
# the accepted commit shipped; a quantity it does not ship is unmeasured, never 0.
#
# Bars: proposed, not calibrated by this step. The unmerged accepted-baseline branch measured,
# from the two validation games' repositories (scripts/tests/fixtures/real/baseline-compare/
# advisory/real-measurements.json `rewrite`): an improving visit of the accepted runs replaced
# at most 0.0625 of the units, rewrote at most 0.0556 of the files and deleted at most 0.0842
# of the lines; the replacements a person rejected - 2D 96f5cea -> 68a12b7: units 1.0, files
# 0.0256, lines 0.1145; 3D 64ff4c6 -> b6b9edb (greybox:1): units unmeasured (no content data
# file), files 0.1897, lines 0.4618; 3D 64ff4c6 -> 1c6b099: files 0.172, lines 0.460. 0.25 is
# about three times the largest improving visit; each rejected replacement exceeds it on one
# share only (2D units, 3D lines), so no single share separates them.
source_rewrite:
  roots: [src]
  file_rewritten_share: 0.5
  maximum:
    units_replaced_share: 0.25
    files_rewritten_share: 0.25
    lines_deleted_share: 0.25
  basis: proposed

# Each compared frame both builds captured (the frames frames.readable reads: the first
# session's first-session-1s, the win test's play-2s), the candidate's mean luminance and
# contrast (0-255, analysis.frame_stats) against the accepted build's, either way
# (baseline.frame_metrics). A brighter or flatter frame is not worse in itself - that is why it
# is advisory: it says the look changed, for a person to judge.
#
# Bars: proposed. Real measurements (scripts/tests/fixtures/real/baseline-compare/advisory/
# real-measurements.json `frames`, from the validation games' playability reports): the
# builds a person judged worse moved each frame's luminance +62 to +84 (desktop: 2D
# first-session-1s 25.79 -> 95.9, play-2s 25.71 -> 88.8; 3D 121.8 -> 183.6 / 183.8; 2D mobile
# 28.4 -> 112.2) and its contrast +25.3 / +16.2 (2D desktop), +31.9 (2D mobile), +1.1 (3D) - the
# contrast bar alone catches one 2D frame of two, and no 3D frame.
# The accepted-baseline branch recorded that two plays of one commit (2D f55653dc, 3D
# db651f92) moved both by at most 0.6. Those were plays of separate runs, not the same-run
# plays this step makes, and no build a person judged has been measured by this step.
frame_metrics:
  frames: [first-session-1s, play-2s]
  max_luminance_delta: 32
  max_contrast_delta: 24
  basis: proposed
