# Design depth: the bars a game-design's reason to come back is held to.
#
# The design module checks every design it produces against these (`build_spec.depth`,
# game-design 1.7.0; scripts/wgf_design/depth.py). They turn the defaults of
# core/craft/retention-and-progression.md from prose into data a check can read: a loop
# above the run that persists, content that arrives on a schedule instead of all at once, a
# goal at every horizon, a first session long enough to show the loop more than once, and a
# stated reason to return.
#
# Depth is stated, not necessarily built: every entry carries a tier, and a strategy that
# defers retention systems past the prototype gets them tiered post-mvp or optional, visibly.
# What the bars refuse is a design with nothing above the core loop at any tier, and an MVP
# entry that rests on something the MVP does not build.
#
# Change a value only with a reason a person could defend from playtest or live data; a
# looser bar here lets a single-loop prototype through as a game.

# 1.1.0: playability bars for the content and depth checks
# 1.2.0: playability.persists.probe_measures - what the probe reports of a persisted kind
# 1.3.0: playability.ramp - the run the time ramp is read on (mode_features, mode, run_s) and
#        the sample it needs (min_inputs_per_third, extend_s)
# 1.4.0: playability.content.transition_grace_ms judges the GAME's latency, not the bot's: the
#        time the game sat in a finished unit before offering a way on, plus the time it stayed
#        there after the bot's input was delivered. The bot's reaction, click and polling are
#        excluded - the raw interval failed an unchanged build on a loaded machine (1687 ms vs
#        586 ms for the same gameplay). The value is unchanged.
# 1.4.0: playability.ramp - the time ramp is judged on `samples` fresh runs, pooled, against a
#        noise band (`noise_z`), extended while inside it; a stretch of play with no oracle
#        input and no progress longer than `stall_max_s` is its own finding (depth.stall);
#        `relief_dip_s` removed - it was stated and implemented nowhere (below)
version: 1.4.0

meta_loop:
  # Persisting only these is a scoreboard, not a meta loop: at least one persisted entry
  # must be of another kind (stage progress, unlocks, currency, upgrades, cosmetics,
  # achievements, missions, streak, collection).
  score_only_kinds: [best-score, settings]

goal_ladder:
  # Every horizon has at least one goal.
  horizons: [short, mid, long]
  # The prototype proves these: the next-seconds goal and the this-run goal are MVP.
  mvp_horizons: [short, mid]

content_schedule:
  # Content-variety items (pieces, specials, power-ups, obstacles, zones, events...) the
  # design introduces over play, at any tier.
  min_items: 4
  # Of which at least this many are MVP: the prototype shows variety arriving, not one
  # static board.
  min_mvp_items: 1
  # Distinct introduction points (`at_s` within a run, `after_runs` across runs, or the
  # `introduced` wording when neither applies): content that all arrives at second 0 is a
  # menu, not a schedule.
  min_distinct_introductions: 3
  # The first new item a player meets inside a run arrives no later than this (s): the
  # first minute already shows the game is more than its opening.
  max_first_in_run_s: 60

first_session:
  # Seconds a first session is designed to last. Below the minimum the loop is seen once;
  # above the maximum it is no longer a portal session. Equal to session.first_session_seconds.
  min_s: 120
  max_s: 900

return_hooks:
  # Stated reasons to open the game again, at any tier.
  min_items: 2
  # Of which at least this many are MVP: the prototype already gives one.
  min_mvp_items: 1

# The playability step's bars for the checks that hold a build to its design's content and
# depth (scripts/wgf_playability/analysis.py; docs/playability-module.md). Numbers live here,
# never in code. A check is SKIPPED only when the design does not claim the thing it measures
# (a parametric or procedural content model has no listed units to traverse); a claimed thing
# the probe cannot show is a FAIL.
playability:
  time_budget:
    # Hard cap for one viewport's bot run; the step scales the traverse and session windows
    # down to fit and records `truncated: true` on the checks it shortened.
    bot_total_s: 600
    traverse_s: 240
    persist_s: 60
  content:
    # Units the oracle traverses in design order, or every MVP unit when there are fewer;
    # the genre model's `qa.min_units_traversed` overrides it.
    min_units_traversed: 3
    # A unit transition is earned when content.unit_index increments after the previous unit
    # ended in `won` or its progress reaching its target, the game moving on within this many
    # ms of that end: its own wait before offering an advance plus its wait after the bot's
    # input was delivered (the bot's reaction and click are not the game's).
    transition_grace_ms: 1500
    # Share of a unit's objective words shown on screen while it is played (the same bar as
    # start.objective).
    objective_min_share: 0.6
  difficulty:
    # Authored: share of consecutive traversed-unit pairs on which an escalating axis is
    # non-decreasing or dips no deeper than relief_dip_max.
    min_rise_share: 0.6
    relief_dip_max: 0.35
    # Parametric and endless: metrics.difficulty.<axis> in the last window of a session run
    # must exceed the first window's for every escalating axis.
    endless_window_s: 30
  variety:
    # Share of consecutive traversed-unit pairs whose entity kinds or mechanics set differs.
    min_changed_pairs_share: 0.5
    # Parametric: the first new entity kind arrives by the earliest MVP content_schedule
    # at_s plus this many seconds.
    first_new_kind_slack_s: 15
  session_length:
    # One oracle session with instant retries, ended on first_session.ends_on or at
    # max_multiplier x target: it must reach min_share x depth.first_session.target_s.
    min_share: 0.5
    max_multiplier: 1.5
    sessions: 1
  ramp:
    # Bad play ends a run within this many times the design's run length, and good play is
    # asked for more as a run goes on: the oracle's input rate in the last third of a run is
    # above the first third's - shown beyond the noise of the counts, not read off one run.
    bad_play_max_multiplier: 3
    # (relief_dip_s, "one relief dip of at least 2 s is allowed", was removed in 1.4.0: no
    # code ever measured it, so the check's text promised a criterion nobody applied. The
    # judge compares a run's first and last thirds only, so a breather in the middle third -
    # of any length - was and is allowed; a dip that reaches the last third is the decline
    # the ramp exists to catch; and play that stops altogether is depth.stall, below.)
    #
    # The input-rate ramp is a time ramp, and it is read only on a run of the play that
    # promises one (a family whose `qa` states endless_window_s): the session itself when
    # that play is endless (game-design genre.ending `endless`, or content that is not
    # authored), else a run of a mode the design includes at a tier this build carries -
    # a feature whose `catalogue` (or id) is one of mode_features. The bot enters that mode
    # through the probe's optional `play.mode.enter(mode)` (docs/template-contract.md) and
    # plays it for run_s. An authored-unit design with no such mode ramps between its units,
    # which difficulty.axes_progress judges; its longest unit is not a time ramp, and a brick
    # level that needs fewer moves as it clears is not a game asking for less.
    mode_features: [endless-mode]
    mode: endless
    run_s: 60
    # The run is sampled, not played once: `samples` fresh runs (a fresh page each, the mode
    # entered again), each held for run_s or until the game ends it, the oracle playing. One
    # run per viewport made the verdict a coin toss - the live 2026-10-05 brick game read
    # [10, 14, 23] PASS on one commit and [10, 29, 9] FAIL on the next with identical
    # gameplay code. The counts of every sample are pooled: the last thirds against the first.
    samples: 3
    # The noise band. Under a rate that does not change, how n = first + last inputs split
    # between the two thirds is Binomial(n, 1/2): their difference has a spread of sqrt(n).
    # A difference inside noise_z x sqrt(n) is not decided either way: the bot plays more
    # samples (extend_s), and if it is still inside, the ramp is unmeasured - never a pass,
    # and a FAIL at a tier whose skipped checks are not passed. At 2 a game whose rate is flat
    # reads as a rise about 2.3% of the time per look (one-sided normal tail), and a real
    # ramp of the live brick game's size (about 1.8x, [10, ., 19] per run) clears it on the
    # three pooled samples (27 against 2 x sqrt(87) = 18.7). A pooled fall beyond the band -
    # or one sample's own fall beyond its own band - fails: the game asks for less.
    noise_z: 2
    # The fewest oracle inputs the pooled first thirds must hold before the rate is compared
    # (and the fewest a single sample's first third holds before its own fall is judged).
    # Counts are Poisson-like: at 10 the spread of a third's count is about +-3 (sqrt 10).
    # Below it, after the extension, the ramp is unmeasured - never a pass.
    min_inputs_per_third: 10
    # Play beyond the planned samples while the pooled counts are short of the minimum or
    # inside the noise band: whole further samples, as many as fit in extend_s.
    extend_s: 60
    # A stall: the longest stretch of a sample, in play (state `playing`), with no oracle
    # input and no change in what the run has achieved (the design's goal metric, the unit's
    # progress, the unit reached). Longer than this is depth.stall - a gameplay defect, routed
    # to gameplay, never read as a ramp: the samples it occurs in are left out of the ramp's
    # counts, whose thirds it would deflate. 10 s is the opening grace the experience floor
    # gives a player before the game must ask something of them (experience-rules.yaml
    # onboarding.min_grace_s) and a third of the time-ramp families' endless window (arcade,
    # survival: endless_window_s 30); an oracle playing a time-ramp game acts every second or
    # so (the live brick game's endless runs: 38-76 inputs in 32-67 s), and a run in which
    # nothing is asked and nothing is achieved for 10 s has stopped being played - the live
    # brick game's ball trapped above its steel bricks (game fix 48a80bb).
    stall_max_s: 10
  persists:
    # Generation modes for which progression.persists is required; others get WARNING.
    required_generations: [authored]
    # What the play probe reports of an MVP `meta_loop.persists` entry whose `delivered_by`
    # names no HUD metric, by its kind: a metric name, or `content.unit_index` - the unit the
    # player has reached, which the probe's `content` block reports with every unit
    # (play-probe `content.unit_index`, required with `content`). Stage progress is the unit
    # reached: it survives a reload when the probe reports the same unit_index back in play,
    # and is measured only once the bot has reached a unit past the first (unit 1 is also
    # where a build that saves nothing starts). A kind not listed here and not delivered by a
    # HUD metric is not measurable: the check is SKIPPED, and the quality floor fails a
    # release build on it.
    probe_measures:
      best-score: best
      stage-progress: content.unit_index
