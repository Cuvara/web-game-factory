            est_cost: 0
            spec: Vector, 32px, 8-frame idle pulse
            role: collectible
            dimension: 2d
            readability: Round tokens where enemies are angular, the health one in the heal colour and the double-shot in the player's accent, both readable at 24 px in a busy arena
        audio:
          - id: music-combat
            type: music
            tier: mvp
            description: Combat loop, one percussion layer added per wave band
            trigger: Wave start
            loop: true
            source_preference: library
            est_cost: 40
          - id: sfx-shoot
            type: sfx
            tier: mvp
            description: Weapon shot, one per weapon
            trigger: Shot fired
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-enemy-hit
            type: sfx
            tier: mvp
            description: Enemy hit and enemy death
            trigger: Enemy takes damage or dies
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-player-hit
            type: sfx
            tier: mvp
            description: Player hit, dry and loud
            trigger: Player takes damage
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-wave-clear
            type: sfx
            tier: mvp
            description: Wave clear sting
            trigger: Wave cleared
            loop: false
            source_preference: library
            est_cost: 5
        post_mvp:
          - id: wave-set-2
            name: Second wave set
