  arcade:
    label: Arcade / action
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: react to what comes, survive and bank score, the pressure rises, a miss ends the run, retry at once
    nodes: [arcade, runner, endless-runner, lane-runner, one-touch, rhythm, snake]
    unit_kinds: [run-segment, round, wave]
    progression_models: [skill-only, unlock-track, endless-scaling]
    difficulty_models: [time-ramp, level-authored]
    ending: [endless, finite]
    axes:
      - id: speed
        range: [0, 1]
        escalates: true
        # optional, not required: the golden ports at the pinned template commit report no
        # metrics.difficulty.speed; a build that reports it is held to the rise, one that does
        # not gets a WARNING. Promote to required when the ports report it.
        probe: optional
        description: Scroll or tempo
      - id: density
        range: [0, 1]
        escalates: true
        probe: optional
        description: Obstacles or targets per second
      - id: variety
        range: [0, 1]
        escalates: true
        probe: optional
        description: Distinct obstacle or pattern kinds active
      - id: precision
        range: [0, 1]
        escalates: false
        probe: optional
        description: Input window width
    win:
      shape: best-score
      per_unit: false
      description: An endless run chases a best; a finite round has a target
    lose:
      shape: collision
      per_unit: false
      description: A hit, a miss or a fall ends the run
    units: {min_mvp: 3, min_total: 6, generation: [authored, parametric, procedural]}
    variety: {dimensions: [introduces, pattern_set, hazard_kind, tempo, objective]}
    mastery:
      model: execution
      signals: [best, multiplier, near-misses]
      statement_required: true
    qa: {min_units_traversed: 3, reset_in_unit: false, checkpoint: false, min_new_kinds_per_unit: 1, failure_state: true, endless_window_s: 30}
    seed:
      archetype:
        id: flip-arcade
        label: One-touch gravity flip
        keywords: [arcade, one-touch, one touch, tap, flip, gravity, dodge, endless, obstacle, wave, reflex]
        signature: [flip, flip gravity, one touch, thread the gap, gravity]
        dimension: 2d
        structure: run
        camera: Fixed, the craft anchored in the left third, the world scrolling right to left.
        orientation: portrait
        identity_affinity: [neon-night, riso-arcade, signal-brutal]
        fantasy: Holding your nerve one beat longer than feels sensible.
        core_loop: Read the gap ahead -> tap to flip gravity -> fall through the gap and bank distance -> the wave changes its hazard mix -> one touch ends the run -> tap again at once.
        pillars:
          - One input, learned in two seconds, mastered in two hundred runs
          - Every gap is reachable from the moment it comes on screen
          - Back in a run inside one second of failing
        run_seconds: 60
        first_reward_s: 15
        content_units: 6
        content_unit_kind: wave
        retention_hooks: [streak, progression]
        return_reason: I died 40 m short of my best and I know which flip was late.
        progression_model: skill-only
        difficulty_model: time-ramp
        mechanics:
          - id: gravity-flip
            name: Gravity flip
            tier: mvp
            description: The craft falls toward the floor or the ceiling, and one tap inverts which.
            rules:
              - A tap inverts gravity on the next frame and zeroes the craft's vertical speed at that instant.
              - Gravity is 2400 px per second squared with a terminal speed of 900 px per second, applied on a fixed step so the arc is the same at any frame rate.
              - Touching the floor or the ceiling is a crash and ends the run.
            parameters: {gravity_px_s2: 2400, terminal_px_s: 900, flip_frames: 1}
          - id: hazards
            name: Hazard waves
            tier: mvp
            description: Pillars, spinning bars and gaps scroll in from the right, drawn from the wave's hazard mix.
            rules:
              - Every spawned obstacle pattern leaves a gap at least 2.2 craft heights tall.
              - Contact with an obstacle is a crash and ends the run.
              - The hazard mix changes every 20 s, and each wave adds one obstacle kind the wave before it did not use.
            parameters: {min_gap_heights: 2.2, wave_s: 20, start_scroll_px_s: 300}
          - id: score-streak
            name: Distance and streak
            tier: mvp
            description: Score is distance, with a streak for obstacles passed close.
            rules:
              - Score rises continuously with distance travelled.
              - Passing an obstacle within 40 px of it adds 1 to the streak, up to 8, and the streak multiplies the distance score.
              - A hit ends the run and the streak; a flip that was not needed costs nothing.
            parameters: {max_streak: 8, close_px: 40}
          - id: shield-pickup
            name: Shield pickup
            tier: post-mvp
            description: A charge collected in a gap that absorbs one hit.
            rules:
              - A shield absorbs exactly one hit and is spent on it.
              - At most one shield is in play, and it never spawns inside an obstacle's gap line.
            parameters: {shield_hits: 1, spawn_every_s: 25}
        actions:
          - id: flip
            action: Flip gravity
            tier: mvp
            mechanic: gravity-flip
            touch: Tap anywhere on the screen
            mouse: Click anywhere, or press Space
            keyboard: Space, W or Up arrow
            gamepad: A button
        goals:
          moment: Get through the gap ahead without touching anything.
          session: Beat the personal best at least once.
          long_term: Reach wave 6 and hold a streak of 8 through it.
        progression_steps:
          - id: wave-2
            tier: mvp
            unlock_condition: Survive 20 s in one run
            grants: Wave 2's hazard mix, spinning bars, for the rest of that run
          - id: wave-3
            tier: mvp
            unlock_condition: Survive 40 s in one run
            grants: Wave 3's hazard mix, staggered double pillars
          - id: waves-4-6
            tier: mvp
            unlock_condition: Survive 60 s in one run
            grants: Waves 4 to 6, which cycle for the rest of the run
        curve:
          - at: 0-20s
            description: Single pillars, wide gaps, slow scroll; a first-time player banks a streak before failing.
            parameters: {scroll_px_s: 300, gap_heights: 3.0}
          - at: 20-60s
            description: Spinning bars and staggered pillars; scroll rises 3% every 5 s.
            parameters: {scroll_step: 0.03, gap_heights: 2.6}
          - at: 60s+
            description: All six waves cycle and the scroll caps, so a skilled player can hold a run.
            parameters: {scroll_cap_px_s: 620, gap_heights: 2.2}
        assist: After three runs under 10 s, the next run's first 15 s use wave 1's spacing with gaps at 3 craft heights.
        failure_condition: The craft touches an obstacle, the floor or the ceiling.
        failure_feedback: 150 ms of hit-stop, one screen shake, the obstacle that was hit flashes white, and the result card slides up with distance, streak and best.
        rewards:
          - id: new-best
            tier: mvp
            trigger: A run ends above the personal best
            grants: A new personal best, saved
            feedback: The best counter bursts and re-colours, over a two-note sting.
          - id: streak-up
            tier: mvp
            trigger: An obstacle is passed within 40 px
            grants: Streak plus one, up to 8
            feedback: The streak badge pulses and the pass sound rises a semitone per step.
          - id: wave-change
            tier: mvp
            trigger: A new wave's hazard mix starts
            grants: A named wave and its new obstacle kind
            feedback: A thin banner names the wave, the palette shifts hue, and the new obstacle kind enters alone first.
        hud:
          - id: score
            tier: mvp
            shows: Distance this run
            anchor: top-center
            updates_on: Every frame
            feedback: Digits roll rather than jump
          - id: streak
            tier: mvp
            shows: Close-pass streak, hidden at zero
            anchor: top-right
            updates_on: Close pass and run end
            feedback: Pulses on each step and drains visibly on a hit
          - id: best
            tier: mvp
            shows: Personal best, with a marker crossing the track when it is reached
            anchor: top-left
            updates_on: When distance passes the best
        tutorial:
          approach: diegetic
          rationale: There is one input; the first gap is placed so that tapping is the only thing a player can do, and the arc teaches the rest.
          steps:
            - id: first-tap
              tier: mvp
              trigger: First run, before the first obstacle
              prompt: The craft rests on the floor under a pulsing tap ring, with the first gap high and the obstacle still four seconds away
              completes_on: The player taps and the craft rises
            - id: first-gap
              tier: mvp
              trigger: First run, first obstacle
              prompt: The gap is drawn with a faint dotted arc from the craft through it
              completes_on: The player passes the first obstacle
        assets:
          - id: craft
            type: spritesheet
            tier: mvp
            description: Player craft with thrust, flip and burst frames
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector-drawn, 64px wide, 4 thrust frames, 2 flip frames, 4 burst frames
            role: player
            dimension: 2d
            readability: One bright wedge in the identity's lead accent with a clear nose and a trailing thrust flame, readable at 48 px against the scrolling field, and plainly inverted the frame after a flip
          - id: obstacles
            type: sprite
            tier: mvp
            description: Pillar, spinning bar, staggered pillar and crown, one per hazard kind
            count: 4
            source_preference: procedural
            est_cost: 0
            spec: Vector, gap-aligned, 96px wide, the bar with 8 rotation frames
            role: threat
            dimension: 2d
            readability: Hard-edged shapes outlined in the danger colour, never in the craft's colour, each one reading as solid at 48 px while its gap reads as empty from the moment it enters the screen
          - id: shield
            type: sprite
            tier: post-mvp
            description: Shield pickup and the shielded craft overlay
            count: 2
            source_preference: procedural
            est_cost: 0
            spec: Vector, 32px token plus a craft ring overlay
            role: collectible
            dimension: 2d
            readability: A round token where obstacles are angular, readable at 24 px, and once taken an unmistakable ring around the craft that disappears the instant it is spent
          - id: field
            type: texture
            tier: mvp
            description: Floor, ceiling and the scrolling field between them
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Tileable 512px, floor and ceiling bands with hazard striping
            role: environment
            dimension: 2d
            readability: Floor and ceiling bands obviously fatal, striped and brighter at their inner edge, with the field between them low in contrast so the craft and the obstacles lead
          - id: backdrop
            type: texture
            tier: mvp
            description: Two-layer parallax background
            count: 2
            source_preference: procedural
            est_cost: 0
            spec: Tileable 512px, 2 layers at 0.15 and 0.4 parallax, one palette per wave
            role: background
            dimension: 2d
            readability: A quiet depth field that shifts hue per wave so progress is visible, never brighter than the craft
          - id: flip-vfx
            type: vfx
            tier: mvp
            description: Flip puff, close-pass streak and hit burst
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Particle presets, 120-400 ms
            role: vfx
            dimension: 2d
            readability: A puff at the point of every flip, a streak along a close pass, and a burst at the point of contact that shows what was hit and clears before the result card
          - id: streak-badge
            type: ui
            tier: mvp
            description: Streak badge, distance readout and the best marker
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: One badge with 8 steps, one rolling readout, one track marker
            role: ui
            dimension: 2d
            readability: The streak step countable at a glance at 24 px, the distance readout legible at 20 CSS px, and the best marker obviously a line the craft crosses
        audio:
          - id: music-run
            type: music
            tier: mvp
            description: Driving loop, one layer added per wave
            trigger: Run start
            loop: true
            source_preference: library
            est_cost: 40
          - id: sfx-flip
            type: sfx
            tier: mvp
            description: Flip whoosh, pitched by the direction of the flip
            trigger: Flip
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-pass
            type: sfx
            tier: mvp
            description: Close-pass tick, a semitone up per streak step
            trigger: Close pass
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-hit
            type: sfx
            tier: mvp
            description: Impact
            trigger: Run ends
            loop: false
            source_preference: library
            est_cost: 5
        post_mvp:
          - id: second-theme
            name: Second visual theme
            description: A second palette and obstacle skin from wave 4 on.
        optional:
          - id: weekly-seed
            name: Weekly seeded run
            description: A fixed obstacle sequence everyone plays for a week.
          - id: craft-skins
            name: Craft skins
            description: Cosmetic craft variants opened by distance.
      experience:
        goal: Tap to flip gravity and thread every gap - how far can you get?
        goal_metric: score
        lose:
          condition: Touching an obstacle, the floor or the ceiling ends the run.
        actions:
          flip:
            visual: Gravity inverts on the next frame, the craft rolls over and a puff marks the point of the flip.
            audio: Flip whoosh, pitched by the direction of the flip
            updates: [score]
        teaches: [flip]
        grace: {until: first-success}
        hud_metrics: {score: score, streak: streak, best: best}
      depth:
        features:
          - id: run-missions
            name: Run missions
            description: Three missions active at a time - pass 60 obstacles, hold a streak of 6, reach wave 4 - each replaced from a list of 30 when it is finished, kept across sessions.
          - id: wave-log
            name: Wave log
            description: A log of the six hazard waves, each filled in the first time a run reaches it and shown on the title screen as six stamps.
        meta:
          statement: Run -> finish missions and stamp the waves reached -> the next mission and the next wave stamp are waiting -> start the next run chasing them.
          tier: post-mvp
          delivered_by: run-missions
          persists:
            - kind: best-score
              what: Best distance
              tier: mvp
              delivered_by: new-best
            - kind: missions
              what: Active missions and their progress
              tier: post-mvp
              delivered_by: run-missions
            - kind: collection
              what: Wave stamps, of six
              tier: post-mvp
              delivered_by: wave-log
        goals:
          - id: next-gap
            horizon: short
            goal: Get through the gap ahead without touching anything.
            measure: obstacles passed
            tier: mvp
            delivered_by: hazards
          - id: beat-best
            horizon: mid
            goal: Beat the best distance at least once this session.
            measure: distance above the best
            tier: mvp
            delivered_by: new-best
          - id: next-wave
            horizon: mid
            goal: Reach the next wave in this run.
            measure: 20 s, then 40 s, then 60 s survived
            tier: mvp
            delivered_by: wave-2
          - id: missions-list
            horizon: long
            goal: Work through the mission list and stamp every wave.
            measure: missions finished of 30
            tier: post-mvp
            delivered_by: run-missions
        content:
          - id: shield
            kind: pickup
            name: Shield pickup
            introduced: From the third run, 15 s into a run
            at_s: 15
            after_runs: 2
            rule: A shield in a gap absorbs one hit when it is taken.
            tier: post-mvp
            delivered_by: shield-pickup
          - id: wave-2
            kind: obstacle
            name: Wave 2, spinning bars
            introduced: 20 s into a run
            at_s: 20
            rule: Spinning bars join the mix, so a gap has a timing as well as a height.
            tier: mvp
            delivered_by: wave-2
          - id: wave-3
            kind: obstacle
            name: Wave 3, staggered pillars
            introduced: 40 s into a run
            at_s: 40
            rule: Staggered pillars join the mix, so two flips are needed in under a second.
            tier: mvp
            delivered_by: wave-3
          - id: waves-4-6
            kind: obstacle
            name: Waves 4 to 6
            introduced: 60 s into a run
            at_s: 60
            rule: Crowns, moving floors and mixed sets cycle for the rest of the run.
            tier: mvp
            delivered_by: waves-4-6
          - id: missions
            kind: event
            name: Run missions
            introduced: From the fourth run
            after_runs: 3
            rule: Three missions are active at a time and are tracked across runs.
            tier: post-mvp
            delivered_by: run-missions
        first_session_ends_on: A new best, with the wave the run reached named on the result card and the next mission shown under it.
        hooks:
          - id: best-to-beat
            kind: best-score
            statement: My best is 40 m away and I know which flip was late.
            tier: mvp
            delivered_by: new-best
          - id: next-mission
            kind: missions
            statement: One mission is two obstacles from done.
            tier: post-mvp
            delivered_by: run-missions
      units:
        unit_arc: [teach, test, twist, breather, test, climax]
        objective_templates:
          - Survive {unit} for {s} s
          - Pass {count} obstacles in {unit} without a hit
          - Hold a streak of {few} through {unit}
          - Pass {count} obstacles in {unit} using at most {budget} flips
        success_template: The wave's {s} s pass without a hit.
        failure_template: Contact with an obstacle, the floor or the ceiling.
        numbers:
          count: {start: 8, step: 4, max: 40}
          few: {start: 3, step: 1, max: 8}
          budget: {start: 6, step: 3, max: 30}
        acceptance_templates:
          - Every gap in {unit} is at least 2.2 craft heights tall, measured from the wave data
          - A bot tapping at a fixed 500 ms interval survives less than half of {unit}'s {s} s
          - Wave {unit} uses at least 1 obstacle kind the wave before it did not
          - Scroll speed in {unit} is within 0.05 of its design value at 30 Hz and at 144 Hz
        introduce_order: [gravity-flip, hazards, score-streak]
        variation_cycle: [introduces, pattern_set, hazard_kind, tempo, objective]
        axis_profile:
          speed: {start: 0.2, step: 0.12}
          density: {start: 0.15, step: 0.13}
          variety: {start: 0.1, step: 0.15}
          precision: {start: 0.2, step: 0.08}

  shooter:
    label: Shooter
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: read the encounter, move and shoot, clear the wave, pick up what it leaves, face a harder mix
    nodes: [shooter]
    unit_kinds: [wave, encounter]
    progression_models: [linear-levels, unlock-track, endless-scaling]
    difficulty_models: [level-authored, time-ramp]
    ending: [finite, endless]
    axes:
      - id: enemy-count
        range: [0, 1]
        escalates: true
        probe: optional
        description: Enemies alive at once
      - id: enemy-variety
        range: [0, 1]
        escalates: true
        probe: required
        description: Distinct enemy kinds in the encounter
      - id: composition
        range: [0, 1]
        escalates: true
        probe: optional
        description: How enemy kinds combine to force a choice - shield plus rusher, sniper plus swarm
      - id: resource-pressure
        range: [0, 1]
        escalates: false
        probe: optional
        description: Ammo, health or cover scarcity
    win:
      shape: encounter-cleared
      per_unit: true
      description: Every enemy of the wave is down, or the boss falls
    lose:
      shape: health-zero
      per_unit: true
      description: The player's health reaches zero
    units: {min_mvp: 4, min_total: 10, generation: [authored, parametric]}
    variety: {dimensions: [introduces, enemy_mix, arena_layout, objective, weapon_available, pacing]}
    mastery:
      model: routing
      signals: [accuracy, wave-time, damage-taken]
      statement_required: true
    qa: {min_units_traversed: 3, reset_in_unit: false, checkpoint: false, min_new_kinds_per_unit: 1, failure_state: true}
    seed:
      archetype:
        id: twin-stick-waves
        label: Top-down wave shooter
        keywords: [shooter, shoot, twin-stick, twin stick, arena, wave, waves, enemy, enemies, aim, boss]
        signature: [shoot, aim, twin-stick, wave, waves, arena]
        dimension: 2d
        structure: level
        camera: Fixed on the arena; the whole arena and every spawn edge are on screen, no scrolling.
        orientation: landscape
        identity_affinity: [neon-night, signal-brutal, riso-arcade]
        fantasy: Reading a room full of trouble and taking it apart in the right order.
        core_loop: Read the wave's mix -> move to the angle that answers it -> hold fire and cut the dangerous kind first -> the wave clears -> the next wave adds a kind that breaks the last answer -> the boss asks for all of it.
        pillars:
          - Every enemy telegraphs before it can hurt the player
          - The whole arena is on screen, so nothing kills from off camera
          - A wave is lost to a decision, never to a surprise
        run_seconds: 60
        first_reward_s: 10
        content_units: 10
        content_unit_kind: wave
        retention_hooks: [progression, collection]
        return_reason: Wave 8 took me down with two shielded walkers left and I know which weapon answers them.
        progression_model: linear-levels
        difficulty_model: level-authored
        mechanics:
          - id: move
            name: Free movement
            tier: mvp
            description: The player moves in any direction and never has to stop to fire.
            rules:
              - The player moves at 260 px per second in any direction, reaching full speed in at most 0.08 s.
              - Firing never slows or stops movement.
              - The player is never spawned or respawned within 120 px of an enemy.
            parameters: {speed_px_s: 260, accel_s: 0.08, safe_spawn_px: 120}
          - id: aim-shoot
            name: Aim and shoot
            tier: mvp
            description: Aim is independent of movement, and the weapon fires while held.
            rules:
              - The weapon fires 4 shots a second along the aim direction while the input is held.
              - A shot travels 700 px per second, lives 0.9 s and deals 1 damage; it stops on the first enemy it meets.
              - Aim is readable without firing - a 64 px lead marker sits ahead of the player at all times.
            parameters: {fire_per_s: 4, shot_px_s: 700, shot_life_s: 0.9, shot_damage: 1}
          - id: enemies
            name: Enemy kinds
            tier: mvp
            description: Three enemy kinds that have to be answered differently.
            rules:
              - A rusher has 2 health and closes at 180 px per second straight at the player.
              - A spitter has 3 health, holds at 90 px per second and fires one slow shot every 1.5 s after a 500 ms telegraph.
              - A shielded walker has 6 health, moves at 70 px per second and takes no damage from the front, so it must be flanked.
            parameters: {rusher_health: 2, spitter_health: 3, walker_health: 6, telegraph_ms: 500}
          - id: waves
            name: Waves and boss
            tier: mvp
            description: A fixed sequence of waves against a five-point health pool, ending in a boss.
            rules:
              - A wave ends when its last enemy is down, and the next wave starts 3 s later with the arena cleared of shots.
              - The player has 5 health, a hit costs 1, and there is half a second of invulnerability after each hit.
              - Wave 10 is one boss with 40 health and three attack patterns, each telegraphed for 700 ms.
            parameters: {player_health: 5, wave_gap_s: 3, boss_health: 40, invuln_s: 0.5}
          - id: pickups
            name: Pickups
            tier: post-mvp
            description: Drops from downed enemies that heal or upgrade the weapon briefly.
            rules:
              - A downed enemy drops a health pickup with probability 0.15, at most 2 a wave.
              - A double-shot pickup lasts 8 s and does not stack with itself.
            parameters: {drop_chance: 0.15, drop_cap_per_wave: 2, double_shot_s: 8}
        actions:
          - id: move
            action: Move
            tier: mvp
            mechanic: move
            touch: Drag the left virtual stick
            mouse: Hold W, A, S, D or drag the left stick
            keyboard: W, A, S, D or the arrow keys
            gamepad: Left stick
          - id: aim-shoot
            action: Aim and shoot
            tier: mvp
            mechanic: aim-shoot
            touch: Drag the right virtual stick; firing is automatic while it is held
            mouse: Aim with the pointer, hold the left button to fire
            keyboard: Aim with the pointer, hold the left button or Space to fire
            gamepad: Right stick, fire automatic while it is held
        goals:
          moment: Cut down the kind that is about to reach you.
          session: Clear two or three waves further than last time.
          long_term: Clear all ten waves, boss included, without losing a run.
        progression_steps:
          - id: waves-1-3
            tier: mvp
            unlock_condition: Available from the start
            grants: Waves 1-3, rushers only, and the starting blaster
          - id: waves-4-7
            tier: mvp
            unlock_condition: Clear wave 3
            grants: Spitters, and the spread shot as a second weapon
          - id: waves-8-10
            tier: mvp
            unlock_condition: Clear wave 7
            grants: Shielded walkers, the piercing shot and the boss wave
        curve:
          - at: Waves 1-3
            description: Rushers only, at most 6 alive, spawning from one edge; a first-time player clears the wave before taking two hits.
            parameters: {alive_cap: 6, kinds: 1, spawn_edges: 1}
          - at: Waves 4-7
            description: Rushers and spitters together, up to 10 alive from two edges, so cover and angle start to matter.
            parameters: {alive_cap: 10, kinds: 2, spawn_edges: 2}
          - at: Waves 8-10
            description: All three kinds from three edges, up to 14 alive; wave 9 is a breather at half the count before the boss.
            parameters: {alive_cap: 14, kinds: 3, spawn_edges: 3}
        assist: After two failures on one wave, the next attempt starts with 7 health instead of 5 and that wave's spitters fire every 2 s.
        failure_condition: The player's health reaches zero.
        failure_feedback: Half a second of slow motion, the arena desaturates, the enemy that landed the last hit is ringed, and the result card shows the wave reached, the accuracy and the hits taken.
        rewards:
          - id: wave-clear
            tier: mvp
            trigger: The last enemy of a wave goes down
            grants: The wave is cleared and the next one is named
            feedback: The arena flashes once, the shots left on screen fade, and the next wave's kinds are shown as icons for the three-second gap.
          - id: no-hit-wave
            tier: mvp
            trigger: A wave is cleared without taking a hit
            grants: One health back, up to five, and a clean marker on the wave
            feedback: The health pip refills with a rising chord and the clean marker stamps beside the wave number.
          - id: weapon-unlocked
            tier: mvp
            trigger: A progression step grants a weapon
            grants: A second or third weapon, chosen before the next wave
            feedback: The weapon card slides in and fires once into the arena as a demonstration.
        hud:
          - id: health
            tier: mvp
            shows: Health, as five pips
            anchor: bottom-left
            updates_on: Each hit and each heal
            feedback: The lost pip cracks and the screen edge pulses red once
          - id: wave
            tier: mvp
            shows: Wave number and its clean marker
            anchor: top-center
            updates_on: Wave start and clear
            feedback: Counts up with the wave banner
          - id: enemies-left
            tier: mvp
            shows: Enemies still alive in this wave
            anchor: top-right
            updates_on: Each enemy down
            feedback: Ticks down with a pop, and turns the accent colour at the last one
        tutorial:
          approach: diegetic
          rationale: Move and shoot are one gesture each; wave 1 is built so the first rusher arrives alone and slowly, which teaches both without a sentence.
          steps:
            - id: first-move
              tier: mvp
              trigger: Wave 1 start, first time
              prompt: The arena is empty, the left stick zone glows, and a ring on the floor asks the player to step into it
              completes_on: The player moves into the ring
            - id: first-kill
              tier: mvp
              trigger: Wave 1, first rusher
              prompt: One rusher walks in at half speed with the right stick zone glowing and a dotted line from the player to it
              completes_on: The player downs the first rusher
        assets:
          - id: player
            type: spritesheet
            tier: mvp
            description: Player character with idle, move, fire and hit frames
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector-drawn, 64px, 8 move frames, 2 fire frames, 2 hit frames, 8 facings
            role: player
            dimension: 2d
            readability: One silhouette in the identity's lead accent with a clearly drawn weapon arm, its facing readable at 48 px from above, and plainly flashing white for the half second after a hit
          - id: enemies
            type: spritesheet
            tier: mvp
            description: Rusher, spitter and shielded walker, each with move, telegraph and death frames
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Vector, 56px, 6 move frames and a 3-frame telegraph each
            role: threat
            dimension: 2d
            readability: Three enemies told apart by silhouette alone at 40 px - the rusher a lean wedge, the spitter a round body with a barrel, the walker a broad slab with a visible shield plate on its front - each in the danger palette and never in the player's colour, and each unmistakable while it telegraphs
          - id: shots
            type: sprite
            tier: mvp
            description: Player shot and enemy shot
            count: 2
            source_preference: procedural
            est_cost: 0
            spec: Vector, 16px and 24px, with a 3-frame trail
            role: projectile
            dimension: 2d
            readability: The player's shot a thin bright dart, the enemy's a fatter slower orb in the danger colour, each drawn with a trail that is visible for at least three frames so a player can see it travel and get out of the way
          - id: arena
            type: texture
            tier: mvp
            description: Arena floor, wall band and the spawn-edge markers
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Tileable 256px floor, wall band, three edge markers
            role: environment
            dimension: 2d
            readability: A floor low enough in contrast that every shot reads against it, walls plainly the arena's limit, and each spawn edge marked before enemies come through it
          - id: backdrop
            type: texture
            tier: mvp
            description: Ground outside the arena walls
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Gradient plus a grid overlay
            role: background
            dimension: 2d
            readability: A quiet surround outside the walls that never competes with the arena floor
          - id: combat-vfx
            type: vfx
            tier: mvp
            description: Muzzle flash, enemy hit spark, enemy death burst and player hit flash
            count: 4
            source_preference: procedural
            est_cost: 0
            spec: Particle presets, 80-400 ms
            role: vfx
            dimension: 2d
            readability: A muzzle flash on every shot, a spark on every enemy hit so damage is never silent, a burst where an enemy dies, and a full-screen edge flash the player cannot miss when they are hit
          - id: health-bar
            type: ui
            tier: mvp
            description: Health pips, wave banner and the enemies-left counter
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Five pip states, one banner, one counter
            role: ui
            dimension: 2d
            readability: Pips countable at a glance at 24 px, the wave banner legible for its full 3 s at 28 CSS px, and the enemies-left counter readable without looking away from the player
          - id: health-pickup
            type: sprite
            tier: post-mvp
            description: Health and double-shot pickups
