  strategy:
    label: Strategy (tower defense)
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: read the wave preview, spend on placements and upgrades, hold the wave, bank what is left, answer a harder mix
    nodes: [strategy, tower-defense]
    unit_kinds: [wave, map, scenario]
    progression_models: [linear-levels, unlock-track, meta-currency]
    difficulty_models: [level-authored]
    ending: [finite]
    axes:
      - id: decision-density
        range: [0, 1]
        escalates: true
        probe: optional
        description: Placements and upgrades the wave demands per minute
      - id: economy-pressure
        range: [0, 1]
        escalates: true
        probe: optional
        description: Income against the cost of the answer the wave needs
      - id: opponent-escalation
        range: [0, 1]
        escalates: true
        probe: required
        description: Enemy count, speed and armour
      - id: composition
        range: [0, 1]
        escalates: true
        probe: optional
        description: Enemy kinds mixed so one tower type is not enough
    win:
      shape: survive-all-waves
      per_unit: true
      description: Every wave of the map is held
    lose:
      shape: base-health-zero
      per_unit: true
      description: The base's lives reach zero
    units: {min_mvp: 4, min_total: 10, generation: [authored, parametric]}
    variety: {dimensions: [introduces, enemy_mix, path_shape, economy_rule, objective, tower_available]}
    mastery:
      model: planning
      signals: [leaks, gold-banked, waves-held-clean]
      statement_required: true
    qa: {min_units_traversed: 2, reset_in_unit: false, checkpoint: false, min_new_kinds_per_unit: 1, failure_state: true, resource_metric: gold}
    seed:
      archetype:
        id: path-defense
        label: Path tower defense
        keywords: [strategy, tower, towers, defense, defence, lane, lanes, wave, waves, place, upgrade, gold, base]
        signature: [tower, towers, place a tower, lane, waves, defend the base]
        dimension: 2d
        structure: level
        camera: Fixed on the whole map; both paths, every build site and the base are on screen at once.
        orientation: landscape
        identity_affinity: [paper-diorama, lacquer-brass, signal-brutal]
        fantasy: Reading what is coming and having the answer already built.
        core_loop: Read the wave the map announces -> spend gold on the tower that answers it -> watch the paths and upgrade or sell mid-wave -> hold the base -> bank the wave bonus -> the next wave breaks the answer that just worked.
        pillars:
          - The next wave's kinds are known before a single coin is spent
          - Every wrong build is recoverable, at a price the player can see
          - A leak is always traceable to one path and one decision
        run_seconds: 120
        first_reward_s: 20
        content_units: 10
        content_unit_kind: wave
        retention_hooks: [progression, collection]
        return_reason: Wave 8 leaked twice down the left path and I know which tower I should have sold.
        progression_model: linear-levels
        difficulty_model: level-authored
        mechanics:
          - id: placement
            name: Tower placement
            tier: mvp
            description: Towers go on the map's marked build sites, one tower a site, and fire at enemies in range.
            rules:
              - A tower is placed only on a marked build site, one tower a site, and starts firing within 0.5 s of being placed.
              - Selecting a site shows the tower's range ring and its damage per second before any gold is spent.
              - A tower's shots travel 600 px per second and stop on the first enemy they meet, so range and angle both matter.
            parameters: {sites_map_1: 8, place_delay_s: 0.5, shot_px_s: 600}
          - id: upgrades
            name: Upgrade and sell
            tier: mvp
            description: Three levels a tower, and a sell price that makes a wrong answer recoverable.
            rules:
              - Each tower has three levels; an upgrade costs 1.6 times the level before it, raising damage 70% and range 10%.
              - Selling a tower returns 60% of everything spent on it, at once, to the gold counter.
              - A tower may be upgraded or sold during a wave, so a leak can be answered while it is happening.
            parameters: {levels: 3, cost_step: 1.6, damage_step: 0.7, sell_ratio: 0.6}
          - id: waves
            name: Waves, enemy kinds and base lives
            tier: mvp
            description: A fixed wave sequence of three enemy kinds walking two paths toward a base with ten lives.
            rules:
              - A wave's kinds and counts are shown 8 s before it starts, and the next wave starts 8 s after the last enemy of the one before is down or has leaked.
              - Three enemy kinds walk the paths - a sprinter with 10 health at 110 px per second, a shielded walker with 40 health that takes half damage from the front, and a flier with 15 health that ignores the path and is only hit by towers marked anti-air.
              - An enemy reaching the base costs one of its 10 lives, and zero lives fails the map.
            parameters: {base_lives: 10, announce_s: 8, wave_gap_s: 8, lanes: 2}
          - id: economy
            name: Gold
            tier: mvp
            description: Gold comes only from play, so a leak costs twice.
            rules:
              - A downed enemy pays gold equal to a tenth of its health, and holding a whole wave pays a 25 gold bonus.
              - The map starts with 150 gold, which buys exactly two level-one towers.
              - Gold is never bought with money and never granted outside play.
            parameters: {start_gold: 150, wave_bonus: 25, kill_pay_ratio: 0.1}
          - id: abilities
            name: Strike ability
            tier: post-mvp
            description: A tapped strike on a cooldown, for the leak nothing else can answer.
            rules:
              - The strike deals 30 damage in a 120 px radius and has a 45 s cooldown shown on its button.
              - The strike is never available in the first 20 s of a wave, so it cannot replace a build.
            parameters: {strike_damage: 30, radius_px: 120, cooldown_s: 45}
        actions:
          - id: place
            action: Place a tower
            tier: mvp
            mechanic: placement
            touch: Tap a build site, then tap the tower in the tray
            mouse: Click a build site, then click the tower in the tray
            keyboard: Tab cycles build sites, 1 to 3 place a tower
            gamepad: D-pad cycles sites, A places the selected tower
          - id: upgrade
            action: Upgrade a tower
            tier: mvp
            mechanic: upgrades
            touch: Tap a tower, then tap its upgrade button
            mouse: Click a tower, then click its upgrade button
            keyboard: Tab selects a tower, U upgrades it
            gamepad: D-pad selects a tower, Y upgrades it
          - id: sell
            action: Sell a tower
            tier: mvp
            mechanic: upgrades
            touch: Tap a tower, then hold its sell button for half a second
            mouse: Click a tower, then click its sell button
            keyboard: Tab selects a tower, X sells it
            gamepad: D-pad selects a tower, B sells it
        goals:
          moment: Get a tower in range of the path that is about to leak.
          session: Hold two waves further than last time.
          long_term: Hold all ten waves with all ten base lives.
        progression_steps:
          - id: waves-1-4
            tier: mvp
            unlock_condition: Available from the start
            grants: Waves 1-4, sprinters only, and the dart tower
          - id: waves-5-7
            tier: mvp
            unlock_condition: Hold wave 4
            grants: Shielded walkers, and the frost tower that slows them
          - id: waves-8-10
            tier: mvp
            unlock_condition: Hold wave 7
            grants: Fliers, the anti-air cannon, and the final mixed wave
        curve:
          - at: Waves 1-3
            description: Sprinters in one path, 8 to 14 of them, paying enough gold that two towers become four; the base cannot realistically be reached.
            parameters: {kinds: 1, count: 14, lanes_used: 1}
          - at: Waves 4-7
            description: Both lanes used and shielded walkers mixed into the sprinters, so one tower type is no longer enough.
            parameters: {kinds: 2, count: 24, lanes_used: 2}
          - at: Waves 8-10
            description: Fliers over both lanes with walkers underneath; wave 9 is a breather at half the count before the final mixed wave.
            parameters: {kinds: 3, count: 36, lanes_used: 2}
        assist: After two failures on one wave, the next attempt starts with 50 extra gold and the path the leak came down is highlighted for the whole wave.
        failure_condition: The base's lives reach zero.
        failure_feedback: The base cracks and the camera pushes in on it, the wave that broke through replays as a two-second route overlay, and the card shows which lane leaked, how many leaked, and how much gold was still banked.
        rewards:
          - id: wave-held
            tier: mvp
            trigger: The last enemy of a wave goes down
            grants: The wave is held, and 25 gold
            feedback: The wave banner stamps held, the gold counts up coin by coin, and the next wave's kinds appear as icons.
          - id: clean-wave
            tier: mvp
            trigger: A wave is held without losing a base life
            grants: A clean marker on the wave and 25 more gold
            feedback: The base pulses once in the accent colour and the clean marker stamps beside the wave number.
          - id: map-clear
            tier: mvp
            trigger: The last wave of the map is held
            grants: The map is cleared, with one to three stars by lives left
            feedback: Stars stamp in one by one over a slow pan across the surviving towers.
        hud:
          - id: gold
            tier: mvp
            shows: Gold banked, and the cost of the selected tower
            anchor: top-left
            updates_on: Each kill, each build, each sale
            feedback: Counts up coin by coin, and a cost the player cannot afford greys out
          - id: lives
            tier: mvp
            shows: Base lives left, of ten
            anchor: top-right
            updates_on: Each leak
            feedback: The base flashes and the counter shakes on every leak
          - id: wave
            tier: mvp
            shows: Wave number, its kinds and the countdown to it
            anchor: top-center
            updates_on: Wave announce, start and end
            feedback: The countdown ring drains in the last 8 s
        tutorial:
          approach: guided-first-run
          rationale: Placing, upgrading and selling are three different gestures on the same object, and one demonstration each removes the only real barrier.
          steps:
            - id: first-place
              tier: mvp
              trigger: Wave 1 announce, first time
              prompt: One build site glows beside the path with the dart tower lifted out of the tray and a hand resting on it
              completes_on: The player places a tower on that site
            - id: first-upgrade
              tier: mvp
              trigger: After wave 1 is held
              prompt: The placed tower pulses with its upgrade button open and the gold counter circled
              completes_on: The player upgrades that tower
        assets:
          - id: enemies
            type: spritesheet
            tier: mvp
            description: Sprinter, shielded walker and flier, each with walk, hit and death frames
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Vector, 48px, 6 walk frames and 3 death frames each
            role: threat
            dimension: 2d
            readability: Three enemies told apart by silhouette at 36 px - the sprinter lean and leaning forward, the walker broad with a shield plate drawn on its front, the flier winged and above the lane - all in the danger palette, with health bars only while damaged
          - id: towers
