# Genre models: the content shape a game of each family must state, and the bars it is held to.
#
# A game-design (core/artifacts/game-design.schema.json, 1.9.0) names its family in `genre`
# and lists its content in `build_spec.content.units[]` - every level, wave, track, encounter,
# scenario or round the player meets, with its purpose, objective, mechanics, difficulty on
# the family's named axes, duration, success, failure and acceptance. This file says, per
# family, what that list must look like: the unit kinds, the progression and difficulty
# models that fit, the axes difficulty is measured on, the shape of win and loss, how many
# units a prototype and a release carry, what counts as variety, and how mastery shows.
#
# Read by:
#   scripts/wgf_design/content.py          the design step's content check (rule ids content.*)
#   scripts/wgf_design/seed.py             the deterministic genre seed author (`seed` blocks)
#   scripts/wgf_develop/brief.py           the developer brief and the content data-file check
#   scripts/wgf_playability/analysis.py    the genre-aware playability checks (`qa` blocks)
#   scripts/wgf_techplan/devplan.py        content tasks (`implementation`)
#
# Universal contract + genre rules as data. No consumer branches on a family id: everything a
# family changes is a value here. A new family is a new entry, never a new code path.
#
# "casual" is not a family. It is a session profile (`genre.session_profile`) that tightens
# unit length, first-session length and how many axes a unit may raise at once; it never
# changes what the game is.
#
# Families cover the research vocabulary's genre nodes (core/reference/research-vocabulary.yaml):
# a node resolves to the family whose `nodes` lists it or its nearest listed ancestor. Nodes
# no family lists (io, card, board, word, physics sandbox, sports) are capability gaps, kept
# as such by research; they are not forced into a family that does not fit them.
#
# Change a bar only with a reason a person could defend from a playtest; a looser bar here lets
# a one-level prototype through as a game.

version: 1.0.0

session_profiles:
  # max_unit_s: the longest a single unit is designed to last. max_first_session_s: the
  # first session. relief_every_units: at most this many units between breathers (purpose
  # `breather`, or a unit whose every axis dips). max_axes_raised_per_unit: a unit raises at
  # most this many axes over the previous one (core/craft/core-loop-and-difficulty.md).
  casual:   {max_unit_s: 90,  max_first_session_s: 300, relief_every_units: 3, max_axes_raised_per_unit: 1}
  standard: {max_unit_s: 240, max_first_session_s: 900, relief_every_units: 5, max_axes_raised_per_unit: 2}

variety:
  # Bars content.py reads for every family unless the family overrides a key.
  # Consecutive units differ on at least this many of the family's variety dimensions
  # (`variation_from_previous`).
  min_dimensions_changed_between_units: 1
  # A unit whose only change is a number (no new mechanic, same objective, same declared
  # variety dimensions) is scaling-only; at most this many in a row.
  max_consecutive_scaling_only_units: 2
  # Every MVP mechanic is used in at least this many units after the unit that introduces it.
  mechanic_reuse_min_units: 2
  # At most this share of units may share one normalized objective.
  max_identical_objectives_ratio: 0.5
  # Acceptance: at least this many lines per unit; two lines anywhere in the design closer
  # than this (token-set Jaccard) are near-duplicates.
  acceptance_min_items: 2
  acceptance_max_similarity: 0.8
  # Relief: a dip on an axis no deeper than this share of the previous value is a breather,
  # not a regression; deeper, or not recovered within `relief_recovery_units`, breaches.
  relief_dip_max: 0.35
  relief_recovery_units: 2
  # An escalating axis ends at least this much higher (of its 0..1 range) on the last MVP
  # unit than on the first: a rise of a few hundredths satisfies "higher" and teaches
  # nothing.
  min_axis_rise: 0.1

implementation:
  # The developer writes every MVP unit as data (public/content/units.json) with the design's
  # difficulty values; a value may differ from the design's by at most this (absolute, on the
  # axis's 0..1 range) before the content check reports it.
  difficulty_tolerance: 0.05
  # The tech plan groups MVP units into tasks of at most this many.
  task_batch: 3
  content_unit_hours: 1.5

# ---------------------------------------------------------------------------------------------
# Families. Keys:
#   nodes               research-vocabulary genre nodes the family covers (subtrees included)
#   unit_kinds          allowed build_spec.content.unit_kind values
#   progression_models  allowed build_spec.progression.model values
#   difficulty_models   allowed build_spec.difficulty.model values
#   ending              allowed genre.ending values; `finite` requires build_spec.experience.win
#   axes                the difficulty dimensions, each 0..1; `escalates`: the axis must end
#                       higher than it starts over the MVP units; `probe`: the build reports it
#                       as metrics.difficulty.<id> (required | optional)
#   win / lose          the shape of success and failure; per_unit: every unit states its own
#   units               min_mvp: MVP units the prototype builds; min_total: units at any tier
#                       a release carries; generation: allowed build_spec.content.generation.mode
#   variety.dimensions  what `variation_from_previous` may name
#   mastery             how a player gets better: the model, the signals a hud metric shows
#   qa                  parameters the playability checks read (fixed vocabulary:
#                       min_units_traversed, reset_in_unit, checkpoint, min_new_kinds_per_unit,
#                       resource_metric, time_target_axis, failure_state, endless_window_s)
#   seed                what the genre seed author starts a design from (scripts/wgf_design/seed.py).
#                       `seed.units` templates are rendered per unit, and every placeholder
#                       names what it means - one symbol, one meaning, so a renderer can give
#                       each a number a player could read:
#                         {unit}    the unit's id
#                         {s}       seconds the unit is designed to take (its duration)
#                         {count}   how many things it sends, holds or asks for
#                         {kinds}   distinct kinds of thing in play at once
#                         {few}     a small number the player counts at a glance
#                         {budget}  a spend or limit it allows: moves, gold, cash, flips
#                         {level}   a tier or level number
#                       A quantity the seed already pins (three gems, ten base lives, three
#                       rivals) is written as a literal, never as a placeholder that rises.
#                       `seed.units.numbers` gives the scale this family counts in per
#                       placeholder - {start, step, max} against the unit's index; the rest
#                       take scripts/wgf_design/seed.py's defaults.
# ---------------------------------------------------------------------------------------------
families:

  puzzle:
    label: Level puzzle
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: read the level, plan the moves, solve it, advance to a harder level that adds a rule or tightens the budget
    nodes: [puzzle, match, match-3, tile-match, bubble-shooter, merge-puzzle, block-puzzle, sort-puzzle, physics-puzzle, logic-puzzle, screw-puzzle]
    unit_kinds: [level]
    progression_models: [linear-levels, unlock-track]
    difficulty_models: [level-authored]
    ending: [finite]
    axes:
      - id: depth
        range: [0, 1]
        escalates: true
        probe: optional
        description: Moves of lookahead a clean solution needs
      - id: move-limit
        range: [0, 1]
        escalates: true
        probe: optional
        description: How tight the move or time budget is against the clean solution
      - id: board-complexity
        range: [0, 1]
        escalates: false
        probe: optional
        description: Board size, blockers, locked cells, irregular shape
      - id: piece-variety
        range: [0, 1]
        escalates: true
        probe: optional
        description: Distinct piece or rule kinds in play at once
    win:
      shape: goal-state-reached
      per_unit: true
      description: The level's goal counters reach zero or the target state is reached
    lose:
      shape: budget-exhausted
      per_unit: true
      description: Moves or time run out before the goal; the level restarts intact
    units: {min_mvp: 6, min_total: 20, generation: [authored, parametric]}
    variety: {dimensions: [introduces, objective, board_shape, blocker_set, rule_twist, pacing]}
    mastery:
      model: reading
      signals: [moves-left, stars, solve-time]
      statement_required: true
    qa: {min_units_traversed: 4, reset_in_unit: true, checkpoint: false, min_new_kinds_per_unit: 0, failure_state: true}
    seed:
      archetype:
        id: grid-logic
        label: Colour grid logic puzzle
        keywords: [puzzle, logic, grid, board, tile, tiles, colour, slide, line, clear, deduction]
        signature: [slide, slide a row, logic grid, line of three, colour line]
        dimension: 2d
        structure: level
        camera: Fixed, the board centred, no scrolling.
        orientation: portrait
        identity_affinity: [paper-diorama, lacquer-brass, riso-arcade]
        fantasy: Seeing three moves ahead on a board that holds still while you think.
        core_loop: Read the board -> slide one row or column -> lines of three clear and the board opens up -> the tile counter falls -> clear the board inside the move budget -> the next level adds a colour or takes moves away.
        pillars:
          - A slide is fully predictable before the player commits to it
          - The board never changes except by a move the player made
          - A level is readable in one glance and finished inside ninety seconds
        run_seconds: 90
        first_reward_s: 20
        content_units: 20
        content_unit_kind: level
        retention_hooks: [progression, collection]
        return_reason: I left a star on level 12 and I can already see the slide I missed.
        progression_model: linear-levels
        difficulty_model: level-authored
        mechanics:
          - id: board
            name: Colour board
            tier: mvp
            description: A 6x6 grid of coloured tiles with a few anchored cells that never move.
            rules:
              - The board is 6x6; every cell holds one coloured tile or one anchored cell.
              - Between two and four colours are in play, and every colour on a board appears at least three times.
              - Every authored board is solvable inside its move budget, and the level data stores that solution's length.
            parameters: {cols: 6, rows: 6, colours_min: 2, colours_max: 4, anchors_max: 4}
          - id: slide
            name: Row and column slide
            tier: mvp
            description: One drag shifts a whole row or column by one cell and wraps the tile that leaves the board back in at the far end.
            rules:
              - A slide moves every tile of one row or column exactly one cell and wraps the edge tile to the other end.
              - A slide costs one move whether or not it clears anything.
              - A row or column holding an anchored cell cannot be slid at all.
            parameters: {shift_cells: 1, slide_ms: 140, cost_moves: 1}
          - id: line-clear
            name: Line clear
            tier: mvp
            description: Three or more tiles of one colour in an orthogonal line clear once the slide settles.
            rules:
              - After a slide settles, every orthogonal line of three or more tiles of one colour clears at once.
              - A cleared cell stays empty - nothing falls into it, so the board opens up as the level goes on.
              - Two or more lines clearing from one slide pay a chain bonus of 50 points for each extra line.
            parameters: {min_line: 3, settle_ms: 180, chain_bonus: 50}
          - id: level-goal
            name: Move budget and goal
            tier: mvp
            description: Each level asks for every coloured tile to be cleared inside a stated move budget.
            rules:
              - Clearing a tile decrements the level's tile counter.
              - The counter reaching zero clears the level, and each unspent move pays 25 bonus points.
              - Moves reaching zero with tiles left fails the level and offers an immediate retry on the same board.
            parameters: {moves_level_1: 18, moves_min: 9, unspent_move_points: 25}
          - id: locked-tiles
            name: Locked tiles
            tier: post-mvp
            description: Tiles under a lock take two clears beside them before they join a slide.
            rules:
              - A locked tile does not move and does not count toward a line.
              - Two clears orthogonally adjacent to a locked tile break the lock.
            parameters: {clears_to_unlock: 2}
        actions:
          - id: slide-row
            action: Slide a row one cell
            tier: mvp
            mechanic: slide
            touch: Drag any tile left or right
            mouse: Drag any tile left or right
            keyboard: Arrows move the cursor, then Shift with Left or Right slides that row
            gamepad: D-pad cursor, shoulder buttons slide the row
          - id: slide-column
            action: Slide a column one cell
            tier: mvp
            mechanic: slide
            touch: Drag any tile up or down
            mouse: Drag any tile up or down
            keyboard: Arrows move the cursor, then Shift with Up or Down slides that column
            gamepad: D-pad cursor, triggers slide the column
        goals:
          moment: Find the slide that completes a line of three.
          session: Clear three levels without dropping a star.
          long_term: Three-star all 20 levels.
        progression_steps:
          - id: levels-1-6
            tier: mvp
            unlock_condition: Available from the start
            grants: Levels 1-6, two colours and six moves of slack over the clean solution
          - id: levels-7-13
            tier: mvp
            unlock_condition: Clear level 6
            grants: A third colour and the first anchored cells
          - id: levels-14-20
            tier: mvp
            unlock_condition: Clear level 13
            grants: A fourth colour and move budgets within one move of the clean solution
        curve:
          - at: Levels 1-3
            description: Two colours, no anchored cells, six moves of slack; the level cannot realistically be failed.
            parameters: {colours: 2, moves_slack: 6, anchors: 0}
          - at: Levels 4-13
            description: A third colour and up to two anchored cells; slack falls to three moves.
            parameters: {colours: 3, moves_slack: 3, anchors: 2}
          - at: Levels 14-20
            description: Four colours and up to four anchored cells; slack falls to one move, and every fourth level is a breather with slack back at four.
            parameters: {colours: 4, moves_slack: 1, anchors: 4}
        assist: After two failed attempts on one level, the next attempt starts with two extra moves and outlines one solvable line once.
        failure_condition: Moves reach zero with coloured tiles still on the board.
        failure_feedback: The board dims, the tile counter shakes, the last slide replays once, and the fail card shows how many tiles were left.
        rewards:
          - id: chain
            tier: mvp
            trigger: Two or more lines clear from one slide
            grants: A chain bonus of 50 points for each extra line
            feedback: Each line clears in turn at a rising pitch, and the bonus counts up on the score.
          - id: level-clear
            tier: mvp
            trigger: The last coloured tile clears
            grants: The level is cleared, with one to three stars by moves left
            feedback: Stars stamp in one by one with a chord, and the next level's number slides in.
          - id: moves-saved
            tier: mvp
            trigger: A level is cleared with at least a third of its move budget unspent
            grants: The third star and 25 points for each unspent move
            feedback: Unspent moves fly into the score one at a time.
        hud:
          - id: moves
            tier: mvp
            shows: Moves remaining
            anchor: top-left
            updates_on: Each slide
            feedback: Turns the danger colour at three moves left
          - id: tiles-left
            tier: mvp
            shows: Coloured tiles still on the board
            anchor: top-center
            updates_on: Each clear
            feedback: Ticks down with one pop per line
          - id: level
            tier: mvp
            shows: Level number and the stars already earned on it
            anchor: top-right
            updates_on: Level start
        tutorial:
          approach: diegetic
          rationale: The first board has exactly one slide that clears a line, and its shape teaches the rule without a sentence.
          steps:
            - id: first-slide
              tier: mvp
              trigger: Level 1 start, first time
              prompt: Three tiles of one colour sit one cell apart in the bottom row, and that row glows under a drifting hand
              completes_on: The player slides that row and the line clears
            - id: column-slide
              tier: mvp
              trigger: Level 1, after the first clear
              prompt: The only line left needs a column slide, and that column glows
              completes_on: The player slides a column
        assets:
          - id: tiles
            type: sprite
            tier: mvp
            description: Four tile colours with idle, selected and clearing states
            count: 4
            source_preference: procedural
            est_cost: 0
            spec: Vector, 96px, distinct by shape as well as by colour
            role: target
            dimension: 2d
            readability: Four tiles told apart by shape as much as colour - circle, square, triangle, hexagon - each recognisable at 40 px in a full board, and a line of three readable as one group before the clear
          - id: board-frame
            type: ui
            tier: mvp
            description: Board frame, cell backing and the anchored-cell plate
            count: 2
            source_preference: procedural
            est_cost: 0
            spec: 9-slice frame plus one anchored-cell plate
            role: environment
            dimension: 2d
            readability: A board that is plainly a 6x6 grid, its cell backing quieter than every tile, and the anchored cells unmistakably bolted down at 40 px
          - id: clear-vfx
            type: vfx
            tier: mvp
            description: Line clear burst and chain streak
            count: 2
            source_preference: procedural
            est_cost: 0
            spec: Particle presets, 300 ms
            role: vfx
            dimension: 2d
            readability: A burst on each cleared cell and a streak along a chain, readable without hiding the tiles that slide in behind them
          - id: backdrop
            type: texture
            tier: mvp
            description: Ground behind the board
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Gradient plus a paper texture overlay
            role: background
            dimension: 2d
            readability: A quiet ground behind the board, lower in contrast than the board so the tiles lead the frame
          - id: counter-bar
            type: ui
            tier: mvp
            description: Move counter, tile counter and the star row, drawn in the identity kit
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: One bar, three slots, star states empty and filled
            role: ui
            dimension: 2d
            readability: Moves left and tiles left legible at 18 CSS px on a phone, the move counter changing colour at three left, and the star row readable without a label
          - id: locked-tile
            type: sprite
            tier: post-mvp
            description: Locked tile and its two break states
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector, 96px, two damage states
            role: target
            dimension: 2d
            readability: A tile behind a visible lock, told apart from an ordinary tile at 40 px, with its two break states obviously a countdown
        audio:
          - id: music-think
            type: music
            tier: mvp
            description: Unhurried loop under play
            trigger: Level start
            loop: true
            source_preference: library
            est_cost: 40
          - id: sfx-slide
            type: sfx
            tier: mvp
            description: Slide click, one per cell of travel
            trigger: Slide
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-clear
            type: sfx
            tier: mvp
            description: Line clear pop, pitched up per chain step
            trigger: Line clear
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-stars
            type: sfx
            tier: mvp
            description: Star stamp chord
            trigger: Level clear
            loop: false
            source_preference: library
            est_cost: 5
        post_mvp:
          - id: level-set-2
            name: Second level set
            description: Levels 21-40, built around locked tiles and boards with a hole in the middle.
        optional:
          - id: daily-board
            name: Daily board
            description: One seeded board a day, the same for everyone, with a days-played streak.
          - id: timed-mode
            name: Timed mode
            description: The same boards against a clock instead of a move budget.
      experience:
        goal: Clear every coloured tile before your moves run out.
        goal_metric: tiles-left
        win:
          condition: Every coloured tile is cleared from the board.
          metric: tiles-left
        lose:
          condition: Moves reach zero with coloured tiles left on the board.
          metric: moves
        actions:
          slide-row:
            visual: The whole row shifts one cell, the wrapped tile slides in from the far edge, and any completed line flashes before it clears.
            audio: Slide click, then a rising tick for each line cleared
            updates: [moves, tiles-left]
          slide-column:
            visual: The whole column shifts one cell, the wrapped tile slides in from the far edge, and any completed line flashes before it clears.
            audio: Slide click, then a rising tick for each line cleared
            updates: [moves, tiles-left]
        teaches: [slide-row, slide-column]
        grace: {until: first-success}
        hud_metrics: {moves: moves, tiles-left: tiles-left, level: level}
      depth:
        features:
          - id: level-stars
            name: Level stars
            description: One to three stars a level by moves left, kept across sessions; replaying a level keeps the most stars, and the level map shows the total out of 60.
          - id: colour-mastery
            name: Colour mastery track
            description: A track counting lines cleared per colour across sessions, opening a board theme at 50, 150 and 400 lines.
        meta:
          statement: Clear a level -> earn its stars and open the next -> the star total opens the next level set and a board theme -> come back for the stars left behind.
          tier: mvp
          delivered_by: levels-7-13
          persists:
            - kind: stage-progress
              what: Levels cleared and the level the player is on
              tier: mvp
              delivered_by: levels-7-13
            - kind: collection
              what: Stars earned per level
              tier: post-mvp
              delivered_by: level-stars
            - kind: cosmetics
              what: Board themes opened by the colour mastery track
              tier: post-mvp
              delivered_by: colour-mastery
        goals:
          - id: next-line
            horizon: short
            goal: Find the slide that completes a line of three.
            measure: lines cleared
            tier: mvp
            delivered_by: line-clear
          - id: clear-level
            horizon: mid
            goal: Clear this level with at least two stars.
            measure: stars earned on the level
            tier: mvp
            delivered_by: level-clear
          - id: clear-set
            horizon: long
            goal: Clear all 20 levels.
            measure: levels cleared of 20
            tier: mvp
            delivered_by: levels-14-20
          - id: all-stars
            horizon: long
            goal: Three-star every level.
            measure: stars of 60
            tier: post-mvp
            delivered_by: level-stars
        content:
          - id: third-colour
            kind: piece
            name: Third colour
            introduced: From level 7
            after_runs: 6
            rule: Boards carry three colours, so a slide that helps one colour can break another.
            tier: mvp
            delivered_by: levels-7-13
          - id: anchored-cells
            kind: obstacle
            name: Anchored cells
            introduced: From level 7, 30 s into the level
            at_s: 30
            after_runs: 6
            rule: An anchored cell locks its row and its column out of sliding.
            tier: mvp
            delivered_by: levels-7-13
          - id: tight-budgets
            kind: modifier
            name: Tight move budgets
            introduced: From level 14
            after_runs: 13
            rule: Move budgets fall to within one move of the clean solution.
            tier: mvp
            delivered_by: levels-14-20
          - id: locked-tiles
            kind: special-piece
            name: Locked tiles
            introduced: From level 21
            after_runs: 20
            rule: A tile under a lock needs two clears beside it before it slides.
            tier: post-mvp
            delivered_by: locked-tiles
          - id: board-themes
            kind: zone
            name: Board themes
            introduced: After 50 lines of one colour
            after_runs: 4
            rule: A new board palette and tile set from the colour mastery track.
            tier: post-mvp
            delivered_by: colour-mastery
        first_session_ends_on: A cleared level with its stars stamped, and the next level's colour count shown on the card.
        hooks:
          - id: next-level
            kind: stage-map
            statement: There is a next level and I can already see its board.
            tier: mvp
            delivered_by: levels-7-13
          - id: missing-stars
            kind: collection
            statement: I left a star on level 12 and I know the slide I missed.
            tier: post-mvp
            delivered_by: level-stars
      units:
        unit_arc: [teach, teach, test, twist, breather, test, climax]
        objective_templates:
          - Clear all {count} coloured tiles of {unit} in {budget} moves
          - Clear all {count} coloured tiles of {unit} in {budget} moves without sliding one row twice in a row
          - Clear every tile of the {kinds} target colours in {unit} in {budget} moves
          - Clear all {count} tiles of {unit} in {budget} moves around {few} anchored cells
        success_template: Every coloured tile is cleared with at least one move left.
        failure_template: Moves reach zero with coloured tiles still on the board.
        numbers:
          count: {start: 14, step: 2, max: 52}
          budget: {start: 24, step: 1, max: 44}
          kinds: {start: 2, step: 1, max: 4}
          few: {start: 1, step: 1, max: 4}
        acceptance_templates:
          - A recorded solution clears {unit} inside its {budget} moves with at least 2 to spare, and the level data stores that length
          - A bot sliding at random fails {unit} in at least 9 of 10 attempts
          - Clearing the last tile of {unit} shows the star card inside 1.5 s with the tile counter at 0
          - Every colour on {unit} appears at least 3 times, so every colour can form a line
        introduce_order: [board, slide, line-clear, level-goal]
        variation_cycle: [introduces, objective, board_shape, blocker_set, rule_twist, pacing]
        axis_profile:
          depth: {start: 0.12, step: 0.12}
          move-limit: {start: 0.1, step: 0.13}
          board-complexity: {start: 0.15, step: 0.1}
          piece-variety: {start: 0.2, step: 0.1}

  platformer:
    label: Platformer
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: read the screen, run and jump through its hazards, reach the exit, advance to a level that adds a hazard or a verb
    nodes: [platformer]
    unit_kinds: [level]
    progression_models: [linear-levels, unlock-track]
    difficulty_models: [level-authored]
    ending: [finite]
    axes:
      - id: precision
        range: [0, 1]
        escalates: true
        probe: optional
        description: Jump windows and landing targets
      - id: timing
        range: [0, 1]
        escalates: true
        probe: optional
        description: Moving hazards and cycles the player must read
      - id: hazard-density
        range: [0, 1]
        escalates: true
        probe: optional
        description: Hazards per screen
      - id: spatial-complexity
        range: [0, 1]
        escalates: false
        probe: optional
        description: Branching, verticality, backtracking
    win:
      shape: reach-exit
      per_unit: true
      description: The player reaches the level exit
    lose:
      shape: lives-or-fall
      per_unit: true
      description: A hazard or a fall costs a life; no lives left ends the attempt
    units: {min_mvp: 5, min_total: 12, generation: [authored, parametric]}
    variety: {dimensions: [introduces, objective, layout_motif, hazard_set, pacing, verticality]}
    mastery:
      model: execution
      signals: [time-to-exit, deaths, collectibles-found]
      statement_required: true
    qa: {min_units_traversed: 3, reset_in_unit: false, checkpoint: true, min_new_kinds_per_unit: 0, failure_state: true}
    seed:
      archetype:
        id: pad-platformer
        label: Single-screen precision platformer
        keywords: [platformer, platform, jump, jumping, run, precision, hazard, spikes, exit, gems, screen]
        signature: [jump, jumps, platform, platforms, exit door, single screen]
        dimension: 2d
        structure: level
        camera: Fixed on one screen; the whole level is visible at once, no scrolling.
        orientation: landscape
        identity_affinity: [riso-arcade, paper-diorama, signal-brutal]
        fantasy: Nailing on the tenth try the jump you had planned on the first.
        core_loop: Read the whole screen -> commit to a route -> run and jump past the hazards -> take the gems on the way -> touch the exit door -> the next screen adds one hazard that changes the route.
        pillars:
          - The whole level is on one screen, so every death is information
          - Back at the entrance inside one second of dying
          - Movement obeys the same numbers at 30 Hz and at 144 Hz
        run_seconds: 45
        first_reward_s: 12
        content_units: 12
        content_unit_kind: level
        retention_hooks: [progression, collection]
        return_reason: Two gems on screen 7 are still sitting there, and I know the route now.
        progression_model: linear-levels
        difficulty_model: level-authored
        mechanics:
          - id: run
            name: Run and turn
            tier: mvp
            description: Horizontal movement with a short ramp and an instant turn.
            rules:
              - Horizontal input reaches the full 240 px per second in 0.1 s and stops in 0.08 s.
              - A direction change reverses at once and never slides more than 4 px past the turn.
              - Every movement number is applied on a fixed 60 Hz step, so the same input gives the same path at any frame rate.
            parameters: {max_speed_px_s: 240, accel_s: 0.1, stop_s: 0.08, step_hz: 60}
          - id: jump
            name: Jump
            tier: mvp
            description: One variable-height jump with a forgiving input window.
            rules:
              - A held jump reaches 96 px of height in 0.32 s, and releasing early cuts the rise at once.
              - A jump pressed up to 100 ms after leaving a ledge still fires, and one pressed up to 120 ms before landing is buffered.
              - There is no second jump in the MVP, so every gap is crossed with one jump or not at all.
            parameters: {jump_height_px: 96, rise_s: 0.32, coyote_ms: 100, buffer_ms: 120}
          - id: hazards
            name: Hazards and walkers
            tier: mvp
            description: Static spikes and patrolling enemies that cost a life on contact.
            rules:
              - Contact with a spike or an enemy costs one life and restarts the screen at its entrance, which is the screen's only checkpoint.
              - A walking enemy paces its platform at 90 px per second and turns at the platform edge, never at the player.
              - Every hazard on a screen is visible from the entrance, so no death can be unforeseeable.
            parameters: {walker_speed_px_s: 90, lives: 3, respawn_ms: 400}
          - id: exit-and-gems
            name: Exit door and gems
            tier: mvp
            description: Touching the exit door clears the screen and banks the gems taken on the way.
            rules:
              - Touching the exit door clears the level at once and banks every gem collected on that attempt.
              - The three gems of a screen sit off the fastest route, so taking them is a choice and never the only path.
              - A death before the exit door returns that attempt's gems to the screen.
            parameters: {gems_per_level: 3, exit_radius_px: 24}
          - id: wall-jump
            name: Wall jump
            tier: post-mvp
            description: A jump taken against a wall pushes off it.
            rules:
              - A jump pressed within 150 ms of touching a wall pushes off at 180 px per second away from it.
              - Two pushes off the same wall without touching ground are refused.
            parameters: {wall_window_ms: 150, push_px_s: 180}
        actions:
          - id: move-left
            action: Run left
            tier: mvp
            mechanic: run
            touch: Hold the left pad in the lower-left corner
            mouse: Hold the left pad, or hold A
            keyboard: Left arrow or A
            gamepad: Left stick or D-pad left
          - id: move-right
            action: Run right
            tier: mvp
            mechanic: run
            touch: Hold the right pad in the lower-left corner
            mouse: Hold the right pad, or hold D
            keyboard: Right arrow or D
            gamepad: Left stick or D-pad right
          - id: jump
            action: Jump
            tier: mvp
            mechanic: jump
            touch: Tap or hold the jump button in the lower-right corner
            mouse: Click the jump button, or hold Space
            keyboard: Space, W or Up arrow
            gamepad: A button
        goals:
          moment: Land the next jump without touching a hazard.
          session: Clear three screens and keep the lives that are left.
          long_term: Clear all 12 screens with every gem taken.
        progression_steps:
          - id: levels-1-4
            tier: mvp
            unlock_condition: Available from the start
            grants: Screens 1-4, running, jumping and static spikes
          - id: levels-5-8
            tier: mvp
            unlock_condition: Clear screen 4
            grants: Walking enemies and crumbling tiles
          - id: levels-9-12
            tier: mvp
            unlock_condition: Clear screen 8
            grants: Moving platforms and routes that ask for two hazards at once
        curve:
          - at: Screens 1-3
            description: Two-platform routes, gaps at two thirds of the jump's reach, spikes only; a first-time player reaches the exit door before losing a life.
            parameters: {gap_fraction: 0.66, hazards_per_screen: 2, walkers: 0}
          - at: Screens 4-8
            description: Walking enemies and crumbling tiles; gaps reach four fifths of the jump and a route crosses itself once.
            parameters: {gap_fraction: 0.8, hazards_per_screen: 5, walkers: 2}
          - at: Screens 9-12
            description: Moving platforms over spikes, gaps at nine tenths of the jump, and every third screen is a breather with half the hazards.
            parameters: {gap_fraction: 0.9, hazards_per_screen: 8, walkers: 3}
        assist: After three deaths on one screen, its walking enemies pace 20% slower and a checkpoint appears at the midpoint of the route.
        failure_condition: A hazard or a fall takes the last of the three lives.
        failure_feedback: The player bursts into four shards, 200 ms of hit-stop, one screen flash, and the retry starts at the entrance with the hazard that killed outlined for a second.
        rewards:
          - id: gem-taken
            tier: mvp
            trigger: A gem is touched
            grants: One of the screen's three gems, banked at the exit door
            feedback: The gem pops into the counter with a rising chime, one semitone up per gem on the screen.
          - id: level-clear
            tier: mvp
            trigger: The player touches the exit door
            grants: The screen is cleared and the next one opens
            feedback: The door swallows the player, the screen wipes, and the clear card names the time and the gems taken.
          - id: no-death-clear
            tier: mvp
            trigger: A screen is cleared without losing a life
            grants: A clean marker on the screen and a life back, up to three
            feedback: The life pips flash once and the clean marker stamps onto the level card.
        hud:
          - id: lives
            tier: mvp
            shows: Lives left, as pips
            anchor: top-left
            updates_on: Death and clean clear
            feedback: The lost pip shatters rather than fading
          - id: gems
            tier: mvp
            shows: Gems taken on this screen, out of three
            anchor: top-center
            updates_on: Each gem taken
            feedback: The slot fills with a pop
          - id: level
            tier: mvp
            shows: Screen number and its clean marker
            anchor: top-right
            updates_on: Screen start
        tutorial:
          approach: diegetic
          rationale: Running, jumping and the exit door are one screen's worth of teaching, and the first screen is built so the route itself is the lesson.
          steps:
            - id: first-gap
              tier: mvp
              trigger: Screen 1, first time
              prompt: A gem floats over a gap one jump wide, with the jump button pulsing and the exit door in plain sight beyond it
              completes_on: The player jumps the gap
            - id: first-spike
              tier: mvp
              trigger: Screen 1, after the first gap
              prompt: A single spike sits under the only route, lit and ringed, with a slow arrow showing the arc over it
              completes_on: The player clears the spike and touches the exit door
        assets:
          - id: player
            type: spritesheet
            tier: mvp
            description: Player character with idle, run, jump, fall and burst frames
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector-drawn, 48px tall, 6 run frames, 2 air frames, 4 burst frames
            role: player
            dimension: 2d
            readability: One solid silhouette in the identity's lead accent, its head and leading foot clear, readable at 48 px tall against tiles and sky, and plainly airborne the frame it leaves the ground
          - id: hazards
            type: sprite
            tier: mvp
            description: Spikes, crumbling tile and the walking enemy
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Vector, 32px grid, the walker with 4 pace frames and a 2-frame turn
            role: threat
            dimension: 2d
            readability: Every hazard hard-edged and in the danger colour, never in the player's colour - spikes point, the walker has a face and a direction, the crumbling tile is cracked before it is stepped on - all readable at 32 px from across the screen
          - id: exit-door
            type: sprite
            tier: mvp
            description: Exit door, closed and open states
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector, 64px tall, 2 states plus a 4-frame open
            role: goal
            dimension: 2d
            readability: A door that reads as the way out from the entrance of the screen - lit frame, inward arrow, brighter than the tiles around it - and obviously open once the player is on the route to it
          - id: gems
            type: sprite
            tier: mvp
            description: Gem collectible with an idle spin
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector, 24px, 8-frame spin
            role: collectible
            dimension: 2d
            readability: A small bright faceted token, round where hazards are angular, readable at 24 px and never mistaken for a hazard or for the door
          - id: tiles
            type: texture
            tier: mvp
            description: Platform and wall tiles, with the moving-platform variant
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Tileable 32px set, top edge distinct from the body
            role: environment
            dimension: 2d
            readability: Solid ground told apart from background at a glance, the standable top edge a clear line, and the moving platform marked so it is not mistaken for static ground
          - id: backdrop
            type: texture
            tier: mvp
            description: Two-layer parallax sky and hills
            count: 2
            source_preference: procedural
            est_cost: 0
            spec: Tileable 512px, 2 layers at 0.2 and 0.5 parallax
            role: background
