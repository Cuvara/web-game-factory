          - id: wall-jump-screens
            kind: level-set
            name: Wall-jump screens
            introduced: From screen 13
            after_runs: 12
            rule: Screens built around pushing off walls to climb.
            tier: post-mvp
            delivered_by: wall-jump
        first_session_ends_on: A screen cleared with its gems counted and its clean marker stamped, with the next screen's new hazard visible behind the card.
        hooks:
