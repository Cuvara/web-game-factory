            description: Gradient sky and distant horizon band
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Shader gradient with a horizon band, no texture fetch
            role: background
            dimension: 3d
            readability: A sky that sets the horizon and the time of day and is never brighter than the finish gate or the cars
          - id: drive-vfx
