            delivered_by: levels-5-8
          - id: moving-platforms
            kind: obstacle
            name: Moving platforms
            introduced: From screen 9
            after_runs: 8
            rule: A platform carries the player over spikes on a fixed cycle.
            tier: mvp
            delivered_by: levels-9-12
          - id: time-medals
            kind: modifier
            name: Screen time medals
            introduced: After the first screen is cleared
            after_runs: 1
            rule: A medal target time appears on every screen already cleared.
