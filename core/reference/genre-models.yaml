          - id: shift-set-2
            name: Second shift set
            description: Shifts 11-20 at a second location with rent, two products and staff shifts.
        optional:
          - id: free-play
            name: Free play
            description: Days with no target, kept only for the profit record.
          - id: stand-skins
            name: Stand skins
            description: Cosmetic stand styles opened by stars.
      experience:
        goal: Hit the shift's cash target before the day ends.
        goal_metric: cash
        win:
          condition: The till reaches the shift's cash target before the day ends.
          metric: cash
        lose:
          condition: The day ends with the till short of the target, or cash falls below zero.
          metric: cash
        actions:
          set-price:
            visual: The price reads out to the cent as the slider moves, and the forecast's demand bar shifts with it on the same frame.
            audio: Slider tick per step
            updates: [target-gap]
          buy-stock:
            visual: Ten cups stack onto the counter and the cash counter ticks down by their cost.
            audio: Crate thud
            updates: [cash, stock]
          serve:
            visual: The cup is poured, the customer leaves the queue, and the coin arcs into the till.
            audio: Cup poured, then a coin into the till
            updates: [cash, stock]
          buy-upgrade:
            visual: The upgrade appears on the stand itself and the cash counter ticks down by its cost.
            audio: Fitting clunk, then a confirming chime
            updates: [cash]
        teaches: [set-price, buy-stock, serve, buy-upgrade]
        grace: {until: first-success}
        hud_metrics: {cash: cash, target: target-gap, stock: stock, clock: day-time}
      depth:
        features:
          - id: shift-stars
            name: Shift stars
            description: One to three stars a shift by the margin over its target, kept across sessions and shown on the shift list out of 30.
          - id: business-ranks
            name: Business ranks
            description: Five ranks from total profit across all shifts, each opening a product line or a location and kept across sessions.
        meta:
          statement: Run a shift -> bank the profit and its stars -> spend the till on a permanent upgrade -> the next shift's target needs that upgrade -> come back for the stars and the next rank.
          tier: mvp
          delivered_by: shifts-4-7
          persists:
            - kind: stage-progress
              what: Shifts cleared and the shift the player is on
              tier: mvp
              delivered_by: shifts-4-7
            - kind: currency
              what: Cash carried between shifts
              tier: mvp
              delivered_by: cash-target
            - kind: upgrades
              what: Upgrades owned on the stand
              tier: mvp
              delivered_by: upgrades-staff
            - kind: collection
              what: Stars a shift, of 30
              tier: post-mvp
              delivered_by: shift-stars
        goals:
          - id: serve-the-head
            horizon: short
            goal: Serve the customer at the head of the queue before they walk.
            measure: customers served inside their patience
            tier: mvp
            delivered_by: serve
          - id: hit-target
            horizon: mid
            goal: Hit this shift's target with a margin worth two stars.
            measure: cash over the target
            tier: mvp
            delivered_by: target-hit
          - id: clear-shifts
            horizon: long
            goal: Clear all ten shifts.
            measure: shifts cleared of 10
            tier: mvp
            delivered_by: shifts-8-10
          - id: all-stars
            horizon: long
            goal: Three-star every shift.
            measure: stars of 30
            tier: post-mvp
            delivered_by: shift-stars
        content:
          - id: midday-rush
            kind: event
            name: Midday rush
            introduced: 45 s into the day
            at_s: 45
            rule: Demand triples for 30 s, so the stock and the serving speed are both tested at once.
            tier: mvp
            delivered_by: day-cycle
          - id: event-deck
            kind: event
            name: Weather and offer events
            introduced: From shift 4
            after_runs: 3
            rule: One event a day from a deck of eight, announced 15 s before it lands.
            tier: mvp
            delivered_by: shifts-4-7
          - id: helpers
            kind: power-up
            name: Second stand and helper
            introduced: From shift 4
            after_runs: 3
            rule: A second stand serves in parallel and a helper serves at 70% speed for a flat wage.
            tier: mvp
            delivered_by: upgrades-staff
          - id: two-products
            kind: mode
            name: Two-product days
            introduced: From shift 8
            after_runs: 7
            rule: A second line with its own price, stock and demand curve, sharing the queue.
            tier: mvp
            delivered_by: shifts-8-10
          - id: ranks
            kind: modifier
            name: Business ranks
            introduced: After the fifth shift is cleared
            after_runs: 5
            rule: A rank from total profit opens a product line or a location.
            tier: post-mvp
            delivered_by: business-ranks
        first_session_ends_on: A till screen that hit its target, with the stars stamped and the next shift's forecast and target shown.
        hooks:
          - id: next-shift
            kind: stage-map
            statement: The next shift's target is up and I already know the price I will set.
            tier: mvp
            delivered_by: shifts-4-7
          - id: stars-left
            kind: collection
            statement: Shift 6 only gave me one star and I know I over-bought the stock.
            tier: post-mvp
            delivered_by: shift-stars
      units:
        unit_arc: [teach, teach, test, twist, breather, test, climax]
        objective_templates:
          - Bank {budget} cash before {unit} closes
          - Bank {budget} cash in {unit} losing at most {few} customers
          - Bank {budget} cash in {unit} with the cooler broken
          - Serve {count} customers in {unit} without running out of stock
        success_template: The till reaches the shift's cash target before the day ends.
        failure_template: The day ends short of the target, or cash falls below zero.
        numbers:
          budget: {start: 120, step: 40, max: 600}
          count: {start: 20, step: 10, max: 120}
          few: {start: 2, step: 1, max: 6}
        acceptance_templates:
          - A recorded play of {unit} banks at least {budget} cash, and the shift data stores that figure
          - Pricing {unit} inside its fair range and buying {count} stock clears its target with at least 10% to spare
          - Every event {unit} can draw is announced at least 15 s before it lands
          - Stock bought at {count} units runs out at most once during {unit}, and the stock counter reads sold out when it does
        introduce_order: [price-and-stock, serve, day-cycle, cash-target, upgrades-staff]
        variation_cycle: [introduces, objective, economy_rule, event_set, unlock_available, pacing]
        axis_profile:
          demand-rate: {start: 0.15, step: 0.13}
          resource-scarcity: {start: 0.1, step: 0.12}
          concurrency: {start: 0.1, step: 0.14}
          decision-density: {start: 0.2, step: 0.1}
