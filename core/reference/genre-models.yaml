            kind: hazard
            name: Crumbling tiles
            introduced: From screen 5, 25 s into the screen
            at_s: 25
            after_runs: 4
            rule: A cracked tile falls away one second after it is stood on, so a route over it cannot be walked back.
            tier: mvp
            delivered_by: hazards
          - id: walkers
            kind: enemy
            name: Walking enemies
            introduced: From screen 5
            after_runs: 4
            rule: An enemy paces a platform of the route, so the gap has a timing as well as a width.
