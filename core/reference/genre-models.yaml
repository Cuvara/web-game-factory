  racing:
    label: Racing / driving
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: learn the track, drive it clean, beat the target, unlock the next track or car
    nodes: [racing, parking]
    unit_kinds: [track, lap]
    progression_models: [linear-levels, unlock-track]
    difficulty_models: [level-authored]
    ending: [finite]
    axes:
      - id: route-complexity
        range: [0, 1]
        escalates: true
        probe: optional
        description: Corner count and tightness, elevation, width changes
      - id: opponent-skill
        range: [0, 1]
        escalates: true
        probe: optional
        description: Rival pace and aggression, or the ghost's time
      - id: hazards
        range: [0, 1]
        escalates: false
        probe: optional
        description: Obstacles, surfaces, traffic on the route
      - id: time-target
        range: [0, 1]
        escalates: true
        probe: optional
        description: How tight the medal time is against a clean lap
    win:
      shape: finish-target
      per_unit: true
      description: Finish the race in the required position or under the target time
    lose:
      shape: out-of-time-or-placed
      per_unit: true
      description: The time runs out or the position target is missed
    units: {min_mvp: 3, min_total: 8, generation: [authored, parametric]}
    variety: {dimensions: [introduces, route_shape, surface, hazard_set, objective, opponents]}
    mastery:
      model: optimisation
      signals: [best-lap, medal, drift-chain]
      statement_required: true
    qa: {min_units_traversed: 2, reset_in_unit: false, checkpoint: false, min_new_kinds_per_unit: 0, failure_state: true, time_target_axis: time-target}
    seed:
      archetype:
        id: lap-racer
        label: Arcade lap racer
        keywords: [racing, race, driving, drive, car, kart, lap, laps, track, drift, rival, medal, time]
        signature: [lap, laps, track, race, drift, finish line]
        dimension: 3d
        structure: level
        camera: Third-person chase camera, slightly high and behind the car, leading into the next corner; the player never moves the camera.
        orientation: landscape
        identity_affinity: [solar-bleach, neon-night, signal-brutal]
        fantasy: Carrying more speed through a corner than anyone should, and keeping it.
        core_loop: Read the corner coming -> brake late and lay the car into a drift -> spend the boost down the straight -> cross the finish line under the medal time -> the next track asks for a line you have not driven.
        pillars:
          - The car does the same thing every time the same input is given
          - Every corner is visible two seconds before it has to be driven
          - A lost race is a corner the player can name
        run_seconds: 90
        first_reward_s: 20
        content_units: 8
        content_unit_kind: track
        retention_hooks: [progression, collection]
        return_reason: Silver on track 4 is 0.8 s away and I know which corner I am losing it in.
        progression_model: unlock-track
        difficulty_model: level-authored
        mechanics:
          - id: drive
            name: Throttle, brake and steering
            tier: mvp
            description: Arcade handling with grip that is readable from the first corner.
            rules:
              - The car reaches its top speed of 180 km/h in 4 s and brakes to a stop in 1.6 s.
              - Steering is rate-based and loses 30% of its authority above 150 km/h, so speed costs turning.
              - Off the track surface the car loses 25% of its speed each second and the camera pulls back to show the way home.
            parameters: {top_speed_kmh: 180, accel_s: 4.0, brake_s: 1.6, offtrack_loss_per_s: 0.25}
          - id: drift
            name: Drift and boost
            tier: mvp
            description: A held drift banks a boost meter that is spent on the next straight.
            rules:
              - Holding the drift input past 25 degrees of slip angle fills the boost meter at 20% a second.
              - Releasing the drift spends the meter as up to 1.5 s of 25% extra speed, scaled by how full it was.
              - A drift that leaves the track surface loses the whole meter, so the line matters more than the angle.
            parameters: {slip_deg: 25, meter_per_s: 0.2, boost_s: 1.5, boost_speed: 0.25}
          - id: laps
            name: Laps, finish line and medals
            tier: mvp
            description: Three laps against three target times, with a split at the finish line each lap.
            rules:
              - A race is 3 laps, and crossing the finish line splits the lap time and shows the gap to the player's best lap.
              - Bronze, silver and gold are awarded on total time against the track's three target times, which the track data stores.
              - Cutting the track by more than 2 m invalidates that lap, which is shown at once rather than at the finish.
            parameters: {laps: 3, cut_limit_m: 2.0, medals: 3}
          - id: rivals
            name: Rival cars
            tier: mvp
            description: Three rival opponents that drive a recorded line at a per-track pace.
            rules:
              - Each of the three opponents drives the track's recorded racing line at its own pace, set per track in the track data.
              - A rival never closes to less than 1.5 s behind the player, so a lead that was earned is kept.
              - Contact with a rival costs both cars 15% of their speed and never spins either of them out.
            parameters: {rivals: 3, min_gap_s: 1.5, contact_loss: 0.15}
          - id: ghost
            name: Best-lap ghost
            tier: post-mvp
            description: The player's best lap replayed as a translucent car.
            rules:
              - The ghost drives the player's best recorded lap of that track and is never collidable.
              - The ghost is drawn at 40% opacity so it never hides a corner or a rival.
            parameters: {opacity: 0.4}
        actions:
          - id: steer
            action: Steer left or right
            tier: mvp
            mechanic: drive
            touch: Hold the left or right third of the screen
            mouse: Move the pointer left or right of centre
            keyboard: Left and Right arrows, or A and D
            gamepad: Left stick
          - id: throttle
            action: Accelerate and brake
            tier: mvp
            mechanic: drive
            touch: Throttle is held by default; press and hold the brake pad in the lower right to slow
            mouse: Hold the left button to accelerate, the right button to brake
            keyboard: Up arrow or W to accelerate, Down arrow or S to brake
            gamepad: Right trigger throttle, left trigger brake
          - id: drift
            action: Drift
            tier: mvp
            mechanic: drift
            touch: Hold both steer thirds at once while turning
            mouse: Hold Shift while turning
            keyboard: Shift
            gamepad: A button
        goals:
          moment: Get this corner on the right line and keep the drift alive.
          session: Take a medal on a track that only gave bronze before.
          long_term: Gold all 8 tracks.
        progression_steps:
          - id: tracks-1-3
            tier: mvp
            unlock_condition: Available from the start
            grants: Tracks 1-3 and the starting car
          - id: tracks-4-6
            tier: mvp
            unlock_condition: Bronze or better on tracks 1-3
            grants: Tracks 4-6, and rivals one pace step faster
          - id: tracks-7-8
            tier: mvp
            unlock_condition: Silver on any four tracks
            grants: Tracks 7 and 8, with wet surface sections
        curve:
          - at: Tracks 1-2
            description: Wide tracks, four corners none tighter than 90 degrees, rivals 12% off the bronze pace; a first-time player takes bronze on the first attempt.
            parameters: {corners: 4, min_corner_deg: 90, rival_pace: 0.88}
          - at: Tracks 3-6
            description: Eight to ten corners with two hairpins and an elevation change, rivals at bronze pace, bronze within 3 s of a clean lap.
            parameters: {corners: 9, min_corner_deg: 50, rival_pace: 1.0}
          - at: Tracks 7-8
            description: Wet sections, narrowing exits and a blind crest, rivals at silver pace; track 7 is a short breather before track 8.
            parameters: {corners: 12, min_corner_deg: 35, rival_pace: 1.06}
        assist: After three races outside the medals on one track, the rivals drop 8% of their pace and the racing line is drawn through every corner on the next attempt.
        failure_condition: The race ends outside the bronze target time or outside the top three.
        failure_feedback: The car coasts and the camera swings to the finish line, then the card shows the gap to bronze and names the three corners that cost the most time.
        rewards:
          - id: medal
            tier: mvp
            trigger: A race ends inside a target time
            grants: Bronze, silver or gold on that track
            feedback: The medal stamps over the finish-line replay with its own chord, and the next medal's time is shown under it.
          - id: new-best-lap
            tier: mvp
            trigger: A lap is finished under the player's best lap for that track
            grants: A new best lap, saved
            feedback: The split flashes green, the lap time re-colours, and the ghost line redraws from that lap.
          - id: drift-chain
            tier: mvp
            trigger: A drift is held through a whole corner and released on the exit
            grants: A full boost meter and a chain count for that lap
            feedback: Sparks build along the drift, the chain count stamps on release, and the boost roars.
        hud:
          - id: lap-time
            tier: mvp
            shows: Lap time and the split against the best lap
            anchor: top-center
            updates_on: Every frame, split at the finish line
            feedback: The split flashes green under the best and red over it
          - id: position
            tier: mvp
            shows: Position of four, and the gap to the car ahead
            anchor: top-left
            updates_on: Each overtake
            feedback: Swaps with a slide rather than a jump
          - id: best
            tier: mvp
            shows: Best lap for this track and the next medal time
            anchor: top-right
            updates_on: Lap finish
            feedback: Re-colours on a new best
          - id: boost
            tier: mvp
            shows: Boost meter
            anchor: bottom-center
            updates_on: Every frame while drifting or boosting
            feedback: Fills with the drift and drains visibly as it is spent
        tutorial:
          approach: diegetic
          rationale: Throttle is automatic and steering is one input; the drift needs one demonstration, so track 1 opens with a corner wide enough to take badly and still finish.
          steps:
            - id: first-corner
              tier: mvp
              trigger: Track 1, first race, the first corner
              prompt: The racing line is drawn through the first corner only, with the steer zones glowing
              completes_on: The player takes the first corner on the surface
            - id: first-drift
              tier: mvp
              trigger: Track 1, first race, the first hairpin
              prompt: The drift input pulses as the hairpin comes into view and the line shows the drift arc
              completes_on: The player holds a drift through the hairpin
        assets:
          - id: car
            type: model
            tier: mvp
            description: Player car with wheels, body and brake lights
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Low-poly GLB from a model spec, under 4k triangles, vertex colours, 4 steered wheels
            role: player
            dimension: 3d
            readability: A car with a clear front, four visible wheels and a cabin, in the identity's lead accent, readable at 120 px wide from the chase camera, its brake lights and its drift angle obvious from behind
          - id: rivals
            type: model
            tier: mvp
            description: Three rival cars, one silhouette each
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Low-poly GLB from model specs, under 4k triangles each, one palette per opponent
            role: threat
            dimension: 3d
            readability: Three opponents told apart from the player's car and from each other by silhouette and palette at 100 px wide, none of them using the player's accent colour
          - id: track-kit
            type: model
            tier: mvp
            description: Modular road, kerb, barrier, bridge and scenery pieces
            count: 8
            source_preference: procedural
            est_cost: 0
            spec: Low-poly GLB modules from model specs, road 12 m wide, kerbs and barriers as separate pieces, vertex colours
            role: environment
            dimension: 3d
            readability: Road plainly drivable and everything off it plainly not, kerbs striped at every corner entry, and barriers tall enough to read the track's shape two seconds ahead at top speed
          - id: finish-gate
            type: model
            tier: mvp
            description: Finish line gate and the lap banner
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Low-poly GLB arch from a model spec, with an emissive band
            role: goal
            dimension: 3d
            readability: An arch over the finish line that is the brightest structure on the track, readable from 150 m out, and obviously the same gate on every lap
          - id: skybox
            type: texture
