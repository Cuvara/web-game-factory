  survival:
    label: Survival (arena survivor)
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: move and survive the swarm, choose an upgrade when it comes, outlast the next escalation, run again stronger
    nodes: [arena-survivor, action]
    unit_kinds: [run-segment, wave, encounter]
    progression_models: [meta-currency, unlock-track, endless-scaling]
    difficulty_models: [time-ramp, adaptive, level-authored]
    ending: [endless, finite]
    axes:
      - id: spawn-rate
        range: [0, 1]
        escalates: true
        probe: required
        description: Enemies spawned per second
      - id: enemy-variety
        range: [0, 1]
        escalates: true
        probe: optional
        description: Distinct enemy kinds on screen
      - id: elite-frequency
        range: [0, 1]
        escalates: true
        probe: optional
        description: Elites and bosses per minute
      - id: build-pressure
        range: [0, 1]
        escalates: false
        probe: optional
        description: How much the upgrade choice matters to surviving the next segment
    win:
      shape: survive-timer
      per_unit: false
      description: Survive to the run's timer; a finite campaign ends on its last segment
    lose:
      shape: health-zero
      per_unit: false
      description: The player's health reaches zero
    units: {min_mvp: 3, min_total: 8, generation: [authored, parametric, procedural]}
    variety: {dimensions: [introduces, enemy_mix, event, upgrade_pool, arena_zone, objective]}
    mastery:
      model: planning
      signals: [survived-s, kills, build-synergy]
      statement_required: true
    qa: {min_units_traversed: 3, reset_in_unit: false, checkpoint: false, min_new_kinds_per_unit: 1, failure_state: true, endless_window_s: 30}
    seed:
      archetype:
        id: swarm-survivor
        label: Arena survivor
        keywords: [survivor, survival, survive, arena, swarm, horde, enemies, upgrade, level up, elite, timer, build]
        signature: [survive, swarm, horde, auto attack, level up, upgrade choice]
        dimension: 2d
        structure: run
        camera: Follows the player with a short lag, the arena larger than the screen; the player is kept inside the middle half of the frame.
        orientation: landscape
        identity_affinity: [neon-night, signal-brutal, riso-arcade]
        fantasy: Starting helpless and ending the run as the most dangerous thing on screen.
        core_loop: Move through the swarm -> the weapon fires itself -> kills fill the bar -> pick one of three upgrades -> the build changes what you can stand in -> the spawn rate outgrows the build -> die, and start again with the next weapon open.
        pillars:
          - One input, and every decision is an upgrade choice
          - Nothing kills the player from off screen
          - A build is readable on screen, never only in a stat sheet
        run_seconds: 180
        first_reward_s: 12
        content_units: 8
        content_unit_kind: run-segment
        retention_hooks: [progression, collection]
        return_reason: I died at 7 minutes with a build that was finally working, and the orbit weapon is one run away.
        progression_model: unlock-track
        difficulty_model: time-ramp
        mechanics:
          - id: move
            name: Move
            tier: mvp
            description: Movement is the only input during play.
            rules:
              - The player moves at 200 px per second in any direction and reaches full speed in at most 0.08 s.
              - There is no dash and no attack input in the MVP, so every escape is a route rather than a button.
              - The camera keeps the player inside the middle half of the screen, so nothing reaches the player from off screen without being seen.
            parameters: {speed_px_s: 200, accel_s: 0.08, camera_lag_s: 0.15}
          - id: auto-attack
            name: Auto attack
            tier: mvp
            description: The weapon fires at the nearest enemy on its own cadence.
            rules:
              - The starting weapon fires at the nearest enemy every 0.6 s without any input.
              - A shot deals 3 damage, travels 500 px per second and pierces one enemy before it stops.
              - The weapon's reach is drawn as a faint ring, so the player can read what is in range before stepping.
            parameters: {fire_every_s: 0.6, shot_damage: 3, shot_px_s: 500, pierce: 1}
          - id: swarm
            name: Swarms and elites
            tier: mvp
            description: Three enemy kinds spawning off screen at a rate that climbs with the elapsed run.
            rules:
              - The spawn rate climbs from 1.5 to 9 enemies a second over ten minutes, on a curve the run data states.
              - Three kinds walk the arena - a crawler with 4 health at 90 px per second, a charger with 8 health that lunges after a 500 ms telegraph, and a splitter with 10 health that becomes two crawlers when it dies.
              - An elite with ten times the health of its kind arrives every 90 s and leaves a guaranteed upgrade chest.
            parameters: {spawn_start_per_s: 1.5, spawn_end_per_s: 9, elite_every_s: 90, player_health: 10}
          - id: level-up
            name: Level up and upgrades
            tier: mvp
            description: Kills fill a bar, and every level is a choice of three upgrades from a pool of twelve.
            rules:
              - Killing enemies fills an experience bar, and each level offers three distinct upgrades drawn from the pool of twelve.
              - An upgrade is permanent for the run and always visible in play - a new orbit, a wider ring, a second shot - never a hidden number.
              - Play pauses while the choice is open, and the choice cannot be skipped or re-rolled in the MVP.
            parameters: {pool: 12, offered: 3, first_level_kills: 8}
          - id: second-weapon
            name: Second weapon slot
            tier: post-mvp
            description: A second weapon that fires on its own cadence beside the first.
            rules:
              - A second weapon slot opens at level 6 and is filled from the upgrade choice.
              - Two weapons never fire on the same frame, so the player can hear which one is working.
            parameters: {slot_level: 6}
        actions:
          - id: move
            action: Move
            tier: mvp
            mechanic: move
            touch: Drag anywhere; the player follows the thumb
            mouse: Hold W, A, S, D, or drag with the left button held
            keyboard: W, A, S, D or the arrow keys
            gamepad: Left stick
          - id: choose-upgrade
            action: Choose an upgrade
            tier: mvp
            mechanic: level-up
            touch: Tap one of the three cards
            mouse: Click one of the three cards
            keyboard: 1, 2 or 3, or arrows and Enter
            gamepad: D-pad and A
        goals:
          moment: Get out of the gap that is closing around you.
          session: Survive longer than the best run so far.
          long_term: Survive fifteen minutes and open every weapon.
        progression_steps:
          - id: weapon-2
            tier: mvp
            unlock_condition: Survive 5 minutes in one run
            grants: The scatter weapon as a starting choice
          - id: weapon-3
            tier: mvp
            unlock_condition: Kill 1500 enemies in total
            grants: The orbit weapon as a starting choice
          - id: arena-2
            tier: mvp
            unlock_condition: Survive 10 minutes in one run
            grants: A second arena with its own hazard and its own elite
        curve:
          - at: 0-3 min
            description: Crawlers only, spawning at 1.5 to 3 a second, with the first level-up inside 20 s; a first-time player reaches level 3 before taking real damage.
            parameters: {spawn_per_s: 2.0, kinds: 1, elites: 0}
          - at: 3-8 min
            description: Chargers and splitters join, spawn rate to 6 a second, an elite every 90 s; the build has to answer a direction rather than a distance.
            parameters: {spawn_per_s: 6.0, kinds: 3, elites: 3}
          - at: 8 min+
            description: Spawn rate to 9 a second with two elites at once, and a 20 s lull every two minutes so a build can be spent rather than only survived.
            parameters: {spawn_per_s: 9.0, kinds: 3, elites: 6}
        assist: After three runs under 2 minutes, the next run spawns at 60% of the rate for its first 60 s and its first level-up arrives at 15 s.
        failure_condition: The player's health reaches zero.
        failure_feedback: Half a second of slow motion with the killing enemy ringed, the arena desaturates, and the card shows time survived, kills, the build that was carried and the next weapon's unlock condition.
        rewards:
          - id: level-up
            tier: mvp
            trigger: The experience bar fills
            grants: A choice of three upgrades from the pool
            feedback: Play freezes with a flash, the three cards slide in, and the chosen upgrade is visible in play on the next frame.
          - id: elite-down
            tier: mvp
            trigger: An elite dies
            grants: A guaranteed upgrade chest
            feedback: The elite breaks apart in slow motion, the chest lands with a beam, and the swarm is briefly cleared around it.
          - id: new-best-time
            tier: mvp
            trigger: A run ends above the best survived time
            grants: A new best time, saved
            feedback: The best clock bursts and re-colours, over a two-note sting.
        hud:
          - id: timer
            tier: mvp
            shows: Time survived this run, and the best beside it
            anchor: top-center
            updates_on: Every frame
            feedback: Marks each minute with a tick and a soft chime
          - id: health
            tier: mvp
            shows: Health, as a bar over the player
            anchor: bottom-center
            updates_on: Each hit and each heal
            feedback: Flashes red on a hit and the screen edge pulses once
          - id: level
            tier: mvp
            shows: Level and the experience bar
            anchor: top-left
            updates_on: Each kill and each level
            feedback: The bar fills visibly and flashes at a level
        tutorial:
          approach: diegetic
          rationale: Moving is the only input in play, and the first level-up arrives before the first real threat, so the upgrade choice teaches itself once.
          steps:
            - id: first-move
              tier: mvp
              trigger: Run start, first time
              prompt: Three crawlers walk in slowly from one side with the weapon's reach ring drawn and a drag hint under the thumb
              completes_on: The player moves and the weapon downs a crawler
            - id: first-choice
              tier: mvp
              trigger: First level-up of the first run
              prompt: Play freezes and the three cards slide in, each showing what will change on screen
              completes_on: The player picks a card
        assets:
          - id: player
            type: spritesheet
            tier: mvp
            description: Player character with idle, move and hit frames, plus the build overlays
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector-drawn, 48px, 8 move frames, 2 hit frames, 4 build overlay slots
            role: player
            dimension: 2d
            readability: One bright silhouette in the identity's lead accent that stays readable at 40 px inside a crowd of forty enemies, its facing clear, and every chosen upgrade visible on or around it
          - id: enemies
            type: spritesheet
            tier: mvp
            description: Crawler, charger and splitter, with walk, telegraph and death frames
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Vector, 40px, 4 walk frames and a 3-frame telegraph each, one elite variant each
            role: threat
            dimension: 2d
            readability: Three enemies told apart by silhouette at 32 px even forty deep - the crawler small and round, the charger spiked and leaning, the splitter fat and seamed - all in the danger palette, with the elite twice the size and outlined
          - id: shots
            type: sprite
            tier: mvp
            description: Weapon shots, one per weapon kind
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Vector, 16px, with a 3-frame trail each
            role: projectile
            dimension: 2d
            readability: Each shot drawn travelling for at least three frames in the player's accent, never the danger colour, so the player can see their damage working inside a crowd
          - id: arena
            type: texture
            tier: mvp
            description: Arena floor, zone bands and the hazard tile
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Tileable 256px floor with zone bands, one hazard tile
            role: environment
            dimension: 2d
            readability: A floor dark and low in contrast so every enemy and every shot reads against it, with zone bands that tell the player where in the arena they are
          - id: chest
            type: sprite
            tier: mvp
            description: Upgrade chest and its open state
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Vector, 48px, closed and open with a beam
            role: collectible
            dimension: 2d
            readability: A chest under a vertical beam, visible across the arena and plainly a reward rather than a threat
          - id: swarm-vfx
            type: vfx
            tier: mvp
            description: Enemy death pops, level-up flash, elite spawn ring and player hit flash
            count: 4
            source_preference: procedural
            est_cost: 0
            spec: Pooled particle presets, capped at 120 live emitters
            role: vfx
            dimension: 2d
            readability: A pop on every kill so progress is felt without reading a counter, a level flash that cannot be missed, a ring where an elite spawns, and a screen-edge flash the instant the player is hit
          - id: upgrade-cards
            type: ui
            tier: mvp
            description: The three upgrade cards, the experience bar and the run clock
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Three card faces with icon, name and one-line effect, one bar, one clock
            role: ui
            dimension: 2d
            readability: Each card readable in two seconds at 18 CSS px with its effect in one line, the three cards obviously exclusive, and the run clock legible at a glance while the player keeps moving
        audio:
          - id: music-survive
            type: music
            tier: mvp
            description: Loop that adds a layer every three minutes and drops to a pad while a choice is open
            trigger: Run start
            loop: true
            source_preference: library
            est_cost: 40
          - id: sfx-attack
            type: sfx
            tier: mvp
            description: Weapon fire, one per weapon, voice-limited to 6 at once
            trigger: Weapon fires
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-kill
            type: sfx
            tier: mvp
            description: Enemy death pop, voice-limited and pitched down as the crowd grows
            trigger: Enemy dies
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-level
            type: sfx
            tier: mvp
            description: Level-up chord under the card slide
            trigger: Level reached
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-player-hit
            type: sfx
            tier: mvp
            description: Player hit, dry and loud over the swarm
            trigger: Player takes damage
            loop: false
            source_preference: library
            est_cost: 5
        post_mvp:
          - id: boss-at-ten
            name: Ten-minute boss
            description: One boss at ten minutes with three telegraphed patterns, which ends the run if it is not beaten.
        optional:
          - id: daily-seed
            name: Daily seeded run
            description: One seeded run a day with the same spawns and upgrade offers for everyone.
          - id: character-variants
            name: Character variants
            description: Starting characters with different weapons and move speeds.
      experience:
        goal: Survive as long as you can - the weapon fires itself, you choose what it becomes.
        goal_metric: time
        lose:
          condition: The player's health reaches zero.
          metric: health
        actions:
          move:
            visual: The player accelerates within two frames, the move cycle starts, and the weapon's reach ring moves with them.
            audio: Footfall under the swarm, ducked while the weapon fires
          choose-upgrade:
            visual: The chosen card flies into the player and its effect is drawn in play on the next frame.
            audio: Level-up chord, one note higher per level
            updates: [level]
        teaches: [move, choose-upgrade]
        grace: {until: seconds, seconds: 20}
        hud_metrics: {timer: time, health: health, level: level}
      depth:
        features:
          - id: permanent-perks
            name: Permanent perks
            description: Coins banked from runs buy small permanent perks - 5% move speed, one extra starting level, a longer first grace - from a list of ten, kept across sessions and never sold for money.
          - id: survivor-log
            name: Survivor log
            description: A log of the elites met and the builds that reached five minutes, filled in across sessions and shown on the title screen.
        meta:
          statement: Run -> bank coins and open the next weapon -> spend coins on a permanent perk -> start the next run a little stronger and chasing the time that beat you.
          tier: post-mvp
          delivered_by: permanent-perks
          persists:
            - kind: best-score
              what: Best time survived
              tier: mvp
              delivered_by: new-best-time
            - kind: unlocks
              what: Weapons and arenas opened
              tier: mvp
              delivered_by: weapon-2
            - kind: upgrades
              what: Permanent perks bought
              tier: post-mvp
              delivered_by: permanent-perks
            - kind: collection
              what: Elites met and builds logged
              tier: post-mvp
              delivered_by: survivor-log
        goals:
          - id: close-the-gap
            horizon: short
            goal: Get out of the gap closing around you.
            measure: seconds survived without a hit
            tier: mvp
            delivered_by: swarm
          - id: beat-best
            horizon: mid
            goal: Survive longer than the best run so far.
            measure: time above the best
            tier: mvp
            delivered_by: new-best-time
          - id: next-level
            horizon: mid
            goal: Reach the next level and take the upgrade the build needs.
            measure: levels reached in the run
            tier: mvp
            delivered_by: level-up
          - id: open-everything
            horizon: long
            goal: Open every weapon and buy every perk.
            measure: weapons of 3 and perks of 10
            tier: post-mvp
            delivered_by: permanent-perks
        content:
          - id: chargers
            kind: enemy
            name: Chargers
            introduced: 45 s into a run
            at_s: 45
            rule: A charger lunges after a 500 ms telegraph, so standing in a gap is no longer safe.
            tier: mvp
            delivered_by: swarm
          - id: elites
            kind: enemy
            name: Elites
            introduced: 90 s into a run, and every 90 s after
            at_s: 90
            rule: An elite with ten times the health of its kind arrives and leaves a guaranteed chest.
            tier: mvp
            delivered_by: swarm
          - id: splitters
            kind: enemy
            name: Splitters
            introduced: 180 s into a run
            at_s: 180
            rule: A splitter becomes two crawlers when it dies, so clearing a side can make it worse.
            tier: mvp
            delivered_by: swarm
          - id: second-weapon
            kind: power-up
            name: Scatter weapon
            introduced: After a run reaches 5 minutes
            after_runs: 3
            rule: A second starting weapon, chosen before the run.
            tier: mvp
            delivered_by: weapon-2
          - id: second-arena
            kind: zone
            name: Second arena
            introduced: After a run reaches 10 minutes
            after_runs: 6
            rule: An arena with its own hazard tile and its own elite.
            tier: mvp
            delivered_by: arena-2
          - id: perks
            kind: modifier
            name: Permanent perks
            introduced: After the third run
            after_runs: 2
            rule: Coins banked from runs buy a small permanent perk before the next run.
            tier: post-mvp
            delivered_by: permanent-perks
        first_session_ends_on: A run that ended past the previous best, with the build it carried shown and the next weapon's unlock condition under it.
        hooks:
          - id: best-to-beat
            kind: best-score
            statement: I died at 7 minutes with a build that was finally working.
            tier: mvp
            delivered_by: new-best-time
          - id: next-weapon
            kind: next-unlock
            statement: The orbit weapon is 300 kills away.
            tier: mvp
            delivered_by: weapon-3
      units:
        unit_arc: [teach, test, twist, breather, test, climax]
        objective_templates:
          - Survive {unit} for {s} s
          - Survive {unit} with {few} elites on screen
          - Survive {unit} taking at most {few} hits
          - Reach level {level} before {unit} ends
        success_template: The segment's {s} s pass with health above zero.
        failure_template: The player's health reaches zero.
        numbers:
          few: {start: 1, step: 1, max: 4}
          level: {start: 2, step: 1, max: 8}
        acceptance_templates:
          - The spawn rate during {unit} is within 0.2 enemies a second of its design value, measured over any 10 s
          - A bot that does not move is dead before the first level-up of {unit}
          - Every level-up during {unit} offers 3 distinct upgrades from the pool of 12
          - No enemy in {unit} spawns inside the camera, and none reaches the player without being on screen for 1 s
        introduce_order: [move, auto-attack, swarm, level-up]
        variation_cycle: [introduces, enemy_mix, event, upgrade_pool, arena_zone, objective]
        axis_profile:
          spawn-rate: {start: 0.15, step: 0.14}
          enemy-variety: {start: 0.1, step: 0.13}
          elite-frequency: {start: 0.1, step: 0.12}
          build-pressure: {start: 0.2, step: 0.1}

  simulation:
    label: Simulation / management
    # The family's loop in one line: the concept a person's idea is read through when
    # the catalog names no hand-coded archetype for it.
    loop: read demand, set prices and stock, serve the day, bank the profit, unlock what the next scenario needs
    nodes: [simulation, time-management, tycoon, idle, idle-merge, clicker]
    unit_kinds: [scenario, shift, round]
    progression_models: [unlock-track, meta-currency, linear-levels]
    difficulty_models: [level-authored, player-chosen]
    ending: [finite]
    axes:
      - id: demand-rate
        range: [0, 1]
        escalates: true
        probe: optional
        description: Customers, orders or events per minute
      - id: resource-scarcity
        range: [0, 1]
        escalates: true
        probe: optional
        description: How far income falls short of what the target needs without good decisions
      - id: concurrency
        range: [0, 1]
        escalates: true
        probe: optional
        description: Systems the player juggles at once
      - id: decision-density
        range: [0, 1]
        escalates: false
        probe: optional
        description: Meaningful choices per minute
    win:
      shape: target-reached
      per_unit: true
      description: The scenario's target is met before its end
    lose:
      shape: collapse-or-unmet
      per_unit: true
      description: Bankruptcy, collapse, or the target unmet when the scenario ends
    units: {min_mvp: 4, min_total: 10, generation: [authored, parametric]}
    variety: {dimensions: [introduces, objective, economy_rule, event_set, unlock_available, pacing]}
    mastery:
      model: optimisation
      signals: [profit, target-margin, days-to-target]
      statement_required: true
    qa: {min_units_traversed: 2, reset_in_unit: false, checkpoint: false, min_new_kinds_per_unit: 0, failure_state: true, resource_metric: cash}
    seed:
      archetype:
        id: stand-tycoon
        label: Stand tycoon
        keywords: [simulation, management, tycoon, shop, stand, lemonade, price, stock, demand, staff, upgrade, day, shift]
        signature: [set a price, stock, demand, day, shift, serve the queue, tycoon]
        dimension: 2d
        structure: level
        camera: Fixed on the stand and the queue in front of it; no scrolling.
        orientation: portrait
        identity_affinity: [paper-diorama, solar-bleach, lacquer-brass]
        fantasy: Reading a day before it happens and pricing it exactly right.
        core_loop: Read the day's forecast -> set the price and buy the stock -> open, serve the queue and watch the rush -> spend the till on an upgrade -> the next shift raises the target and changes the weather.
        pillars:
          - Every number the player sets is visible in its result the same day
          - A bad day is explained on the till screen, never just lost
          - A shift fits in two minutes and ends on a figure
        run_seconds: 120
        first_reward_s: 20
        content_units: 10
        content_unit_kind: shift
        retention_hooks: [progression, collection]
        return_reason: Shift 6 ended 12 short of its target and I know I over-bought the stock.
        progression_model: unlock-track
        difficulty_model: level-authored
        mechanics:
          - id: price-and-stock
            name: Price and stock
            tier: mvp
            description: Before the day opens the player sets a cup price and buys stock.
            rules:
              - The price is set between 0.25 and 3.00 in steps of 0.05, and stock is bought in units of ten.
              - Demand falls 12% for every 0.25 above the day's fair price and rises 8% for every 0.25 below it, and the forecast states the fair price as a range.
              - Unsold stock spoils at the end of the day unless a cooler is owned, so over-buying is a real loss the till screen names.
            parameters: {price_min: 0.25, price_max: 3.0, price_step: 0.05, stock_unit: 10, demand_step: 0.12}
          - id: serve
            name: Serving the queue
            tier: mvp
            description: Customers queue, wait, and leave if they are not served.
            rules:
              - A customer waits 12 s before leaving, and every customer who leaves unserved costs one reputation of twenty.
              - Serving takes 2 s a cup, and one stand serves one customer at a time.
              - A customer served inside 6 s of arriving tips 15% on top of the price.
            parameters: {patience_s: 12, serve_s: 2.0, tip_window_s: 6, reputation: 20}
          - id: day-cycle
            name: Day cycle and events
            tier: mvp
            description: A day of two minutes with a midday rush and one drawn event.
            rules:
              - A day runs 120 s split into a quiet morning, a midday rush at three times demand, and a slow afternoon.
              - One event is drawn a day from a deck of eight - heatwave at plus 40% demand, rain at minus 35%, a bulk stock offer, a broken cooler - and is announced 15 s before it lands.
              - The day ends on a till screen that lists revenue, stock cost, wages and profit as separate lines.
            parameters: {day_s: 120, rush_multiplier: 3.0, event_deck: 8, event_warning_s: 15}
          - id: cash-target
            name: Cash target
            tier: mvp
            description: Each shift states a cash figure the till must reach before the day ends.
            rules:
              - A shift states its cash target, and the till at the end of the day decides whether it is met.
              - Cash carries between shifts, and a replayed shift starts with the cash the player had when it opened.
              - Cash below zero at any point ends the shift at once.
            parameters: {start_cash: 50, target_shift_1: 120}
          - id: upgrades-staff
            name: Upgrades and staff
            tier: mvp
            description: The till buys permanent upgrades and a helper for the shift.
            rules:
              - Cash buys permanent upgrades between days and never during one - a second stand that serves in parallel, a cooler that keeps stock overnight, and a sign that raises demand 15%.
              - One helper can be hired a shift, serving at 70% of the player's speed for a flat wage whether the day is busy or not.
              - Every upgrade states its payback in days at the current demand before it is bought.
            parameters: {stand_cost: 120, cooler_cost: 90, sign_cost: 150, helper_wage: 25, helper_speed: 0.7}
          - id: second-product
            name: Second product
            tier: post-mvp
            description: A second line with its own price, stock and demand curve.
            rules:
              - The second product has its own price and stock and shares the queue and the serving time.
              - A customer wants one of the two products, shown as an icon above their head while they queue.
            parameters: {products: 2}
        actions:
          - id: set-price
            action: Set the cup price
            tier: mvp
            mechanic: price-and-stock
            touch: Drag the price slider, or tap its plus and minus
            mouse: Drag the price slider, or click its plus and minus
            keyboard: Left and Right arrows on the slider
            gamepad: Left stick on the slider
          - id: buy-stock
            action: Buy stock
            tier: mvp
            mechanic: price-and-stock
            touch: Tap the plus ten button on the stock tray
            mouse: Click the plus ten button on the stock tray
            keyboard: S then a number, or plus and minus
            gamepad: D-pad to the tray, A buys ten
          - id: serve
            action: Serve the next customer
            tier: mvp
            mechanic: serve
            touch: Tap the customer at the head of the queue
            mouse: Click the customer at the head of the queue
            keyboard: Space serves the head of the queue
            gamepad: A serves the head of the queue
          - id: buy-upgrade
            action: Buy an upgrade
            tier: mvp
            mechanic: upgrades-staff
            touch: Tap an upgrade card between days
            mouse: Click an upgrade card between days
            keyboard: Arrows and Enter on the upgrade cards
            gamepad: D-pad and A on the upgrade cards
        goals:
          moment: Serve the customer at the head of the queue before they walk.
          session: Clear two shifts and buy the upgrade they paid for.
          long_term: Clear all ten shifts and own every upgrade.
        progression_steps:
          - id: shifts-1-3
            tier: mvp
            unlock_condition: Available from the start
            grants: Shifts 1-3, price and stock, one stand and no events
          - id: shifts-4-7
            tier: mvp
            unlock_condition: Clear shift 3
            grants: The event deck, the second stand and helpers
          - id: shifts-8-10
            tier: mvp
            unlock_condition: Clear shift 7
            grants: The cooler, the sign and two-product days
        curve:
          - at: Shifts 1-2
            description: Fair price stated exactly, demand flat, target at 60% of what a careless day earns; the shift cannot realistically be failed.
            parameters: {target_ratio: 0.6, events: 0, systems: 2}
          - at: Shifts 3-7
            description: The fair price becomes a range, one event a day, and the second stand and helper arrive together so wages start to matter.
            parameters: {target_ratio: 0.85, events: 1, systems: 3}
          - at: Shifts 8-10
            description: Two products, two events on the hardest day, and targets within 5% of a well-run day; shift 9 is a breather with a guaranteed heatwave.
            parameters: {target_ratio: 0.95, events: 2, systems: 5}
        assist: After two failed attempts at one shift, the next attempt starts with 40 extra cash and the day's event is named before the day opens.
        failure_condition: The day ends with the till short of the shift's cash target.
        failure_feedback: The till screen stays up with the shortfall in red, the three largest costs listed, the customers lost counted, and one line naming the decision that cost the most; retry re-opens the same day with the cash it started with.
        rewards:
          - id: tip
            tier: mvp
            trigger: A customer is served inside 6 s of arriving
            grants: A 15% tip on that cup
            feedback: A coin arcs from the customer into the till with a bright chime, and the tip total sits beside the cash counter.
          - id: rush-cleared
            tier: mvp
            trigger: Every customer of the midday rush is served
            grants: Two reputation back and a rush bonus of 10% of the rush's takings
            feedback: The queue empties, the stand lights up, and the bonus counts into the till over a rising run of notes.
          - id: target-hit
            tier: mvp
            trigger: The till reaches the shift's cash target
            grants: The shift is cleared, with one to three stars by the margin
            feedback: The target bar fills and overflows, stars stamp in one by one, and the next shift's target and forecast slide in.
        hud:
          - id: cash
            tier: mvp
            shows: Cash in the till, with the day's costs under it
            anchor: top-left
            updates_on: Each sale, each purchase, each wage tick
            feedback: Counts up coin by coin and flashes red while it falls
          - id: target
            tier: mvp
            shows: The shift's target and the gap still to go
            anchor: top-center
            updates_on: Each sale
            feedback: The bar fills, and the gap turns the accent colour inside 10%
          - id: stock
            tier: mvp
            shows: Stock left, of what was bought
            anchor: top-right
            updates_on: Each cup served
            feedback: Turns the danger colour under ten cups and reads sold out at zero
          - id: clock
            tier: mvp
            shows: Time left in the day, with the rush marked on it
            anchor: bottom-left
            updates_on: Every second
            feedback: The rush band glows as it is entered
        tutorial:
          approach: guided-first-run
          rationale: Price, stock and serving are three different screens on the first day, and one pass through them in order is the only way a player can see the link between them.
          steps:
            - id: first-price
              tier: mvp
              trigger: Shift 1, before the day opens
              prompt: The forecast names the fair price and the slider rests one step under it, pulsing
              completes_on: The player sets a price and confirms
            - id: first-serve
              tier: mvp
              trigger: Shift 1, first customer
              prompt: One customer arrives alone with their patience ring drawn and the stand highlighted
              completes_on: The player serves that customer
        assets:
          - id: customers
            type: spritesheet
            tier: mvp
            description: Four customer types with walk, queue, served and leaving frames
            count: 4
            source_preference: procedural
            est_cost: 0
            spec: Vector, 72px tall, 4 walk frames each, a patience ring and a want icon
            role: target
            dimension: 2d
            readability: Four customers told apart at 48 px by shape and palette, each with a patience ring that reads as time running out and a want icon above the head, so who to serve next is readable without tapping anything
          - id: stand
            type: sprite
            tier: mvp
            description: The stand, its second-stand variant and the upgrade fittings
            count: 4
            source_preference: procedural
            est_cost: 0
            spec: Vector, 256px wide, one base plus cooler, sign and second-stand fittings
            role: prop
            dimension: 2d
            readability: A stand that plainly sells something, with every bought upgrade visible on it - the cooler, the sign, the second counter - so progress is seen before it is read
          - id: street
            type: texture
            tier: mvp
            description: Street, pavement and the queue line
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Tileable 256px, with a marked queue line and three weather tints
            role: environment
            dimension: 2d
            readability: A street whose queue line is unmistakable so the order of customers is never in doubt, and whose weather tint names the day's event at a glance
          - id: skyline
            type: texture
            tier: mvp
            description: Background skyline with the day's light
            count: 2
            source_preference: procedural
            est_cost: 0
            spec: Two parallax layers, four light states across the day
            role: background
            dimension: 2d
            readability: A quiet skyline that shifts light from morning to afternoon so the time of day is visible without the clock, never brighter than the stand
          - id: money-vfx
            type: vfx
            tier: mvp
            description: Coin arc, tip sparkle, customer-leaving puff and the sold-out stamp
            count: 4
            source_preference: procedural
            est_cost: 0
            spec: Particle presets, 200-600 ms
            role: vfx
            dimension: 2d
            readability: A coin that arcs from customer to till on every sale, a sparkle on a tip, and an unmissable puff where a customer walks away unserved so a loss is never silent
          - id: shop-ui
            type: ui
            tier: mvp
            description: Price slider, stock tray, upgrade cards, forecast panel and the till screen
            count: 1
