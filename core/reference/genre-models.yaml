        acceptance_templates:
          - A recorded route clears {unit} inside its {s} s with 3 s to spare, and the level data stores that time
          - Every hazard of {unit} is on screen from its entrance at the design resolution
          - All 3 gems of {unit} are reachable on a route at most 3 s slower than the fastest one
          - A death on {unit} puts the player back at its entrance inside 1 s with lives down by 1
        introduce_order: [run, jump, hazards, exit-and-gems]
