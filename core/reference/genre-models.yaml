          - Every corner of {unit} is on screen 2 s before the car reaches it at top speed
          - Leaving the surface of {unit} costs 25% of speed each second, measured from the play probe
          - The rivals of {unit} finish within {few} s of its silver target in 10 of 10 unattended runs
        introduce_order: [drive, laps, drift, rivals]
        variation_cycle: [introduces, route_shape, surface, hazard_set, objective, opponents]
