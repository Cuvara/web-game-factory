            visual: The player accelerates right inside two frames, the run cycle starts, and dust kicks from the trailing foot.
            audio: Footfall per stride, quieter than the jump
          jump:
            visual: The player leaves the ground on the frame of the press, squashing once, and the arc is readable from its first 100 ms.
