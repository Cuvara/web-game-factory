            role: ui
            dimension: 2d
            readability: The price readable to the cent at 20 CSS px while the slider is dragged, every upgrade card stating its cost and its payback in days, and the till screen's four lines each legible at 16 px on a phone
        audio:
          - id: music-day
            type: music
            tier: mvp
