            description: Life pips, gem slots and the screen plate
            count: 1
            source_preference: procedural
            est_cost: 0
            spec: Three pip states, three gem slots, one plate
            role: ui
            dimension: 2d
            readability: Pips and gem slots countable at a glance at 24 px without a label, held inside the safe area and never over the route
        audio:
          - id: music-run
            type: music
            tier: mvp
            description: Bright loop under play, one bar of silence after a death
            trigger: Screen start
            loop: true
            source_preference: library
            est_cost: 40
          - id: sfx-jump
            type: sfx
            tier: mvp
            description: Jump hop, pitched by how long the button is held
            trigger: Jump
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-land
            type: sfx
            tier: mvp
            description: Landing tap
            trigger: Landing on ground
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-gem
            type: sfx
            tier: mvp
            description: Gem chime, a semitone up per gem on the screen
            trigger: Gem taken
            loop: false
            source_preference: library
            est_cost: 5
          - id: sfx-death
            type: sfx
            tier: mvp
            description: Death burst
            trigger: Life lost
            loop: false
            source_preference: library
            est_cost: 5
        post_mvp:
          - id: level-set-2
            name: Second screen set
            description: Screens 13-24, built around wall jumps and vertical routes.
        optional:
          - id: speedrun-timer
            name: Speedrun timer
            description: A visible per-screen timer with a split against the player's best.
          - id: character-skins
            name: Character skins
            description: Cosmetic player variants opened by clean clears.
      experience:
        goal: Reach the exit door - take the three gems on the way if you can.
        goal_metric: gems
        win:
          condition: The player touches the exit door of the screen.
          metric: level
        lose:
