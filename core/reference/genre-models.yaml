          - id: impact-vfx
            type: vfx
            tier: mvp
            description: Landing dust, gem pop and death burst
            count: 3
            source_preference: procedural
            est_cost: 0
            spec: Particle presets, 200-400 ms
            role: vfx
            dimension: 2d
            readability: Dust at the feet on every landing, a pop at the gem, and a four-shard burst at the point of death that shows what was touched and clears before the retry
          - id: hud-bar
            type: ui
