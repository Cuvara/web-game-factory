# Platform profile — Generic Web
#
# Self-hosted, no portal. Included as a real profile rather than a special case so that
# "no portal" is expressed in the same vocabulary as every other target — the design and
# validation paths do not need a branch for it.
#
# Useful as a fallback target and as a control: a title that only fits here has no
# distribution, which is what makes its platform_fit low.

id: generic-web
name: Generic Web
version: 1.1.0  # 1.1.0: the store_listing block (listing requirements, null = unknown)
status: verified
docs: null

audience:
  primary_regions: []
  device_mix: { mobile: 0.5, desktop: 0.5 }

capabilities:
  ads: []
  iap: false
  cloud_saves: false
  leaderboards: false
  achievements: false
  auth: none
  analytics: self-hosted

requirements:
  locales_required: [en]
  locales_recommended: []
  max_bundle_mb: null
  orientation: [landscape, portrait]
  loading_api: optional
  offline_start: true
  https_only: true

ads:
  interstitial_min_interval_s: null
  rewarded_available: false
  banner_available: false
  notes: No portal ad SDK. Any monetization must be arranged independently.

metadata_requirements:
  descriptions_locales: [en]
  screenshots_min: 0
  icon_required: false
  age_rating_required: false

review:
  process: none
  typical_days: [0, 0]
  common_rejections: []

# No portal, so no listing requirement: nothing is required, and the canonical package is
# what a self-hosted page gets. Verified by construction.
store_listing:
  status: verified
  source: null
  notes: Self-hosted; the canonical package is the listing.
  title: {required: true, max_chars: null}
  short_description: {required: false, max_chars: null}
  long_description: {required: false, max_chars: null}
  locales: [en]
  icon: {id: icon, required: false, sizes: null, aspect: "1:1", formats: null, max_kb: null, source: icon}
  covers: []
  screenshots: {required: false, min: 0, max: null, sizes: null, aspect: null, formats: null, max_kb: null}
  video: {required: false, formats: null, min_seconds: null, max_seconds: null, max_mb: null}

assertions:
  - id: generic_web_https_only
    check: { left: package.insecure_requests, op: eq, right: 0 }
    severity: blocking
  - id: generic_web_standalone
    check: { left: package.platform_sdk, op: eq, right: none }
    severity: blocking

scoring_hints:
  platform_fit_favours:
    - Portfolio pieces, demos, and titles being validated before portal submission.
  platform_fit_penalizes:
    - Anything depending on portal traffic or portal monetization, which is most things.
