# Publication profile - Poki (docs/publish-module.md)
#
# Poki publishes a CLI whose login is a browser flow (scripts/wgf-org-setup.sh:
# WGF_POKI_AUTH_JSON is its captured auth file). The CLI is the supported way in and is
# preferred over the console; no adapter drives it yet, so the publish step stops
# HUMAN_REQUIRED (no-automated-method) and a person runs the CLI with the packaged release.

id: poki
version: 1.0.0
status: unverified
docs: https://developers.poki.com/

submission:
  method: cli
  automation_terms: permitted   # the portal's own tool
  api:
    docs: https://developers.poki.com/
    tool: poki-cli
  credential:
    kind: token
    env: WGF_POKI_AUTH_JSON
    capture: The CLI's browser login, captured once locally (~/.config/poki/auth.json).
  human_required: [login, terms, review]
