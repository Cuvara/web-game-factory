# LAYER B, per rendering dimension of the game (2d | 3d: the design's engine and assets,
# scripts/wgf_assets/requirements.py game_dimension). 2D adds nothing beyond the universal floor.
dimensions_contracts:
  3d:
    contract: camera and spatial readability, an environment with a sense of place, lit frames
    criteria:
