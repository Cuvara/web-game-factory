# Research vocabulary: the shared codes every researched game is described in.
#
# Research is game-corpus based. Each game in a corpus - seen in a portal listing, or played
# and timed in a teardown - is coded against the facets below, and every coding is a claim
# with its own tier. One vocabulary is what makes games comparable: "4 of 6 puzzle games
# offer a rewarded continue" is only countable when every teardown says `fail-continue` the
# same way. Free text describes; codes count.
#
# Versioned like a scoring model. A game record and a research report name the version they
# were coded against; renaming or removing a value is a MAJOR change (old codings stop
# resolving), adding one is MINOR. Never repurpose an id.
#
# Sections
#   genres       a tree, not a flat list: family -> subgenre -> (optionally) a narrower kind.
#                `aliases` are the strings portals and snapshot authors use, in any locale;
#                matching is case-insensitive on the whole string. A portal's own category is
#                an observation; mapping a game onto this tree is an interpretation (derived).
#   descriptors  market descriptors (hyper-casual, casual, midcore). Deliberately NOT genre
#                branches: they describe audience and production size, and cut across genres.
#   facets       every dimension a game can be coded on: its kind (one value, several values,
#                or a number with a unit), and which vocabulary its values come from.
#   vocabularies the value lists. Entries may carry attributes the analysis reads (an art
#                rendering's production `cost`, a control's `control_scheme` in the strategy
#                contract, an audience band's seconds).

