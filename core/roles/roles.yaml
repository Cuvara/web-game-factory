# Web Game Factory — Role registry
#
# Roles come in three kinds, and keeping them distinct matters:
#
#   owner       — accountable for a lifecycle state and for the artifact it produces.
#                 Exactly one owner per state.
#   implementer — does work INSIDE a state (prototype, production) and owns no state.
#   human       — a person. Appears at gates.
#
# The previous role list mixed owners and implementers in one flat table, and that is
# precisely why core/workflows/ (8 dirs) and core/schemas/ (6 dirs) drifted apart: the
# directory structure inherited a list that conflated two taxonomies.
#
# These are provider-independent. Adapters bind them to whatever surface their runtime
# offers — a subagent, a prompt file, something else; nothing here names an AI provider.

# Specialists (1.1.0). An implementer that a quality finding can be routed to carries
# `focus` - what its brief is about - `reads` - the craft playbooks its brief points at
# (core/craft/) - and `writes` - its writable scope in the game repository, which the develop
# step intersects with the installation's factory.develop.writable_paths (never widens it).
# Which specialist owns which quality dimension is reference data, not a role property:
# core/reference/specialist-routing.yaml. Charter: specialists.md.

version: 1.2.0  # 1.2.0: art-director, performance-engineer, browser-qa, publishing-compliance

roles:
  # ---------------------------------------------------------------- owners
  research:
    kind: owner
    label: Research
    charter: research.md
    owns_states:
      - portfolio:discovered
    owns_jobs:
      - portfolio:market-scan
    produces: [claim, opportunity, research-report]
    consumes: []
    responsibility: >
      Gather market signal from platform sources and normalize it into claims. Never
      promotes a hypothesis to observed without a citation.

  analysis:
    kind: owner
    label: Analysis
    charter: analysis.md
    owns_states:
      - portfolio:scored
      - portfolio:shortlisted
      - portfolio:approved
      - title:concept
    produces: [evaluation]
    consumes: [claim, opportunity]
    responsibility: >
      Score opportunities under a named scoring model, keep evidence coverage honest, and
      present the shortlist at G1 without hiding the rejected candidates.

  game-designer:
    kind: owner
    label: Game designer
    charter: game-designer.md
    owns_states:
      - title:strategy
      - title:design
    produces: [title-strategy, game-design]
    consumes: [opportunity, evaluation, claim]
    responsibility: >
      Author the strategy including its kill criteria, then solve scope, session,
      retention and monetization jointly as one design. Presents evidence at G4 and does
      not defend the prototype against its own kill criteria.

  architect:
    kind: owner
    label: Architect
    charter: architect.md
    owns_states:
      - title:tech-plan
    produces: [tech-plan]
    consumes: [game-design, title-strategy, asset-manifest]
    responsibility: >
      Select the engine with a written rationale, define the technical architecture and
      performance budgets, and produce a development plan specific enough that a coding
      agent does not have to invent scope.

  qa:
    kind: owner
    label: QA
    charter: qa.md
    owns_states:
      - release:qa
    produces: [qa-report]
    consumes: [release-manifest, game-design, tech-plan]
    responsibility: >
      Independent verification of a built candidate. Distinct from the implement/test/fix
      loop agents run during production — an agent saying "ready" is not QA saying
      "approved", and QA must be able to fail a build its author believes is finished.

  release:
    kind: owner
    label: Release
    charter: release.md
    owns_states:
      - title:scaffolding
      - title:releasing
      - release:draft
      - release:rc
      - release:approved
      - release:validating
      - release:submitting
      - release:partially-live
    produces: [release-manifest, platform-publication, store-listing, listing-validation-report]
    consumes: [tech-plan, qa-report]
    responsibility: >
      Create the game repository from the template, assemble and freeze release
      candidates, run platform validation, prepare submissions.

      Also owns COMPLIANCE AND LOCALIZATION — store metadata, required locales, per-portal
      requirements. This is assigned explicitly because it was previously assigned to
      nobody, which meant it was discovered at submission time.

  liveops:
    kind: owner
    label: LiveOps
    charter: liveops.md
    owns_states:
      - title:live
    produces: [performance-review, claim]
    consumes: [release-manifest, platform-publication]
    responsibility: >
      Interpret post-launch data and decide iterate / scale / hold / sunset. Feeds claims
      back into the portfolio so the factory learns across titles.

      This role was missing from the original ten. The sdk role integrates the analytics
      SDK; nobody interpreted the data, which left the entire "learns from what it ships"
      premise without an owner.

  # ---------------------------------------------------------- implementers
  gameplay:
    kind: implementer
    label: Gameplay
    charter: implementers.md
    works_in: [title:prototype, title:production]
    responsibility: Core mechanics, game loop, systems, progression, and their tests.
    focus: >
      The loop's code: rules, states, input, win and loss, restart, the play probe, and the
      feel of every action. The generalist: it owns any finding no specialist does.
    reads:
      - core/craft/core-loop-and-difficulty.md
      - core/craft/game-feel.md
      - core/craft/juice.md
      - core/craft/gameplay-review.md
      - core/craft/web-performance.md
    writes: [src/, tests/, public/, docs/development/, index.html]

  ui:
    kind: implementer
    label: UI
    charter: implementers.md
    works_in: [title:prototype, title:production]
    responsibility: Interface, HUD, menus, onboarding flow, and platform UI constraints.
    focus: >
      UI and UX: the HUD, menus, title, pause, result and retry screens, typography,
      buttons, touch targets, the objective on screen and the first thirty seconds.
    reads:
      - core/craft/game-ui-kit.md
      - core/craft/ui-hud-mobile.md
      - core/craft/onboarding-and-portal-ux.md
      - core/craft/accessibility.md
      - core/craft/production-art-and-ui.md
    writes: [src/, public/, index.html, tests/, docs/development/]

  asset:
    kind: implementer
    label: Asset
    charter: implementers.md
    works_in: [title:design, title:tech-plan, title:prototype, title:production]
    produces: [asset-manifest]
    responsibility: >
      Author the asset manifest with sources and cost estimates, then produce or source
      the assets and keep line-item status current.

      Note it contributes during design: asset cost is an input to the scope decision, and
      an input cannot be produced downstream of the decision it feeds.

  sdk:
    kind: implementer
    label: SDK
    charter: implementers.md
    works_in: [title:prototype, title:production, release:validating]
    responsibility: >
      Platform SDK, ads, analytics and cloud-save integration through the template's
      platform abstraction. Game code never calls a portal SDK directly.
    focus: >
      Platform integration: the portal behaviour the profiles require - mute through ads,
      rewarded grants on close, pause on visibility, the context menu - wired through the
      platform abstraction, never a portal SDK called from game code.
    reads:
      - core/craft/onboarding-and-portal-ux.md
      - core/craft/web-performance.md
    writes: [src/, index.html, tests/, docs/development/]

  # ----------------------------------------------------------- specialists
  # Implementers a quality finding is routed to (core/reference/specialist-routing.yaml).
  # Each is a develop visit briefed as that discipline - not a separate process or host.
  level-designer:
    kind: implementer
    label: Level designer
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      The content the build ships: units, their structure, element introductions and
      combinations, variety between units, and that every unit of the design is built and
      reachable.
    focus: >
      Content and level design: what each unit asks of the player, how it differs from the
      one before, where each element is introduced and combined, and the count and variety
      the bar asks for - built in the content data, not hard-coded.
    reads:
      - core/craft/content-and-level-design.md
      - core/craft/core-loop-and-difficulty.md
      - core/craft/retention-and-progression.md
    writes: [public/content/, src/, tests/, docs/development/]

  systems-designer:
    kind: implementer
    label: Systems and progression designer
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      Progression and the systems around the loop: unlocks, persistence, meta rewards,
      economy, and the reason to play the next session.
    focus: >
      Progression: what is unlocked, kept and earned across units and sessions, that it
      persists, and that its pacing matches the design's session and retention targets.
    reads:
      - core/craft/retention-and-progression.md
      - core/craft/core-loop-and-difficulty.md
      - core/craft/feature-evaluation.md
    writes: [public/content/, src/, tests/, docs/development/]

  encounter-designer:
    kind: implementer
    label: Encounter designer
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      Difficulty: the grace before the first threat, the axes that rise across units, relief
      beats, and threats a player can read and answer.
    focus: >
      Difficulty and encounters: tuning as data, a ramp that rises on the design's axes with
      relief, a fair opening grace, and threats telegraphed before they hit.
    reads:
      - core/craft/core-loop-and-difficulty.md
      - core/craft/content-and-level-design.md
      - core/craft/game-feel.md
    writes: [public/content/, src/, tests/, docs/development/]

  environment-artist:
    kind: implementer
    label: Environment and lighting artist (3D)
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      The 3D world as a player sees it: models placed and dressed, materials, the lighting
      rig, fog, sky, colour grade, and the camera's framing on both viewports.
    focus: >
      The 3D scene: a dressed world rather than an empty plane, one material language, a
      lighting rig and grade that keep the readable entities readable, and camera framing
      that shows the play on desktop and portrait mobile.
    reads:
      - core/craft/production-art-3d.md
      - core/craft/3d-scene-and-physics.md
      - core/craft/3d-assets-and-animation.md
      - core/craft/3d-diagnostics.md
      - core/craft/art-direction.md
      - core/craft/production-wiring.md
    writes: [src/, public/, tests/, docs/development/]

  artist-2d:
    kind: implementer
    label: 2D artist
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      2D production art in the build: sprites, backgrounds, VFX, palette roles, silhouettes
      distinct per entity and variant, and their use on screen.
    focus: >
      2D art on screen: every readable entity a finished sprite with its own silhouette,
      backgrounds and effects in the art direction's palette, nothing a primitive or a
      placeholder, and the art used as the runtime asset manifest lists it.
    reads:
      - core/craft/production-art-2d.md
      - core/craft/2d-assets.md
      - core/craft/art-direction.md
      - core/craft/production-wiring.md
    writes: [src/, public/, tests/, docs/development/]

  audio-designer:
    kind: implementer
    label: Audio designer
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      Sound in the build: music, effects timed to the actions they acknowledge, mixing,
      unlock on first gesture, mute, pause and silence during ads.
    focus: >
      Audio: every cue the design lists plays at its moment, music loops cleanly, levels
      are mixed and ducked, and sound unlocks, mutes and stops when it must.
    reads:
      - core/craft/game-audio.md
      - core/craft/production-wiring.md
    writes: [src/, public/, tests/, docs/development/]

  # 1.2.0: art direction, performance, browser QA and publishing
  # compliance as routed specialists.
  art-director:
    kind: implementer
    label: Art director (2D/3D)
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      One coherent look across the build: palette, shape language, scale, perspective and
      rendering style shared by every asset and screen, judged apart from the artists who
      make the assets.
    focus: >
      Art direction: what does not belong - a sprite or model in another style, a palette
      the direction does not name, scale and perspective that disagree, a UI that reads as
      another game - fixed at the shared source (palette roles, materials, the style the
      assets are drawn in), never by retouching one frame.
    reads:
      - core/craft/art-direction.md
      - core/craft/production-art-2d.md
      - core/craft/production-art-3d.md
      - core/craft/production-art-and-ui.md
    writes: [src/, public/, tests/, docs/development/]

  performance-engineer:
    kind: implementer
    label: Performance engineer
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      Load time, first interaction, frame stability, memory and download size within the
      budgets the tech plan set, on the device classes it names.
    focus: >
      Performance: what the player waits for and what stutters - oversized textures and
      audio, allocations in the frame loop, scene complexity, work on the main thread - each
      measured before and after, never traded against what the game shows.
    reads:
      - core/craft/web-performance.md
      - core/craft/3d-diagnostics.md
      - core/craft/production-wiring.md
    writes: [src/, public/, tests/, docs/development/, index.html]

  browser-qa:
    kind: implementer
    label: Browser QA engineer
    charter: specialists.md
    works_in: [title:prototype, title:production]
    responsibility: >
      The game in real browsers: no page error or uncaught exception, every viewport the
      Factory tests, focus and visibility handled, and the end-to-end tests that hold it.
    focus: >
      Browser behaviour: an uncaught error or a failed request in play, a viewport the
      layout breaks on, a lost focus or a hidden tab the game does not pause for - each
      reproduced in an end-to-end test that fails before the fix and passes after.
    reads:
      - core/craft/web-performance.md
      - core/craft/ui-hud-mobile.md
      - core/craft/onboarding-and-portal-ux.md
      - core/craft/playtesting.md
    writes: [src/, tests/, index.html, docs/development/]

  publishing-compliance:
    kind: implementer
    label: Publishing compliance
    charter: specialists.md
    works_in: [release:store-listing]
    responsibility: >
      What each targeted platform's rules require of the package and its listing - fields,
      media, formats, sizes, age and content declarations - checked against the platform
      profiles before a person is asked to authorize an upload.
    focus: >
      Platform compliance: each requirement a platform profile states that the package or
      its listing does not meet, fixed in the listing or named for a person when only a
      person can provide it; a requirement the profile leaves UNKNOWN is said so, never
      passed.
    reads:
      - core/craft/store-listing.md
      - core/craft/onboarding-and-portal-ux.md
    # The listing is the store-listing step's output, not the game repository's.
    writes: []

  copywriter:
    kind: implementer
    label: Copywriter
    charter: specialists.md
    works_in: [release:store-listing]
    responsibility: >
      Store copy grounded in the shipped build: every number equals the build's, controls
      match the design's actions, and every required locale is complete.
    focus: >
      Store copy: a title, short and long descriptions and controls text that state only
      what the build does, with the build's own counts, in every required locale.
    reads:
      - core/craft/store-listing.md
      - core/craft/onboarding-and-portal-ux.md
    # The copy is the store-listing step's output, not the game repository's.
    writes: []

  # ----------------------------------------------------------------- human
  portfolio-owner:
    kind: human
    label: Portfolio owner
    charter: portfolio-owner.md
    approves_gates: [G1, G2, G3, G4, G5, G6, G7]
    responsibility: >
      The human accountable for every gate decision, and the only party that may kill a
      concept, authorize publication, or approve spend.

      Named as a role rather than left as an implicit "somebody approves", because a gate
      with no named approver is a gate that gets skipped.
