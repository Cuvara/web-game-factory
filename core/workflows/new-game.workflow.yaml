# The new-game workflow: from a market signal to a prepared release, as executable data.
#
# This is an EXECUTION plan, not a lifecycle. The lifecycles in core/lifecycle/*.machine.yaml
# say what state an opportunity, title or release is in and which transitions are legal; this
# file says which units of work run, in what order, and where each result goes next. Each
# step names the lifecycle stage it serves in `stage:`, which check-integrity.py resolves.
# A step advancing an entity's lifecycle still goes through wgf-state.py and its gates - the
# workflow never moves a title by itself.
#
# Read by scripts/wgflib/workflow (see docs/workflow-engine.md). Every `wgf` command is a
# slice of this file: `wgf new-game` runs all of it, `wgf plan` runs the `plan` group, and
# `wgf verify` runs one step. None of them has an order of its own.
#
# Routing: a step's result is routed by its `on:` map, keyed by the route label it returned
# or by its outcome (success, failed, blocked, waiting_for_input, waiting_for_human).
# Unrouted success goes to `next`, or the next step listed; unrouted failure fails the run;
# unrouted blocked blocks it; unrouted waiting parks it until resumed. Targets are step ids,
# $end or $fail.
#
# Gates are checkpoints (`type: human-checkpoint`, `with: gate`). Each lists as `inputs` the
# artifacts core/lifecycle/gates.yaml says it is decided on (`required_artifacts`); without
# them it waits for input instead of asking anyone. G2 and G3 are reversible: an
# installation may approve them itself (factory.checkpoints.auto_approve) or after a window
# (factory.checkpoints.timeout_auto_approve, applied by `wgf resume`). G4 is irreversible:
# only a person decides it, and nothing downstream of it runs until they pass it.
# Every checkpoint outputs a decision-record (core/artifacts/decision-record.schema.json)
# with each answer - approve, reject, pass, iterate, kill, or an approval on a timeout -
# pinning by content hash exactly the inputs it was decided on.
#
# `release` prepares a release - a release-manifest in state `draft` - and `wgf new-game`
# stops there. Publication is the `publish` group after it: `wgf publish --run <run-id>`
# continues the same run through release:validating, G5, G6 and release:submitting
# (docs/publish-module.md). G6 is irreversible and never auto-approves, which is why no
# unattended run enters the group on its own.

workflow:
  id: new-game
  # 2: the definition as of Factory 2.0.0 (sdk-review, G4, loop limits per route).
  # 3: playability - the build is played from outside before review reads it.
  # 4: greybox - the loop is built with primitives and played before any asset is made.
  # 5: production - production-quality and visual-qa judge the production build's art and UI
  # before review, routing back to assets or develop; release refuses a build they did not
  # pass.
  # 6: store listing - after G4 passes, the verified build's store package (branding,
  # screenshots, trailer, copy, one rendition per platform) is captured and validated per
  # platform before release ships it beside the packages.
  # 7: publication - the `publish` group: platform-validate (release:validating), G5, G6
  # and submit (release:submitting), continued in the drafting run by `wgf publish --run`.
  # 8: content - the design states its genre family and every content unit (game-design
  # 1.9.0, core/reference/genre-models.yaml); a developer that finds the design silent on a
  # decision reports a design gap instead of inventing it, and a blocking gap routes back to
  # design (route `design-gap`), which repairs the design with the gaps; verify and G4 read
  # the playability report, whose content and difficulty checks hold the build to the units
  # the design claims. A run records the version it started under; one resumed under a newer
  # definition is marked (WORKFLOW_RESUMED `definition_version`).
  # 9: content sufficiency - after visual-qa, the BUILT game's content is counted against its
  # quality tier (core/reference/quality-benchmark.yaml): the content data file the played
  # commit ships, and what its probe showed while the playability bot traversed the units and
  # surveyed every one of them. A build short of a design that meets the bar goes back to
  # develop; a design itself short of the bar goes back to design (route `design-gap`).
  # 10: specialist routing - every failure that sent the build back to develop or design
  # (content-sufficiency's `design-gap` included), and G4's iterate, goes to `triage`
  # instead, which normalizes the current build's failures into quality findings, groups
  # them by the specialist that owns each dimension (core/reference/specialist-routing.yaml)
  # and routes one group per visit: `design` for a scope or content increase, `assets` for
  # an asset made again, or the specialist's own label, mapped to develop, whose brief is
  # then that specialist's (docs/specialist-routing.md). The loop budgets move with it: per
  # source on triage, per specialist on develop.
  # 11: the quality gate - after verify and before G4, one build is scored on every quality
  # dimension from the reports the producing steps wrote about it, against the Factory's
  # quality floor (core/reference/quality-floor.yaml: the universal floor, the genre family's
  # contract, the 3D contract) and the benchmark's release bars at the run's tier, pinned when
  # the run started (`pinned_references`). A dimension below its floor goes through triage
  # like every gate's failure: its findings go to the specialist that owns them, `design` for
  # a design-gap, `assets` for an asset made again. G4 is decided on the quality-report, and
  # release ships only a build whose quality-report passed.
  # 12: store copy grounded in the build - listing-validation's failures go through
  # `listing-triage` (a triage after G4) to store-listing, whose copywriter is briefed with
  # the store-copy findings; store-listing reads the content-sufficiency report of the build
  # it lists (every count the copy states is a measured one) and the triage-report.
  # 13: publication per platform - submit acts on every packaged platform with its own
  # record, checks G6 against the manifest, the store listing and its validation, waits for
  # a person's `submit` after each upload, and routes a create-before-build portal's
  # `platform-ids` back to sdk.
  # 14: the finding ledger closes before G4 and release - the quality gate advances the
  # run's ledger (the triage-report it reads, and the decision-record) on every report of the
  # build, so the last specialist fix is verified by the gate that raised it though no
  # triage runs after it, and is BLOCKED while a blocking finding a gate raised is open;
  # release refuses while any is (it reads the triage-report and decision-record too).
  # 15: greybox-playability says it plays the greybox (`with: {phase: greybox}`): the MVP
  # build, so a time ramp promised by a post-mvp mode is not owed by it.
  # 16: the accepted baseline - a build a person passed at G4 is the bar every later build of
  # the same game is held to. `accepted-baseline` pins it into the run before design (the
  # newest G4 `pass` a person gave for the title, its reports and frames; core/reference/
  # accepted-baseline.yaml); design and every develop visit are briefed to extend it; after
  # the greybox and after content-sufficiency `baseline-regression` measures how much of it
  # the candidate replaced - above the maximum the run waits for a person (approve | restore,
  # never automation, never a timeout) - and, on the production build, the same bot's metrics
  # within tolerance, a paired judgement of the accepted and the candidate frames per rubric
  # dimension, and the playtest findings a person filed (scripts/wgf-playtest.py). Its
  # failures go through triage like every gate's; the quality gate is not releasable while a
  # baseline exists that its build was not measured against (docs/accepted-baseline.md).
  version: 16
  description: Discover an opportunity, plan a title, build it, verify it and prepare its first release.
  start: research

  # Reference files the run copies and pins when it starts (scripts/wgflib/workflow/
  # references.py): the quality gate scores every build of the run against the contract it
  # started under, and an edit made while it runs applies to the next run.
  pinned_references:
    - core/reference/quality-floor.yaml
    - core/reference/quality-benchmark.yaml
    - core/reference/visual-qa-rubric.yaml
    - core/reference/accepted-baseline.yaml

  # Every artifact a step names has a schema in core/artifacts/. A workflow MAY list types
  # without one under `untyped_artifacts`, as a visible, temporary gap: check-integrity.py
  # reports each one, and the engine accepts nothing but a non-empty JSON object for them.
  # This workflow lists none.

  defaults:
    # Omitted keys fall back to factory.execution in workspace/config/factory.yaml.
    max_visits: 3

  # Loops. Two routes lead back into design: a blocking design gap reported by greybox or
  # develop (`design-gap`), one pass from each, and triage's `design` (a scope or content
  # increase a finding asks for - content-sufficiency's `design-gap` among them), two
  # passes. Eight routes send the build back: playability's fail, production-quality's,
  # visual-qa's and content-sufficiency's `develop`, review's and sdk-review's
  # request-changes, verify's fail, and G4's iterate - and content-sufficiency's
  # `design-gap`. They all go to `triage`, which routes the build's findings to the
  # specialist that owns them - and two go to assets, production-quality's and visual-qa's
  # `assets`, from which the run continues through triage to develop as on its first pass.
  # Each sending route has its own budget on triage
  # (max_visits_by_route; `review.request-changes` counts only review's requests), counted
  # over the whole run, so one loop cannot spend the passes another needs - and G4's
  # iterate, which always arrives by a resume, is still bounded - and a run blocked at a
  # limit says which route reached it (state.blocked_reason). Each specialist has its own
  # budget on develop (`triage.<role>`): a specialist that cannot resolve what it owns stops
  # the run for a person, named, rather than spending the passes of the others. When one
  # build has findings for several specialists they visit in turn - develop returns
  # `next-specialist` to triage, which routes the next group - before the gates measure the
  # build again. develop's own max_visits is the first visit plus every route's budget -
  # the specialists', and assets' (each pass through assets enters develop once more) - so
  # it is never the limit a loop meets first; every step of the loop after develop is
  # visited at most once per gate measurement and carries the same bound. A person resuming
  # a run blocked at a route limit grants that route one more pass and a fresh budget - that
  # route only. What a whole run may spend on unattended developer sessions is bounded
  # separately and is not reset by a resume: factory.develop.budget.

  groups:
    plan: [strategy, strategy-review, accepted-baseline, design, tech-plan, tech-plan-review]
    # Publication of a drafted release, in the run that drafted it: `wgf publish --run <id>`.
    publish: [platform-validate, release-review, publish-review, submit]

  steps:
    - id: research
      type: research
      stage: portfolio:market-scan
      description: Scan the market, screen candidate games, and carry one opportunity forward.
      outputs: [research-report, opportunity]

    - id: strategy
      type: strategy
      stage: title:strategy
      inputs: [opportunity]
      outputs: [title-strategy]

    # G2 is reversible, so an installation may auto-approve it (factory.checkpoints); a
    # rejection is unrouted, so it blocks the run for a person to look at.
    - id: strategy-review
      type: human-checkpoint
      stage: title:strategy
      inputs: [title-strategy]
      outputs: [decision-record]
      with:
        gate: G2
        prompt: Approve the title strategy before design starts?
        choices: [approve, reject]

    # The build a person accepted for this title, if any: the newest G4 `pass` decision-record
    # a person gave (the project's run store, workspace/titles/<id>/decisions) or the commit
    # factory.baseline.accepted names, with the reports that measured it and the frames its
    # play captured, copied into the run (scripts/wgf_baseline, docs/accepted-baseline.md).
    # `status: none` when nothing was accepted yet: every later baseline check is then
    # SKIPPED, with that reason.
    - id: accepted-baseline
      type: accepted-baseline
      stage: title:design
      description: Pin the build a person accepted for this title - its commit, reports and frames - as the bar every later build is held to.
      inputs: [title-strategy]
      outputs: [accepted-baseline]

    # Re-entered through `design-gap` from greybox or develop with the prototype-report whose
    # `design_gaps` name what the design did not decide; the design is repaired, never
    # replaced, and tech-plan and G3 run again on it. One pass per source, then a person looks.
    #
    # Re-entered through triage's `design` with the triage-report whose selected findings ask
    # for a scope or content increase the design must state before anything is built on it
    # (the findings become the gaps the design answers) - content-sufficiency's design gaps
    # among them, read from its report. Two passes, then a person looks.
    - id: design
      type: design
      stage: title:design
      inputs: [title-strategy, prototype-report, content-sufficiency-report, triage-report, accepted-baseline]
      outputs: [game-design]
      # 5 = the first design + one repair from each design-gap source + two from triage.
      max_visits: 5
      max_visits_by_route:
        greybox.design-gap: 1
        develop.design-gap: 1
        triage.design: 2
      # A blocking design-consistency breach is FAILED with route `descope` and the design
      # kept as evidence. Nothing in this workflow can act on a descope yet - strategy does
      # not consume one - so it ends the run, explicitly: cut scope in the strategy, and
      # start again. Never relax the rules to get past it.
      on:
        descope: $fail

    - id: tech-plan
      type: tech-plan
      stage: title:tech-plan
      description: Select the engine the design declares, pin the platforms, plan the build.
      inputs: [game-design, title-strategy]
      outputs: [tech-plan]

    # G3 is reversible, like G2: an installation may auto-approve it (factory.checkpoints).
    # A rejection is unrouted, so it blocks the run for a person to look at.
    - id: tech-plan-review
      type: human-checkpoint
      stage: title:tech-plan
      inputs: [game-design, tech-plan]
      outputs: [decision-record]
      with:
        gate: G3
        prompt: Approve the design and technical plan before the repository is created?
        choices: [approve, reject]

    - id: init
      type: init
      stage: title:scaffolding
      description: Create the game repository from the template. Idempotent per run.
      # tech-plan carries repo_params.game_config: the engine, platforms and ad kinds init
      # writes into game.config.yaml.
      inputs: [game-design, tech-plan]
      outputs: [scaffold-record]
      retry: {max_attempts: 2}

    # The loop before the assets: develop builds the whole MVP with primitives in the
    # design's palette - the probe, objective, onboarding, HUD and acknowledgements included,
    # no asset files - and the build is played from outside. Only a loop that plays and
    # reads goes on to have assets made for it; one that does not comes back here with what
    # the bot saw (two passes, then a person looks).
    - id: greybox
      type: develop
      stage: title:prototype
      description: Build the whole MVP loop with primitives, before any asset exists.
      inputs: [game-design, scaffold-record, title-strategy, tech-plan, playability-report, accepted-baseline, baseline-regression-report]
      outputs: [prototype-report]
      with:
        phase: greybox
      # 9 = the first visit + 2 playability passes + 2 restorations a person asked for at
      # greybox-baseline + 4 returns after a design repair (two design-gap sources and
      # triage's design).
      max_visits: 9
      max_visits_by_route:
        greybox-playability.fail: 2
        greybox-baseline.restore: 2
      on:
        design-gap: design

    # `phase: greybox`: the build carries the MVP tier only, whatever the run's quality tier
    # builds later - a mode the design tiers post-mvp is not played or owed here.
    - id: greybox-playability
      type: playability
      stage: title:prototype
      inputs: [prototype-report, game-design, scaffold-record]
      outputs: [playability-report]
      with:
        phase: greybox
      max_visits: 3
      on:
        fail: greybox

    # How much of the accepted build the greybox replaced (accepted units removed or
    # changed, accepted source files rewritten, accepted source lines deleted, from git):
    # above core/reference/accepted-baseline.yaml's maximum the run WAITS for a person -
    # `approve` the replacement (recorded, and carried for the run) or `restore`, which sends
    # the greybox back to make its change an extension of the accepted build. Only a
    # person's answer is taken; nothing approves it on a timeout. SKIPPED when nothing was
    # accepted for the title.
    - id: greybox-baseline
      type: baseline-regression
      stage: title:prototype
      inputs: [accepted-baseline, prototype-report, scaffold-record, game-design, baseline-regression-report]
      outputs: [baseline-regression-report]
      with:
        phase: greybox
      max_visits: 9
      on:
        restore: greybox

    # scaffold-record is optional: it names the target platforms, whose bundle-size limits
    # the delivered files are checked against. Without it the manifest skips that check.
    #
    # Re-entered by production-quality or visual-qa (route `assets`) with the report that
    # sent it back: only the items the report concerns are rebuilt, by an author handed the
    # judge's reasons and the failing frames (the playability-report resolves them), then the
    # run continues through triage to develop, which integrates them. A re-entry that could
    # change no art blocks rather than succeed. Two passes per gate before a person looks.
    # Re-entered by triage (route `assets`) with the triage-report whose selected findings ask
    # for an asset made again - a person's at G4 - which are its feedback.
    - id: assets
      type: assets
      stage: title:prototype
      description: Inspect, source or generate, validate and license-check every asset. Re-entered with the failing production-quality-report or visual-qa-report, or the triage-report, when an asset must be made again.
      inputs: [game-design, scaffold-record, production-quality-report, visual-qa-report, playability-report, triage-report]
      outputs: [asset-manifest]
      # 7 = the first visit + 2 + 2 + 2.
      max_visits: 7
      max_visits_by_route:
        production-quality.assets: 2
        visual-qa.assets: 2
        triage.assets: 2

    # What sent the build back, as specialist work (scripts/wgf_triage,
    # docs/specialist-routing.md). After assets on the first pass nothing has failed and it
    # continues to develop. Entered from a gate's failure or G4's iterate, it normalizes the
    # current build's failing reports - and the typed findings a person gave at G4 (`wgf
    # decide <run> iterate --findings FILE`) - into quality findings, groups them by the
    # specialist that owns each dimension (core/reference/specialist-routing.yaml), and
    # routes one group: `design` first and alone (a scope or content increase), then
    # `assets`, then each specialist in the routing data's order, mapped below to develop,
    # whose brief is then that specialist's. Groups after the first wait as `pending`;
    # develop returns `next-specialist` and the next is routed, before the gates measure the
    # build again. A group whose label is not mapped here (store copy before the listing
    # exists) is held; findings that are all held stop the run (BLOCKED) for a person.
    # The sending routes' budgets live here: two passes per gate, two G4 iterations.
    - id: triage
      type: triage
      stage: title:prototype
      description: Normalize the current build's failures into quality findings and route them to the specialist that owns them.
      inputs: [game-design, prototype-report, asset-manifest, playability-report, production-quality-report, visual-qa-report, content-sufficiency-report, review-report, qa-report, verification-report, quality-report, decision-record, triage-report, baseline-regression-report]
      outputs: [triage-report]
      # 1 + 6 assets passes + the sending routes' budgets, each followed by at most one visit
      # per specialist through next-specialist; the specialists' own budgets on develop are
      # the bound a chain meets. The quality gate's three routes (workflow 11) add 10, the
      # accepted baseline's three (workflow 16) 10 more.
      max_visits: 120
      max_visits_by_route:
        playability.fail: 2
        production-quality.develop: 2
        visual-qa.develop: 2
        content-sufficiency.develop: 2
        content-sufficiency.design-gap: 1
        quality-gate.develop: 2
        quality-gate.assets: 2
        quality-gate.design-gap: 1
        baseline-regression.develop: 2
        baseline-regression.assets: 2
        baseline-regression.restore: 1
        review.request-changes: 2
        sdk-review.request-changes: 2
        verify.fail: 2
        iterate: 2
      on:
        design: design
        assets: assets
        level-designer: develop
        systems-designer: develop
        encounter-designer: develop
        gameplay: develop
        environment-artist: develop
        artist-2d: develop
        ui: develop
        audio-designer: develop
        sdk: develop

    - id: develop
      type: develop
      stage: title:prototype
      description: Build the game. Re-entered with the failing playability-report when the build cannot be played from outside, the failing production-quality-report or visual-qa-report when its use of assets or its UI falls short, the failing qa-report when verification fails, or with the review-report when review requests changes.
      # scaffold-record says which repository to build in; title-strategy carries the
      # questions the prototype must answer and the kill criteria its report must list;
      # tech-plan carries the approved prototype tasks and their acceptance criteria.
      # triage-report: entered through triage with a specialist's label, the visit is that
      # specialist's - its focus, craft playbooks, writable scope and only the findings it
      # owns (docs/specialist-routing.md).
      inputs: [game-design, asset-manifest, scaffold-record, title-strategy, tech-plan, qa-report, review-report, playability-report, production-quality-report, visual-qa-report, content-sufficiency-report, triage-report, accepted-baseline, baseline-regression-report]
      outputs: [prototype-report]
      with:
        phase: production
      # Per specialist, over the whole run: the generalist (gameplay) takes what review,
      # sdk-review and verify send back and what nobody else owns - every develop-bound
      # sending route's budget (2 x 8), so it is never cut before a gate's own; every
      # other specialist four visits before a person looks. Plus the six passes through
      # assets (assets' own route budgets), each of which enters develop once more.
      # 59 = the first visit + 16 + 8 x 4 + 6 + 4 returns after a design repair (one each
      # from greybox's and develop's design-gap, two from triage's design).
      max_visits: 59
      max_visits_by_route:
        triage.gameplay: 16
        triage.level-designer: 4
        triage.systems-designer: 4
        triage.encounter-designer: 4
        triage.environment-artist: 4
        triage.artist-2d: 4
        triage.ui: 4
        triage.audio-designer: 4
        triage.sdk: 4
      on:
        design-gap: design
        # A specialist visit done while the triage that routed it has groups pending: the
        # next specialist works on the same build before the gates measure it again.
        next-specialist: triage

    # The build is played from outside before anyone reads its code: a bot clones develop's
    # commit, builds it, and plays it through the game's play probe with real input on a
    # desktop and a mobile viewport - objective on screen, no loss before the grace, every
    # action visibly acknowledged, a reachable win and loss, a working retry, readable
    # entities, lit frames (the design's experience contract, core/reference/
    # visual-quality.yaml). FAIL (route `fail`) goes back, through triage, to develop with the report and
    # the frames that show it; BLOCKED - it could not be built or played - stops the run.
    #
    # `survey`: after the traverse plays the first units in order, the bot also enters every
    # unit the design lists directly through the probe's unit link and records what each one
    # draws and how long it takes (core/reference/content-sufficiency.yaml `survey`), so
    # content-sufficiency counts every unit, not the first few. The greybox is not surveyed.
    - id: playability
      type: playability
      stage: title:prototype
      inputs: [prototype-report, game-design, scaffold-record]
      outputs: [playability-report]
      with:
        survey: true
      max_visits: 59
      on:
        fail: triage

    # The production gate: from what playability recorded of the same play of the same
    # commit, every required asset exists, is not a placeholder, passes its own quality
    # checks, is fetched, drawn and visible; no readable entity is a primitive (unless the
    # design's art direction is primitive_style); the DOM UI meets its measured bars
    # (core/reference/production-quality.yaml). FAILED with route `assets` - an asset must
    # be made again - goes to assets; route `develop` - the game's use of assets or its UI
    # must change - goes through triage to develop. BLOCKED (nothing recorded to judge) stops the run.
    - id: production-quality
      type: production-quality
      stage: title:prototype
      inputs: [playability-report, asset-manifest, game-design, scaffold-record]
      outputs: [production-quality-report]
      max_visits: 59
      on:
        assets: assets
        develop: triage

    # A judge reads the production build's frames against core/reference/visual-qa-rubric.yaml
    # and the design's visual identity; the step decides. FAIL routes by the category of the
    # failures: `assets` to assets, `develop` through triage to develop. With no judge configured it is
    # BLOCKED, never a silent pass.
    - id: visual-qa
      type: visual-qa
      stage: title:prototype
      inputs: [playability-report, game-design, asset-manifest, production-quality-report]
      outputs: [visual-qa-report]
      max_visits: 59
      on:
        assets: assets
        develop: triage

    # Content sufficiency: the BUILT game carries the content its quality tier asks for.
    # From what playability recorded of the same commit - the content data file it ships,
    # the traverse and the survey of every unit through the probe - the units shipped and
    # reached, the elements and element combinations the probe shows, structural variety and
    # near-identical units, groups that bring something new, difficulty that asks for new
    # skills, objective kinds, climax units with art of their own, gated unlocks, designed
    # play and every design commitment present, against core/reference/quality-benchmark.yaml
    # at the design's tier (core/reference/content-sufficiency.yaml says how each is
    # measured). FAILED with route `develop` - the build is short of a design that meets the
    # bar - goes through triage to develop; route `design-gap` - the design itself is short
    # of it - goes through triage to design with the findings' design gaps. BLOCKED
    # (nothing recorded) stops the run.
    - id: content-sufficiency
      type: content-sufficiency
      stage: title:prototype
      inputs: [playability-report, game-design, scaffold-record, title-strategy, visual-qa-report]
      outputs: [content-sufficiency-report]
      max_visits: 59
      on:
        # Through triage, like every gate: `develop` to the specialist that owns each
        # finding, `design-gap` to design (triage's `design`, with the report's gaps).
        develop: triage
        design-gap: triage

    # The accepted baseline (workflow 16): the production build held to the build a person
    # accepted for this title. From the same play of the same commit - the playability
    # report, visual-qa's, production-quality's and content-sufficiency's - and the accepted
    # build's reports pinned at the start: how much of the accepted build it replaced (above
    # the maximum the run waits for a person: approve | restore); the metrics the same bot
    # measured on both builds against core/reference/accepted-baseline.yaml's tolerances; a
    # paired judgement - the visual-qa judge shown the accepted and the candidate frame of the
    # same state, per rubric dimension better, same or worse; and the playtest findings a
    # person filed against a build (scripts/wgf-playtest.py). A metric beyond tolerance, a
    # dimension judged worse or an open blocking playtest finding is FAILED and goes through
    # triage like every gate: `assets` to assets, `develop` to the specialist that owns it,
    # `restore` to develop. SKIPPED when nothing was accepted for the title; BLOCKED when a
    # baseline exists that cannot be measured, or the paired judgement cannot be made.
    - id: baseline-regression
      type: baseline-regression
      stage: title:prototype
      inputs: [accepted-baseline, prototype-report, scaffold-record, game-design, playability-report, visual-qa-report, production-quality-report, content-sufficiency-report, baseline-regression-report]
      outputs: [baseline-regression-report]
      max_visits: 59
      on:
        develop: triage
        assets: triage
        restore: triage

    # An independent reviewer reads the commit develop made; it may not change it. Approve
    # continues to sdk (whose own commit sdk-review reads in turn); request-changes (FAILED,
    # route `request-changes`) goes back, through triage, to develop with the blockers. Unrouted, a request
    # for changes would fail the run, never continue. Verify runs only after both reviews
    # approve, so after verify fails the reviewer reads a commit nothing can have verified
    # yet: the newest qa-report, when it is a fail this run recorded, is shown in the brief -
    # its failing checks and recorded cause - with the instruction to judge the code, never
    # to demand verify's result (docs/review-module.md). Otherwise it is not shown.
    - id: review
      type: review
      stage: title:prototype
      inputs: [prototype-report, game-design, scaffold-record, qa-report]
      outputs: [review-report]
      max_visits: 59
      on:
        request-changes: triage

    # Integrates the template's platform SDK into the game the design and init produced:
    # it reads the design's placements, and writes into the repository init created. When
    # the newest tech-plan names other platforms than the checkout targets - a title
    # retargeted after develop, re-planned through G2 and G3 - it first writes those
    # platforms and their pinned profiles, committed with its integration, so a retarget
    # re-runs sdk onwards and never develop (docs/platform-targets-2026-10.md).
    - id: sdk
      type: sdk
      stage: title:prototype
      inputs: [game-design, scaffold-record, prototype-report, tech-plan]
      outputs: [sdk-report]
      max_visits: 59
      # A create-before-build portal's ids (wgf_publish.identity): once per portal, and once
      # more for a person's retry.
      max_visits_by_route:
        submit.platform-ids: 3

    # The sdk step commits integration code on top of the reviewed development commit, and
    # that sdk commit is what verify checks and release ships. So it is reviewed too, by the
    # same independent, read-only reviewer: the subject is the sdk-report's commit (HEAD
    # after sdk), the change is prototype-report's commit..sdk commit. request-changes goes
    # back, through triage, to develop with the blockers - the developer fixes the game side, sdk integrates
    # again, and both reviews run again; develop's own sdk-review.request-changes budget
    # bounds the loop. A requested change never continues to verify. It is shown an open
    # verify failure the same way review is.
    - id: sdk-review
      type: review
      stage: title:prototype
      inputs: [sdk-report, prototype-report, game-design, scaffold-record, qa-report]
      outputs: [review-report]
      max_visits: 59
      with:
        subject: sdk-report
      on:
        request-changes: triage

    # Verification returns a result, not a destination: FAIL (route `fail`) goes back to
    # develop, through triage, with the failing qa-report, PASS continues to the prototype
    # review (G4), and
    # BLOCKED - a check that could not be established - is unrouted, so the run stops for a
    # person.
    - id: verify
      type: verify
      stage: release:qa
      inputs: [prototype-report, sdk-report, game-design, scaffold-record, asset-manifest, playability-report]
      outputs: [verification-report, qa-report]
      retry: {max_attempts: 2}
      max_visits: 59
      on:
        fail: triage

    # The quality gate: one build, every quality dimension. From the reports the producing
    # steps wrote about this build - playability, production-quality, visual-qa,
    # content-sufficiency, review, sdk, verify - each dimension (gameplay, content, variety,
    # progression, visual, UI, audio, consistency, polish, technical, platform, store) is
    # scored against core/reference/quality-floor.yaml and the benchmark's bars at the run's
    # quality tier, as pinned when the run started. A dimension below its floor - whatever the
    # others score - is FAILED and goes through triage like every gate's failure: `develop`
    # to the specialist that owns each finding, `assets` to assets, `design-gap` to design
    # (triage's `design`). Evidence about another build, or a pinned reference edited after
    # the start, is BLOCKED. The store is measured after the listing exists (deferred; release
    # requires its validation). A run at tier mvp is a development build: its release
    # decision is `development`, never release (docs/quality-gate-module.md).
    - id: quality-gate
      type: quality-gate
      stage: title:prototype
      inputs: [playability-report, production-quality-report, visual-qa-report, content-sufficiency-report, qa-report, verification-report, prototype-report, game-design, sdk-report, review-report, asset-manifest, title-strategy, triage-report, decision-record, accepted-baseline, baseline-regression-report]
      outputs: [quality-report]
      max_visits: 59
      on:
        develop: triage
        assets: triage
        design-gap: triage

    # G4, the kill gate: a person judges the verified prototype - the qa-report,
    # verification-report and prototype-report verify just produced - against the terms of
    # the bet (the kill criteria in title-strategy, the game-design they measure); nothing else
    # answers it (it is irreversible; automation's answer is refused). `pass` continues to
    # the store listing, then release. `iterate` sends the work back through triage to develop (typed findings,
    # `wgf decide <run> iterate --findings FILE`, route like a gate's): a success routed backwards, so the
    # run's lineage stands and the loop ends here again, at a new visit that needs a new
    # decision. `kill` is gates.yaml's `abandon`: it stops the run for good (BLOCKED,
    # routed to $end), and the gate stays unpassed, so no later step of this run can start.
    # Verification that runs again after a pass supersedes it: G4 is asked again. The
    # quality-report is shown with it: every dimension's score against its floor, the open
    # findings and the release decision.
    - id: prototype-review
      type: human-checkpoint
      stage: title:prototype-review
      inputs: [qa-report, verification-report, prototype-report, title-strategy, game-design, playability-report, review-report, quality-report]
      outputs: [decision-record]
      with:
        gate: G4
        prompt: Judge the verified prototype against the kill criteria set at strategy - pass to release, iterate to develop again, or kill the title?
        choices: [pass, iterate, kill]
      max_visits: 59
      on:
        iterate: triage
        kill: $end

    # The store listing, made only after a person passed G4 (`with: required_gates`, the
    # same rule as release): the verified build - the qa-report's commit, HEAD of a clean
    # checkout, the bundle on disk hashing to the verification-report's - is served and
    # played through its play probe in a headless browser, and the package is written:
    # branding from the game's own assets and identity, screenshots and a gameplay recording
    # of real play, copy grounded in the design and the shipped build (checked against
    # core/reference/store-listing.yaml `claims`), and one rendition per targeted platform
    # under its profile's `store_listing` block. The copy is held to the build: every count
    # it states is one the content-sufficiency report of the listed build measured, its
    # controls name every input the build accepts, every required locale is a full
    # description, written by the copywriter agent at the release tier
    # (docs/store-listing-module.md). Re-entered through listing-triage (route `listing`)
    # with the failing report and the triage-report, it captures, renders or rewrites again
    # what the report names, the copywriter briefed with the store-copy findings. No browser,
    # no build or an unpassed G4 is BLOCKED, never a silent pass; a package that is not
    # complete is FAILED with the listing kept as evidence.
    - id: store-listing
      type: store-listing
      stage: release:store-listing
      description: Capture the verified build's store package - branding, screenshots, trailer, copy grounded in the build's measured content, one rendition per platform. Re-entered through listing-triage with the failing listing-validation-report and the copywriter's findings.
      inputs: [qa-report, verification-report, sdk-report, prototype-report, game-design, title-strategy, scaffold-record, asset-manifest, playability-report, content-sufficiency-report, listing-validation-report, triage-report]
      outputs: [store-listing]
      with:
        required_gates: [G4]
      retry: {max_attempts: 2}
      # Once per develop visit (G4's iterate comes back through here), plus the validation
      # loop's own budget.
      max_visits: 59
      max_visits_by_route:
        listing-triage.listing: 2

    # Every required text present and within its limits, every file present with the
    # dimensions, format and size required, screenshots real frames and distinct, the
    # trailer within bounds or an honest fallback, the copy free of unbacked claims and of
    # counts the build did not measure, its controls naming every input, every required
    # locale a full description, and every platform rendition against its profile's block.
    # FAIL (route `listing`) goes through listing-triage back to store-listing with the
    # report; a requirement a profile leaves null is UNKNOWN, listed per platform, never
    # passed. BLOCKED (no listing to judge, or only a person can fix it) stops the run.
    - id: listing-validation
      type: listing-validation
      stage: release:store-listing
      inputs: [store-listing, game-design, sdk-report, scaffold-record]
      outputs: [listing-validation-report]
      max_visits: 59
      on:
        listing: listing-triage

    # Drafts a release only from the newest passing qa-report, whose commit the
    # verification-report, sdk-report, prototype-report and the clean checkout all share.
    # scaffold-record says which repository, and which template revision it came from.
    # It also refuses unless the newest review-report approved exactly that commit (the sdk
    # commit; factory.release.allow_unreviewed is the installation's explicit, recorded
    # exception for a run with no reviewer), and unless every gate in `required_gates` is
    # passed and current in this run. A workflow with no G4 checkpoint must say so with
    # `required_gates: []`; omitted, the release step requires G4. And it refuses unless the
    # newest production-quality-report and visual-qa-report both passed the development
    # commit the released sdk commit sits on: a build whose art or UI the gates did not pass
    # is not released. And it refuses unless the run's newest store-listing is of the commit
    # it ships and the newest listing-validation-report passed exactly that listing: the
    # package is copied to release/<release-id>/listing/ and store_metadata is filled from
    # it, which is what G6's store_metadata_complete reads. A workflow without the listing
    # steps says so with `required_listing: false`. And it refuses unless the newest
    # quality-report passed exactly the build it ships (its commit and development commit);
    # a `development` decision (tier mvp) is drafted and recorded as such, never as a
    # release. A workflow without the quality gate says so with `required_quality: false`.
    # playability-report and content-sufficiency-report are read only to tell whether the
    # quality-report scored the run's newest of them. And it refuses while the run's finding
    # ledger, advanced on the newest reports and G4's decision (triage-report,
    # decision-record), holds an open finding of a blocking severity.
    - id: release
      type: release
      stage: release:draft
      inputs: [qa-report, verification-report, sdk-report, prototype-report, scaffold-record, review-report, production-quality-report, visual-qa-report, store-listing, listing-validation-report, quality-report, playability-report, content-sufficiency-report, triage-report, decision-record, game-design]
      outputs: [release-manifest]
      with:
        required_gates: [G4]
      # `wgf new-game` ends here, with a draft: publication is authorized per release, never
      # standing (gates.yaml G6), so an unattended run never continues into it. The steps
      # below are the `publish` group: `wgf publish --run <run-id>` continues this same run
      # through them, reusing its artifacts (docs/publish-module.md).
      next: $end

    # The listing's failures as quality findings (docs/specialist-routing.md): the same
    # triage step as before G4, here after it, where route `listing` can be taken. Its
    # findings - store copy the copywriter's, screenshots and art the 2D artist's, a platform
    # rendition the integrator's - are one store-listing pass (routing.py WHOLE_PASS), whose
    # copywriter is briefed with the store-copy ones. A finding no store-listing pass can
    # act on was already BLOCKED by listing-validation, for a person. It is listed after
    # release, which ends `wgf new-game` ($end), so no step falls through into it; it is
    # entered only by listing-validation's `listing`, and leads only to store-listing.
    - id: listing-triage
      type: triage
      stage: release:store-listing
      description: Normalize the store listing's failures into quality findings and route them to store-listing, the copywriter briefed with the store-copy ones.
      inputs: [game-design, prototype-report, listing-validation-report, triage-report]
      outputs: [triage-report]
      max_visits: 59
      max_visits_by_route:
        listing-validation.listing: 2
      on:
        listing: store-listing
      next: store-listing

    # -- publication: the `publish` group ------------------------------------------------
    #
    # The release lifecycle's tail (release.machine.yaml: validating -> [G6] -> submitting),
    # run as a continuation of the run that drafted the release, never as a new one: every
    # record it writes pins the manifest, the verification and the decisions of that run.
    # Publication readiness is computed first, so both gates are decided on it.

    # release:validating. The publication guards (candidate_frozen, store_metadata_complete,
    # package_shaped_to_profile, assertions_pass, metadata_and_locales_present), the package
    # on disk against the manifest's checksum, the pinned platform profile's assertions as
    # verify recorded them for this commit, and the publication profile
    # (core/reference/publication/<id>.yaml: method, terms, credential named). One
    # platform-publication per packaged platform, with a `readiness`: READY, BLOCKED,
    # HUMAN_REQUIRED or UNKNOWN. A guard that cannot be evaluated is UNKNOWN, never READY.
    # BLOCKED is FAILED, route `fail`, the record kept as evidence; it is unrouted, so the
    # run stops for a person (the lifecycle sends it back to production with the named
    # assertion ids).
    - id: platform-validate
      type: platform-validate
      stage: release:validating
      inputs: [release-manifest, verification-report, qa-report, sdk-report, scaffold-record]
      outputs: [platform-publication]

    # G5, release approval (reversible): a person reads the qa-report, verification-report
    # and release-manifest the run holds and the readiness platform-validate computed.
    # `reject` cancels the release and ends the run.
    - id: release-review
      type: human-checkpoint
      stage: release:rc
      inputs: [qa-report, verification-report, release-manifest]
      outputs: [decision-record]
      with:
        gate: G5
        prompt: Approve this release candidate - the build, its manifest and its evidence - as the thing people will play?
        choices: [approve, reject]
      on:
        reject: $end

    # G6, publish authorization (irreversible): only a person decides it - `publish`, the
    # release machine's own edge - and the decision-record pins the release-manifest by
    # content hash. The submit step refuses to submit unless that hash is the manifest it
    # holds. `reject` ends the run; an approved build may sit indefinitely.
    - id: publish-review
      type: human-checkpoint
      stage: release:approved
      inputs: [release-manifest, platform-publication, store-listing, listing-validation-report]
      outputs: [decision-record]
      with:
        gate: G6
        prompt: Publish this release, to these platforms, now? Irreversible - portals cache and index.
        choices: [publish, reject]
      on:
        reject: $end

    # release:submitting (scripts/wgf_publish, docs/publish-module.md). Every packaged
    # platform, each with its own platform-publication: a wait, a failure or a pending
    # review on one never changes another's (`wgf publish --run <id> --platform <p>` acts on
    # one; `--track` only reads each one's status). Before any upload: G6 is a person's
    # approval pinning THIS release-manifest, store-listing and listing-validation-report
    # (a hash that changed after G6 is BLOCKED g6-stale: decide G6 again), the package's
    # bytes are the manifest's and its bundle_hash the bundle verify built for THIS
    # platform. The portal registry (workspace/titles/<id>/portals.json) says which game
    # the title already has there; resolve the adapter from
    # core/reference/publication/<id>.yaml (api/cli where the portal publishes one; a
    # deterministic Playwright run of its console where it does not; email/manual by a
    # person). A live visit uploads and saves, then waits for a person
    # (WAITING_FOR_HUMAN_SUBMIT_CONFIRMATION: `wgf decide <run> submit | hold | abandon`, or
    # `done` after submitting by hand); `submit` requests review once and reads the status
    # back. The irreversible request is attempted once: retry is max_attempts 1 and a
    # failure around it is never retryable. A login challenge, a CAPTCHA, unconfirmed terms,
    # a missing credential, a duplicate candidate, a pending review or a method nobody
    # automates stops the step WAITING_FOR_HUMAN (unrouted: the run parks until `wgf decide
    # <run> done` after a person acted, or `abandon`). factory.publish.mode is dry-run until
    # an installation sets live. A create-before-build portal (identity.issued_on_create)
    # issues the ids the build must carry when the game is created: IDS_ISSUED routes
    # `platform-ids` to sdk, outside the publish slice: the run ends naming sdk next.
    # `wgf sdk --run <id> --force` writes them into game.config.yaml; `wgf new-game --run
    # <id>` runs sdk-review, verify, the quality gate, G4, the listing and release on the new
    # build; `wgf publish --run <id>` validates it and asks G5 and G6 again. Until then the
    # quality floor refuses submit: the checks it rests on passed the old build.
    - id: submit
      type: publish
      stage: release:submitting
      inputs: [release-manifest, platform-publication, decision-record, scaffold-record, verification-report, store-listing, listing-validation-report]
      outputs: [platform-publication]
      retry: {max_attempts: 1}
      max_visits: 3
      on:
        platform-ids: sdk
