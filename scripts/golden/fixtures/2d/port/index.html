<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tower Merge Rush</title>
    <!--
      GOLDEN-RUN REPLAY: the template's index.html with the overlay of
      examples/tower-merge-rush/index.html, written by the Factory's replay developer.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1026;
        color: #eef2ff;
        font:
          16px/1.4 system-ui,
          sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #hud {
        position: absolute;
        bottom: 4px;
        right: 8px;
        opacity: 0.4;
        font-size: 11px;
        pointer-events: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ui .hud {
        display: flex;
        gap: 12px;
        padding: max(10px, env(safe-area-inset-top)) 14px 0;
        font-weight: 700;
      }
      #ui .spacer {
        flex: 1;
      }
      #ui .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: rgba(11, 16, 38, 0.8);
        pointer-events: auto;
      }
      #ui [hidden] {
        display: none !important;
      }
      #ui h1 {
        margin: 0;
        font-size: clamp(28px, 8vmin, 56px);
        color: #ffd166;
      }
      #ui p {
        margin: 0;
        max-width: 32em;
      }
      #ui .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      #ui button {
        min-width: 44px;
        min-height: 44px;
        padding: 12px 22px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 800;
        color: #0b1026;
        background: #ffd166;
        cursor: pointer;
      }
      #ui button.secondary {
        background: #06d6a0;
      }
      #ui button.pause {
        position: absolute;
        top: max(6px, env(safe-area-inset-top));
        right: 8px;
        padding: 6px 12px;
        pointer-events: auto;
      }
      #ui .note {
        min-height: 1.4em;
        color: #ffadad;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="hud" data-scene="none">tower-merge-rush</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
