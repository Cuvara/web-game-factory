# A publication profile for tests: the generic-web platform, published to the fixture
# portal (portal.py) through its console. Loaded over core's generic-web.yaml by
# factory.publish.profiles_extra; the console url is set per test
# (factory.publish.platforms.generic-web.console_url) and the adapter is the fixture's.
# Automated console use is permitted: the portal is ours.
#
# 2.1.0 (core/artifacts/shared/publication-profile.schema.json): the console flow as intents,
# each with a phase and a class, and a person's live login. The fixture portal is driven by
# this flow alone - every ladder names its markup, role or label first, css as the fallback.

id: generic-web
version: 2.1.0
status: verified
docs: null

submission:
  method: console
  automation_terms: permitted
  content_policy:
    ai_generated_text: allowed
    ai_generated_assets: allowed
    note: The fixture portal is ours; it states no policy and needs none.
  console:
    url: http://127.0.0.1:1/
    allowed_origins: [http://127.0.0.1:1]
    upload_timeout_s: 60
  credential:
    kind: human-login
  human_required: [login, declaration, age-rating]

  adaptive: allowed
  adaptive_bounds: {max_per_intent: 3, max_per_visit: 10}
  dismissable: [Close, Got it, Skip, Not now]
  deny: [Supprimer, Soumettre]

  session:
    logged_in: [{css: "#dashboard"}]
    login: [{css: "form#login"}, {css: "input[type=password]"}]
    captcha: [{css: "#captcha"}]
    two_factor: [{css: "#two-factor"}]
    authenticated_url: "/console"

  identity:
    portal_id_from: [registry, config:game_id, config:app_id, idempotency-key, title]
    list_url: /console
    game_url: /console/game/{id}
    row: [{css: "tr.game"}]
    row_title: [{css: "td.title"}]
    row_id: {attr: data-id}
    page_id: [{css: "#game-id"}]
    title_match: exact-casefold
    basis: observed

  flow:
    - id: create.open
      phase: create_game
      class: reversible
      action: navigate
      url: /console/new
      expect: {url_matches: "/console/new$"}
      basis: observed
    - id: create.name
      phase: create_game
      class: reversible
      action: fill
      value: identity.title
      target: [{role: textbox, name: "Name"}, {css: "input[name=name]"}]
      names: [Name, Game name]
      expect: {value_equals: identity.title}
      basis: observed
    - id: create.confirm
      phase: create_game
      class: reversible
      action: click
      target: [{role: button, name: "Create game"}, {css: "button#create"}]
      names: [Create game, New game]
      expect: {url_matches: "/console/game/"}
      basis: observed
    - id: upload.archive
      phase: upload_build
      class: reversible
      action: upload
      value: package.file
      target: [{label: "Archive"}, {css: "input[name=archive]"}]
      names: [Build file, Game build]
      basis: observed
    - id: upload.start
      phase: upload_build
      class: reversible
      action: click
      target: [{role: button, name: "Upload build"}, {css: "button#upload"}]
      names: [Upload build]
      expect: {visible: [{css: "#uploaded"}]}
      basis: observed
    - id: field.title
      phase: fill_metadata
      class: reversible
      action: fill
      value: listing.title
      target: [{role: textbox, name: "Title"}, {css: "input[name=title]"}]
      names: [Title, Game title, Game name]
      page: "^/console/game/[^/]+$"
      expect: {value_equals: listing.title}
      basis: observed
    - id: field.description
      phase: fill_metadata
      class: reversible
      action: fill
      value: listing.text.<locale>.description
      per_locale: true
      target: [{label: "Description (<locale>)"}, {css: "textarea[name='description[<locale>]']"}]
      expect: {value_equals: listing.text.<locale>.description}
      basis: observed
    - id: media.icon
      phase: upload_media
      class: reversible
      action: upload
      value: listing.media.icon
      target: [{label: "Icon"}, {css: "input[name=icon]"}]
      names: [Icon]
      basis: observed
    - id: media.cover
      phase: upload_media
      class: reversible
      action: upload
      value: listing.media.cover
      optional: true
      target: [{label: "Cover"}, {css: "input[name=cover]"}]
      names: [Cover]
      basis: observed
    - id: media.screenshots
      phase: upload_media
      class: reversible
      action: upload
      value: listing.media.screenshots
      multiple: true
      target: [{label: "Screenshots"}, {css: "input[name=screenshots]"}]
      names: [Screenshots]
      basis: observed
    - id: declare.ownership
      phase: human_fields
      class: human
      note: Ownership and licensing declaration - a person makes it in the console.
      url: /console
      expect: {visible: [{css: "#declared"}]}
    - id: declare.age_rating
      phase: human_fields
      class: human
      note: Age rating questionnaire - a person answers it.
      url: /console
      expect: {visible: [{css: "#declared"}]}
    - id: draft.save
      phase: save_draft
      class: reversible
      action: click
      target: [{role: button, name: "Save"}, {css: "button#save"}]
      names: [Save, Save draft]
      expect: {visible: [{css: "#saved"}]}
      basis: observed
    - id: review.request
      phase: request_review
      class: irreversible
      action: click
      target: [{role: button, name: "Submit for moderation"}, {css: "button#submit"}]
      expect: {status_in: submitted_states}
      basis: observed
    - id: status.read
      phase: verify
      class: reversible
      action: read
      target: [{css: "#status"}]
      basis: observed

  status:
    read: [{css: "#status"}]
    error: [{css: "#upload-error"}]
    states: [Draft, Waiting for moderation, Live, Rejected]
    submitted_states: [Waiting for moderation]
    live_states: [Live]
    rejected_states: [Rejected]
    pending_states: [Waiting for moderation]

  constraints:
    one_moderation_at_a_time: true
    archive_root_index: true
    upload_max_mb: 50

  fields:
    title: {required: true, max: 50, locales: shared, listing: listing.title, basis: observed}
    description: {required: true, max: 2000, locales: per-locale, listing: listing.text.<locale>.description, basis: observed}

  restrictions:
    - rule: A game whose review was requested cannot be requested again (409).
      source: scripts/tests/fixtures/publish/portal.py
