# Autonomous profile: an unattended new-game run, from research to the G4 decision.
#
# Not active anywhere by default. A project turns it on by copying this file to its own
# workspace/config/factory.yaml, which is layered over the Factory's shipped factory.yaml
# key by key (wgflib/workflow/config.py load_config): only what is set here changes.
#
#     mkdir -p workspace/config
#     cp <runtime>/workspace/config/profiles/autonomous.yaml workspace/config/factory.yaml
#
# <runtime> is the `factory_root` `wgf where` reports (from the installed plugin:
# ~/.claude/plugins/cache/cuvara/web-game-factory/<version>/runtime). Every key below is
# documented in the shipped factory.yaml; the agent argvs are its commented, verified
# examples, verbatim (docs/claude-capabilities.md). See docs/autonomous-runs.md.
#
# What it changes, and what it does not:
#   develop    a headless Claude Code developer builds the game and fixes what verify or
#              review sends back; the Factory still runs the checks and makes the commit
#   review     a read-only headless Claude Code reviewer approves or requests changes
#   design     a headless Claude Code design author writes the design draft the module then
#              checks unchanged - needed for a brief no design archetype carries
#   assets     a headless Claude Code 2D author draws every 2D requirement as one set,
#              writing only into a Factory scratch directory and looking at the contact
#              sheet the Factory renders; a read-only 3D model author prints a model spec
#              per 3D requirement that the pinned Blender builds; the Factory validates and
#              judges both, and asks again with the problems (repair rounds). Without them every asset is a placeholder,
#              which production-quality refuses: the run loops back to assets and blocks
#   visual-qa  a read-only headless Claude Code judge reads the captured frames and returns
#              scores; the step decides. Without a judge visual-qa BLOCKS
#   G2, G3     approved by the run (reversible gates)
#   init       a LOCAL project from the pinned template: no GitHub repository, no remote
#   budget     at most 12 developer sessions / US$60 per run; a person raises it
#   G4         still a person's decision (irreversible: the engine refuses to automate it),
#              and so is everything after it - release, G5, G6, G7
#   research   still needs evidence: snapshots in workspace/research/snapshots/, or a
#              probes.yaml there with discovery.live. Without either the run waits for input
factory:
  init:
    # A GitHub repository is an outward-facing, irreversible side effect: set
    # `source: github` here yourself if you want one. /new-game still asks before starting
    # such a run.
    source: local

  checkpoints:
    auto_approve: [G2, G3]

  design:
    author: agent
    agent:
      # The draft is edited in place: printing a whole design (tens of kilobytes) in one
      # reply overflows the host's output limit, and `claude -p` then returns only its tail.
      # Edit is allowed on that one file only (`//` = an absolute path).
      draft_from: file
      argv:
        - claude
        - -p
        - "{prompt}"
        - --model
        - sonnet
        - --safe-mode
        - --strict-mcp-config
        - --tools
        - "Read,Edit"
        - --allowedTools
        - "Read,Edit(/{draft})"
        - --disallowedTools
        - "Write,NotebookEdit,Bash,WebFetch,WebSearch"
        - --permission-mode
        - dontAsk
        - --no-session-persistence
        - --output-format
        - text
        - --max-turns
        - "80"
        - --max-budget-usd
        - "8"
      timeout_seconds: 1800
      idle_timeout_seconds: null

  develop:
    developer:
      kind: command
      argv:
        - claude
        - -p
        - "{prompt}"
        - --model
        - sonnet
        - --setting-sources
        - project
        - --strict-mcp-config
        - --tools
        - "Read,Edit,Write,Glob,Grep,Bash"
        - --allowedTools
        - "Read,Glob,Grep,Edit(./**),Write(./**),Bash(pnpm *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *)"
        - --disallowedTools
        - "WebFetch,WebSearch,Bash(git commit *),Bash(git push *),Bash(git reset *),Bash(git checkout *),Bash(git switch *),Bash(git rebase *),Bash(git stash *),Bash(git tag *),Bash(git branch *),Bash(git clean *),Bash(git config *),Bash(git remote *),Bash(git * --output*)"
        - --permission-mode
        - dontAsk
        - --no-session-persistence
        - --output-format
        - stream-json
        - --verbose
        - --max-turns
        - "400"
        - --max-budget-usd
        - "40"
      timeout_seconds: 5400
      idle_timeout_seconds: 900
    budget:
      max_sessions: 12
      max_cost: 60
      cost_from:
        jsonl_key: total_cost_usd

  review:
    reviewer:
      kind: command
      verdict_from: stdout
      argv:
        - claude
        - -p
        - "{prompt}"
        - --model
        - sonnet
        - --safe-mode
        - --strict-mcp-config
        - --tools
        - "Read,Glob,Grep,Bash"
        - --allowedTools
        - "Read,Glob,Grep,Bash(git diff *),Bash(git log *),Bash(git show *)"
        - --disallowedTools
        - "Edit,Write,NotebookEdit,WebFetch,WebSearch,Bash(git * --output*),Bash(git *--output=*)"
        - --permission-mode
        - dontAsk
        - --no-session-persistence
        - --output-format
        - text
        - --max-turns
        - "60"
        - --max-budget-usd
        - "5"
      timeout_seconds: 1800
      idle_timeout_seconds: null

  assets:
    # Workflow 5 refuses placeholder art (production-quality routes it back to `assets`), so
    # an unattended run needs authors. The 2D author draws the whole set in ONE session
    # (mode: set): it writes SVGs only into the Factory's scratch directory {out}, runs only
    # the Factory's preview {preview} - the drawings judged and rendered into a contact sheet
    # it then looks at - and revises; the Factory judges again and delivers what passes. The
    # 3D model author is read-only and prints its spec. Both are judged by
    # core/reference/asset-quality.yaml.
    author:
      kind: command
      mode: set
      argv:
        - claude
        - -p
        - "{prompt}"
        - --model
        - sonnet
        - --safe-mode
        - --strict-mcp-config
        - --tools
        - "Read,Write,Edit,Bash"
        - --allowedTools
        - "Read"
        - "Edit(/{out}/**)"
        - "Bash({preview})"
        - --disallowedTools
        - "NotebookEdit,WebFetch,WebSearch"
        - --permission-mode
        - dontAsk
        - --no-session-persistence
        - --output-format
        - text
        - --max-turns
        - "150"
        - --max-budget-usd
        - "6"
      timeout_seconds: 2700
      idle_timeout_seconds: null
      repair_rounds: 1
    # Builds through the pinned Blender 4.5 LTS: on PATH, or WGF_BLENDER
    # (docs/blender-pipeline.md). Without it, every 3D requirement is a placeholder.
    model_author:
      kind: command
      spec_from: stdout
      argv:
        - claude
        - -p
        - "{prompt}"
        - --model
        - sonnet
        - --safe-mode
        - --strict-mcp-config
        - --tools
        - "Read"
        - --allowedTools
        - "Read"
        - --disallowedTools
        - "Edit,Write,NotebookEdit,Bash,WebFetch,WebSearch"
        - --permission-mode
        - dontAsk
        - --no-session-persistence
        - --output-format
        - text
        - --max-turns
        - "20"
        - --max-budget-usd
        - "2"
      timeout_seconds: 900
      idle_timeout_seconds: null
      max_repair_rounds: 2

  visualqa:
    # Without a judge visual-qa BLOCKS: it is never a silent pass.
    judge:
      kind: command
      verdict_from: stdout
      argv:
        - claude
        - -p
        - "{prompt}"
        - --model
        - sonnet
        - --safe-mode
        - --strict-mcp-config
        - --tools
        - "Read"
        - --allowedTools
        - "Read"
        - --disallowedTools
        - "Edit,Write,NotebookEdit,Bash,WebFetch,WebSearch"
        - --permission-mode
        - dontAsk
        - --no-session-persistence
        - --output-format
        - text
        - --max-turns
        - "40"
        - --max-budget-usd
        - "2"
      timeout_seconds: 900
      idle_timeout_seconds: null
