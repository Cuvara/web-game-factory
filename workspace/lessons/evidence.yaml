# Instance evidence for core/reference/lessons.yaml: which game showed each lesson, where the
# evidence is, and which workstream is closing an open one. Core states the lesson generically
# and never names a game; this file is the only place the two meet, keyed by lesson id.
#
# `games` lists every game name the lessons came from. check-integrity refuses a core lesson
# whose text contains one of them (core/ names no specific game).
#
# Paths under `evidence` are relative to the Lead's evidence root outside this repository
# (the runs directory the 2026-10-05..07 validation runs wrote), recorded as found; the
# ledger row is the external ledger's id this lesson replaces.
#
# The evidence legs of a lesson (2.0.0; docs/knowledge-enforcement.md), each optional except
# `source`, and recorded only as they happened - never inferred:
#   source        {kind: run | review | benchmark | research-principle, run, issue, reviewer,
#                 date}: where the lesson came from - a game run, a person's review or audit,
#                 a benchmark criterion, or a design principle
#   discovered    {run, commit, date}: the run and build it was first seen on
#   fixed         {pr | commit, date}: the Factory change that holds it
#   verified      {run, artifact_id, commit, date}: the RERUN leg - the check passed on the
#                 game that raised it, after the fix. Required before core/reference/
#                 lessons.yaml may mark the lesson `lifecycle: validated`
#   regressions   [{run, artifact_id, date}]: a later run where the check caught it again

version: 2.0.0

source: factory-learning-ledger.md L1-L22 and M1-M6 (the Lead's ledger of the 2026-10-05..07 validation runs), and factory-gap-audit-2026-10-07.md section 2; L23-L28 added at the quality-system integration (2026-10-08)

